<script>
const FF_DATA={"metadata":{"title":"Ophthalmology Fact Fixer","subtitle":"240 MCQs with explanatory answers","authors":["Chung Nen Chua","Li Wern Voon","Siddhartha Goel"],"question_count":240,"statement_count":1200,"id_prefix":"FF","id_format":"FF001–FF240","question_format":"Five statements per question; each statement is answered True or False.","response_options":["True","False"],"negative_marking":false,"scoring":{"correct":1,"incorrect":0,"unanswered":0},"quick_fix_count":17,"notes":["The original source answer key and explanations are preserved as the basis of the data.","The response model is intentionally restricted to True/False and uses no negative marking, as requested.","Quick Fix boxes are stored separately and linked to the questions sharing the corresponding answer page."],"source_year":2002,"publisher":"Radcliffe Medical Press","topic_count":12,"topic_assignment_note":"Primary topics and secondary tags are derived study labels added for this website; the source book itself presents the questions in deliberately mixed order.","quality_control":{"groups_expected":240,"statements_expected":1200,"quick_fixes_expected":17,"answer_circle_low_confidence_visual_review":"completed","source_page_pairing_validated":true,"sequential_id_validation":true,"five_statement_validation":true,"ocr_cleanup":"Clear OCR artefacts in selected headings were corrected against rendered source pages; source wording was otherwise retained."}},"questions":[{"id":"FF001","question_number":1,"stem":"Vigabatrin:","options":["True","False"],"statements":[{"label":"a","text":"is used as the first-line medication in grand mal epilepsy","answer":"False","answer_bool":false},{"label":"b","text":"increases GABA concentration in the retina","answer":"True","answer_bool":true},{"label":"c","text":"causes visual field defects in one-third of patients","answer":"True","answer_bool":true},{"label":"d","text":"is contraindicated in patients with pre-existing visual field defect","answer":"True","answer_bool":true},{"label":"e","text":"causes narrowing of the retinal arterioles.","answer":"False","answer_bool":false}],"correct_labels":["b","c","d"],"explanation":"Vigabatrin is used in combination with other anti-epileptics in the control of epilepsy. It is not used as a first-line treatment except in West's syndrome. It increases the concentration of GABA in the brain and the retina. It is associated with visual field defects (as many as one-third of patients) but the mechanism is unknown. It should be avoided in patients with pre-existing visual field defect. Ophthalmoscopy appearance in patients taking vigabatrin includes narrowing of the retinal arterioles, wrinkles on the retina surface and optic atrophy in the presence of visual field defects.","quick_fix_ids":["QF001"],"source":{"question_pdf_page":12,"question_book_page":1,"answer_pdf_page":13,"answer_book_page":2},"primary_topic":"Diagnostics, Pharmacology & Perioperative","tags":["Pharmacology","Genetics","Visual field","Neuro-ophthalmology","Retina & Vitreous"]},{"id":"FF002","question_number":2,"stem":"The following pharmacological tests are useful in differentiating a patient with a fixed dilated pupil:","options":["True","False"],"statements":[{"label":"a","text":"4% cocaine test","answer":"False","answer_bool":false},{"label":"b","text":"0.01 % pilocarpine","answer":"True","answer_bool":true},{"label":"c","text":"1 % pilocarpine","answer":"True","answer_bool":true},{"label":"d","text":"2.5% phenylephrine","answer":"False","answer_bool":false},{"label":"e","text":"0.1 % adrenaline.","answer":"False","answer_bool":false}],"correct_labels":["b","c"],"explanation":"Cocaine test is used to confirm Horner's syndrome and 2.5% phenylephrine or 0.1 % adrenaline are used to localise the site in Horner's syndrome. 0.01 % pilocarpine causes constriction of Adie's pupil and 1 % pilocarpine will constrict a dilated pupil caused by third nerve palsy but will not constrict a pharmacologically dilated pupil.","quick_fix_ids":["QF001"],"source":{"question_pdf_page":12,"question_book_page":1,"answer_pdf_page":13,"answer_book_page":2},"primary_topic":"Neuro-ophthalmology","tags":["Pharmacology","Genetics","Pupil","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF003","question_number":3,"stem":"Kayser-Fleischer's ring:","options":["True","False"],"statements":[{"label":"a","text":"is pathognomonic of Wilson's disease","answer":"False","answer_bool":false},{"label":"b","text":"first appears in the superior and inferior Descemet's membrane","answer":"True","answer_bool":true},{"label":"c","text":"occurs in all patients with hepatic failure due to Wilson's disease","answer":"False","answer_bool":false},{"label":"d","text":"occurs in all patients with neurologic manifestations of Wilson's disease","answer":"True","answer_bool":true},{"label":"e","text":"disappears with desferrioxamine treatment.","answer":"False","answer_bool":false}],"correct_labels":["b","d"],"explanation":"Kayser-Fleischer's ring is not pathognomonic for Wilson's disease; it can occur in other conditions such as primary biliary cirrhosis. In patients with suspected Wilson's disease, gonioscopy may be required to detect early copper deposition at the periphery of Descemet's membrane in the superior and inferior limbus. It may be absent in patients with hepatic failure due to Wilson's disease but is always present in those with neurologic manifestations. It disappears with D-penicillamine treatment.","quick_fix_ids":["QF001"],"source":{"question_pdf_page":12,"question_book_page":1,"answer_pdf_page":13,"answer_book_page":2},"primary_topic":"Systemic Disease & Ocular Associations","tags":["Glaucoma"]},{"id":"FF004","question_number":4,"stem":"Ocular signs associated with abnormal dentition are seen in:","options":["True","False"],"statements":[{"label":"a","text":"congenital syphilis","answer":"True","answer_bool":true},{"label":"b","text":"Reiger's syndrome","answer":"True","answer_bool":true},{"label":"c","text":"congenital rubella","answer":"False","answer_bool":false},{"label":"d","text":"Down's syndrome","answer":"False","answer_bool":false},{"label":"e","text":"pseudoxanthoma elasticum.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"Congenital syphilis can give rise to Hutchinson's teeth and Reiger's syndrome is associated with under-developed dentition.","quick_fix_ids":["QF001"],"source":{"question_pdf_page":12,"question_book_page":1,"answer_pdf_page":13,"answer_book_page":2},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Paediatrics","Systemic Disease & Ocular Associations"]},{"id":"FF005","question_number":5,"stem":"Location of lesion for the following abnormal ocular movements are true:","options":["True","False"],"statements":[{"label":"a","text":"WEBINO (wall-eyed bilateral internuclear ophthalmoplegia) - rostral medial longitudinal fasciculus and the third nerve nucleus","answer":"True","answer_bool":true},{"label":"b","text":"internuclear ophthalmoplegia - contralateral medial longitudinal fasciculus","answer":"False","answer_bool":false},{"label":"c","text":"one and a half syndrome - ipsilateral medial longitudinal fasciculus and ipsilateral sixth nerve nucleus","answer":"True","answer_bool":true},{"label":"d","text":"down-gaze palsy - caudal interstitial nucleus of the medial longitudinal fasciculus","answer":"False","answer_bool":false},{"label":"e","text":"skew deviation - ipsilateral sixth and third nerve nucleus.","answer":"False","answer_bool":false}],"correct_labels":["a","c"],"explanation":"Internuclear ophthalmoplegia is caused by a lesion in the ipsilateral medial longitudinal fasciculus, i.e. the same side as the eye that has adduction restriction. Down-gaze palsy is caused by a lesion in the rostral interstitial nucleus of the medial longitudinal fasciculus. The lesion for skew deviation is in the brain stem but the exact location is unknown.","quick_fix_ids":[],"source":{"question_pdf_page":14,"question_book_page":3,"answer_pdf_page":15,"answer_book_page":4},"primary_topic":"Ocular Motility & Strabismus","tags":["Genetics"]},{"id":"FF006","question_number":6,"stem":"Idiopathic polypoidal choroidal vasculopathy (IPCV):","options":["True","False"],"statements":[{"label":"a","text":"occurs mainly in people of African descent","answer":"False","answer_bool":false},{"label":"b","text":"drusen are typically absent","answer":"True","answer_bool":true},{"label":"c","text":"causes vitreous haemorrhage","answer":"True","answer_bool":true},{"label":"d","text":"is best visualised with indocyanine green","answer":"True","answer_bool":true},{"label":"e","text":"has a better visual prognosis than age-related macular degeneration.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"• IPCV was first described in people of African descent but it is now being recognised in other races due to increased awareness. The condition typically affects women in the fifth and sixth decade. Haemorrhage is common and it was previously called posterior uveal bleeding syndrome. It is one of the differential diagnoses of age-related macular degeneration (ARMD). Unlike ARMD, it is not associated with drusen. The lesions are made up of dilated choroidal vessels and are best visualised with indocyanine green. IPCV tends to affect the peripapillary region away from the fovea. Therefore, the outcome of treatment is more favourable than ARMD.","quick_fix_ids":[],"source":{"question_pdf_page":14,"question_book_page":3,"answer_pdf_page":15,"answer_book_page":4},"primary_topic":"Retina & Vitreous","tags":["Imaging","Genetics","Trauma","Macula"]},{"id":"FF007","question_number":7,"stem":"The following are true about pigment dispersion syndrome:","options":["True","False"],"statements":[{"label":"a","text":"peripapillary transillumination is a feature","answer":"False","answer_bool":false},{"label":"b","text":"the anterior chamber is deeper than the normal population","answer":"True","answer_bool":true},{"label":"c","text":"the iris is inserted more posteriorly into the ciliary body than the normal population","answer":"True","answer_bool":true},{"label":"d","text":"exercise or pupil dilatation causes intraocular pressure to rise","answer":"True","answer_bool":true},{"label":"e","text":"there is an increased incidence of lattice degeneration.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"Pigment dispersion syndrome is associated with pigmentary glaucoma and the risk factors are myopia and raised intraocular pressure. In this condition, the pigment dispersion is believed to be caused by the rubbing of the iris against the lens. This is caused by concavity of the iris as a result of a more posteriorly inserted iris. Iridotomy is useful in reducing the iris-lens contact and hence the amount of pigment dispersed. Lattice degeneration is increased in pigment dispersion syndrome as most of the sufferers are myopic.","quick_fix_ids":[],"source":{"question_pdf_page":14,"question_book_page":3,"answer_pdf_page":15,"answer_book_page":4},"primary_topic":"Glaucoma","tags":["Genetics","Pupil","Glaucoma","Lens, Cataract & Refractive Surgery","Retina & Vitreous"]},{"id":"FF008","question_number":8,"stem":"Aberrant regeneration of the oculomotor nerve:","options":["True","False"],"statements":[{"label":"a","text":"presents with retraction of the upper lid on down-gaze","answer":"True","answer_bool":true},{"label":"b","text":"presents with miosis on attempted adduction","answer":"True","answer_bool":true},{"label":"c","text":"has not been reported in oculomotor palsy caused by diabetes","answer":"True","answer_bool":true},{"label":"d","text":"most often occurs after trauma or aneurysm","answer":"True","answer_bool":true},{"label":"e","text":"is suggestive of orbital meningioma in the absence of antecedent oculomotor nerve palsy.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","d","e"],"explanation":"Aberrant regeneration of the oculomotor nerve occurs in a 'surgical' third nerve palsy and not in 'medical' third nerve palsy such as diabetes mellitus or hypertension. Retraction of the upper lid on down-gaze is called pseudo von Graefe's sign and miosis of the pupil on adduction is termed pseudo Argyll-Robertson pupil.","quick_fix_ids":[],"source":{"question_pdf_page":14,"question_book_page":3,"answer_pdf_page":15,"answer_book_page":4},"primary_topic":"Ocular Motility & Strabismus","tags":["Surgery","Genetics","Diabetes","Trauma","Pupil","Orbit"]},{"id":"FF009","question_number":9,"stem":"True autofluorescence is a feature of:","options":["True","False"],"statements":[{"label":"a","text":"optic disc drusen","answer":"True","answer_bool":true},{"label":"b","text":"macular drusen","answer":"True","answer_bool":true},{"label":"c","text":"cotton wool spots","answer":"False","answer_bool":false},{"label":"d","text":"myelinated nerve fibres","answer":"False","answer_bool":false},{"label":"e","text":"astrocytic hamartoma.","answer":"True","answer_bool":true}],"correct_labels":["a","b","e"],"explanation":"Autofluorescence is defined as the emission of fluorescent light from ocular structures in the absence of sodium fluorescein. On the other hand, pseudo-autofluorescence results from reflection of light from light-coloured or white fundal structures such as myelinated nerve fibres, sclera, hard exudates or cotton wool spots.","quick_fix_ids":["QF002"],"source":{"question_pdf_page":16,"question_book_page":5,"answer_pdf_page":17,"answer_book_page":6},"primary_topic":"Retina & Vitreous","tags":["Imaging","Optic nerve","Macula","Neuro-ophthalmology"]},{"id":"FF010","question_number":10,"stem":"With regard to optic neuritis:","options":["True","False"],"statements":[{"label":"a","text":"95% of patients recover their vision to 6/12 or better","answer":"True","answer_bool":true},{"label":"b","text":"the risk of developing multiple sclerosis is higher in patients with a T2 weighted abnormal MRI scan","answer":"True","answer_bool":true},{"label":"c","text":"a faster visual recovery occurs with systemic corticosteroids","answer":"True","answer_bool":true},{"label":"d","text":"final visual outcome is improved with systemic corticosteroids","answer":"False","answer_bool":false},{"label":"e","text":"the risk of developing multiple sclerosis is reduced in patients treated with corticosteroids.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Systemic corticosteroids can speed up the visual recovery of optic neuritis but the final visual outcome does not appear to be affected. It does not prevent the development of multiple sclerosis.","quick_fix_ids":["QF002"],"source":{"question_pdf_page":16,"question_book_page":5,"answer_pdf_page":17,"answer_book_page":6},"primary_topic":"Neuro-ophthalmology","tags":["Pharmacology","Imaging","Optic nerve","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF011","question_number":11,"stem":"The following are true about the differences between LASIK (laser assisted in-situ keratomileusis) and PRK (photo refractive keratectomy):","options":["True","False"],"statements":[{"label":"a","text":"LASIK is technically easier to perform than PRK","answer":"False","answer_bool":false},{"label":"b","text":"LASIK can be used to treat a higher myopia than PRK","answer":"True","answer_bool":true},{"label":"c","text":"LASIK causes less pain than PRK","answer":"True","answer_bool":true},{"label":"d","text":"LASIK is associated with less regression than PRK","answer":"True","answer_bool":true},{"label":"e","text":"epithelial downgrowth is seen in LASIK but not PRK.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"LASIK involves the creation of a partial thickness corneal flap followed by photorefractive surgery. It is technically more difficult than PRK. However, it has the advantages of faster visual rehabilitation with less pain and the ability to treat higher myopia. Epithelial downgrowth can occur under the flap in LASIK, resulting in poor vision.","quick_fix_ids":["QF002"],"source":{"question_pdf_page":16,"question_book_page":5,"answer_pdf_page":17,"answer_book_page":6},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Laser","Cornea","Cornea & External Eye"]},{"id":"FF012","question_number":12,"stem":"In Stickler's syndrome:","options":["True","False"],"statements":[{"label":"a","text":"type II collagen is defective","answer":"True","answer_bool":true},{"label":"b","text":"high myopia of more than 8 diopters is a feature","answer":"True","answer_bool":true},{"label":"c","text":"bone-spicule pigmentary changes are common in the peripheral retina","answer":"False","answer_bool":false},{"label":"d","text":"retinal detachment affects about 50% of patients","answer":"True","answer_bool":true},{"label":"e","text":"epiphyseal dysplasia of the long bones is a feature.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"Stickler's syndrome is an autosomal dominant condition. The patient has abnormal type II collagen, with high myopia (>8D), perivascular pigmentary changes but no bone-spicule formation. There is empty vitreous and the incidence of retinal detachment is as high as 50%. Orofacial anomalies are common, as are joint changes, especially at the epiphyses of the long bones.","quick_fix_ids":["QF002"],"source":{"question_pdf_page":16,"question_book_page":5,"answer_pdf_page":17,"answer_book_page":6},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Retinal detachment","Retina & Vitreous"]},{"id":"FF013","question_number":13,"stem":"In a patient with symptomatic right superior oblique palsy, the following surgery may be useful:","options":["True","False"],"statements":[{"label":"a","text":"right inferior oblique anterior transposition","answer":"True","answer_bool":true},{"label":"b","text":"left inferior oblique myectomy","answer":"False","answer_bool":false},{"label":"c","text":"left inferior rectus recession","answer":"True","answer_bool":true},{"label":"d","text":"right superior rectus resection","answer":"False","answer_bool":false},{"label":"e","text":"right superior oblique tuck.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"A right superior oblique palsy can result in vertical or torsional diplopia. Vertical diplopia may be treated with either ipsilateral inferior oblique myectomy or anterior transposition, contralateral inferior rectus recession or ipsilateral superior oblique tuck (sometimes in combination). Torsional diplopia can be treated with anterior transposition of the superior oblique muscle.","quick_fix_ids":["QF003"],"source":{"question_pdf_page":18,"question_book_page":7,"answer_pdf_page":19,"answer_book_page":8},"primary_topic":"Ocular Motility & Strabismus","tags":["Surgery","Strabismus"]},{"id":"FF014","question_number":14,"stem":"Increased pigmentary deposition in the angles is seen in:","options":["True","False"],"statements":[{"label":"a","text":"pseudoexfoliation syndrome","answer":"True","answer_bool":true},{"label":"b","text":"patients on latanoprost treatment","answer":"False","answer_bool":false},{"label":"c","text":"pigment dispersion syndrome","answer":"True","answer_bool":true},{"label":"d","text":"laser iridotomy","answer":"True","answer_bool":true},{"label":"e","text":"oculodermal melanocytosis.","answer":"True","answer_bool":true}],"correct_labels":["a","c","d","e"],"explanation":"Latanoprost increases melanin production in the melanocytes but does not cause increased pigmentary deposition in the angle.","quick_fix_ids":["QF003"],"source":{"question_pdf_page":18,"question_book_page":7,"answer_pdf_page":19,"answer_book_page":8},"primary_topic":"Glaucoma","tags":["Pharmacology","Laser","Genetics","Glaucoma","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF015","question_number":15,"stem":"The following are true about the structures seen on gonioscopy:","options":["True","False"],"statements":[{"label":"a","text":"Sampaolesi's line is anterior to Schwalbe's line","answer":"True","answer_bool":true},{"label":"b","text":"Scheie's stripe is located within the trabecular meshwork","answer":"False","answer_bool":false},{"label":"c","text":"the scleral spur is the posterior border of the trabecular meshwork","answer":"True","answer_bool":true},{"label":"d","text":"Schwalbe's line marks the termination of Descemet's membrane","answer":"True","answer_bool":true},{"label":"e","text":"the scleral spur defines the anatomical limbus.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"Sampaolesi's line is caused by pigment deposition and is found anterior to Schwalbe's line. Scheie's stripe is outside the trabecular meshwork and refers to the area of pigmentation between the lens zonules and the lens capsule. The anterior border of the trabecular meshwork is defined by Schwalbe's line and the scleral spur defines the posterior border. The anatomical limbus is defined by Schwalbe's line.","quick_fix_ids":["QF003"],"source":{"question_pdf_page":18,"question_book_page":7,"answer_pdf_page":19,"answer_book_page":8},"primary_topic":"Glaucoma","tags":["Glaucoma","Cataract","Lens, Cataract & Refractive Surgery"]},{"id":"FF016","question_number":16,"stem":"Regarding Wernicke's encephalopathy:","options":["True","False"],"statements":[{"label":"a","text":"vitamin B1 deficiency is the underlying cause","answer":"True","answer_bool":true},{"label":"b","text":"occurs in hyperemesis gravidarum","answer":"True","answer_bool":true},{"label":"c","text":"lesions typically occur in the frontal lobe","answer":"False","answer_bool":false},{"label":"d","text":"ophthalmoplegia occurs as the result of peripheral cranial nerve palsies","answer":"False","answer_bool":false},{"label":"e","text":"cerebellar signs are characteristic.","answer":"True","answer_bool":true}],"correct_labels":["a","b","e"],"explanation":"Wernicke's encephalopathy is characterised by ophthalmoplegia, mental confusion and gait ataxia. It is caused by vitamin B1 deficiency and is commonly seen in alcoholics. It also occurs in hyperemesis gravidarum in which the pregnant woman cannot take in food due to recurrent vomiting. The ophthalmoplegia is central in origin. Lesions are found in the motor and vestibular nuclei, paraventricular region of the thalamus, hypothalamus and the cerebellum.","quick_fix_ids":["QF003"],"source":{"question_pdf_page":18,"question_book_page":7,"answer_pdf_page":19,"answer_book_page":8},"primary_topic":"Neuro-ophthalmology","tags":["Systemic Disease & Ocular Associations"]},{"id":"FF017","question_number":17,"stem":"The following are true about Leber's hereditary optic neuropathy:","options":["True","False"],"statements":[{"label":"a","text":"it causes painless visual loss in young patients","answer":"True","answer_bool":true},{"label":"b","text":"Uhthoff's phenomenon is a recognised symptom","answer":"True","answer_bool":true},{"label":"c","text":"affected males do not pass the condition to their offspring","answer":"True","answer_bool":true},{"label":"d","text":"fluorescein angiography shows leakage of dye at the optic disc","answer":"False","answer_bool":false},{"label":"e","text":"the amount of recovery can be predicted from the genetic mutation.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"Painless visual loss differentiates Leber's optic neuropathy from optic neuritis. Uhthoff's phenomenon describes decreased vision with exercise or warming of body temperature and is seen in both optic neuritis and Leber's hereditary optic neuropathy, as well as in other optic neuropathies. The condition is caused by abnormalities in the mitochondrial DNA and therefore is not transmitted in sperm. Ophthalmoscopy reveals circumpapillary telangiectatic microangiopathy and swelling of the nerve fibre layer around the disc. However, unlike in patients with swollen disc, leakage of dye is not seen in fluorescein angiography. The type of mutation can predict visual recovery, those with 117788 mutation have poor recovery, whereas those with 14484 mutation have significant visual recovery.","quick_fix_ids":["QF004"],"source":{"question_pdf_page":20,"question_book_page":9,"answer_pdf_page":21,"answer_book_page":10},"primary_topic":"Neuro-ophthalmology","tags":["Imaging","Genetics","Optic nerve","Retina & Vitreous"]},{"id":"FF018","question_number":18,"stem":"The following signs are regarded as significant macular oedema in diabetes mellitus:","options":["True","False"],"statements":[{"label":"a","text":"microaneurysms within one disc diameter of the fovea","answer":"False","answer_bool":false},{"label":"b","text":"hard exudate in the fovea","answer":"False","answer_bool":false},{"label":"c","text":"retinal thickening within 500 μm of the fovea","answer":"True","answer_bool":true},{"label":"d","text":"retinal thickening of one disc diameter, any part of which is within one disc diameter of the fovea","answer":"True","answer_bool":true},{"label":"e","text":"flamed haemorrhages within 500 μm of the fovea.","answer":"False","answer_bool":false}],"correct_labels":["c","d"],"explanation":"Clinically significant macular oedema is defined as:\n\n• retinal thickening within 500 μm of the fovea • presence of hard exudate with retinal thickening within 500 μm of the fovea • retinal thickening of one disc diameter and any part of which is within one disc diameter of the fovea.","quick_fix_ids":["QF004"],"source":{"question_pdf_page":20,"question_book_page":9,"answer_pdf_page":21,"answer_book_page":10},"primary_topic":"Retina & Vitreous","tags":["Diabetes","Trauma","Macula"]},{"id":"FF019","question_number":19,"stem":"The following blood tests are useful for the respective diseases mentioned:","options":["True","False"],"statements":[{"label":"a","text":"C-ANCA in Wegener's granulomatosis","answer":"False","answer_bool":false},{"label":"b","text":"P-ANCA in polyarteritis nodosa","answer":"False","answer_bool":false},{"label":"c","text":"anti centromere antibody in scleroderma","answer":"True","answer_bool":true},{"label":"d","text":"anti-SS-B in primary Sjogren's syndrome","answer":"True","answer_bool":true},{"label":"e","text":"anti-striated muscle antibody in thymoma.","answer":"True","answer_bool":true}],"correct_labels":["c","d","e"],"explanation":"ANCA is present in polyarteritis nodosa and Wegener's granulomatosis. Perinuclear ANCA (P-ANCA) is seen in polyarteritis nodosa whereas cytoplasmic ANCA (C-ANCA) is seen in Wegener's granulomatosis.","quick_fix_ids":["QF004"],"source":{"question_pdf_page":20,"question_book_page":9,"answer_pdf_page":21,"answer_book_page":10},"primary_topic":"Diagnostics, Pharmacology & Perioperative","tags":["Genetics"]},{"id":"FF020","question_number":20,"stem":"The Gram stain of a patient's corneal ulcer reveals Gram-negative rods. The following are possible diagnoses:","options":["True","False"],"statements":[{"label":"a","text":"Pseudomonas aeruginosa","answer":"True","answer_bool":true},{"label":"b","text":"Corynebacterium","answer":"False","answer_bool":false},{"label":"c","text":"Serratia marcescens","answer":"True","answer_bool":true},{"label":"d","text":"Moraxella","answer":"True","answer_bool":true},{"label":"e","text":"Neisseria.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"Corynebacterium is a Gram-positive rod and Neisseria is a Gram-negative coccus. Pseudomonas aeruginosa is the most common pathogen in contact lens-related corneal ulcer. Serratia marcescens is uncommon but can cause rapid and extensive corneal necrosis. Moraxella species are opportunistic pathogens and are usually seen in alcoholic or debilitated patients.","quick_fix_ids":["QF004"],"source":{"question_pdf_page":20,"question_book_page":9,"answer_pdf_page":21,"answer_book_page":10},"primary_topic":"Cornea & External Eye","tags":["Cornea"]},{"id":"FF021","question_number":21,"stem":"In Miller-Fisher's syndrome:","options":["True","False"],"statements":[{"label":"a","text":"two-thirds of patients present with diplopia","answer":"True","answer_bool":true},{"label":"b","text":"the ratio of male to female involvement is about 2:1","answer":"True","answer_bool":true},{"label":"c","text":"the cerebrospinal fluid shows lymphocytosis","answer":"False","answer_bool":false},{"label":"d","text":"antibody to ganglioside GQ1b is diagnostic","answer":"True","answer_bool":true},{"label":"e","text":"chronic cases occur in 50% of patients.","answer":"False","answer_bool":false}],"correct_labels":["a","b","d"],"explanation":"Miller-Fisher's syndrome is a variant of Guillain Barre's syndrome. It is characterised by areflexia, external ophthalmoplegia and ataxia. Diplopia is the most common presentation. The cerebrospinal fluid typically shows dissociation of proteins and cells, i.e. the protein is increased but there are minimal cells. Chronic or recurrent cases are uncommon.","quick_fix_ids":["QF005"],"source":{"question_pdf_page":22,"question_book_page":11,"answer_pdf_page":23,"answer_book_page":12},"primary_topic":"Neuro-ophthalmology","tags":["Genetics"]},{"id":"FF022","question_number":22,"stem":"With regard to progressive supranuclear palsy:","options":["True","False"],"statements":[{"label":"a","text":"it occurs in patients with chronic Parkinson's disease","answer":"False","answer_bool":false},{"label":"b","text":"the vertical eye movements are affected before the horizontal eye movements","answer":"True","answer_bool":true},{"label":"c","text":"the downward pursuit movement is usually affected before the upward pursuit movement","answer":"True","answer_bool":true},{"label":"d","text":"blinking to bright light is reduced","answer":"True","answer_bool":true},{"label":"e","text":"oral levodopa improves the eye movement in the majority of patients.","answer":"False","answer_bool":false}],"correct_labels":["b","c","d"],"explanation":"Progressive supranuclear palsy is a form of parkinsonism, which is different from Parkinson's disease. The vertical eye movement is affected early before the horizontal eye movement. Both the saccades and pursuit movements are abnormal. The blinking reflex is also affected. Unlike Parkinson's disease, it does not respond to levodopa.","quick_fix_ids":["QF005"],"source":{"question_pdf_page":22,"question_book_page":11,"answer_pdf_page":23,"answer_book_page":12},"primary_topic":"Neuro-ophthalmology","tags":[]},{"id":"FF023","question_number":23,"stem":"In infantile esotropia:","options":["True","False"],"statements":[{"label":"a","text":"amblyopia occurs in 40% of patients despite early surgery","answer":"True","answer_bool":true},{"label":"b","text":"early surgical correction restores normal binocular single vision","answer":"False","answer_bool":false},{"label":"c","text":"asymmetric optokinetic nystagmus occurs with a better nasal-to-temporal movement than temporal-to-nasal movement","answer":"False","answer_bool":false},{"label":"d","text":"90% of patients have dissociated vertical deviation","answer":"True","answer_bool":true},{"label":"e","text":"post-surgical accommodative esotropia is common.","answer":"True","answer_bool":true}],"correct_labels":["a","d","e"],"explanation":"Infantile esotropia has large angle esotropia. Binocular single vision is usually poor despite early treatment. The temporal-to-nasal movement is usually better than nasal-to-temporal movement on optokinetic testing. Dissociated vertical deviation and inferior oblique overaction are common and have been reported in about 90% of patients. Post-surgical esotropia may be caused by an accommodative component.","quick_fix_ids":["QF005"],"source":{"question_pdf_page":22,"question_book_page":11,"answer_pdf_page":23,"answer_book_page":12},"primary_topic":"Ocular Motility & Strabismus","tags":["Surgery","Paediatrics","Strabismus","Paediatric Ophthalmology & Genetics"]},{"id":"FF024","question_number":24,"stem":"The following are true about retinoblastoma:","options":["True","False"],"statements":[{"label":"a","text":"a family history is present in less than 10% of the sufferers","answer":"True","answer_bool":true},{"label":"b","text":"about 40% of all cases of retinoblastoma are heritable","answer":"True","answer_bool":true},{"label":"c","text":"deletion of 13q14 chromosome is seen in 25% of patients","answer":"False","answer_bool":false},{"label":"d","text":"systemic malformations are more common in those with bilateral than unilateral retinoblastoma","answer":"False","answer_bool":false},{"label":"e","text":"secondary cancers are more common in non-heritable than heritable retinoblastoma.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"About 40% of all retinoblastomas are caused by germinal mutation and are therefore heritable. Deletion of 13q14 occurs in about 1% of cases and is associated with systemic malformation. Heritable retinoblastoma is associated with a higher incidence of secondary cancers.","quick_fix_ids":["QF005"],"source":{"question_pdf_page":22,"question_book_page":11,"answer_pdf_page":23,"answer_book_page":12},"primary_topic":"Ocular Oncology & Pathology","tags":["Genetics","Oncology"]},{"id":"FF025","question_number":25,"stem":"In shaken baby syndrome:","options":["True","False"],"statements":[{"label":"a","text":"the average age of the patient is about 2 years old","answer":"False","answer_bool":false},{"label":"b","text":"retinal haemorrhages are essential for the diagnosis","answer":"False","answer_bool":false},{"label":"c","text":"retinal haemorrhages are useful in determining the time of trauma","answer":"False","answer_bool":false},{"label":"d","text":"neurological deficits occur in about one-third of patients","answer":"True","answer_bool":true},{"label":"e","text":"permanent visual loss results from retinal lesions.","answer":"False","answer_bool":false}],"correct_labels":["d"],"explanation":"Retinal haemorrhages are commonly seen in shaken baby syndrome. However, they are not necessary for diagnosis and should not be used to determine the time of trauma. Neurological deficits occur in about one-third of patients. Visual impairment is usually caused by cerebral damage.","quick_fix_ids":["QF006"],"source":{"question_pdf_page":24,"question_book_page":13,"answer_pdf_page":25,"answer_book_page":14},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Trauma","Retina & Vitreous"]},{"id":"FF026","question_number":26,"stem":"Risk factors for expulsive suprachoroidal haemorrhage during cataract extraction include:","options":["True","False"],"statements":[{"label":"a","text":"high myopia","answer":"True","answer_bool":true},{"label":"b","text":"history of glaucoma","answer":"True","answer_bool":true},{"label":"c","text":"shallow anterior chamber","answer":"False","answer_bool":false},{"label":"d","text":"atherosclerosis","answer":"True","answer_bool":true},{"label":"e","text":"blue iris.","answer":"False","answer_bool":false}],"correct_labels":["a","b","d"],"explanation":"Expulsive suprachoroidal haemorrhage. is rare and has been estimated to occur in about one in every thousand cases of cataract extraction. Risk factors include increased axial length, glaucoma, atherosclerosis and previous expulsive suprachoroidal haemorrhage.","quick_fix_ids":["QF006"],"source":{"question_pdf_page":24,"question_book_page":13,"answer_pdf_page":25,"answer_book_page":14},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Trauma","Glaucoma","Cataract","Retina & Vitreous"]},{"id":"FF027","question_number":27,"stem":"The following are true about the use of pneumatic retinopexy:","options":["True","False"],"statements":[{"label":"a","text":"it is contraindicated in patients with glaucoma","answer":"True","answer_bool":true},{"label":"b","text":"it is not suitable for patients with inferior retinal detachment","answer":"True","answer_bool":true},{"label":"c","text":"presence of any proliferative vitreoretinopathy is a contraindication","answer":"False","answer_bool":false},{"label":"d","text":"the retinal breaks should be within one clock hour of each other","answer":"True","answer_bool":true},{"label":"e","text":"the success rate is higher in pseudophakic compared with phakic patients.","answer":"False","answer_bool":false}],"correct_labels":["a","b","d"],"explanation":"Pneumatic retinopexy involves the use of air to flatten the retina following cryotherapy. It is suitable only for superior retinal detachment and the retinal tears should be within one clock hour of each other. As there is often an increase in intraocular pressure, it is contraindicated in glaucoma. Grade C PVR is a contraindication as the retina is usually rigid in these cases. The success rate is higher in phakic than pseudophakic patients.","quick_fix_ids":["QF006"],"source":{"question_pdf_page":24,"question_book_page":13,"answer_pdf_page":25,"answer_book_page":14},"primary_topic":"Retina & Vitreous","tags":["Surgery","Retinal detachment","Glaucoma","Lens, Cataract & Refractive Surgery"]},{"id":"FF028","question_number":28,"stem":"The advantages of continuous curvilinear capsulorrhexis over capsulotomy include:","options":["True","False"],"statements":[{"label":"a","text":"easier prolapse of the lens nucleus into the anterior chamber","answer":"False","answer_bool":false},{"label":"b","text":"ensures 'in the bag' intraocular lens implantation","answer":"True","answer_bool":true},{"label":"c","text":"allows hydrodissection of the lens with minimal risk of extension of tear to the equator","answer":"True","answer_bool":true},{"label":"d","text":"reduced incidence of post-operative intraocular lens decentration","answer":"True","answer_bool":true},{"label":"e","text":"reduced incidence of posterior capsule thickening.","answer":"False","answer_bool":false}],"correct_labels":["b","c","d"],"explanation":"Capsulorrhexis allows safe hydrodissection and phacoemulsification. It ensures 'in-the-bag' intraocular lens implantation and reduced post-operative decentration. Nucleus prolapse is difficult in capsulorrhexis compared with capsulotomy. Capsulorrhexis does not reduce the incidence of posterior capsule thickening.","quick_fix_ids":["QF006"],"source":{"question_pdf_page":24,"question_book_page":13,"answer_pdf_page":25,"answer_book_page":14},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Cataract"]},{"id":"FF029","question_number":29,"stem":"In involutional ptosis:","options":["True","False"],"statements":[{"label":"a","text":"height of the skin crease is increased","answer":"True","answer_bool":true},{"label":"b","text":"levator function is reduced","answer":"False","answer_bool":false},{"label":"c","text":"ptosis is decreased on down-gaze","answer":"False","answer_bool":false},{"label":"d","text":"up-gaze is usually abnormal","answer":"False","answer_bool":false},{"label":"e","text":"levator resection is the treatment of choice.","answer":"False","answer_bool":false}],"correct_labels":["a"],"explanation":"In involutional ptosis, there is dehiscence of the levator aponeurosis resulting in an elevated skin crease. The ptosis is constant in up- or down-gaze. The up-gaze is not affected as in some congenital ptosis. Levator advancement is the treatment of choice.","quick_fix_ids":["QF007"],"source":{"question_pdf_page":26,"question_book_page":15,"answer_pdf_page":27,"answer_book_page":16},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Surgery","Paediatrics"]},{"id":"FF030","question_number":30,"stem":"An increased rate of proliferative vitreoretinopathy is seen in:","options":["True","False"],"statements":[{"label":"a","text":"multiple retinal breaks","answer":"True","answer_bool":true},{"label":"b","text":"pneumatic retinopexy","answer":"False","answer_bool":false},{"label":"c","text":"scleral buckling","answer":"False","answer_bool":false},{"label":"d","text":"vitrectomy surgery","answer":"True","answer_bool":true},{"label":"e","text":"vitreous haemorrhage.","answer":"True","answer_bool":true}],"correct_labels":["a","d","e"],"explanation":"Proliferative vitreoretinopathy is thought to be caused by the release of retinal pigment epithelium onto the retina. The incidence of PVR is increased in large or multiple retinal breaks, cryotherapy, vitreous haemorrhages and vitrectomy surgery. Pneumatic retinopexy and scleral buckling do not increase PVR....•....•....•.....•..•......•.....•....................•..•................•","quick_fix_ids":["QF007"],"source":{"question_pdf_page":26,"question_book_page":15,"answer_pdf_page":27,"answer_book_page":16},"primary_topic":"Retina & Vitreous","tags":["Surgery","Trauma","Retinal detachment"]},{"id":"FF031","question_number":31,"stem":"The following lens changes are typical of the medical condition mentioned:","options":["True","False"],"statements":[{"label":"a","text":"posterior subcapsular cataract in retinitis pigmentosa","answer":"True","answer_bool":true},{"label":"b","text":"anterior subcapsular cataract in amiodarone user","answer":"False","answer_bool":false},{"label":"c","text":"posterior lenticonus in Alport's syndrome","answer":"False","answer_bool":false},{"label":"d","text":"droplet cataract in galactosaemia","answer":"True","answer_bool":true},{"label":"e","text":"polychromatic cataract in Wilson's disease.","answer":"False","answer_bool":false}],"correct_labels":["a","d"],"explanation":"Amiodarone can give rise to anterior stellate deposit but is usually visually insignificant. Alport's syndrome is associated with anterior lenticonus. Polychromatic cataract is seen in myotonic dystrophy.","quick_fix_ids":["QF007"],"source":{"question_pdf_page":26,"question_book_page":15,"answer_pdf_page":27,"answer_book_page":16},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Genetics","Cataract"]},{"id":"FF032","question_number":32,"stem":"In a patient with subluxated lens, the following tests are useful:","options":["True","False"],"statements":[{"label":"a","text":"echocardiogram","answer":"True","answer_bool":true},{"label":"b","text":"serum methionine","answer":"True","answer_bool":true},{"label":"c","text":"brain MRI","answer":"False","answer_bool":false},{"label":"d","text":"serum FTA antibodies","answer":"True","answer_bool":true},{"label":"e","text":"urine thiosulphate.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"Echocardiogram may show enlarged aortic roots or mitral valve prolapse in Marfan's syndrome. High serum methionine is seen in homocystinuria. Syphilis is a known cause of ectopia lentis. Urine thiosulphate is seen in sulphite oxidase deficiency, in which the disulphide bond is disrupted and can cause ectopia lentis.","quick_fix_ids":["QF007"],"source":{"question_pdf_page":26,"question_book_page":15,"answer_pdf_page":27,"answer_book_page":16},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Imaging","Genetics"]},{"id":"FF033","question_number":33,"stem":"Shallowing of the anterior chamber during phacoemulsification may indicate:","options":["True","False"],"statements":[{"label":"a","text":"posterior capsule rupture","answer":"False","answer_bool":false},{"label":"b","text":"retinal detachment","answer":"False","answer_bool":false},{"label":"c","text":"suprachoroidal haemorrhage","answer":"True","answer_bool":true},{"label":"d","text":"inadequate infusion of BSS","answer":"True","answer_bool":true},{"label":"e","text":"aqueous misdirection syndrome.","answer":"True","answer_bool":true}],"correct_labels":["c","d","e"],"explanation":"Shallowing of the anterior chamber can result from inadequate fluid infusion or a rise in vitreous pressure. The latter can result from breath holding, pressure from the speculum, or misdirection of the aqueous or suprachoroidal haemorrhage. Posterior capsule rupture and retinal detachment usually cause deepening of the anterior chamber.","quick_fix_ids":["QF008"],"source":{"question_pdf_page":28,"question_book_page":17,"answer_pdf_page":29,"answer_book_page":18},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Genetics","Trauma","Retinal detachment","Cataract","Retina & Vitreous"]},{"id":"FF034","question_number":34,"stem":"The following are true about the Endophthalmitis Vitrectomy Study:","options":["True","False"],"statements":[{"label":"a","text":"use of vancomycin in the irrigating solution reduces the risk of endophthalmitis","answer":"False","answer_bool":false},{"label":"b","text":"Staphylococcus aureus is the most common pathogen","answer":"False","answer_bool":false},{"label":"c","text":"systemic corticosteroid is useful","answer":"False","answer_bool":false},{"label":"d","text":"intravenous antibiotic improves the final visual outcome","answer":"False","answer_bool":false},{"label":"e","text":"vitrectomy is only useful in patients with light-perception vision.","answer":"True","answer_bool":true}],"correct_labels":["e"],"explanation":"The study did not look into the use of vancomycin or systemic corticosteroid in endophthalmitis. The most common pathogen is 5 epidermidis. In the study, intravenous antibiotic did not appear to affect the outcome. Vitrectomy appeared to improve the visual outcome in those with light perception only.","quick_fix_ids":["QF008"],"source":{"question_pdf_page":28,"question_book_page":17,"answer_pdf_page":29,"answer_book_page":18},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Pharmacology","Surgery","Retina & Vitreous","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF035","question_number":35,"stem":"The risk of zonular dehiscence during cataract surgery is increased in the following conditions:","options":["True","False"],"statements":[{"label":"a","text":"pseudoexfoliation syndrome","answer":"True","answer_bool":true},{"label":"b","text":"pigment dispersion syndrome","answer":"False","answer_bool":false},{"label":"c","text":"aniridia","answer":"True","answer_bool":true},{"label":"d","text":"Ehler-Danlos syndrome","answer":"True","answer_bool":true},{"label":"e","text":"albinism.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"The zonules are weakened in patients with pseudoexfoliation syndrome, aniridia and Ehler-Danlos syndrome. Other conditions that can increase zonular dehiscence include high myopia, syphilis, Marfan's syndrome, Weil-Marchesani syndrome, sulphate oxidase deficiency and lysine deficiency.","quick_fix_ids":["QF008"],"source":{"question_pdf_page":28,"question_book_page":17,"answer_pdf_page":29,"answer_book_page":18},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Genetics","Cataract","Paediatric Ophthalmology & Genetics","Glaucoma"]},{"id":"FF036","question_number":36,"stem":"Concerning malignant glaucoma:","options":["True","False"],"statements":[{"label":"a","text":"it occurs most commonly after filteration surgery for acute angle-closure glaucoma","answer":"True","answer_bool":true},{"label":"b","text":"the anterior chamber is typically shallow","answer":"True","answer_bool":true},{"label":"c","text":"the volume of the vitreous is increased","answer":"True","answer_bool":true},{"label":"d","text":"the increased pressure is due to anterior displacement of the ciliary body by choroidal effusion","answer":"False","answer_bool":false},{"label":"e","text":"the pressure can be controlled with a miotic.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Malignant glaucoma typically occurs following trabeculectomy in angle-closure glaucoma. The anterior chamber is shallow with raised intraocular pressure. The mechanism is believed to be caused by aqueous misdirection, resulting in expansion of the vitreous, causing forward movement of the lens and the ciliary body. The initial treatment of choice is a cycloplegic which moves the lens backwards and encourages the flow of aqueous anteriorly.","quick_fix_ids":["QF008"],"source":{"question_pdf_page":28,"question_book_page":17,"answer_pdf_page":29,"answer_book_page":18},"primary_topic":"Glaucoma","tags":["Surgery","Glaucoma","Retina & Vitreous","Lens, Cataract & Refractive Surgery"]},{"id":"FF037","question_number":37,"stem":"Uveitis and poliosis are seen in:","options":["True","False"],"statements":[{"label":"a","text":"sympathetic ophthalmia","answer":"True","answer_bool":true},{"label":"b","text":"Vogt-Koyanagi-Harada's syndrome","answer":"True","answer_bool":true},{"label":"c","text":"AZOOR","answer":"False","answer_bool":false},{"label":"d","text":"tuberculosis","answer":"False","answer_bool":false},{"label":"e","text":"sarcoidosis.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"Pigment abnormalities are seen in sympathetic ophthalmia and VKH syndrome, which can also cause uveitis.","quick_fix_ids":[],"source":{"question_pdf_page":30,"question_book_page":19,"answer_pdf_page":31,"answer_book_page":20},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Genetics","Inflammation"]},{"id":"FF038","question_number":38,"stem":"With regard to acute retinal necrosis:","options":["True","False"],"statements":[{"label":"a","text":"the affected eye is usually painless","answer":"False","answer_bool":false},{"label":"b","text":"the condition is bilateral in one-third of cases","answer":"True","answer_bool":true},{"label":"c","text":"retinal detachment is an important cause of visual loss","answer":"False","answer_bool":false},{"label":"d","text":"most patients are immunocompromised","answer":"False","answer_bool":false},{"label":"e","text":"gancyclovir is the treatment of choice.","answer":"True","answer_bool":true}],"correct_labels":["b","e"],"explanation":"Acute retinal necrosis usually presents with a painful red eye and pan uveitis. It usually affects immunocompetent patients. Herpes viruses, especially herpes simplex and varicella zoster, are often implicated. Visual loss is usually due to optic neuritis and retinal detachment. The treatment of choice is initial intravenous acyclovir followed by an oral course. Gancyclovir is not used due to its toxicity and the need for intravenous administration to be effective.","quick_fix_ids":[],"source":{"question_pdf_page":30,"question_book_page":19,"answer_pdf_page":31,"answer_book_page":20},"primary_topic":"Retina & Vitreous","tags":["Infection","Inflammation","Optic nerve","Retinal detachment"]},{"id":"FF039","question_number":39,"stem":"The following are true about retinal capillary haemangioma:","options":["True","False"],"statements":[{"label":"a","text":"it is usually the first manifestation of von Hippel-Lindau's syndrome","answer":"True","answer_bool":true},{"label":"b","text":"radiological imaging of the abdomen and head should be carried out irrespective of family history","answer":"True","answer_bool":true},{"label":"c","text":"spontaneous regression is common and close observation is the management of choice","answer":"False","answer_bool":false},{"label":"d","text":"there is usually a prominent feeding vessel but normal drainage vessel","answer":"False","answer_bool":false},{"label":"e","text":"a blood test may show thrombocythaemia.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"Retinal capillary haemangioma is often the first manifestation of von Hippel-lindau's syndrome. As the disease may skip a generation(s), a MRI scan of the abdomen and head for potentially lethal tumours such as phaeochromocytoma or cerebellar haemangioblastoma is essential. The lesions have variable progression, and ablation with either cryotherapy or photocoagulation is recommended before the tumour gets too big. Both the feeding and drainage vessels are usually enlarged. Cerebellar haemangioblastoma can give rise to polycythaemia through erythropoietin secretion, and the blood tests show increased red blood cells.","quick_fix_ids":[],"source":{"question_pdf_page":30,"question_book_page":19,"answer_pdf_page":31,"answer_book_page":20},"primary_topic":"Ocular Oncology & Pathology","tags":["Imaging","Genetics","Oncology","Retina & Vitreous"]},{"id":"FF040","question_number":40,"stem":"An HIV-positive patient was found to have a white lesion on the retina. The following can accurately differentiate a cotton wool spot from CMV retinitis:","options":["True","False"],"statements":[{"label":"a","text":"CD4+ count","answer":"False","answer_bool":false},{"label":"b","text":"presence of vitritis","answer":"False","answer_bool":false},{"label":"c","text":"visual acuity","answer":"False","answer_bool":false},{"label":"d","text":"presence of haemorrhage","answer":"True","answer_bool":true},{"label":"e","text":"enlargement of the lesion.","answer":"True","answer_bool":true}],"correct_labels":["d","e"],"explanation":"Early CMV retinitis can pose a diagnostic dilemma as it may resemble cotton wool spots which are common in HIV patients. Although CMV retinitis is more common in those with CD 4+ counts of fewer than 50 cells per /11, it cannot be used to differentiate the two conditions. Furthermore, early CMV retinitis is asymptomatic and vitritis is minimal. White lesions in HIV patients should be observed over time· for any enlargement or development of haemorrhages which are suggestive of CMV retinitis.","quick_fix_ids":[],"source":{"question_pdf_page":30,"question_book_page":19,"answer_pdf_page":31,"answer_book_page":20},"primary_topic":"Retina & Vitreous","tags":["Infection","Trauma","Uveitis & Ocular Inflammation"]},{"id":"FF041","question_number":41,"stem":"The following are true about the optokinetic response:","options":["True","False"],"statements":[{"label":"a","text":"it tests the pursuit movement in the direction of the movement of the drum","answer":"True","answer_bool":true},{"label":"b","text":"a subject who has a right pursuit problem is likely to have a lesion in the left parietal lobe","answer":"False","answer_bool":false},{"label":"c","text":"a subject who has a problem with refixation when the drum is moved to the left is likely to have a lesion in the left frontal lobe","answer":"True","answer_bool":true},{"label":"d","text":"a patient with Parinaud's syndrome will develop convergence retraction nystagmus when the drum is rotated vertically","answer":"True","answer_bool":true},{"label":"e","text":"in a patient with adduction deficit, the presence of adduction in response to an optokinetic drum indicates a supranuclear lesion.","answer":"True","answer_bool":true}],"correct_labels":["a","c","d","e"],"explanation":"Optokinetic response tests the pursuit and saccadic movements. When the drum is rotated to the right, the pursuit movement is mediated by the right parietal lobe and the saccadic movement by the right frontal lobe, i.e. the optokinetic response tests the pursuit and saccadic movement on the side towards which the drum is moving. Parinaud's syndrome causes up-gaze palsy and vertical rotation of the drum will elicit convergence retraction nystagmus. In a patient with a frontal lobe lesion, there may be deviation of his or her eyes to the side of the lesion. However, provided the contralateral frontal lobe is intact, rotating an optokinetic drum away from the side of the frontal lobe will elicit a response.","quick_fix_ids":[],"source":{"question_pdf_page":32,"question_book_page":21,"answer_pdf_page":33,"answer_book_page":22},"primary_topic":"Neuro-ophthalmology","tags":["Electrophysiology","Genetics","Strabismus","Retina & Vitreous","Ocular Motility & Strabismus"]},{"id":"FF042","question_number":42,"stem":"Enlarged superior ophthalmic vein on CT scan is a feature in:","options":["True","False"],"statements":[{"label":"a","text":"carotid cavernous fistula","answer":"True","answer_bool":true},{"label":"b","text":"posterior communicating artery aneurysm","answer":"False","answer_bool":false},{"label":"c","text":"craniopharyngioma","answer":"False","answer_bool":false},{"label":"d","text":"von Hippel-Lindau's syndrome","answer":"False","answer_bool":false},{"label":"e","text":"cavernous sinus thrombosis.","answer":"True","answer_bool":true}],"correct_labels":["a","e"],"explanation":"Enlarged superior ophthalmic vein occurs when the drainage of venous blood into the cavernous sinus is impaired. This occurs in carotid cavernous fistula and cavernous sinus thrombosis. The other conditions mentioned do not increase the pressure of the cavernous sinus or impair venous drainage.","quick_fix_ids":[],"source":{"question_pdf_page":32,"question_book_page":21,"answer_pdf_page":33,"answer_book_page":22},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Imaging","Genetics"]},{"id":"FF043","question_number":43,"stem":"The following are true about neonatal conjunctivitis:","options":["True","False"],"statements":[{"label":"a","text":"it is defined as conjunctivitis that occurs within 28 days of birth","answer":"True","answer_bool":true},{"label":"b","text":"chlamydial conjunctivitis is the most common cause in the UK","answer":"True","answer_bool":true},{"label":"c","text":"topical tetracycline is the treatment of choice in chlamydial conjunctivitis of the neonate","answer":"False","answer_bool":false},{"label":"d","text":"Thayer-Martin medium is useful in isolating Neisseria gonorrhoea","answer":"True","answer_bool":true},{"label":"e","text":"topical treatment should be combined with systemic treatment in gonococcal conjunctivitis.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"Chlamydial conjunctivitis is the most common cause of neonatal con junctivitis. Systemic antibiotics such as erythromycin are indicated due to the high risk of pneumonitis. Thayer-Martin medium contains antibiotic and antifungal agents that will stop the growth of bacteria and fungus but not that of Neisseria gonorrhoea. Like chlamydial conjunctivitis, gonococcal conjunctivitis should also be treated with systemic antibiotics.","quick_fix_ids":[],"source":{"question_pdf_page":32,"question_book_page":21,"answer_pdf_page":33,"answer_book_page":22},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Paediatrics","Infection","Cornea & External Eye"]},{"id":"FF044","question_number":44,"stem":"In familial exudative vitreoretinopathy:","options":["True","False"],"statements":[{"label":"a","text":"males are more commonly affected than females","answer":"False","answer_bool":false},{"label":"b","text":"dragged discs may be present which can be confused with retinopathy of prematurity","answer":"True","answer_bool":true},{"label":"c","text":"fluorescein angiography shows failure of vascularisation of the temporal retina","answer":"True","answer_bool":true},{"label":"d","text":"exudative retinal detachment is the most common cause of poor vision","answer":"False","answer_bool":false},{"label":"e","text":"prophylactic cryotherapy of the peripheral retina is useful in preventing visual loss.","answer":"True","answer_bool":true}],"correct_labels":["b","c","e"],"explanation":"Familial exudative vitreoretinopathy is an autosomal dominant condition. Clinically it may resemble retinopathy of prematurity with failure of vascularisation in the temporal retina leading to fibrovascular changes with dragged macula and disc. However, a history of prematurity is absent. Although exudates are common, retinal detachment is rare. Poor vision usually results from rheumatogenous retinal detachment. The use of cryotherapy or photocoagulation to the avascular retina reduces complications.","quick_fix_ids":[],"source":{"question_pdf_page":32,"question_book_page":21,"answer_pdf_page":33,"answer_book_page":22},"primary_topic":"Retina & Vitreous","tags":["Imaging","Genetics","Paediatrics","Retinal detachment","Macula","Paediatric Ophthalmology & Genetics"]},{"id":"FF045","question_number":45,"stem":"The following maculopathies typically give rise to severe central visual loss before the age of 40:","options":["True","False"],"statements":[{"label":"a","text":"Sorby's macular dystrophy","answer":"True","answer_bool":true},{"label":"b","text":"Stargardt's macular dystrophy","answer":"True","answer_bool":true},{"label":"c","text":"Best's disease","answer":"True","answer_bool":true},{"label":"d","text":"central areolar choroidal dystrophy","answer":"False","answer_bool":false},{"label":"e","text":"North Carolina macular dystrophy.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"All the conditions mentioned are dominantly inherited and give rise to severe central visual loss. Stargardt's disease, North Carolina macular dystrophy and Best's disease usually reduce the vision significantly before the age of 20. Sorby's macular dystrophy causes significant visual loss in the 20s to 40s. Patients with central areolar choroidal dystrophy do not usually have significant visual loss until the 50s.","quick_fix_ids":[],"source":{"question_pdf_page":34,"question_book_page":23,"answer_pdf_page":35,"answer_book_page":24},"primary_topic":"Retina & Vitreous","tags":["Macula"]},{"id":"FF046","question_number":46,"stem":"Corneal blood staining following hyphaema is increased in:","options":["True","False"],"statements":[{"label":"a","text":"raised intraocular pressure","answer":"True","answer_bool":true},{"label":"b","text":"a patient with sickle cell anaemia","answer":"True","answer_bool":true},{"label":"c","text":"prolonged hyphaema","answer":"True","answer_bool":true},{"label":"d","text":"Fuch's endothelial dystrophy","answer":"True","answer_bool":true},{"label":"e","text":"use of topical steroid.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c","d"],"explanation":"Corneal blood staining is a complication of hyphaema. Its incidence is increased in patients with prolonged hyphaema, large hyphaema, high intraocular pressure and abnormal endothelium. Sickle cell anaemia is associated with delayed clearance of hyphaema due to sickling of the red blood cells and hence higher incidence of corneal blood staining. The use of topical steroid does not increase corneal blood staining.","quick_fix_ids":[],"source":{"question_pdf_page":34,"question_book_page":23,"answer_pdf_page":35,"answer_book_page":24},"primary_topic":"Cornea & External Eye","tags":["Glaucoma","Cornea","Systemic Disease & Ocular Associations"]},{"id":"FF047","question_number":47,"stem":"Presence of the following condition decreases the risk of proliferative diabetic retinopathy:","options":["True","False"],"statements":[{"label":"a","text":"advanced glaucoma","answer":"True","answer_bool":true},{"label":"b","text":"pseudoxanthoma elasticum","answer":"True","answer_bool":true},{"label":"c","text":"high myopia","answer":"True","answer_bool":true},{"label":"d","text":"posterior vitreous detachment","answer":"True","answer_bool":true},{"label":"e","text":"renal failure.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c","d"],"explanation":"Proliferative diabetic retinopathy is the result of severe retinal ischaemia. Any condition that either reduces the number of nerve fibre layers or increases oxygen transmission between the choroidal and retinal circulation will reduce the proliferation. Renal failure is associated with hypertension and tends to exacerbate the retinal ischaemia.","quick_fix_ids":[],"source":{"question_pdf_page":34,"question_book_page":23,"answer_pdf_page":35,"answer_book_page":24},"primary_topic":"Retina & Vitreous","tags":["Diabetes","Glaucoma","Systemic Disease & Ocular Associations"]},{"id":"FF048","question_number":48,"stem":"The following are true about corticosteroid-induced ocular hypertension:","options":["True","False"],"statements":[{"label":"a","text":"diabetes is a risk factor","answer":"True","answer_bool":true},{"label":"b","text":"the ocular hypertension is caused by outflow obstruction","answer":"True","answer_bool":true},{"label":"c","text":"it is related to the strength of the topical steroid used","answer":"True","answer_bool":true},{"label":"d","text":"the time from taking the steroid to development of ocular hypertension is longer for systemic than for topical steroid","answer":"True","answer_bool":true},{"label":"e","text":"ocular hypertension which fails to reverse after stopping corticosteroid is more common in myopia.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","d","e"],"explanation":"Risk factors for corticosteroid-induced ocular hypertension include glaucoma, relatives of glaucoma patients, diabetes and myopia. The mechanism is outflow obstruction and may be caused by deposition of mucopolysaccharide in the trabecular meshwork. It is related to the potency of the steroid. Topical steroid causes ocular hypertension earlier than systemic steroids. This is due to an increased ocular concentration after topical administration compared with systemic administration. Stopping the steroid early in the course of the disease will reverse the ocular hypertension - however, irreversible ocular hypertension has been documented, especially in myopic patients.","quick_fix_ids":[],"source":{"question_pdf_page":34,"question_book_page":23,"answer_pdf_page":35,"answer_book_page":24},"primary_topic":"Glaucoma","tags":["Pharmacology","Diabetes","Glaucoma","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF049","question_number":49,"stem":"The following are true about thyroid eye disease:","options":["True","False"],"statements":[{"label":"a","text":"it is the commonest cause of eyelid retraction","answer":"True","answer_bool":true},{"label":"b","text":"it is more severe in older patients","answer":"False","answer_bool":false},{"label":"c","text":"it is more severe in smokers","answer":"True","answer_bool":true},{"label":"d","text":"its severity is related to the degree of thyrotoxicosis","answer":"False","answer_bool":false},{"label":"e","text":"the activity is best elucidated with STER MRI sequence.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"Thyroid eye disease is more common in females than males and tends to be more severe in the elderly than the young. Although hyperthyroidism occurs in about 80% of these patients, its severity does not correlate with the severity of the eye disease. STER MRI sequence is useful in detecting the activity of the disease. The presence of 'wet' sequence suggests active disease.","quick_fix_ids":[],"source":{"question_pdf_page":36,"question_book_page":25,"answer_pdf_page":37,"answer_book_page":26},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Imaging","Systemic Disease & Ocular Associations"]},{"id":"FF050","question_number":50,"stem":"The following are true about botulinum toxin:","options":["True","False"],"statements":[{"label":"a","text":"the most commonly used botulinum toxin in clinical practice is type A","answer":"True","answer_bool":true},{"label":"b","text":"it causes irreversible post-synaptic blockage at the neuromuscular junction","answer":"False","answer_bool":false},{"label":"c","text":"the onset of action is about 72 hours","answer":"True","answer_bool":true},{"label":"d","text":"prolonged use is associated with muscle atrophy","answer":"True","answer_bool":true},{"label":"e","text":"in a right abducence nerve palsy, injection of botulinum into the right lateral rectus may reduce the esotropia.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"Botulinum toxin causes irreversible blockage of the pre-synaptic neurone and thus inhibits the release of acetylcholine. The onset of action is 72 hours, with a mean duration of action of 4 months. Termination of action is the result of regeneration of new dendrites. Muscle atrophy occurs in prolonged use of botulinum toxin. In right abducence nerve palsy, it can be injected into the non-paralysed muscle, i.e. the right medial rectus, to reduce contracture of the muscle and the esotropia. (!&.•......•.•.•.•.•....","quick_fix_ids":[],"source":{"question_pdf_page":36,"question_book_page":25,"answer_pdf_page":37,"answer_book_page":26},"primary_topic":"Ocular Motility & Strabismus","tags":["Pharmacology","Genetics","Strabismus","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF051","question_number":51,"stem":"With regard to congenital nasolacrimal duct obstruction:","options":["True","False"],"statements":[{"label":"a","text":"about 6% of newborns have symptoms referrable to dacryostenosis","answer":"True","answer_bool":true},{"label":"b","text":"the most common site of obstruction is at the valve of Hasner","answer":"True","answer_bool":true},{"label":"c","text":"compression of a dacryocystocele often produces a sticky discharge through the puncta","answer":"False","answer_bool":false},{"label":"d","text":"early probing is recommended in patients with mucocele","answer":"True","answer_bool":true},{"label":"e","text":"the success rate of the initial probing is about 60%.","answer":"False","answer_bool":false}],"correct_labels":["a","b","d"],"explanation":"It is estimated that congenital nasolacrimal duct obstruction occurs in 73% of newborns but only 6% are symptomatic. The most common site of obstruction is at the valve of Hasner. In a dacryocystocele, there is concurrent obstruction in the common canaliculus - therefore, compression of the sac does not show reflux. A mucocele increases the risk of orbital cellulitis and early probing is recommended. The success of first probing in congenital nasolacrimal duct obstruction approaches 90%.","quick_fix_ids":[],"source":{"question_pdf_page":36,"question_book_page":25,"answer_pdf_page":37,"answer_book_page":26},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Paediatrics","Orbit","Paediatric Ophthalmology & Genetics"]},{"id":"FF052","question_number":52,"stem":"The following are true about giant cell arteritis:","options":["True","False"],"statements":[{"label":"a","text":"visual loss is usually caused by ischaemia of the posterior ciliary artery","answer":"True","answer_bool":true},{"label":"b","text":"visual loss is usually more severe than non-arteritic optic neuropathy","answer":"True","answer_bool":true},{"label":"c","text":"C-reactive protein is better than ESR in monitoring the response to treatment","answer":"True","answer_bool":true},{"label":"d","text":"during temporal artery biopsy, the artery can be found beneath the temporalis fascia","answer":"False","answer_bool":false},{"label":"e","text":"the presence of skip lesion in the temporal artery is associated with a less severe form of the disease.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Branches of posterior ciliary artery supply the optic nerve head. Ischaemia causes optic nerve head swelling. Compared with the non-arteritic form, the visual loss in giant cell arteritis is usually profound and more often bilateral, unless steroid treatment is carried out early. C-reactive protein is a better indicator of response to treatment because its concentration changes more quickly with the amount of inflammation. The temporal artery lies on the temporalis fascia. Skip lesion may give a negative temporal artery biopsy but does not correlate with the severity of the disease.","quick_fix_ids":[],"source":{"question_pdf_page":36,"question_book_page":25,"answer_pdf_page":37,"answer_book_page":26},"primary_topic":"Neuro-ophthalmology","tags":["Inflammation","Optic nerve"]},{"id":"FF053","question_number":53,"stem":"In argon laser trabeculoplasty:","options":["True","False"],"statements":[{"label":"a","text":"laser is applied to the anterior half of the trabecular meshwork","answer":"True","answer_bool":true},{"label":"b","text":"the amount of energy used per unit area of burn is larger than in retinal photocoagulation","answer":"True","answer_bool":true},{"label":"c","text":"the amount of intraocular pressure reduction is related to the pre-treatment intraocular pressure","answer":"True","answer_bool":true},{"label":"d","text":"reduction of pressure is more marked in phakic than pseudophakic patients","answer":"True","answer_bool":true},{"label":"e","text":"the effect on intraocular pressure reduction becomes less with retreatment.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","d","e"],"explanation":"Argon laser trabeculoplasty increases the outflow facility of aqueous. It is applied to the anterior half of the trabecular meshwork. Application of laser to the posterior half risks the development of anterior synechiae. The effect on pressure reduction depends on the pre-treatment pressure, age of the patient and type of glaucoma. It is less effective in pseudophakic and aphakic patients. The effect of pressure reduction tends to decrease with time and retreatment tends to be less effective.","quick_fix_ids":[],"source":{"question_pdf_page":38,"question_book_page":27,"answer_pdf_page":39,"answer_book_page":28},"primary_topic":"Glaucoma","tags":["Laser","Electrophysiology","Glaucoma","Lens, Cataract & Refractive Surgery","Retina & Vitreous"]},{"id":"FF054","question_number":54,"stem":"The following are true about nasolacrimal duct obstruction in the adult:","options":["True","False"],"statements":[{"label":"a","text":"it is more common in females than in males","answer":"True","answer_bool":true},{"label":"b","text":"presence of dacryoliths occurs in 25% of patients","answer":"False","answer_bool":false},{"label":"c","text":"probing and syringing has a success rate of 70%","answer":"False","answer_bool":false},{"label":"d","text":"external OCR has a higher success rate than endonasal OCR in relieving epiphora","answer":"True","answer_bool":true},{"label":"e","text":"OCR involves removing most of the ethmoid bone.","answer":"False","answer_bool":false}],"correct_labels":["a","d"],"explanation":"Adult epiphora caused by nasolacrimal duct obstruction is more common in females than males. It usually occurs in post-menopausal women and there is stenosis of the nasolacrimal duct. Dacryoliths are uncommon. Unlike congenital nasolacrimal duct obstruction, syringing and probing has a low success rate. External DCR gives a higher success rate than endonasal DCR. During the operation, most of the bone removed to create a rhinostomy is from the lacrimal bone.","quick_fix_ids":[],"source":{"question_pdf_page":38,"question_book_page":27,"answer_pdf_page":39,"answer_book_page":28},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Paediatrics"]},{"id":"FF055","question_number":55,"stem":"In an eye with raised intraocular pressure caused by Sturge-Weber's syndrome, the pressure can be effectively lowered with:","options":["True","False"],"statements":[{"label":"a","text":"an a blocker such as brimonidine","answer":"True","answer_bool":true},{"label":"b","text":"a f3 blocker such as timolol","answer":"True","answer_bool":true},{"label":"c","text":"latanoprost","answer":"True","answer_bool":true},{"label":"d","text":"pilocarpine","answer":"False","answer_bool":false},{"label":"e","text":"topical acetazolamide.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"Raised intraocular pressure in Sturge-Weber's syndrome is caused by an increase in episcleral pressure that impairs aqueous outflow. a and (3 blockers, as well as acetazolamide, suppress aqueous production and are therefore effective. Latanoprost is also effective as it increases the uveoscleral outflow. Pilocarpine increases the aqueous outflow through the trabecular meshwork and therefore is ineffective in the presence of raised episcleral pressure.","quick_fix_ids":[],"source":{"question_pdf_page":38,"question_book_page":27,"answer_pdf_page":39,"answer_book_page":28},"primary_topic":"Glaucoma","tags":["Pharmacology","Genetics","Glaucoma","Paediatric Ophthalmology & Genetics","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF056","question_number":56,"stem":"Laser iridotomy may be expected to reduce the intraocular pressure in:","options":["True","False"],"statements":[{"label":"a","text":"phacomorphic glaucoma","answer":"True","answer_bool":true},{"label":"b","text":"phacolytic glaucoma","answer":"False","answer_bool":false},{"label":"c","text":"microspherophakia with glaucoma","answer":"True","answer_bool":true},{"label":"d","text":"iris bombe in severe iritis","answer":"True","answer_bool":true},{"label":"e","text":"malignant glaucoma following cataract surgery.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"Laser iridotomy is used in angle-closure glaucoma caused by pupillary block by providing an alternative pathway for the aqueous. Phacomorphic glaucoma is a common contributing factor in primary angle closure. Pupillary block can be caused by the abnormal spherical lens in microspherophakia. Iris bombe impair the flow of aqueous through the pupil and hence pupillary block. Phacolytic glaucoma is caused by the release of lens proteins into the drainage angle where they are engulfed by macrophages, leading to blockage of the trabecular meshwork. Malignant glaucoma is caused by aqueous misdirection into the vitreous cavity.","quick_fix_ids":[],"source":{"question_pdf_page":38,"question_book_page":27,"answer_pdf_page":39,"answer_book_page":28},"primary_topic":"Glaucoma","tags":["Surgery","Laser","Pupil","Glaucoma","Cataract","Lens, Cataract & Refractive Surgery"]},{"id":"FF057","question_number":57,"stem":"The following are true about Tenon's cyst:","options":["True","False"],"statements":[{"label":"a","text":"it is caused by adhesion between the episclera and the Tenon's capsule","answer":"True","answer_bool":true},{"label":"b","text":"it usually appears as a thick-walled lobulated mass over the trabeculectomy site","answer":"False","answer_bool":false},{"label":"c","text":"digital pressure on the lower globe i
