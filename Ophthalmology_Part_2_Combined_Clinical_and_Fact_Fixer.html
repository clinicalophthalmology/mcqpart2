ue","answer_bool":true}],"correct_labels":["b","d","e"],"explanation":"Serum ACE is useful for sarcoidosis but bone-spicule pigmentation is not seen in sarcoidosis. Serum phytanic acid is raised in Refsum's disease. Elevated ornithine level occurs in gyrate atrophy which is choroidoretinal atrophy. Plasma lipoprotein B is absent in abetalipoproteinaemia, a cause of bone-spicule pigmentation. Urine glycosaminoglycans are elevated in mucopolysaccharidoses such as Hunter's or Hurler's syndrome, in which bone-spicule pigmentation is a feature.","quick_fix_ids":[],"source":{"question_pdf_page":68,"question_book_page":57,"answer_pdf_page":69,"answer_book_page":58},"primary_topic":"Retina & Vitreous","tags":["Genetics","Inflammation","Uveitis & Ocular Inflammation","Systemic Disease & Ocular Associations"]},{"id":"FF110","question_number":110,"stem":"The following are true about the findings of the Diabetes Control and Complications Trial (DCCT):","options":["True","False"],"statements":[{"label":"a","text":"good diabetic control in type II diabetes reduces the risk of diabetic retinopathy","answer":"False","answer_bool":false},{"label":"b","text":"hypoglycaemia is common in patients on intensive diabetic treatment","answer":"True","answer_bool":true},{"label":"c","text":"good diabetic control reduces diabetic nephropathy by 50%","answer":"True","answer_bool":true},{"label":"d","text":"there is no significant difference in the incidence of diabetic neuropathy between patients on standard and intensive diabetic treatment","answer":"False","answer_bool":false},{"label":"e","text":"the risk of cardiovascular diseases is reduced in patients on intensive diabetic treatment.","answer":"False","answer_bool":false}],"correct_labels":["b","c"],"explanation":"The DCCT is a clinical study conducted from 1983 to 1993 by the National Institute of Diabetes and Digestive and Kidney Diseases. The study showed that keeping blood glucose levels as close to normal as possible delays the onset and progression of eye, kidney and nerve disease caused by diabetes. In fact, it demonstrated that any sustained lowering of blood glucose helps, even if the person has a history of poor control. The study involved only type I diabetics and did not look at cardiovascular risks.","quick_fix_ids":[],"source":{"question_pdf_page":68,"question_book_page":57,"answer_pdf_page":69,"answer_book_page":58},"primary_topic":"Retina & Vitreous","tags":["Diabetes","Systemic Disease & Ocular Associations"]},{"id":"FF111","question_number":111,"stem":"In an infant with poor vision, initial constriction of pupils to darkness occurs in:","options":["True","False"],"statements":[{"label":"a","text":"Tay-Sachs' disease","answer":"False","answer_bool":false},{"label":"b","text":"achromatopsia","answer":"True","answer_bool":true},{"label":"c","text":"Leber's congenital amaurosis","answer":"False","answer_bool":false},{"label":"d","text":"X-linked congenital stationary night blindness","answer":"True","answer_bool":true},{"label":"e","text":"optic atrophy.","answer":"False","answer_bool":false}],"correct_labels":["b","d"],"explanation":"In Tay-Sachs' disease and optic atrophy, the pupils dilate in response to darkness. In Leber's congenital amaurosis, pupillary response is sluggish but the pupil still dilates in response to darkness. In achromatopsia and X-linked congenital stationary night blindness, there is an initial constriction of pupils to darkness.","quick_fix_ids":[],"source":{"question_pdf_page":68,"question_book_page":57,"answer_pdf_page":69,"answer_book_page":58},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Paediatrics","Pupil","Neuro-ophthalmology"]},{"id":"FF112","question_number":112,"stem":"In juvenile chronic arthritis, the risk of developing uveitis is highest if:","options":["True","False"],"statements":[{"label":"a","text":"the age of onset is less than 6 years of age","answer":"True","answer_bool":true},{"label":"b","text":"the gender is female","answer":"True","answer_bool":true},{"label":"c","text":"serum anti-nuclear antibodies are positive","answer":"True","answer_bool":true},{"label":"d","text":"more than four joints are affected","answer":"False","answer_bool":false},{"label":"e","text":"HLA-B27 is positive.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Uveitis develops in about 20% of patients with juvenile chronic arthritis. The risk is highest in the female gender, patients less than 6 years of age, pauci-ariticular joint involvement (fewer than four joints affected) and the presence of positive anti-nuclear antibodies.","quick_fix_ids":[],"source":{"question_pdf_page":70,"question_book_page":59,"answer_pdf_page":71,"answer_book_page":60},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Inflammation"]},{"id":"FF113","question_number":113,"stem":"In congenital nystagmus:","options":["True","False"],"statements":[{"label":"a","text":"vision decreases on convergence","answer":"False","answer_bool":false},{"label":"b","text":"the intensity of nystagmus increases with fixation","answer":"True","answer_bool":true},{"label":"c","text":"nystagmus is enhanced when one eye is covered","answer":"True","answer_bool":true},{"label":"d","text":"absence of nystagmus in the dark is a feature","answer":"False","answer_bool":false},{"label":"e","text":"the vertical optokinetic response is normal.","answer":"True","answer_bool":true}],"correct_labels":["b","c","e"],"explanation":"In congenital nystagmus, vision improves on convergence and therefore vision is always better for near than distance. The intensity of the nystagmus increases with fixation. Latent nystagmus is common and closing one eye may enhance the nystagmus. Congenital nystagmus is absent in sleep but present in the dark when both eyes are open. There is an inverse horizontal optokinetic response but the vertical optokinetic response is normal.","quick_fix_ids":[],"source":{"question_pdf_page":70,"question_book_page":59,"answer_pdf_page":71,"answer_book_page":60},"primary_topic":"Ocular Motility & Strabismus","tags":["Electrophysiology","Paediatrics","Strabismus","Paediatric Ophthalmology & Genetics","Retina & Vitreous"]},{"id":"FF114","question_number":114,"stem":"The following are true about neurofibromatosis:","options":["True","False"],"statements":[{"label":"a","text":"Lisch's nodules are composed of melanocytic hamartoma","answer":"True","answer_bool":true},{"label":"b","text":"Lisch's nodules are diagnostic of type I neurofibromatosis","answer":"True","answer_bool":true},{"label":"c","text":"bilateral acoustic neurofibromas are more common in type I than type II neurofibromatosis","answer":"False","answer_bool":false},{"label":"d","text":"pulsatile exophthalmos is a feature of type I neurofibromatosis","answer":"True","answer_bool":true},{"label":"e","text":"posterior subcapsular cataract is a feature of type II neurofibromatosis.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"Both type I and type \\I neurofibromatosis are autosomal dominant in inheritance. Lisch's nodules occur in type I neurofibromatosis and are composed of melanocytic hamartoma. Pulsatile exophthalmos is seen in type I neurofibromatosis caused by the absence of the lesser wing of the sphenoid bone. Type \\I neurofibromatosis is characterised by acoustic neuroma which may be bilateral. Posterior subcapsular cataract is also a feature.","quick_fix_ids":[],"source":{"question_pdf_page":70,"question_book_page":59,"answer_pdf_page":71,"answer_book_page":60},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Cataract","Systemic Disease & Ocular Associations","Lens, Cataract & Refractive Surgery"]},{"id":"FF115","question_number":115,"stem":"In sarcoidosis:","options":["True","False"],"statements":[{"label":"a","text":"serum ACE concentration is a good reflection of the activity of the disease","answer":"True","answer_bool":true},{"label":"b","text":"pulmonary function test shows an obstructive pattern","answer":"False","answer_bool":false},{"label":"c","text":"Mantoux test is typically positive in those with previous BCG vaccination","answer":"False","answer_bool":false},{"label":"d","text":"band keratopathy usually results from recurrent anterior uveitis","answer":"False","answer_bool":false},{"label":"e","text":"neurosarcoidosis is more common in the presence of retinal periphlebitis.","answer":"True","answer_bool":true}],"correct_labels":["a","e"],"explanation":"Serum ACE concentration is often elevated in active sarcoidosis and its concentration reflects the activity of the disease. Pulmonary fibrosis is a complication giving a restrictive pattern on pulmonary function test. Skin anergy is common and the Mantoux test may be negative in those with previous BCG vaccination. Band keratopathy usually results from hypercalcaemia. The presence of retinal periphlebitis increases the risk of neurosarcoidosis.","quick_fix_ids":[],"source":{"question_pdf_page":70,"question_book_page":59,"answer_pdf_page":71,"answer_book_page":60},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Electrophysiology","Inflammation","Retina & Vitreous","Systemic Disease & Ocular Associations"]},{"id":"FF116","question_number":116,"stem":"In myasthenia gravis:","options":["True","False"],"statements":[{"label":"a","text":"the Tensilon test causes ventricular tachycardia","answer":"False","answer_bool":false},{"label":"b","text":"tendon reflexes are reduced","answer":"False","answer_bool":false},{"label":"c","text":"anti-acetylcholine receptor antibodies are more commonly detected in generalised disease than ocular myasthenia","answer":"True","answer_bool":true},{"label":"d","text":"application of ice to a ptotic lid will reduce the ptosis","answer":"True","answer_bool":true},{"label":"e","text":"excision of the thymus should be carried out in patients with ptosis not responding to anticholinesterase or steroid.","answer":"False","answer_bool":false}],"correct_labels":["c","d"],"explanation":"The T ensilon test can give rise to bradycardia, thus intravenous atropine should be readily available during the test. Tendon reflexes are normal in myasthenia gravis. Although antibody to acetylcholine receptors may be detected in about 80 to 90% of generalised myasthenia gravis, only 50% of pure ocular myasthenia is positive for this antibody. Ice packs can transiently improve muscle activity and therefore alleviate ptosis. Excision of the thymus is not recommended in pure ocular myasthenia gravis unless a thymoma is present.","quick_fix_ids":[],"source":{"question_pdf_page":72,"question_book_page":61,"answer_pdf_page":73,"answer_book_page":62},"primary_topic":"Ocular Motility & Strabismus","tags":["Genetics","Oculoplastics, Lacrimal & Orbit"]},{"id":"FF117","question_number":117,"stem":"In unilateral facial nerve palsy:","options":["True","False"],"statements":[{"label":"a","text":"corneal sensation is reduced","answer":"False","answer_bool":false},{"label":"b","text":"ipsilateral absence of taste in the anterior two-thirds of the tongue suggests a lesion in the facial canal","answer":"False","answer_bool":false},{"label":"c","text":"the eye is not involved if the lesion involves the upper motor neurone","answer":"True","answer_bool":true},{"label":"d","text":"there is retraction of the ipsilateral upper eyelid","answer":"True","answer_bool":true},{"label":"e","text":"there is a higher chance of recovery for Ramsay Hunt's syndrome compared with Bell's palsy.","answer":"False","answer_bool":false}],"correct_labels":["c","d"],"explanation":"The trigeminal nerve is responsible for corneal sensation. Absence of taste suggests that the lesion is in the geniculate body which is located in the middle ear. In upper motor neurone lesion of the facial nerve, the upper face including the eye is not affected, due to bilateral innervation of the upper face. Retraction of the levator results from the unopposed action of the paralysed orbicularis oculi. Facial nerve recovery is poor for Ramsay Hunt's syndrome but excellent in Bell's palsy.","quick_fix_ids":[],"source":{"question_pdf_page":72,"question_book_page":61,"answer_pdf_page":73,"answer_book_page":62},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Genetics","Cornea","Cornea & External Eye"]},{"id":"FF118","question_number":118,"stem":"Intraocular foreign bodies made up of the following are relatively inert:","options":["True","False"],"statements":[{"label":"a","text":"aluminium","answer":"False","answer_bool":false},{"label":"b","text":"gold","answer":"True","answer_bool":true},{"label":"c","text":"copper","answer":"False","answer_bool":false},{"label":"d","text":"silver","answer":"True","answer_bool":true},{"label":"e","text":"platinum.","answer":"True","answer_bool":true}],"correct_labels":["b","d","e"],"explanation":"Gold, silver and platinum are relatively inert and cause little reaction. Aluminium causes a variable amount of reaction. Copper is toxic and in high concentration (85% or above) may cause a sterile suppurative endophthalmitis.","quick_fix_ids":[],"source":{"question_pdf_page":72,"question_book_page":61,"answer_pdf_page":73,"answer_book_page":62},"primary_topic":"Diagnostics, Pharmacology & Perioperative","tags":[]},{"id":"FF119","question_number":119,"stem":"The types of giant cells seen in the following conditions are correct:","options":["True","False"],"statements":[{"label":"a","text":"chalazion - foreign body giant cells","answer":"True","answer_bool":true},{"label":"b","text":"sarcoidosis - Langhans' giant cells","answer":"True","answer_bool":true},{"label":"c","text":"juvenile xanthogranuloma - Touton giant cells","answer":"True","answer_bool":true},{"label":"d","text":"tuberculosis - foreign body giant cells","answer":"False","answer_bool":false},{"label":"e","text":"xanthoma disseminatum - Touton giant cells.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"There are three types of giant cells:\n\n• Langhans' giant cells are seen in tuberculosis and sarcoidosis • foreign body giant cells are seen in chalazion • Touton giant cells are seen in juvenile xanthogranuloma, xanthoma disseminatum and Erdheim-Chester's disease.","quick_fix_ids":[],"source":{"question_pdf_page":72,"question_book_page":61,"answer_pdf_page":73,"answer_book_page":62},"primary_topic":"Ocular Oncology & Pathology","tags":["Inflammation","Trauma","Uveitis & Ocular Inflammation","Systemic Disease & Ocular Associations"]},{"id":"FF120","question_number":120,"stem":"Orbital rhabdomyosarcoma:","options":["True","False"],"statements":[{"label":"a","text":"has a peak incidence at 10 years of age","answer":"False","answer_bool":false},{"label":"b","text":"commonly arises from the medial rectus","answer":"False","answer_bool":false},{"label":"c","text":"is most commonly of the alveolar type","answer":"False","answer_bool":false},{"label":"d","text":"contains cells with a high nuclear-cytoplasmic ratio","answer":"True","answer_bool":true},{"label":"e","text":"usually presents with fever, making it indistinguishable from orbital cellulitis.","answer":"False","answer_bool":false}],"correct_labels":["d"],"explanation":"The most common age of presentation for orbital rhabdomyosarcoma is 7-8 years of age. It commonly arises from mesenchymal tissue external to the extraocular muscles. Occasionally the tumour may arise from the conjunctiva. There are three types of orbital rhabdomyosarcoma: embryonal, alveolar and differentiated. Histologically, the tumour cells have a high nuclear-cytoplasmic ratio with little cytoplasm. As a result, special tests such as immunostaining or electron-microscopy are needed for diagnosis. The tumour may be misdiagnosed as orbital cellulitis, but unlike cellulitis, fever is absent.","quick_fix_ids":[],"source":{"question_pdf_page":74,"question_book_page":63,"answer_pdf_page":75,"answer_book_page":64},"primary_topic":"Ocular Oncology & Pathology","tags":["Orbit","Oncology","Oculoplastics, Lacrimal & Orbit"]},{"id":"FF121","question_number":121,"stem":"Cyclosporin:","options":["True","False"],"statements":[{"label":"a","text":"is insoluble in water","answer":"True","answer_bool":true},{"label":"b","text":"is excreted unchanged by the kidneys","answer":"False","answer_bool":false},{"label":"c","text":"depresses CD4+ but not CD8+ lymphocyte function","answer":"True","answer_bool":true},{"label":"d","text":"should be avoided in patients with anaemia as it can affect haematopoiesis","answer":"False","answer_bool":false},{"label":"e","text":"effect can be increased with the concurrent use of ketoconazole.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"Cyclosporin is now commonly used as second-line treatment in patients with severe uveitis. It is also used in patients with high-risk corneal graft. It is lipophilic and insoluble in water. It depresses the function of CD4+ lymphocytes but has no effect on CD8+ lymphocytes. Compared with other immunosuppressants, it does not affect bone marrow function. It is metabolised by the liver and its effect is enhanced in the presence of P450 inhibitors such as ketoconazole.","quick_fix_ids":[],"source":{"question_pdf_page":74,"question_book_page":63,"answer_pdf_page":75,"answer_book_page":64},"primary_topic":"Diagnostics, Pharmacology & Perioperative","tags":["Pharmacology","Inflammation","Cornea","Cornea & External Eye"]},{"id":"FF122","question_number":122,"stem":"In internuclear ophthalmoplegia:","options":["True","False"],"statements":[{"label":"a","text":"multiple sclerosis is the most common cause in young people","answer":"True","answer_bool":true},{"label":"b","text":"diplopia is not a problem","answer":"False","answer_bool":false},{"label":"c","text":"patients usually complain of problems with close work","answer":"False","answer_bool":false},{"label":"d","text":"the lesion is ipsilateral to the eye with abducting nystagmus","answer":"False","answer_bool":false},{"label":"e","text":"involvement of the sixth nerve nucleus is common.","answer":"False","answer_bool":false}],"correct_labels":["a"],"explanation":"Internuclear ophthalmoplegia may be unilateral or bilateral. In young patients, the most common cause is multiple sclerosis, whereas in the elderly, cerebrovascular accidents are more common. Rarely, tumour may be the cause. There is failure of adduction in one eye with abducting nystagmus in the fellow eye but convergence is normal. Diplopia occurs when the patient looks sideways due to the adduction deficit. Close work does not usually pose a problem because convergence is normal. The location of the lesion is in the medial longitudinal fasciculus ipSilateral to the eye with the adduction deficit. Involvement of the sixth nerve nucleus constitutes the one-and-a-half syndrome.","quick_fix_ids":[],"source":{"question_pdf_page":74,"question_book_page":63,"answer_pdf_page":75,"answer_book_page":64},"primary_topic":"Ocular Motility & Strabismus","tags":["Electrophysiology","Genetics","Strabismus","Oncology","Retina & Vitreous"]},{"id":"FF123","question_number":123,"stem":"In peribulbar anaesthesia:","options":["True","False"],"statements":[{"label":"a","text":"the patient should be instructed to look up to avoid perforation of the globe","answer":"False","answer_bool":false},{"label":"b","text":"the superonasal quadrant should be avoided because of the risk of retrobulbar haemorrhage","answer":"True","answer_bool":true},{"label":"c","text":"the risk of complications is lower with a longer needle","answer":"False","answer_bool":false},{"label":"d","text":"the risk of complications is lower with a fine needle","answer":"True","answer_bool":true},{"label":"e","text":"globe perforation causes increased vitreous pressure.","answer":"False","answer_bool":false}],"correct_labels":["b","d"],"explanation":"For safe peri bulbar anaesthesia, the patient should keep the eye in the primary position. The superonasal and inferonasal quadrants contain a rich vascular supply and injection into these sites may be associated with an increased risk of retrobulbar haemorrhage. The use of shorter and finer needles helps to minimise complications through injuries of the nerves and vessels. Globe perforation results in hypotony.","quick_fix_ids":[],"source":{"question_pdf_page":74,"question_book_page":63,"answer_pdf_page":75,"answer_book_page":64},"primary_topic":"Diagnostics, Pharmacology & Perioperative","tags":["Trauma"]},{"id":"FF124","question_number":124,"stem":"The following are true about posterior capsular thickening:","options":["True","False"],"statements":[{"label":"a","text":"it occurs in 50% of post-cataract patients over a 5-year period","answer":"True","answer_bool":true},{"label":"b","text":"it is more common in younger patients","answer":"True","answer_bool":true},{"label":"c","text":"it is more common in patients with diabetic retinopathy","answer":"True","answer_bool":true},{"label":"d","text":"it is caused by multiplication of the epithelial cells","answer":"True","answer_bool":true},{"label":"e","text":"it can be prevented by vigorous polishing of the posterior capsule.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c","d"],"explanation":"Posterior capsule thickening can significantly reduce visual acuity. It is usually caused by migration of the epithelial cells to the posterior pole and multiplication of the epithelial cells. It is more common in younger patients, in diabetic retinopathy and uveitis. Polishing of the posterior capsule does not prevent opacity from developing, as epithelial cells can still migrate from the anterior capsule.","quick_fix_ids":[],"source":{"question_pdf_page":76,"question_book_page":65,"answer_pdf_page":77,"answer_book_page":66},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Inflammation","Diabetes","Cataract","Retina & Vitreous","Systemic Disease & Ocular Associations"]},{"id":"FF125","question_number":125,"stem":"The following are recognised features of ophthalmic herpes zoster:","options":["True","False"],"statements":[{"label":"a","text":"haemorrhagic glaucoma","answer":"True","answer_bool":true},{"label":"b","text":"myositis","answer":"True","answer_bool":true},{"label":"c","text":"par planitis","answer":"False","answer_bool":false},{"label":"d","text":"ocular hypertension in the presence of anterior uveitis","answer":"True","answer_bool":true},{"label":"e","text":"diffuse iris atrophy.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"Follicular conjunctivitis and episcleritis are common in patients with ophthalmic herpes zoster. Intraocular complications are most common in those with nasociliary involvement. These can include keratitis, uveitis, vasculitis and myositis. Uveitis may be associated with hypopyon and haemorrhage; trabeculitis is common and may give rise to troublesome glaucoma. Iris atrophy can occur as a result of vasculitis and this is typically sectorial rather than diffuse.","quick_fix_ids":[],"source":{"question_pdf_page":76,"question_book_page":65,"answer_pdf_page":77,"answer_book_page":66},"primary_topic":"Cornea & External Eye","tags":["Infection","Inflammation","Trauma","Glaucoma","Cornea","Uveitis & Ocular Inflammation"]},{"id":"FF126","question_number":126,"stem":"In a patient presenting with dendritic ulcers, the following suggest that the lesion may not be caused by herpes simplex:","options":["True","False"],"statements":[{"label":"a","text":"presence of uveitis","answer":"False","answer_bool":false},{"label":"b","text":"absence of sensation","answer":"False","answer_bool":false},{"label":"c","text":"absence of terminal bulbs","answer":"True","answer_bool":true},{"label":"d","text":"presence of ring infiltrates","answer":"True","answer_bool":true},{"label":"e","text":"staining with rose bengal.","answer":"False","answer_bool":false}],"correct_labels":["c","d"],"explanation":"Most dendritic ulcers are caused by herpes simplex. Two conditions that can mimic herpetic dendrites are herpes zoster keratitis and early stages of acanthoamoeba. In both cases the characteristic terminal bulbs of herpetic dendrites are absent. In acanthoamoeba, the pain is usually disproportionate to the clinical appearance of the lesion. Other features of acanthoamoeba keratitis include ring infiltrates and perineural infiltrates. Decreased corneal sensation, variable amount of uveitis and staining of the lesion with rose bengal are common features of herpetic dendritis.","quick_fix_ids":[],"source":{"question_pdf_page":76,"question_book_page":65,"answer_pdf_page":77,"answer_book_page":66},"primary_topic":"Cornea & External Eye","tags":["Infection","Inflammation","Cornea","Uveitis & Ocular Inflammation"]},{"id":"FF127","question_number":127,"stem":"The pairings of the following head posture and the respective ocular motility disorders are correct:","options":["True","False"],"statements":[{"label":"a","text":"right sixth nerve palsy - face turn to the right","answer":"True","answer_bool":true},{"label":"b","text":"right fourth nerve palsy - head tilt to the right","answer":"False","answer_bool":false},{"label":"c","text":"bilateral fourth nerve palsy - chin depression","answer":"True","answer_bool":true},{"label":"d","text":"bilateral superior rectus palsy - chin elevation","answer":"True","answer_bool":true},{"label":"e","text":"chronic progressive external ophthalmoplegia - chin elevation.","answer":"True","answer_bool":true}],"correct_labels":["a","c","d","e"],"explanation":"Abnormal head posture is adopted by patients to maintain binocular single vision. In a sixth nerve palsy, the face is turned in the direction of the affected eye. In a fourth nerve palsy, the head tilt is opposite to the side of the lesion. Chin depression is seen in bilateral fourth nerve palsy and less commonly in bilateral inferior rectus palsy. Chin elevation occurs with ptosis as in chronic progressive external ophthalmoplegia and superior rectus palsy.","quick_fix_ids":[],"source":{"question_pdf_page":76,"question_book_page":65,"answer_pdf_page":77,"answer_book_page":66},"primary_topic":"Ocular Motility & Strabismus","tags":["Strabismus"]},{"id":"FF128","question_number":128,"stem":"The following are true about ptosis surgery:","options":["True","False"],"statements":[{"label":"a","text":"in involutional ptosis, levator resection is seldom required","answer":"True","answer_bool":true},{"label":"b","text":"in a patient with right amblyopia and an ipsilateral congenital ptosis covering the pupil, unilateral brow suspension is the treatment of choice","answer":"False","answer_bool":false},{"label":"c","text":"in ptosis due to chronic progressive external ophthalmoplegia, levator resection is the treatment of choice","answer":"False","answer_bool":false},{"label":"d","text":"ptosis surgery should never be performed on patients with myasthenia gravis","answer":"False","answer_bool":false},{"label":"e","text":"in Marcus-Gunn jaw-winking ptosis, unilateral lid surgery is usually unsatisfactory.","answer":"True","answer_bool":true}],"correct_labels":["a","e"],"explanation":"The choice of ptosis surgery depends on the function of the levator. In involutional ptosis, the levator function is good and therefore only advancement is required. In the presence of amblyopia and severe ptosis, unilateral brow suspension is usually not satisfactory because the patient may not use the frontalis muscle to lift the eye due to amblyopia. The choice of surgery is disinsertion of the contralateral eye followed by bilateral brow suspension. In chronic progressive external ophthalmoplegia, levator resection may lead to corneal exposure when the function of the orbicularis oculi weakens with time. Brow suspension is the recommended technique. Although myasthenia gravis can cause ptosis, persistent ptosis may develop which is unresponsive to systemic cholinesterase treatment. Surgery may be performed provided the ptosis has been recorded as being stable for about 1 year. In Marcus-Gunn jaw-winking syndrome, unilateral ptosis surgery does not abolish the winking. Bilateral levator disinsertions followed by brow suspension is recommended.","quick_fix_ids":[],"source":{"question_pdf_page":78,"question_book_page":67,"answer_pdf_page":79,"answer_book_page":68},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Surgery","Genetics","Paediatrics","Pupil","Cornea","Cornea & External Eye"]},{"id":"FF129","question_number":129,"stem":"In sickle cell disease:","options":["True","False"],"statements":[{"label":"a","text":"HbSC and HbSThal are more likely to cause proliferative retinopathy than HbSS","answer":"True","answer_bool":true},{"label":"b","text":"degenerative retinoschisis is commonly seen in the superotemporal quadrant","answer":"False","answer_bool":false},{"label":"c","text":"an increased foveal avascular zone with microaneurysms is a cause of poor vision","answer":"True","answer_bool":true},{"label":"d","text":"proliferative vitreoretinopathy most commonly affects the peripheral retina","answer":"True","answer_bool":true},{"label":"e","text":"blood transfusion reduces the severity of the retinopathy.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"In sickle cell disease, HbSC and HbSThal are most commonly associated with severe proliferative retinopathy despite a benign systemic course. Retinoschisis occurs as a result of resorption of intraretinal haemorrhage. Occlusion of capillaries causes an increased foveal avascular zone and microaneurysms may be seen, especially with fluorescein angiography. Proliferative retinopathy is an important cause of visual loss through vitreous haemorrhage and retinal detachment. The new vessels usually occur in the peripheral retina. Blood transfusion does not affect the retinopathy.","quick_fix_ids":[],"source":{"question_pdf_page":78,"question_book_page":67,"answer_pdf_page":79,"answer_book_page":68},"primary_topic":"Retina & Vitreous","tags":["Imaging","Genetics","Trauma","Retinal detachment","Systemic Disease & Ocular Associations"]},{"id":"FF130","question_number":130,"stem":"Benign intracranial hypertension:","options":["True","False"],"statements":[{"label":"a","text":"is a complication of treatment for acne","answer":"True","answer_bool":true},{"label":"b","text":"does not give rise to focal neurological deficits","answer":"True","answer_bool":true},{"label":"c","text":"typically shows dilated ventricles on the CT scan","answer":"False","answer_bool":false},{"label":"d","text":"requires optic nerve fenestration to be performed prophylactically to prevent optic nerve damage","answer":"False","answer_bool":false},{"label":"e","text":"is unlikely to be the diagnosis if there are hard exudates at the macula.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"Benign intracranial hypertension typically affects females who are obese. Patients on tetracycline or steroid may also develop this condition. The diagnosis is made after excluding other causes of raised intracranial hypertension. There should be no focal neurological deficit, although false localising signs such as sixth nerve palsy may be present. Optic nerve fenestration is indicated in progressive visual field loss despite repeated removal of the cerebrospinal fluid. Macular exudate may develop, causing visual disturbance.","quick_fix_ids":[],"source":{"question_pdf_page":78,"question_book_page":67,"answer_pdf_page":79,"answer_book_page":68},"primary_topic":"Neuro-ophthalmology","tags":["Imaging","Optic nerve","Visual field","Macula","Retina & Vitreous"]},{"id":"FF131","question_number":131,"stem":"The following are true about the management of cytomegaloviral (CMV) retinitis:","options":["True","False"],"statements":[{"label":"a","text":"zidovudine (AZT) is not effective against CMV retinitis","answer":"True","answer_bool":true},{"label":"b","text":"the main complication of gancyclovir is bone marrow toxicity","answer":"True","answer_bool":true},{"label":"c","text":"the main complication of foscarnet is nephrotoxicity","answer":"True","answer_bool":true},{"label":"d","text":"viral resistance to gancyclovir will also prevent the effective use of foscarnet","answer":"False","answer_bool":false},{"label":"e","text":"intravitreal administration of gancyclovir or foscarnet will avoid systemic complications.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"AZT is not effective against CMV retinitis. The three drugs most commonly used are gancyclovir, foscarnet and cidofovir. Gancyclovir causes bone marrow toxicity, whereas foscarnet and cidofovir cause nephrotoxicity. Viral resistance to one drug does not prevent the use of another to be effective. In patients with systemic complications, intravitreal drugs can be given.","quick_fix_ids":[],"source":{"question_pdf_page":80,"question_book_page":69,"answer_pdf_page":81,"answer_book_page":70},"primary_topic":"Retina & Vitreous","tags":["Pharmacology","Infection"]},{"id":"FF132","question_number":132,"stem":"Glycosylated haemoglobin assay:","options":["True","False"],"statements":[{"label":"a","text":"reflects red blood cell exposure to glucose in the last six weeks","answer":"True","answer_bool":true},{"label":"b","text":"is used in the diagnosis of diabetes mellitus","answer":"False","answer_bool":false},{"label":"c","text":"correlates with the risk of development of microvascular disease","answer":"True","answer_bool":true},{"label":"d","text":"is artificially high in a patient with sickle cell anaemia","answer":"False","answer_bool":false},{"label":"e","text":"if low in diabetes mellitus can be associated with hypoglycaemia.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"Glycosylated haemoglobin reflects red blood cell exposure to glucose in the last six weeks. It is used to assess diabetic control. It is not used to diagnose diabetes mellitus. It correlates well with the risk of microvascular disease. In sickle cell anaemia, the concentration may be artificially low. A low level in a diabetic may indicate that the patient is predisposed to recurrent hypoglycaemia.","quick_fix_ids":[],"source":{"question_pdf_page":80,"question_book_page":69,"answer_pdf_page":81,"answer_book_page":70},"primary_topic":"Systemic Disease & Ocular Associations","tags":["Diabetes","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF133","question_number":133,"stem":"In Marfan's syndrome:","options":["True","False"],"statements":[{"label":"a","text":"blood test is useful for diagnosis","answer":"False","answer_bool":false},{"label":"b","text":"there is a point mutation in the long arm of chromosome 15","answer":"True","answer_bool":true},{"label":"c","text":"the majority of cases are the result of a new mutation","answer":"False","answer_bool":false},{"label":"d","text":"lens subluxation is in the superonasal direction","answer":"True","answer_bool":true},{"label":"e","text":"myopia is common.","answer":"True","answer_bool":true}],"correct_labels":["b","d","e"],"explanation":"Marfan's syndrome is a clinical diagnosis. The point mutation is in the fibrillin gene on the long arm of chromosome 15. The majority of cases are inherited and only 15% are caused by new mutations. Ocular manifestations include myopia and ectopia lentis with superonasal subluxation of the lens.","quick_fix_ids":[],"source":{"question_pdf_page":80,"question_book_page":69,"answer_pdf_page":81,"answer_book_page":70},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Lens, Cataract & Refractive Surgery","Systemic Disease & Ocular Associations"]},{"id":"FF134","question_number":134,"stem":"In a patient with sudden onset of visual loss, the following favour the diagnosis of ophthalmic artery over central retinal artery occlusion:","options":["True","False"],"statements":[{"label":"a","text":"absent a- and b-wave on the ERG","answer":"True","answer_bool":true},{"label":"b","text":"absent cherry red spot","answer":"True","answer_bool":true},{"label":"c","text":"relative afferent pupillary defect","answer":"False","answer_bool":false},{"label":"d","text":"visual acuity of light perception","answer":"True","answer_bool":true},{"label":"e","text":"delayed choroidal circulation during fluorescein angiography.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"In ophthalmic artery occlusion, the visual loss is usually profound and vision is typically light perception or worse, as opposed to counting finger vision in central retinal artery occlusion. As the choroidal circulation is affected, cherry red spot is absent. The ERG in central retinal artery occlusion shows a decreased b-wave amplitude and a relatively normal a-wave; in ophthalmic artery occlusion, both a- and b-wave are absent. Relative afferent pupillary defect is present in both conditions but is usually more marked in ophthalmic artery occlusion.","quick_fix_ids":[],"source":{"question_pdf_page":80,"question_book_page":69,"answer_pdf_page":81,"answer_book_page":70},"primary_topic":"Retina & Vitreous","tags":["Imaging","Electrophysiology","Pupil","Neuro-ophthalmology"]},{"id":"FF135","question_number":135,"stem":"In a patient with proptosis, the following features favour a lesion in the orbital apex rather than the cavernous sinus:","options":["True","False"],"statements":[{"label":"a","text":"decreased vision with relative afferent pupillary defect","answer":"True","answer_bool":true},{"label":"b","text":"abduction deficit","answer":"False","answer_bool":false},{"label":"c","text":"dilated pupil","answer":"False","answer_bool":false},{"label":"d","text":"absent forehead sensation","answer":"False","answer_bool":false},{"label":"e","text":"loss of sensation in the lower eyelid.","answer":"False","answer_bool":false}],"correct_labels":["a"],"explanation":"The optic nerve does not pass through the cavernous sinus and therefore the presence of a relative afferent pupillary defect suggests a lesion in the orbital apex. An abduction deficit is caused by a sixth nerve palsy, a dilated pupil by a third nerve lesion and absent forehead sensation by an ophthalmic nerve lesion. All the aforementioned structures pass through both the cavernous sinus and the orbital apex. Loss of sensation in the lower eyelid is caused by maxillary nerve involvement and suggests a lesion in the cavernous sinus because this nerve does not enter the orbital apex.","quick_fix_ids":["QF011"],"source":{"question_pdf_page":82,"question_book_page":71,"answer_pdf_page":83,"answer_book_page":72},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Pupil","Optic nerve","Orbit","Neuro-ophthalmology"]},{"id":"FF136","question_number":136,"stem":"The following are true about photodynamic therapy:","options":["True","False"],"statements":[{"label":"a","text":"it is effective in both classic and occult choroidal neovascularisation","answer":"False","answer_bool":false},{"label":"b","text":"indocyanine green angiography is essential before commencement of treatment","answer":"False","answer_bool":false},{"label":"c","text":"retinal pigment epithelial detachments are not suitable for treatment","answer":"True","answer_bool":true},{"label":"d","text":"therapy works by causing proliferation of the retinal pigment epithelium","answer":"False","answer_bool":false},{"label":"e","text":"argon laser is used.","answer":"False","answer_bool":false}],"correct_labels":["c"],"explanation":"In photodynamic therapy, a photosensitive dye such as verteporfin is injected which is then taken up by the endothelium of the choroidal neovascularisation. Infra-red laser is used to irradiate these vessels causing damage to the endothelium but sparing the retinal pigment epithelium and the photoreceptors. Only classic choroidal neovascularisation is suitable for treatment; patients with haemorrhage and retinal pigment epithelial detachment are not suitable for treatment.","quick_fix_ids":["QF011"],"source":{"question_pdf_page":82,"question_book_page":71,"answer_pdf_page":83,"answer_book_page":72},"primary_topic":"Retina & Vitreous","tags":["Laser","Imaging","Trauma","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF137","question_number":137,"stem":"In carotid artery stenosis:","options":["True","False"],"statements":[{"label":"a","text":"the atheroma is most commonly found at the bifurcation of the common carotid artery","answer":"True","answer_bool":true},{"label":"b","text":"the bruit, if present, is best heard opposite the thyroid gland","answer":"False","answer_bool":false},{"label":"c","text":"the risk of stroke is higher with cerebral TIAs (transient ischaemic attacks) than with ocular TIAs","answer":"True","answer_bool":true},{"label":"d","text":"endarterectomy is superior to medical treatment in the prevention of stroke in a patient with moderate stenosis","answer":"False","answer_bool":false},{"label":"e","text":"the addition of dipyridamole to aspirin has no additive effect in reducing the risk of stroke.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"Carotid artery stenosis can give rise to recurrent TIAs and stroke. The stenosis caused by an atheroma is found usually at the bifurcation of the common carotid artery. The bruit is best heard over the angle of the jaw. The annual risk of stroke is 8% for cerebral TIAs and 2% for ocular TIAs. However, the cause of death is usually myocardial infarction rather than stroke. Endarterectomy is superior to medical treatment in symptomatic cases with significant stenosis of over 70%. Endarterectomy has not been shown to be advantageous over medical treatment in moderate stenosis of between 50 and 60%. Aspirin is the medication of choice. Dipyridamole can be given as an alternative but has no additive effect.","quick_fix_ids":["QF011"],"source":{"question_pdf_page":82,"question_book_page":71,"answer_pdf_page":83,"answer_book_page":72},"primary_topic":"Neuro-ophthalmology","tags":["Pharmacology"]},{"id":"FF138","question_number":138,"stem":"With regard to the following visual field defects:","options":["True","False"],"statements":[{"label":"a","text":"a right temporal lesion causes a left superior homonymous quadrantanopia","answer":"True","answer_bool":true},{"label":"b","text":"a left superior occipital lesion causes a right inferior homonymous quadrantanopia","answer":"True","answer_bool":true},{"label":"c","text":"a junctional scotoma comprises a central scotoma in one eye and superotemporal field loss in the other","answer":"True","answer_bool":true},{"label":"d","text":"a junctional scotoma is a feature of Kennedy-Foster's syndrome","answer":"False","answer_bool":false},{"label":"e","text":"bitemporal hemianopia from a pituitary lesion usually begins superiorly.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"A temporal lobe lesion causes a superior homonymous quadrantanopia, whereas a parietal lobe lesion causes an inferior homonymous quadrantanopia. Lesion in the occipital lobe causes homonymous hemianopia, and a lesion in the lower occipital lobe causes superior homonymous quadrantanopia. A junctional scotoma is caused by a lesion at the junction between the optic nerve and the optic chiasm, resulting in the compression of the knee of Wilbrand. The visual field defect is made up of an ipsilateral central scotoma and a contralateral superotemporal field defect. Chiasmal lesions from a pituitary lesion typically present with early superior field loss.","quick_fix_ids":[],"source":{"question_pdf_page":84,"question_book_page":73,"answer_pdf_page":85,"answer_book_page":74},"primary_topic":"Neuro-ophthalmology","tags":["Genetics","Optic nerve","Visual field"]},{"id":"FF139","question_number":139,"stem":"The following are true when assessing patients for cataract surgery:","options":["True","False"],"statements":[{"label":"a","text":"patients with Fuch's heterochromic cyclitis should only undergo surgery if there is an absence of cells in the anterior chamber for at least one week","answer":"False","answer_bool":false},{"label":"b","text":"patients with significant diabetic macular oedema should undergo laser photocoagulation before cataract surgery","answer":"True","answer_bool":true},{"label":"c","text":"patients with lattice degeneration and atrophic holes should undergo cryotherapy before cataract surgery","answer":"False","answer_bool":false},{"label":"d","text":"an active herpetic lesion of the cornea is a contraindication to surgery","answer":"True","answer_bool":true},{"label":"e","text":"a dacryocystorhinostomy should be performed in the presence of a nasolacrimal duct obstruction prior to cataract surgery.","answer":"False","answer_bool":false}],"correct_labels":["b","d"],"explanation":"In Fuch's heterochromic cyclitis, cells in the anterior chamber do not respond to steroid and their presence should not result in postponement of cataract surgery. However, Fuch's heterochromic cyclitis is associated with certain operative complications due to poor pupillary dilatation and a tendency for the iris to bleed (Amsler's sign). Patients with proliferative diabetic retinopathy and significant macular oedema should undergo laser treatment prior to cataract surgery. In maculopathy, it is recommended that laser is performed 12 weeks before cataract surgery. Retinal detachment following cataract surgery is usually the result of a fresh retinal tear. Prophylactic treatment of lattice degeneration and atrophic holes is not necessary. Active ocular infections, including herpetic keratitis, is a contraindication to cataract surgery. Nasolacrimal duct obstruction in the absence of a mucocele is not a contraindication to cataract surgery.","quick_fix_ids":[],"source":{"question_pdf_page":84,"question_book_page":73,"answer_pdf_page":85,"answer_book_page":74},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Laser","Electrophysiology","Genetics","Infection","Inflammation"]},{"id":"FF140","question_number":140,"stem":"The following are true of endophthalmitis which developed 2 years post-trabeculectomy:","options":["True","False"],"statements":[{"label":"a","text":"it does not occur in the absence of a leaking bleb","answer":"False","answer_bool":false},{"label":"b","text":"it is associated with the use of 5-fluorouracil","answer":"True","answer_bool":true},{"label":"c","text":"it is most commonly caused by Staphylococcus","answer":"False","answer_bool":false},{"label":"d","text":"it has a benign course compared with other forms of post-operative endophthalmitis","answer":"False","answer_bool":false},{"label":"e","text":"it can be effectively treated with intensive topical antibiotics.","answer":"False","answer_bool":false}],"correct_labels":["b"],"explanation":"Infection can enter the eye through a microscopic break in the absence of an obvious leaking bleb. A thin cystic bleb such as those created with the use of mitomycin C or 5-fluorouracil increases the risk of infection. The most commonly isolated pathogens are Streptococcus and Haemophilus. The endophthalmitis can cause severe visual loss unless treated early. The management should include a vitreous tap for culture and sensitivity and intravitreal antibiotics.","quick_fix_ids":[],"source":{"question_pdf_page":84,"question_book_page":73,"answer_pdf_page":85,"answer_book_page":74},"primary_topic":"Glaucoma","tags":["Pharmacology","Surgery","Infection","Glaucoma","Retina & Vitreous"]},{"id":"FF141","question_number":141,"stem":"The following are true about limbal dermoids:","options":["True","False"],"statements":[{"label":"a","text":"they are hamartomas","answer":"False","answer_bool":false},{"label":"b","text":"they are most commonly found in the inferotemporal region","answer":"True","answer_bool":true},{"label":"c","text":"limbal dermoids are more commonly associated with systemic diseases than orbital dermoids","answer":"True","answer_bool":true},{"label":"d","text":"limbal dermoids give a plus cylinder with an axis along the meridian of the lesion","answer":"True","answer_bool":true},{"label":"e","text":"early removal of limbal dermoids will prevent refractive amblyopia.","answer":"False","answer_bool":false}],"correct_labels":["b","c","d"],"explanation":"Limbal dermoids are choristomas, i.e. proliferation of normal tissue in abnormal locations. They are most commonly located in the inferotemporal region. Systemic diseases such as Goldenhar's syndrome are an association. They often induce oblique astigmatism with a plus cylinder axis along the meridian of the lesion. Despite early removal, the astigmatism usually remains. Some refractive amblyopia is present even with spectacle correction.","quick_fix_ids":[],"source":{"question_pdf_page":86,"question_book_page":75,"answer_pdf_page":87,"answer_book_page":76},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Orbit","Cornea & External Eye","Lens, Cataract & Refractive Surgery"]},{"id":"FF142","question_number":142,"stem":"Acoustic neuromas:","options":["True","False"],"statements":[{"label":"a","text":"arise from the vestibular nerve of the eighth cranial nerve","answer":"True","answer_bool":true},{"label":"b","text":"are benign tumours of Schwann cell origin","answer":"True","answer_bool":true},{"label":"c","text":"cause a reduced blink reflex","answer":"True","answer_bool":true},{"label":"d","text":"commonly present with facial nerve palsy","answer":"False","answer_bool":false},{"label":"e","text":"are a feature of neurofibromatosis type II.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"Acoustic neuromas, despite the name, arise from the vestibular nerve of the eighth cranial nerve. The most common location is the internal auditory canal. The tumour is made up of benign Schwann cells. Acoustic neuromas can cause compression of the fifth or seventh cranial nerve, resulting in a reduced or abnormal blink reflex. Facial nerve palsy is a rare presentation. Most patients present with neurosensory deafness, disequilibrium or tinnitus.","quick_fix_ids":[],"source":{"question_pdf_page":86,"question_book_page":75,"answer_pdf_page":87,"answer_book_page":76},"primary_topic":"Neuro-ophthalmology","tags":["Oncology","Systemic Disease & Ocular Associations","Ocular Oncology & Pathology"]},{"id":"FF143","question_number":143,"stem":"Orbital lymphomas:","options":["True","False"],"statements":[{"label":"a","text":"most often arise from the lacrimal fossa","answer":"True","answer_bool":true},{"label":"b","text":"should not be biopsied due to the risk of tumour dissemination","answer":"False","answer_bool":false},{"label":"c","text":"are of high-grade non-Hodgkins' lymphoma in the majority of cases","answer":"False","answer_bool":false},{"label":"d","text":"usually have systemic involvement at presentation","answer":"False","answer_bool":false},{"label":"e","text":"are best treated with radiotherapy.","answer":"True","answer_bool":true}],"correct_labels":["a","e"],"explanation":"The lacrimal fossa is the most common location (about 50%) for orbital lymphoma. Biopsy is essential for diagnosis. The majority of orbital lymphomas are of low grade and do not show systemic dissemination at presentation. However, long-term follow-up is essential because of the risk of systemic involvement. Radiotherapy is the treatment of choice.","quick_fix_ids":[],"source":{"question_pdf_page":86,"question_book_page":75,"answer_pdf_page":87,"answer_book_page":76},"primary_topic":"Ocular Oncology & Pathology","tags":["Orbit","Oncology","Oculoplastics, Lacrimal & Orbit"]},{"id":"FF144","question_number":144,"stem":"The following organisms can penetrate an intact cornea:","options":["True","False"],"statements":[{"label":"a","text":"Staphylococcus aureus","answer":"False","answer_bool":false},{"label":"b","text":"Pseudomonas aeruginosa","answer":"False","answer_bool":false},{"label":"c","text":"Neisseria gonorrhoea","answer":"True","answer_bool":true},{"label":"d","text":"Corynebacterium diphtheriae","answer":"True","answer_bool":true},{"label":"e","text":"Escherichia coli.","answer":"False","answer_bool":false}],"correct_labels":["c","d"],"explanation":"Bacteria that can penetrate an intact cornea include Neisseria gonorrhoea, Nesseria meningitidis and Corynebacterium diphtheriae.","quick_fix_ids":[],"source":{"question_pdf_page":86,"question_book_page":75,"answer_pdf_page":87,"answer_book_page":76},"primary_topic":"Cornea & External Eye","tags":["Cornea"]},{"id":"FF145","question_number":145,"stem":"The following are true about cataract seen in congenital rubella:","options":["True","False"],"statements":[{"label":"a","text":"nuclear sclerosis is a feature","answer":"True","answer_bool":true},{"label":"b","text":"microspherophakia is a feature of rubella cataract","answer":"True","answer_bool":true},{"label":"c","text":"the rubella virus can be isolated from the lens content","answer":"True","answer_bool":true},{"label":"d","text":"retention of lens fibre nuclei is a feature","answer":"True","answer_bool":true},{"label":"e","text":"it is a common cause of glaucoma in congenital rubella.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c","d"],"explanation":"Bilateral or unilateral cataracts are common in congenital glaucoma. The cataract typically involves the nucleus but white cataracts are also commonly seen. The lens tends to be small and spherical. The rubella virus has been isolated from lens material years after birth. Cataract extraction may release the virus, resulting in endophthalmitis. Retention of lens fibre nuclei is common. Glaucoma often co-exists with cataract but is not caused by the cataract.","quick_fix_ids":[],"source":{"question_pdf_page":88,"question_book_page":77,"answer_pdf_page":89,"answer_book_page":78},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Paediatrics","Infection","Glaucoma","Cataract","Paediatric Ophthalmology & Genetics"]},{"id":"FF146","question_number":146,"stem":"Endothelial proliferation is a feature of:","options":["True","False"],"statements":[{"label":"a","text":"congenital hereditary endothelial dystrophy","answer":"False","answer_bool":false},{"label":"b","text":"iridocorneal endothelial syndrome","answer":"True","answer_bool":true},{"label":"c","text":"chronic uveitis","answer":"False","answer_bool":false},{"label":"d","text":"traumatic angle recession","answer":"True","answer_bool":true},{"label":"e","text":"posterior polymorphous dystrophy.","answer":"True","answer_bool":true}],"correct_labels":["b","d","e"],"explanation":"Congenital hereditary endothelial dystrophy is characterised by absent or atrophic endothelium, resulting in corneal oedema. Chronic uveitis does not cause endothelial proliferation. Endothelial proliferation occurs in iridocorneal endothelial syndrome, traumatic angle recession and posterior polymorphous dystrophy. This proliferation can involve the trabecular meshwork, giving rise to glaucoma.","quick_fix_ids":[],"source":{"question_pdf_page":88,"question_book_page":77,"answer_pdf_page":89,"answer_book_page":78},"primary_topic":"Ocular Oncology & Pathology","tags":["Surgery","Genetics","Paediatrics","Inflammation","Trauma","Glaucoma"]},{"id":"FF147","question_number":147,"stem":"The following are indications for surgery in a blowout fracture:","options":["True","False"],"statements":[{"label":"a","text":"cosmetically unacceptable enophthalmos","answer":"True","answer_bool":true},{"label":"b","text":"fracture involving more than 50% of the floor","answer":"True","answer_bool":true},{"label":"c","text":"diplopia on up-gaze","answer":"False","answer_bool":false},{"label":"d","text":"anaesthesia of the lower lid","answer":"False","answer_bool":false},{"label":"e","text":"hyphaema.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"Repair of the blowout fracture is indicated in:\n\n• cosmetically unacceptable enophthalmos • a large fracture • entrapment of the inferior rectus • presence of diplopia in the primary position.","quick_fix_ids":[],"source":{"question_pdf_page":88,"question_book_page":77,"answer_pdf_page":89,"answer_book_page":78},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Surgery","Trauma"]},{"id":"FF148","question_number":148,"stem":"In a patient with an alkaline burn:","options":["True","False"],"statements":[{"label":"a","text":"the eye should be irrigated immediately until the pH is about 7.5","answer":"True","answer_bool":true},{"label":"b","text":"calcium hydroxide (lime) causes more damage than sodium hydroxide","answer":"False","answer_bool":false},{"label":"c","text":"limbal ischaemia is used to decide on the severity of the damage","answer":"True","answer_bool":true},{"label":"d","text":"conjunctival erythema is associated with poor visual prognosis","answer":"False","answer_bool":false},{"label":"e","text":"topical steroids are contraindicated due to the risk of perforation.","answer":"False","answer_bool":false}],"correct_labels":["a","c"],"explanation":"Immediate irrigation is essential until the pH is about 7.5. Lime causes less damage to the eye than sodium hydroxide or ammonium hydroxide. The presence of limbal ischaemia is an indication of the severity of the injury and can predict the extent of stem cell loss. Conjunctival erythema is common and does not affect the visual prognosis. Steroids should be used cautiously due to the risk of sterile ulceration and, occasionally, perforation.","quick_fix_ids":[],"source":{"question_pdf_page":88,"question_book_page":77,"answer_pdf_page":89,"answer_book_page":78},"primary_topic":"Cornea & External Eye","tags":["Trauma"]},{"id":"FF149","question_number":149,"stem":"In a child with accommodative esotropia:","options":["True","False"],"statements":[{"label":"a","text":"the condition can usually be detected at birth","answer":"False","answer_bool":false},{"label":"b","text":"cycloplegic refraction is required to avoid under-estimation of the hypermetropia","answer":"True","answer_bool":true},{"label":"c","text":"the amount of hypermetropia is usually greater than 1.5D","answer":"True","answer_bool":true},{"label":"d","text":"the presence of inferior oblique overaction does not support the diagnosis","answer":"False","answer_bool":false},{"label":"e","text":"strabismus surgery may be an option instead of glasses to correct the esotropia.","answer":"False","answer_bool":false}],"correct_labels":["b","c"],"explanation":"In accommodative esotropia, esotropia results from excessive accommodation in response to high hypermetropia. The age of onset is usually between 2 and 3 years of age. It is rarely detected before the age of 6 months. Cycloplegic refraction is essential as accommodation can underestimate the hypermetropia. Inferior oblique overaction and dissociated vertical deviation can occur in accommodative esotropia. Operating on the muscle does not resolve the esotropia as the eye will still converge when the eye attempts to accommodate.","quick_fix_ids":[],"source":{"question_pdf_page":90,"question_book_page":79,"answer_pdf_page":91,"answer_book_page":80},"primary_topic":"Ocular Motility & Strabismus","tags":["Surgery","Electrophysiology","Paediatrics","Strabismus"]},{"id":"FF150","question_number":150,"stem":"The following are true statements about ocular complications of ionising radiation:","options":["True","False"],"statements":[{"label":"a","text":"a radiation has a deeper tissue penetration than f3 radiation","answer":"False","answer_bool":false},{"label":"b","text":"true exfoliation of the lens is a feature","answer":"False","answer_bool":false},{"label":"c","text":"corneal perforation can result from dry eye and limbal stem cell failure","answer":"True","answer_bool":true},{"label":"d","text":"the retina is more sensitive to radiation than the lens","answer":"False","answer_bool":false},{"label":"e","text":"radiation retinopathy is caused chiefly by damage to photo receptors.","answer":"False","answer_bool":false}],"correct_labels":["c"],"explanation":"f3 radiation has a deeper tissue penetration than a radiation. True exfoliation is a feature of infra-red radiation which is a form of non-ionising radiation. Dry eye and limbal stem cell failure occur with ionising radiation which can lead to corneal perforation. The lens is more vulnerable than the retina to radiation damage. Radiation retinopathy is the result of microangiopathy.","quick_fix_ids":[],"source":{"question_pdf_page":90,"question_book_page":79,"answer_pdf_page":91,"answer_book_page":80},"primary_topic":"Diagnostics, Pharmacology & Perioperative","tags":["Cornea","Cornea & External Eye","Retina & Vitreous"]},{"id":"FF151","question_number":151,"stem":"The following are true about Nd:YAG capsulotomy:","options":["True","False"],"statements":[{"label":"a","text":"the laser is absorbed by the pigment in the eye","answer":"False","answer_bool":false},{"label":"b","text":"it can elicit propionibacterium acne endophthalmitis","answer":"True","answer_bool":true},{"label":"c","text":"raised intraocular pressure is higher in sulcus fixated lenses than 'in the bag' lenses","answer":"True","answer_bool":true},{"label":"d","text":"complications of lens subluxation are most commonly seen with plate haptic lenses","answer":"True","answer_bool":true},{"label":"e","text":"pupil block glaucoma is a complication.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"Nd:Y AG laser works by breaking molecular bonds in tissue. Unlike argon laser, Y AG laser is not absorbed by pigment. In a patient with sequestered focus of propriobacterium acne in the capsule, disruption of the capsule can give rise to endophthalmitis. Post-VAG capsulotomy-induced ocular hypertension is more common and is higher in patients with sulcus fixated lenses than those with 'in the bag' lenses. Lens subluxation is uncommon but can occur with plate haptic lens. Pupil block glaucoma can occur if there is prolapse of vitreous into the anterior chamber.","quick_fix_ids":[],"source":{"question_pdf_page":90,"question_book_page":79,"answer_pdf_page":91,"answer_book_page":80},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Laser","Pupil","Glaucoma","Cataract","Neuro-ophthalmology"]},{"id":"FF152","question_number":152,"stem":"In a patient with lattice dystrophy:","options":["True","False"],"statements":[{"label":"a","text":"the lesion usually involves the central cornea and spares the periphery","answer":"True","answer_bool":true},{"label":"b","text":"the condition usually presents with recurrent erosion corneal syndrome","answer":"True","answer_bool":true},{"label":"c","text":"the main type of amyloid is amyloid P","answer":"True","answer_bool":true},{"label":"d","text":"presence of amyloid within the vitreous is common","answer":"False","answer_bool":false},{"label":"e","text":"compared with macular or granular dystrophy, recurrence in the corneal graft is higher.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"Lattice dystrophy is an autosomal dominant condition. The lesions typically involve the central cornea with clear intervening spaces. The periphery is spared. The condition usually presents as recurrent corneal erosion syndrome. Vision is usually normal until the 40s. The most common type of amyloid seen is amyloid P rather than amyloid A. Most cases of lattice dystrophy have amyloidosis confined to the cornea. It has a higher recurrent rate within the graft compared with other forms of stromal dystrophy.","quick_fix_ids":[],"source":{"question_pdf_page":90,"question_book_page":79,"answer_pdf_page":91,"answer_book_page":80},"primary_topic":"Cornea & External Eye","tags":["Genetics","Macula","Cornea","Retina & Vitreous"]},{"id":"FF153","question_number":153,"stem":"True statements about latent nystagmus include:","options":["True","False"],"statements":[{"label":"a","text":"it is more common than manifest latent nystagmus","answer":"True","answer_bool":true},{"label":"b","text":"it is absent when both eyes are open","answer":"True","answer_bool":true},{"label":"c","text":"the fast phase of the nystagmus is towards the occluded eye","answer":"True","answer_bool":true},{"label":"d","text":"in the presence of congenital esotropia, squint operation usually abolishes latent nystagmus","answer":"False","answer_bool":false},{"label":"e","text":"the amplitude decreases with age.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"Latent nystagmus is more often seen than manifest latent nystagmus. It is common in congenital esotropia. The nystagmus is absent with both eyes open and the fast phase of the nystagmus is towards the occluded eye. Surgery on the muscle does not abolish it. With time, the amplitude of the nystagmus decreases.","quick_fix_ids":[],"source":{"question_pdf_page":92,"question_book_page":81,"answer_pdf_page":93,"answer_book_page":82},"primary_topic":"Ocular Motility & Strabismus","tags":["Surgery","Paediatrics","Strabismus","Paediatric Ophthalmology & Genetics"]},{"id":"FF154","question_number":154,"stem":"24 hours post-trabeculectomy:","options":["True","False"],"statements":[{"label":"a","text":"a minus lens can usually improve the vision in patients with shallow anterior chamber","answer":"True","answer_bool":true},{"label":"b","text":"an increase in the intraocular pressure is usually caused by malignant glaucoma","answer":"False","answer_bool":false},{"label":"c","text":"the presence of choroidal effusion is associated with increased risk of trabeculectomy failure","answer":"False","answer_bool":false},{"label":"d","text":"shallow anterior chamber with iris-to-cornea touch does not require intervention","answer":"True","answer_bool":true},{"label":"e","text":"shallow anterior chamber with lens-to-cornea touch requires immediate reformation of the anterior chamber.","answer":"True","answer_bool":true}],"correct_labels":["a","d","e"],"explanation":"A shallow anterior chamber causes anterior movement of the lens, resulting in myopia. Malignant glaucoma is an uncommon cause of raised intraocular pressure even after trabeculectomy. One must exclude blockage of the sclerotomy by iris tissue, failure of filtration due to tight sutures or retained viscoelastic. Choroidal effusion is a common early finding following trabeculectomy and usually has no long-term implications. Shallow anterior chamber with iris-to-cornea touch is usually a transient phenomenon and needs only observation. Lens-to-cornea touch requires early reformation due to the risk of corneal. decompensation and cataract.","quick_fix_ids":[],"source":{"question_pdf_page":92,"question_book_page":81,"answer_pdf_page":93,"answer_book_page":82},"primary_topic":"Glaucoma","tags":["Surgery","Glaucoma","Cataract","Cornea","Lens, Cataract & Refractive Surgery","Cornea & External Eye"]},{"id":"FF155","question_number":155,"stem":"The following are true about chronic primary angle-closure glaucoma:","options":["True","False"],"statements":[{"label":"a","text":"occurs most commonly in a hypermetropic patient","answer":"True","answer_bool":true},{"label":"b","text":"chronic retrobulbar pain is a feature","answer":"True","answer_bool":true},{"label":"c","text":"cataract extraction often decreases the pressure","answer":"True","answer_bool":true},{"label":"d","text":"laser iridotomy is not useful","answer":"False","answer_bool":false},{"label":"e","text":"progressive angle closure may occur in the presence of a patent peripheral iridectomy.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"Chronic angle-closure glaucoma can occur in patients with chronic open-angle glaucoma. It is more common in females and hypermetropic patients. Pain is not a feature. The angle closure can be abolished with cataract extraction provided there is no anterior synechiae. Laser iridotomy should be tried in these patients to break the pupillary block. Progressive angle closure may occur in the presence of a patent peripheral iridectomy and repeated periodic gonioscopy is imperative.","quick_fix_ids":[],"source":{"question_pdf_page":92,"question_book_page":81,"answer_pdf_page":93,"answer_book_page":82},"primary_topic":"Glaucoma","tags":["Surgery","Laser","Pupil","Glaucoma","Cataract","Lens, Cataract & Refractive Surgery"]},{"id":"FF156","question_number":156,"stem":"The following are true about gases used in retina surgery:","options":["True","False"],"statements":[{"label":"a","text":"an ideal gas is one with low surface tension","answer":"False","answer_bool":false},{"label":"b","text":"expansion of gas is due to diffusion of oxygen and carbon dioxide","answer":"True","answer_bool":true},{"label":"c","text":"sulphur hexafluoride usually dissolves completely one week after injection","answer":"False","answer_bool":false},{"label":"d","text":"sulphur hexafluoride is more expansile than perfluoropropane","answer":"False","answer_bool":false},{"label":"e","text":"nuclear sclerosis is a complication of intravitreal gas usage.","answer":"False","answer_bool":false}],"correct_labels":["b"],"explanation":"Intravitreal gases are used as volume replacement after vitrectomy and to retinal tamponade. The most commonly used gases are air, sulphur hexafluoride (SF6) and perfluoropropane (C3F8). Air dissolves most rapidly (5 days) followed by SF6 (2 weeks) and C3F8 (2 months). Expansion of gas is caused by diffusion of oxygen and carbon dioxide. Air does not expand, SF6 expands to twice its volume and C3F8 expands by about 4 times. Posterior subcapsular cataract is a complication of using intravitreal gas.","quick_fix_ids":[],"source":{"question_pdf_page":92,"question_book_page":81,"answer_pdf_page":93,"answer_book_page":82},"primary_topic":"Retina & Vitreous","tags":["Surgery","Cataract","Lens, Cataract & Refractive Surgery"]},{"id":"FF157","question_number":157,"stem":"With regard to viscoelastic substances:","options":["True","False"],"statements":[{"label":"a","text":"they have the ability to transform from gel into liquid under pressure","answer":"True","answer_bool":true},{"label":"b","text":"healon is a cohesive viscoelastic","answer":"True","answer_bool":true},{"label":"c","text":"a cohesive viscoelastic has better endothelial protective function","answer":"False","answer_bool":false},{"label":"d","text":"capsulorrhexis is easier to perform with a cohesive viscoelastic","answer":"True","answer_bool":true},{"label":"e","text":"a dispersive viscoelastic is easier to insert and remove.","answer":"False","answer_bool":false}],"correct_labels":["a","b","d"],"explanation":"Viscoelastics have pseudoplasticity properties, i.e. the ability to transform under pressure from gel to liquid. Viscoelastics can be divided into cohesive and dispersive types. Healon is a cohesive viscoelastic and viscoat is dispersive. A cohesive viscoelastic has better shock absorption, provides a better view for capsulorrhexis and is easier to insert and to remove. A dispersive viscoelastic gives better coating and endothelial protection but gives a poorer view and is more difficult to insert and remove.","quick_fix_ids":["QF012"],"source":{"question_pdf_page":94,"question_book_page":83,"answer_pdf_page":95,"answer_book_page":84},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Cataract"]},{"id":"FF158","question_number":158,"stem":"Silicone oil:","options":["True","False"],"statements":[{"label":"a","text":"is more effective than SF6 in the management of proliferative vitreoretinopathy","answer":"False","answer_bool":false},{"label":"b","text":"is lighter than water","answer":"True","answer_bool":true},{"label":"c","text":"causes abnormal ERG and EOG","answer":"True","answer_bool":true},{"label":"d","text":"acts as a plus lens in aphakic eyes","answer":"True","answer_bool":true},{"label":"e","text":"can be used instead of gas to avoid posturing.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"Silicone oil is used as a long-lasting volume replacement following vitrectomy. It is more effective than SF6 in the management of proliferative vitreoretinopathy. It is lighter than water and very viscid. The use of silicone oil has been associated with abnormal ERG and EOG which may indicate a certain degree of retinal toxicity. In the aphakic eye, it acts as a plus lens and in the phakic eye as a minus lens. In those who cannot posture, such as the elderly, silicone oil can be used instead of gas.","quick_fix_ids":["QF012"],"source":{"question_pdf_page":94,"question_book_page":83,"answer_pdf_page":95,"answer_book_page":84},"primary_topic":"Retina & Vitreous","tags":["Surgery","Electrophysiology","Lens, Cataract & Refractive Surgery"]},{"id":"FF159","question_number":159,"stem":"Vitritis is a prominent feature in:","options":["True","False"],"statements":[{"label":"a","text":"multiple choroiditis","answer":"True","answer_bool":true},{"label":"b","text":"acute multifocal placoid punctate epitheliopathy (AMPPE)","answer":"True","answer_bool":true},{"label":"c","text":"punctate inner choroidopathy","answer":"False","answer_bool":false},{"label":"d","text":"progressive outer retinal necrosis (PORN)","answer":"False","answer_bool":false},{"label":"e","text":"birdshot choroidopathy.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"Vitritis is often minimal or absent in punctate inner choroidopathy, progressive outer retinal necrosis and birdshot choroidopathy.","quick_fix_ids":["QF012"],"source":{"question_pdf_page":94,"question_book_page":83,"answer_pdf_page":95,"answer_book_page":84},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Retina & Vitreous"]},{"id":"FF160","question_number":160,"stem":"The advantages of indocyanine green (ICG) over fluorescein angiography (FFA) include:","options":["True","False"],"statements":[{"label":"a","text":"better visualisation of retinal vasculature","answer":"False","answer_bool":false},{"label":"b","text":"better visualisation of the choroidal circulation","answer":"True","answer_bool":true},{"label":"c","text":"does not result in skin and urine discolouration","answer":"True","answer_bool":true},{"label":"d","text":"less nausea after injection","answer":"True","answer_bool":true},{"label":"e","text":"an exciting light source is not required.","answer":"False","answer_bool":false}],"correct_labels":["b","c","d"],"explanation":"ICG is highly protein bound and therefore does not leak out from the choroidal vasculature. This makes it ideal for the study of choroidal circulation and pathology. It is excreted unchanged by the liver and does not discolour skin or urine. Nausea is less common compared with FFA. ICG requires an exciting light source like FFA.","quick_fix_ids":["QF012"],"source":{"question_pdf_page":94,"question_book_page":83,"answer_pdf_page":95,"answer_book_page":84},"primary_topic":"Retina & Vitreous","tags":["Imaging"]},{"id":"FF161","question_number":161,"stem":"True statements about pars planitis include:","options":["True","False"],"statements":[{"label":"a","text":"it is uncommon before the age of 10","answer":"False","answer_bool":false},{"label":"b","text":"multiple sclerosis is a common association","answer":"False","answer_bool":false},{"label":"c","text":"involvement of the anterior segment excludes this diagnosis","answer":"False","answer_bool":false},{"label":"d","text":"macular oedema is the most common cause of poor vision","answer":"True","answer_bool":true},{"label":"e","text":"systemic steroids are the treatment of choice for reducing inflammation.","answer":"False","answer_bool":false}],"correct_labels":["d"],"explanation":"Par planitis is characterised by vitreous condensation and cellular aggregation in the inferior vitreous body. There are two peaks for its incidence: 5-15 and 25-35 years of age. It has no known cause. In chronic cases, there may be a posterior subcapsular cataract, posterior synechiae and/or band keratopathy. The main cause of visual loss is macular oedema. The treatment of choice for poor vision secondary to macular oedema is subtenon corticosteroid.","quick_fix_ids":[],"source":{"question_pdf_page":96,"question_book_page":85,"answer_pdf_page":97,"answer_book_page":86},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Pharmacology","Inflammation","Macula","Cataract","Retina & Vitreous","Lens, Cataract & Refractive Surgery"]},{"id":"FF162","question_number":162,"stem":"Post-operatively, an eye has a refraction of + 1.50D which was originally planned to be -0.50D. The following may be responsible:","options":["True","False"],"statements":[{"label":"a","text":"nuclear sclerosis","answer":"False","answer_bool":false},{"label":"b","text":"asteroid hyalosis","answer":"False","answer_bool":false},{"label":"c","text":"little applanation during A-scan","answer":"True","answer_bool":true},{"label":"d","text":"posterior vitreous detachment","answer":"False","answer_bool":false},{"label":"e","text":"eccentric staphyloma.","answer":"True","answer_bool":true}],"correct_labels":["c","e"],"explanation":"A hypermetropic calculation will result if the axial length is falsely long and vice versa. Asteroid hyalosis and posterior vitreous detachment can give a shorter axial length than expected by reflecting the ultrasound before it reaches the retina. Insufficient applanation can create a fluid space between the scan and the cornea, giving a falsely high axial length. Eccentric staphyloma also gives falsely long axial length if the ultrasound is not aimed at the macula. Nuclear sclerosis does not affect the biometry.","quick_fix_ids":[],"source":{"question_pdf_page":96,"question_book_page":85,"answer_pdf_page":97,"answer_book_page":86},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Imaging","Macula","Cataract","Cornea","Retina & Vitreous","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF163","question_number":163,"stem":"Characteristics of toxoplasmosis include:","options":["True","False"],"statements":[{"label":"a","text":"most cases of ocular toxoplasmosis result from ingestion of oocytes","answer":"False","answer_bool":false},{"label":"b","text":"siblings of patients with ocular toxoplasmosis rarely develop ocular findings","answer":"True","answer_bool":true},{"label":"c","text":"the organism typically involves the superficial retinal layer","answer":"True","answer_bool":true},{"label":"d","text":"serum Ig M anti-toxoplasma antibody is useful for the diagnosis of ocular toxoplasmosis","answer":"False","answer_bool":false},{"label":"e","text":"toxoplasma uveitis involving the posterior pole usually resolves spontaneously.","answer":"True","answer_bool":true}],"correct_labels":["b","c","e"],"explanation":"The majority of ocular toxoplasmosis is acquired through congenital transmission. Once immunity is established the subsequent foetuses are rarely infected. The organisms have a predilection for superficial retina. Serum Ig G anti-toxoplasma antibody is useful for the diagnosis. Reactivation of a toxoplasma lesion can give rise to self-limiting posterior uveitis; unless important structures or vision are threatened, treatment is not necessary.","quick_fix_ids":[],"source":{"question_pdf_page":96,"question_book_page":85,"answer_pdf_page":97,"answer_book_page":86},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Paediatrics","Infection","Inflammation","Retina & Vitreous"]},{"id":"FF164","question_number":164,"stem":"In biometry for intraocular lens calculation:","options":["True","False"],"statements":[{"label":"a","text":"intraocular
