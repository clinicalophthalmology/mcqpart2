 lens calculation using traditional keratometry in patients who have had photo refractive surgery will result in post-operative hypermetropia","answer":"True","answer_bool":true},{"label":"b","text":"videokeratography is more accurate than manual keratometry in patients who have had photo refractive surgery","answer":"True","answer_bool":true},{"label":"c","text":"error in keratometry measurement has a greater effect than axial length measurement","answer":"False","answer_bool":false},{"label":"d","text":"the velocity of ultrasound is faster in the silicone oil than in vitreous","answer":"False","answer_bool":false},{"label":"e","text":"axial length in a patient with silicone oil will give a falsely high value.","answer":"True","answer_bool":true}],"correct_labels":["a","b","e"],"explanation":"Photo refractive surgery flattens the cornea and can result in miscalculation of intraocular lens power, giving a more hypermetropic calculation than expected. Videokeratography assesses more points on the cornea and provides more accurate keratometric results. In biometry, error in axial length measurement has a greater effect on the result than error in keratometric measurement. Ultrasonic waves travel more slowly in silicone oil and therefore give a falsely high axial length measurement.","quick_fix_ids":[],"source":{"question_pdf_page":96,"question_book_page":85,"answer_pdf_page":97,"answer_book_page":86},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Imaging","Cataract","Cornea","Retina & Vitreous","Cornea & External Eye"]},{"id":"FF165","question_number":165,"stem":"The following are true about A pattern strabismus:","options":["True","False"],"statements":[{"label":"a","text":"the eye is less exotropic or more esotropic on up-gaze","answer":"True","answer_bool":true},{"label":"b","text":"it is associated with overaction of the superior oblique muscle","answer":"True","answer_bool":true},{"label":"c","text":"it is seen in Crouzon's disease","answer":"False","answer_bool":false},{"label":"d","text":"it can be treated by anterio-posterior displacement of the inferior oblique muscle","answer":"False","answer_bool":false},{"label":"e","text":"it can be treated by upward transposition of the medial rectus muscle.","answer":"True","answer_bool":true}],"correct_labels":["a","b","e"],"explanation":"A pattern strabismus occurs when the eye is less exotropic or more esotropic on up-gaze. It is associated with overaction of the superior oblique muscles. In craniosynostosis such as Crouzon's disease or Apert's syndrome, there is often inferior oblique overaction, giving rise to a V pattern. Inferior oblique muscle weakening does not improve the A pattern. Transposition of the horizontal recti can be used to reduce the A pattern - this is achieved by moving the medial rectus upwards or by moving the lateral rectus downwards.","quick_fix_ids":[],"source":{"question_pdf_page":98,"question_book_page":87,"answer_pdf_page":99,"answer_book_page":88},"primary_topic":"Ocular Motility & Strabismus","tags":["Genetics","Strabismus"]},{"id":"FF166","question_number":166,"stem":"With regard to medication used in cataract surgery:","options":["True","False"],"statements":[{"label":"a","text":"flurbiprofen can be used to prevent miosis but has no mydriatic effect","answer":"True","answer_bool":true},{"label":"b","text":"intracameral lignocaine must be preservative-free","answer":"True","answer_bool":true},{"label":"c","text":"the use of adrenaline in the infusion fluid is contraindicated because of the risk of cystoid macular oedema","answer":"False","answer_bool":false},{"label":"d","text":"acetylcholine is used to constrict the pupil rapidly","answer":"True","answer_bool":true},{"label":"e","text":"subconjunctival antibiotics have been shown to reduce the rate of post-operative endophthalmitis.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"Flurbiprofen can be used pre-operatively to prevent miosis but it has no intrinsic mydriatic effect. It can also be used to reduce inflammation if corticosteroids are contraindicated. Any drug used in the anterior chamber should be preservative-free because preservatives can damage the endothelium. Unpreserved adrenaline is added to the infusion solution to prevent miosis during phacoemulsification. Acetylcholine is used for rapid pupillary constriction. Although subconjunctival antibiotics are given routinely at the end of cataract surgery, studies have not shown a clear reduction of the endophthalmitis rate.","quick_fix_ids":[],"source":{"question_pdf_page":98,"question_book_page":87,"answer_pdf_page":99,"answer_book_page":88},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Pharmacology","Surgery","Inflammation","Pupil","Macula","Cataract"]},{"id":"FF167","question_number":167,"stem":"The following changes are responsible for involutional entropion:","options":["True","False"],"statements":[{"label":"a","text":"lateral canthal laxity","answer":"True","answer_bool":true},{"label":"b","text":"orbital fat atrophy","answer":"True","answer_bool":true},{"label":"c","text":"lower lid retractor laxity","answer":"True","answer_bool":true},{"label":"d","text":"shallowing of the inferior fornix","answer":"False","answer_bool":false},{"label":"e","text":"spasm of the orbicularis oculi.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"The following changes are believed to have contributed to involutional entropion:\n\n• fat atrophy • laxity of the medial and lateral canthal tendons • laxity of the inferior retractor • over-riding of the pre-tarsal muscle by the pre-septal muscle.\n\nShortening of the inferior fornix causes cicatricial entropion, and spasm of the orbicularis oculi causes spastic entropion.","quick_fix_ids":[],"source":{"question_pdf_page":98,"question_book_page":87,"answer_pdf_page":99,"answer_book_page":88},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Orbit"]},{"id":"FF168","question_number":168,"stem":"In orbital myositis:","options":["True","False"],"statements":[{"label":"a","text":"an underlying cause can be found in the majority of patients","answer":"False","answer_bool":false},{"label":"b","text":"the most commonly involved muscles are the superior and medial recti","answer":"True","answer_bool":true},{"label":"c","text":"CT scan shows enlargement of the muscle belly with sparing of the tendon","answer":"False","answer_bool":false},{"label":"d","text":"the pain is worse on looking away from the action of the affected muscle","answer":"True","answer_bool":true},{"label":"e","text":"systemic non-steroidal anti-inflammatory drugs should be tried before systemic steroid.","answer":"True","answer_bool":true}],"correct_labels":["b","d","e"],"explanation":"Orbital myositis is idiopathic in the majority of patients. It is part of the spectrum of idiopathic orbital inflammatory syndrome. The superior and medial recti are most commonly involved. CT scan shows enlargement of the muscle belly with involvement of the tendon. Pain is worse when the eye looks away from the action of the affected muscle. Forced duction test is often positive. Chronic cases can lead to fibrosis and restriction of ocular movement. In the acute stage, a non-steroidal anti-inflammatory drug may be sufficient to control the inflammation. If this fails, systemic steroids are usually required.","quick_fix_ids":[],"source":{"question_pdf_page":98,"question_book_page":87,"answer_pdf_page":99,"answer_book_page":88},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Pharmacology","Imaging","Genetics","Inflammation","Orbit"]},{"id":"FF169","question_number":169,"stem":"Heterochromic iridis occurs in the following:","options":["True","False"],"statements":[{"label":"a","text":"acquired Horner's syndrome","answer":"False","answer_bool":false},{"label":"b","text":"Sturge-Weber's syndrome","answer":"True","answer_bool":true},{"label":"c","text":"Waardenburg's syndrome","answer":"True","answer_bool":true},{"label":"d","text":"Hirschprung's disease","answer":"True","answer_bool":true},{"label":"e","text":"naevus of Ota.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"Congenital rather than acquired Horner's syndrome is associated with heterochromia iridis with the affected side being lighter. Sympathetic innervation is important for the migration of melanocytes into the iris. Sturge-Weber's syndrome can give rise to ipsilateral iris hyperpigmentation. Waardenburg's syndrome causes hypochromia of the iris. Hirschprung's disease results from abnormal sympathetic nervous system development and hence abnormal melanocyte migration. Naevus of Ota causes increased pigmentation of the affected side.","quick_fix_ids":[],"source":{"question_pdf_page":100,"question_book_page":89,"answer_pdf_page":101,"answer_book_page":90},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Genetics","Paediatrics","Inflammation","Pupil","Paediatric Ophthalmology & Genetics","Glaucoma"]},{"id":"FF170","question_number":170,"stem":"Latanoprost:","options":["True","False"],"statements":[{"label":"a","text":"decreases the formation of aqueous humour","answer":"False","answer_bool":false},{"label":"b","text":"should be avoided in the presence of anterior uveitis","answer":"True","answer_bool":true},{"label":"c","text":"causes iris hyperpigmentation by inciting melanocyte hyperplasia","answer":"False","answer_bool":false},{"label":"d","text":"should be avoided in pseudophakic patients","answer":"True","answer_bool":true},{"label":"e","text":"anti-glaucoma effect is reduced with the concurrent use of a non-steroidal anti-inflammatory drug.","answer":"False","answer_bool":false}],"correct_labels":["b","d"],"explanation":"Latanoprost works by increasing uveoscleral outflow. It causes blood aqueous barrier instability and should be avoided in anterior uveitis. It should also be avoided in aphakic and pseudophakic patients due to the risk of cystoid macular oedema. Iris hyperpigmentation results from increased production of melanin by the melanocytes. Non-steroidal anti-inflammatory drugs which inhibit the formation of prostaglandins have no effect on latanoprost, which is a prostaglandin analogue.","quick_fix_ids":[],"source":{"question_pdf_page":100,"question_book_page":89,"answer_pdf_page":101,"answer_book_page":90},"primary_topic":"Glaucoma","tags":["Pharmacology","Inflammation","Macula","Glaucoma","Uveitis & Ocular Inflammation","Lens, Cataract & Refractive Surgery"]},{"id":"FF171","question_number":171,"stem":"In nanophthalmos:","options":["True","False"],"statements":[{"label":"a","text":"the palpebral fissure is reduced","answer":"True","answer_bool":true},{"label":"b","text":"intraocular structures are disorganised","answer":"False","answer_bool":false},{"label":"c","text":"microspherophakia is usual","answer":"False","answer_bool":false},{"label":"d","text":"the sclera is abnormally thickened","answer":"True","answer_bool":true},{"label":"e","text":"intraocular surgery is associated with rhegmatogenous retinal detachment.","answer":"False","answer_bool":false}],"correct_labels":["a","d"],"explanation":"In nanophthalmos, the axial length of the eye is reduced. The lens, however, is of normal size and this increases the risk of pupillary block. The sclera is abnormally thickened and this is thought to cause uveal effusion syndrome and rhegmatogenous retinal detachment, especially after intraocular surgery, through vortex vein compression.","quick_fix_ids":[],"source":{"question_pdf_page":100,"question_book_page":89,"answer_pdf_page":101,"answer_book_page":90},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Surgery","Genetics","Pupil","Retinal detachment","Retina & Vitreous"]},{"id":"FF172","question_number":172,"stem":"Regarding Sturge-Weber's syndrome:","options":["True","False"],"statements":[{"label":"a","text":"the port-wine stain does not cross the midline","answer":"False","answer_bool":false},{"label":"b","text":"glaucoma is more common in a patient with upper lid rather than lower lid involvement","answer":"True","answer_bool":true},{"label":"c","text":"recurrent epilepsy and mental retardation are features","answer":"True","answer_bool":true},{"label":"d","text":"tram-line appearance on the plain skull X-ray is the result of calcification of the abnormal cerebral vessel","answer":"True","answer_bool":true},{"label":"e","text":"expulsive haemorrhage is a recognised risk during cataract surgery.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"Sturge-Weber's syndrome is a type of phakomatoses. It has a sporadic occurrence. The condition is characterised by a port-wine stain involving the trigeminal distribution. However, the lesion often crosses the midline. Glaucoma is a common complication due to increased episcleral venous pressure, and is more common if the port-wine stain involves the upper lid. Recurrent epilepsy and mental retardation occur in about 50% of cases. Cerebral angiomatosis causes cerebral calcification in a tram-line fashion. Diffuse choroidal haemangioma is common and increases the risk of expulsive haemorrhage during intraocular surgery.","quick_fix_ids":[],"source":{"question_pdf_page":100,"question_book_page":89,"answer_pdf_page":101,"answer_book_page":90},"primary_topic":"Glaucoma","tags":["Surgery","Genetics","Trauma","Glaucoma","Cataract","Paediatric Ophthalmology & Genetics"]},{"id":"FF173","question_number":173,"stem":"The pairing of the following are correct:","options":["True","False"],"statements":[{"label":"a","text":"epiblepharon - punctate keratitis","answer":"True","answer_bool":true},{"label":"b","text":"dermatochalasis - superior visual field defect","answer":"True","answer_bool":true},{"label":"c","text":"blepharochalasis - allergic dermatitis","answer":"False","answer_bool":false},{"label":"d","text":"floppy eyelid syndrome - chronic papillary conjunctivitis","answer":"True","answer_bool":true},{"label":"e","text":"brow ptosis - facial nerve palsy.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"In epiblepharon there is excess pre-tarsal skin and orbicularis oculi. This can cause misdirection of the eyelashes, resulting in corneal irritation and punctate keratitis. Dermatochalasis is seen in the elderly due to excess upper lid skin. Overhanging of the skin can cause superior visual field defects. Blepharochalasis affects younger people with recurrent inflammation and swelling of the upper lid. This can lead to loosening of the skin and levator dehiscence. It is not caused by allergy. Floppy eyelid syndrome typically affects middle-aged overweight males. The upper lid everts easily during sleep, causing mechanical irritation. Chronic papillary conjunctivitis and punctate keratitis are common. Brow ptosis can be involutional or the result of facial nerve palsy.","quick_fix_ids":[],"source":{"question_pdf_page":102,"question_book_page":91,"answer_pdf_page":103,"answer_book_page":92},"primary_topic":"Diagnostics, Pharmacology & Perioperative","tags":["Electrophysiology","Genetics","Inflammation","Visual field","Cornea","Cornea & External Eye"]},{"id":"FF174","question_number":174,"stem":"A patient with an orbital implant develops a superior sulcus deformity. The following methods are useful in correcting or reducing the deformity:","options":["True","False"],"statements":[{"label":"a","text":"levator resection","answer":"False","answer_bool":false},{"label":"b","text":"increasing the size of the orbital implant","answer":"True","answer_bool":true},{"label":"c","text":"lower lid tightening","answer":"True","answer_bool":true},{"label":"d","text":"placement of cartilage along the orbital floor","answer":"True","answer_bool":true},{"label":"e","text":"mucous membrane graft.","answer":"False","answer_bool":false}],"correct_labels":["b","c","d"],"explanation":"Loss of volume or shifting of the orbital implant usually causes a superior sulcus deformity in an eye with an orbital implant. Increasing the size of the orbital implant is useful. If the lower lid is lax, tightening the lid will allow the prosthesis to be placed more superiorly and reduces the deformity. Placing cartilage in the orbital floor will help to elevate the implant and reduces the deformity.","quick_fix_ids":[],"source":{"question_pdf_page":102,"question_book_page":91,"answer_pdf_page":103,"answer_book_page":92},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Surgery","Orbit"]},{"id":"FF175","question_number":175,"stem":"In Tolosa-Hunt's syndrome:","options":["True","False"],"statements":[{"label":"a","text":"the lesion is located at the orbital apex","answer":"False","answer_bool":false},{"label":"b","text":"the cause is usually a metastatic tumour","answer":"False","answer_bool":false},{"label":"c","text":"visual loss is common","answer":"False","answer_bool":false},{"label":"d","text":"orbital inflammation is often absent","answer":"True","answer_bool":true},{"label":"e","text":"systemic steroids usually relieve the pain before ophthalmoplegia.","answer":"True","answer_bool":true}],"correct_labels":["d","e"],"explanation":"Tolosa-Hunt's syndrome involves the cavernous sinus. It is thought to be an extra-orbital idiopathic inflammatory disorder. There is pain and ophthalmoplegia due to involvement of the third, fourth and sixth cranial nerves. It is a diagnosis of exclusion. As the optic nerve does not enter the cavernous sinus, visual involvement is rare. Proptosis is minimal and orbital inflammation is often absent. Systemic steroid is the treatment of choice. Pain usually responds to treatment first before ophthalmoplegia.","quick_fix_ids":[],"source":{"question_pdf_page":102,"question_book_page":91,"answer_pdf_page":103,"answer_book_page":92},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Genetics","Inflammation","Optic nerve","Orbit","Oncology"]},{"id":"FF176","question_number":176,"stem":"Regarding systemic lupus erythematosus (SLE):","options":["True","False"],"statements":[{"label":"a","text":"the diagnosis is made by the presence of characteristic anti-nuclear antibodies","answer":"False","answer_bool":false},{"label":"b","text":"the majority of patients are female of child-bearing age","answer":"True","answer_bool":true},{"label":"c","text":"superficial punctate keratitis is the most common cornea pathology associated with SLE","answer":"True","answer_bool":true},{"label":"d","text":"cotton wool spots are a feature of SLE retinopathy","answer":"True","answer_bool":true},{"label":"e","text":"cerebrovascular accident is the main cause of death.","answer":"False","answer_bool":false}],"correct_labels":["b","c","d"],"explanation":"Systemic lupus erythematosus is a systemic collagen vascular disease. The underlying pathogenesis is caused by autoimmune necrotising vasculitis. The majority of patients are female and of child-bearing age. Diagnosis is made clinically by the presence of specific signs. Superficial punctate keratitis is the most common sign in the cornea. Cotton wool spots are characteristic of SLE retinopathy. Proliferative retinopathy can occur but is uncommon. The main cause of death is renal failure.","quick_fix_ids":[],"source":{"question_pdf_page":102,"question_book_page":91,"answer_pdf_page":103,"answer_book_page":92},"primary_topic":"Systemic Disease & Ocular Associations","tags":["Genetics","Paediatrics","Inflammation","Cornea","Retina & Vitreous","Cornea & External Eye"]},{"id":"FF177","question_number":177,"stem":"The following B scan ultrasound features favour a diagnosis of choroidal detachment rather than retinal detachment:","options":["True","False"],"statements":[{"label":"a","text":"dome-shaped elevation","answer":"True","answer_bool":true},{"label":"b","text":"presence of fluid level","answer":"True","answer_bool":true},{"label":"c","text":"attachment of vortex veins to the elevated area","answer":"True","answer_bool":true},{"label":"d","text":"attachment of the elevation to the optic disc","answer":"False","answer_bool":false},{"label":"e","text":"vitreous opacities.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Choroidal detachment tends to have a smooth and dome-shaped outline. Fluid level is common and the vortex vein may be seen attached to the elevation.","quick_fix_ids":[],"source":{"question_pdf_page":104,"question_book_page":93,"answer_pdf_page":105,"answer_book_page":94},"primary_topic":"Retina & Vitreous","tags":["Imaging","Optic nerve","Retinal detachment","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF178","question_number":178,"stem":"The following genetic disorders are associated with the development of multiple basal cell carcinoma:","options":["True","False"],"statements":[{"label":"a","text":"Corlin's syndrome","answer":"True","answer_bool":true},{"label":"b","text":"xeroderma pigmentosa","answer":"True","answer_bool":true},{"label":"c","text":"incontinentia pigmenti","answer":"False","answer_bool":false},{"label":"d","text":"albinism","answer":"True","answer_bool":true},{"label":"e","text":"neurofibromatosis.","answer":"False","answer_bool":false}],"correct_labels":["a","b","d"],"explanation":"Corlin's syndrome is also called the naevoid basal cell carcinoma syndrome. It is an autosomal dominant disorder characterised by development of multiple basal cell carcinoma in early life. Xeroderma pigmentosa is an autosomal recessive disorder. The DNA repair mechanism is defective, resulting in an increased incidence of skin tumours upon exposure to ultraviolet light. Albinism lacks melanin which is protective against ultraviolet light. As a result, the skin is at risk of various tumours including basal cell carcinoma. Incontinentia pigmenti is an X-linked dominant disorder. The patient develops erythema and bullae on the skin and proliferative retinopathy. The risk of developing basal cell carcinoma is not increased. Neurofibromatosis does not cause an increased incidence of basal cell carcinoma.","quick_fix_ids":[],"source":{"question_pdf_page":104,"question_book_page":93,"answer_pdf_page":105,"answer_book_page":94},"primary_topic":"Ocular Oncology & Pathology","tags":["Surgery","Genetics","Oncology","Paediatric Ophthalmology & Genetics","Systemic Disease & Ocular Associations"]},{"id":"FF179","question_number":179,"stem":"The pairings of the following concerning glaucoma are true:","options":["True","False"],"statements":[{"label":"a","text":"Scheie's procedure - removal of full-thickness sclera","answer":"True","answer_bool":true},{"label":"b","text":"trabeculectomy - partial removal of the ciliary body","answer":"False","answer_bool":false},{"label":"c","text":"goniotomy - incision of trabecular meshwork","answer":"True","answer_bool":true},{"label":"d","text":"trabeculotomy - partial removal of trabecular meshwork","answer":"True","answer_bool":true},{"label":"e","text":"trabeculodialysis - creation of a cyclodialysis cleft.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"Scheie's procedure creates a full-thickness sclerotomy. Hence, intraocular pressure is less controlled and hypotony is common. Trabeculectomy involves removing part of the sclera to create a sclerotomy which is then covered by a scleral flap. The procedure is performed anterior to the ciliary body. Coniotomy is performed in congenital glaucoma to create a communication between the anterior chamber and Schlemm's canal. It involves incision of the trabecular meshwork at a point between Schwalbe's line and the scleral spur. Trabeculotomy establishes a communication between the anterior chamber and Schlemm's canal by partial removal of the trabecular meshwork (goniotomy ab externo). Trabeculodialysis involves incision of Schwalbe's line followed by disinsertion of the trabecular meshwork from the scleral spur.","quick_fix_ids":[],"source":{"question_pdf_page":104,"question_book_page":93,"answer_pdf_page":105,"answer_book_page":94},"primary_topic":"Glaucoma","tags":["Surgery","Paediatrics","Glaucoma"]},{"id":"FF180","question_number":180,"stem":"Features of primary congenital glaucoma include the following:","options":["True","False"],"statements":[{"label":"a","text":"males are more commonly affected than females","answer":"True","answer_bool":true},{"label":"b","text":"siblings have a 5% chance of being affected","answer":"True","answer_bool":true},{"label":"c","text":"there is enlargement of both the cornea and the axial length","answer":"True","answer_bool":true},{"label":"d","text":"Haab's striae is caused by tears in Descemet's membrane","answer":"True","answer_bool":true},{"label":"e","text":"the amount of optic disc cupping can be used to predict visual prognosis.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c","d"],"explanation":"Primary congenital glaucoma affects males more often than females. About 60 to 80% of cases have bilateral involvement. The inheritance is multifactorial; siblings and offspring have a 5% chance of acquiring the disease. The raised intraocular pressure causes global enlargement of the eye. Haab's striae results from tears in Descemet's membrane. Optic disc cupping develops early but usually reverses with treatment of the intraocular pressure. Corneal opacities and refractive amblyopia usually cause poor vision.","quick_fix_ids":[],"source":{"question_pdf_page":106,"question_book_page":95,"answer_pdf_page":107,"answer_book_page":96},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Paediatrics","Optic nerve","Glaucoma","Cornea","Cornea & External Eye"]},{"id":"FF181","question_number":181,"stem":"The following drugs are known to cause anterior uveitis:","options":["True","False"],"statements":[{"label":"a","text":"rifabutin","answer":"True","answer_bool":true},{"label":"b","text":"streptokinase","answer":"True","answer_bool":true},{"label":"c","text":"quinidine","answer":"True","answer_bool":true},{"label":"d","text":"cidofovir","answer":"True","answer_bool":true},{"label":"e","text":"metipranolol.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","d","e"],"explanation":"Other drugs that have been reported to cause uveitis include oral contraceptives, hepatitis Band BCG vaccines, interleukin-3, interleukin-6, diethylcarbamazine and disodium pamidronate.","quick_fix_ids":[],"source":{"question_pdf_page":106,"question_book_page":95,"answer_pdf_page":107,"answer_book_page":96},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Pharmacology","Inflammation"]},{"id":"FF182","question_number":182,"stem":"The following are true concerning optic nerve trauma in head injuries:","options":["True","False"],"statements":[{"label":"a","text":"it usually involves the intracranial portion of the optic nerve","answer":"False","answer_bool":false},{"label":"b","text":"an altitudinal visual field defect is common","answer":"False","answer_bool":false},{"label":"c","text":"optic atrophy is a common complication","answer":"True","answer_bool":true},{"label":"d","text":"delay latency in the visual evoked potential may occur","answer":"True","answer_bool":true},{"label":"e","text":"it usually responds to optic nerve fenestration.","answer":"False","answer_bool":false}],"correct_labels":["c","d"],"explanation":"Optic nerve trauma in head injuries often occurs in the intracanalicular portion. The visual field defect is usually a central scotoma. Optic atrophy is common and the visual evoked potential will show a delayed latency. Optic nerve fenestration is usually performed in patients with optic nerve sheath haematoma -however, in most traumatic optic neuropathies the optic nerve appears normal on CT or MRI scan, and optic nerve fenestration is of uncertain benefit in such cases.","quick_fix_ids":[],"source":{"question_pdf_page":106,"question_book_page":95,"answer_pdf_page":107,"answer_book_page":96},"primary_topic":"Neuro-ophthalmology","tags":["Imaging","Electrophysiology","Trauma","Optic nerve","Visual field"]},{"id":"FF183","question_number":183,"stem":"With regard to AC/A (accommodative convergence/ accommodation) ratio:","options":["True","False"],"statements":[{"label":"a","text":"it refers to the amount of accommodative convergence in prism dioptres per unit of accommodation","answer":"True","answer_bool":true},{"label":"b","text":"it decreases with age","answer":"False","answer_bool":false},{"label":"c","text":"it is reduced with phopholine iodide","answer":"True","answer_bool":true},{"label":"d","text":"it decreases in exotropia","answer":"False","answer_bool":false},{"label":"e","text":"it is better measured with the heterophoria rather than the gradient method.","answer":"False","answer_bool":false}],"correct_labels":["a","c"],"explanation":"AC/A ratio refers to the amount of accommodative convergence needed in prism dioptre per unit dioptre of accommodation. This ratio tends to remain unchanged throughout life. Phopholine iodide stimulates accommodation and therefore may reduce the ratio. AC/A ratio is increased in exotropia. AC/A ratio can be measured with either the gradient or heterophoria method but the former is more accurate.","quick_fix_ids":[],"source":{"question_pdf_page":106,"question_book_page":95,"answer_pdf_page":107,"answer_book_page":96},"primary_topic":"Ocular Motility & Strabismus","tags":["Electrophysiology","Strabismus","Retina & Vitreous"]},{"id":"FF184","question_number":184,"stem":"The female carrier of the following X-linked conditions may show fundal changes:","options":["True","False"],"statements":[{"label":"a","text":"choroideremia","answer":"True","answer_bool":true},{"label":"b","text":"retinoschisis","answer":"False","answer_bool":false},{"label":"c","text":"ocular albinism","answer":"True","answer_bool":true},{"label":"d","text":"retinitis pigmentosa","answer":"True","answer_bool":true},{"label":"e","text":"Norrie's disease.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"In choroideremia, ocular albinism and retinitis pigmentosa, pigmentary changes may be observed in the peripheral retina of the female carrier. Retinoschisis and Norrie's disease are not associated with abnormal retinal findings in the female carriers.","quick_fix_ids":[],"source":{"question_pdf_page":108,"question_book_page":97,"answer_pdf_page":109,"answer_book_page":98},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Retina & Vitreous","Systemic Disease & Ocular Associations"]},{"id":"FF185","question_number":185,"stem":"Features of cluster headaches include:","options":["True","False"],"statements":[{"label":"a","text":"greater predilection in males than females","answer":"True","answer_bool":true},{"label":"b","text":"the pupil is typically enlarged during the attack","answer":"False","answer_bool":false},{"label":"c","text":"ptosis is a feature","answer":"True","answer_bool":true},{"label":"d","text":"prodromal visual symptoms are typical","answer":"False","answer_bool":false},{"label":"e","text":"rhinorrhoea is common.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"Cluster headaches occur more commonly in males than females. The pain is severe and confined to within the region of the eye. During the attacks, conjunctival redness, lacrimation and Horner's syndrome can occur. Other features include orbital swelling, rhinorrhea and nasal congestion. Unlike migraine, prodromal visual symptoms are uncommon.","quick_fix_ids":[],"source":{"question_pdf_page":108,"question_book_page":97,"answer_pdf_page":109,"answer_book_page":98},"primary_topic":"Neuro-ophthalmology","tags":["Genetics","Pupil","Orbit","Oculoplastics, Lacrimal & Orbit","Systemic Disease & Ocular Associations"]},{"id":"FF186","question_number":186,"stem":"Mooren's ulcer:","options":["True","False"],"statements":[{"label":"a","text":"has a better prognosis if the patient is less than 40 years of age","answer":"False","answer_bool":false},{"label":"b","text":"tends to affect both eyes in older patients","answer":"False","answer_bool":false},{"label":"c","text":"is associated with Wegener's granulomatosis in 20% of cases","answer":"False","answer_bool":false},{"label":"d","text":"is usually associated with scleritis","answer":"False","answer_bool":false},{"label":"e","text":"may be treated with limbal conjunctival excision.","answer":"True","answer_bool":true}],"correct_labels":["e"],"explanation":"Mooren's ulcer is a peripheral ulcerative keratitis that begins in the corneoscleral limbus and progresses centrally and circumferentially. The condition is idiopathic and not associated with scleritis. In the elderly, the disease tends to be unilateral and associated with good prognosis. In the young, especially in people of African origin, the disease tends to be bilateral and more aggressive. Excision of the limbal conjunctival may be useful in some cases. Other treatment options include systemic steroids and immunosuppression.","quick_fix_ids":[],"source":{"question_pdf_page":108,"question_book_page":97,"answer_pdf_page":109,"answer_book_page":98},"primary_topic":"Cornea & External Eye","tags":["Genetics","Inflammation","Cornea"]},{"id":"FF187","question_number":187,"stem":"Advantages of fornix-based over limbal-based conjunctival flaps during trabeculectomy include:","options":["True","False"],"statements":[{"label":"a","text":"better surgical exposure","answer":"True","answer_bool":true},{"label":"b","text":"less post-operative wound leakage","answer":"False","answer_bool":false},{"label":"c","text":"easier wound closure","answer":"True","answer_bool":true},{"label":"d","text":"formation of a more diffuse bleb","answer":"True","answer_bool":true},{"label":"e","text":"better long-term intraocular pressure control.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"The advantages of fornix-based over limbal-based conjunctival flaps during trabeculectomy include: better surgical exposure, easier wound closure and formation of a more diffuse bleb. Post-operative wound leakage is more common in fornix-based flaps compared with limbal-based flaps. The long-term intraocular pressure control is equivocal in either approach.","quick_fix_ids":[],"source":{"question_pdf_page":108,"question_book_page":97,"answer_pdf_page":109,"answer_book_page":98},"primary_topic":"Glaucoma","tags":["Surgery","Glaucoma","Cornea & External Eye"]},{"id":"FF188","question_number":188,"stem":"The following features on B scan suggest a rhegmatogenous retinal detachment:","options":["True","False"],"statements":[{"label":"a","text":"absence of echogenicity behind the membrane","answer":"True","answer_bool":true},{"label":"b","text":"attachment of the membrane to the optic disc","answer":"True","answer_bool":true},{"label":"c","text":"full mobility of the membrane","answer":"False","answer_bool":false},{"label":"d","text":"high echogenicity of the membrane","answer":"False","answer_bool":false},{"label":"e","text":"attachment of the membrane to multiple sites away from the disc.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"Rhegmatogenous retinal membranes are not associated with fluid behind the membrane. A fully mobile membrane suggests a posterior vitreous detachment. The membrane has the same echogenicity as the retina. Presence of multiple sites of attachment is suggestive of tractional retinal detachment.","quick_fix_ids":[],"source":{"question_pdf_page":110,"question_book_page":99,"answer_pdf_page":111,"answer_book_page":100},"primary_topic":"Retina & Vitreous","tags":["Imaging","Optic nerve","Retinal detachment"]},{"id":"FF189","question_number":189,"stem":"Iridoschisis:","options":["True","False"],"statements":[{"label":"a","text":"usually involves the inferior quadrant of the iris","answer":"True","answer_bool":true},{"label":"b","text":"results from a split between the iris stroma and the pigment epithelium","answer":"False","answer_bool":false},{"label":"c","text":"can be caused by mydriatics","answer":"False","answer_bool":false},{"label":"d","text":"is associated with glaucoma in 50% of cases","answer":"True","answer_bool":true},{"label":"e","text":"can cause endothelial decompensation.","answer":"True","answer_bool":true}],"correct_labels":["a","d","e"],"explanation":"Iridoschisis is a degenerative disorder involving the lower quadrant of the iris near the pupil. It is an uncommon condition and usually affects the elderly. The splitting of the iris occurs between the anterior and the posterior stroma. It is idiopathic in most cases but acute angle-closure glaucoma and use of miotics such as pilocarpine are contributing factors. It is associated with glaucoma in 50% of cases and may lead to endothelial decompensation....•....•...••.....•.....••. ' '....•.••..••.........•.....••.•...•....","quick_fix_ids":[],"source":{"question_pdf_page":110,"question_book_page":99,"answer_pdf_page":111,"answer_book_page":100},"primary_topic":"Glaucoma","tags":["Pharmacology","Genetics","Pupil","Glaucoma"]},{"id":"FF190","question_number":190,"stem":"Riley-Day's syndrome:","options":["True","False"],"statements":[{"label":"a","text":"is an autosomal recessive disorder","answer":"True","answer_bool":true},{"label":"b","text":"causes corneal anaesthesia","answer":"True","answer_bool":true},{"label":"c","text":"results in a decrease in lacrimation","answer":"True","answer_bool":true},{"label":"d","text":"causes decreased sweating","answer":"False","answer_bool":false},{"label":"e","text":"may be associated with an increased urine HV A (homovanillic acid).","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"Riley-Day's syndrome or familial dysautonomia is a rare autosomal recessive disorder characterised by an abnormal autonomic nervous system and sensory function. There is a deficiency of the enzyme dopamine;3-hydroxylase. This causes an increased urinary HV A (homovanillic acid). The ophthalmic features include corneal anaesthesia, decreased lacrimation, anisocoria and ptosis. Systemic features include paroxysmal hypertension, increased sweating and emotional lability.\n\nt$\\ ·.• ·.•.•.•. ti · · j VJ:iJ.. 8... ·.. ·.·.. ·.. ·...;. W •...•..•. ·.·.•. ·.j: V!!fjI.•.•.","quick_fix_ids":[],"source":{"question_pdf_page":110,"question_book_page":99,"answer_pdf_page":111,"answer_book_page":100},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Cornea","Cornea & External Eye","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF191","question_number":191,"stem":"In marginal keratitis:","options":["True","False"],"statements":[{"label":"a","text":"the lesion is typically found where the cornea rests against the eyelid","answer":"True","answer_bool":true},{"label":"b","text":"there is a clear area between the lesion and the limbus","answer":"True","answer_bool":true},{"label":"c","text":"cornea scrape usually yields Gram-positive bacteria","answer":"False","answer_bool":false},{"label":"d","text":"lid swab usually yields Streptococcus","answer":"False","answer_bool":false},{"label":"e","text":"systemic tetracycline can be used to prevent recurrence.","answer":"True","answer_bool":true}],"correct_labels":["a","b","e"],"explanation":"Marginal keratitis is an immune disorder caused by hypersensitivity to the staphylococcal toxin. Blepharitis is common. The lesion is characterised by infiltrate with a clear zone between the lesion and the limbus. The lesion is usually localised to the area of the cornea which is in close contact with the eyelid. Lid swabs usually reveal Staphylococcus aureus but the cornea scrap is sterile. Treatment consists of weak steroids. Lid hygiene and tetracycline can rid the lids of Staphylococcus and prevent recurrence.","quick_fix_ids":[],"source":{"question_pdf_page":110,"question_book_page":99,"answer_pdf_page":111,"answer_book_page":100},"primary_topic":"Cornea & External Eye","tags":["Inflammation","Cornea","Oculoplastics, Lacrimal & Orbit"]},{"id":"FF192","question_number":192,"stem":"In a patient with suspected fungal keratitis, the following stains can be used for identification:","options":["True","False"],"statements":[{"label":"a","text":"haematoxylin and eosin (H&E)","answer":"False","answer_bool":false},{"label":"b","text":"periodic acid schiff (PAS)","answer":"True","answer_bool":true},{"label":"c","text":"methenamine silver","answer":"True","answer_bool":true},{"label":"d","text":"calcofluor white","answer":"True","answer_bool":true},{"label":"e","text":"Giemsa stain.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"The cell wall of the fungus can be identified using PAS, methenamine silver, calcofluor white and Ciemsa stain. Calcofluor white also stains acanthamoeba and Ciemsa also stains chlamydia.","quick_fix_ids":[],"source":{"question_pdf_page":112,"question_book_page":101,"answer_pdf_page":113,"answer_book_page":102},"primary_topic":"Cornea & External Eye","tags":["Infection","Inflammation","Cornea","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF193","question_number":193,"stem":"In a pleomorphic adenoma of the lacrimal gland:","options":["True","False"],"statements":[{"label":"a","text":"the globe is usually displaced inferomedially","answer":"True","answer_bool":true},{"label":"b","text":"the tumour contains ductules of the epithelial cells and fatty tissue","answer":"False","answer_bool":false},{"label":"c","text":"pain is uncommon","answer":"True","answer_bool":true},{"label":"d","text":"CT scan usually reveals an increase in orbital volume","answer":"True","answer_bool":true},{"label":"e","text":"biopsy of the lesion is recommended to exclude malignancy.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"Pleomorphic adenoma is a benign tumour of the lacrimal gland composed of ductules of the epithelial cells and fibrous myxoid stroma. It grows slowly, causing downward and medial displacement of the globe. Orbital bone erosion without destruction is common, resulting in expansion of the orbital volume. Pain is rare unless the tumour undergoes malignant transformation. The treatment of choice is excision without biopsy because of the risk of orbital seeding leading to recurrence and, rarely, malignant transformation.","quick_fix_ids":[],"source":{"question_pdf_page":112,"question_book_page":101,"answer_pdf_page":113,"answer_book_page":102},"primary_topic":"Ocular Oncology & Pathology","tags":["Imaging","Electrophysiology","Orbit","Oncology","Oculoplastics, Lacrimal & Orbit"]},{"id":"FF194","question_number":194,"stem":"Posterior polar cataract:","options":["True","False"],"statements":[{"label":"a","text":"is usually a congenital disorder","answer":"True","answer_bool":true},{"label":"b","text":"involves the cortex and the capsule","answer":"True","answer_bool":true},{"label":"c","text":"causes more visual symptoms than an anterior polar cataract","answer":"True","answer_bool":true},{"label":"d","text":"is associated with a higher incidence of posterior capsule rupture during cataract surgery","answer":"True","answer_bool":true},{"label":"e","text":"is associated with phacodonesis.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c","d"],"explanation":"Posterior polar cataracts involve the cortex and the capsule. It is a congenital disorder and can be sporadic or familial. Visual symptoms are usually more common than anterior polar cataracts because of their location and also their tendency to progress. Posterior capsule rupture is a common complication during cataract surgery. Zonular dialysis is not a feature.","quick_fix_ids":[],"source":{"question_pdf_page":112,"question_book_page":101,"answer_pdf_page":113,"answer_book_page":102},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Genetics","Paediatrics","Cataract","Paediatric Ophthalmology & Genetics"]},{"id":"FF195","question_number":195,"stem":"In aqueous tear deficiency:","options":["True","False"],"statements":[{"label":"a","text":"there is a reduction in the tear meniscus","answer":"True","answer_bool":true},{"label":"b","text":"facial nerve palsy may be a cause","answer":"True","answer_bool":true},{"label":"c","text":"inferior punctate keratopathy is a feature","answer":"True","answer_bool":true},{"label":"d","text":"antihistamine reduces aqueous tear production","answer":"True","answer_bool":true},{"label":"e","text":"tear break up time is decreased.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c","d"],"explanation":"In aqueous tear deficiency, the tear meniscus is reduced and there may be punctate keratopathy of the inferior paracentral region. Facial nerve palsy affects the parasympathetic supply to the lacrimal gland and reduces tear production. Antihistamines, oral contraceptives and atropine can cause dry eyes by reducing aqueous tear production. The tear break up time is usually normal in aqueous tear deficiency.","quick_fix_ids":[],"source":{"question_pdf_page":112,"question_book_page":101,"answer_pdf_page":113,"answer_book_page":102},"primary_topic":"Cornea & External Eye","tags":["Inflammation","Oculoplastics, Lacrimal & Orbit"]},{"id":"FF196","question_number":196,"stem":"In pellucid marginal degeneration:","options":["True","False"],"statements":[{"label":"a","text":"the peripheral inferior cornea is thinned and flattened","answer":"True","answer_bool":true},{"label":"b","text":"with-the-rule astigmatism is common","answer":"False","answer_bool":false},{"label":"c","text":"Munson's sign is a feature","answer":"True","answer_bool":true},{"label":"d","text":"Fleischer's ring is commonly seelll","answer":"False","answer_bool":false},{"label":"e","text":"wedge resection can improve vision.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"Pellucid marginal degeneration is an ectatic condition characterised by thinning and flattening of the peripheral inferior cornea. This gives rise to against-the-rule astigmatism. Munson's sign is a non-specific sign and can occur in any condition which causes protrusion of the cornea. Unlike keratoconus, Fleischer's ring and Vogt's striae are not seen. Wedge resection of the thinned area can improve vision.","quick_fix_ids":["QF013"],"source":{"question_pdf_page":114,"question_book_page":103,"answer_pdf_page":115,"answer_book_page":104},"primary_topic":"Cornea & External Eye","tags":["Surgery","Genetics","Cornea"]},{"id":"FF197","question_number":197,"stem":"In the Herpetic Eye Disease Study:","options":["True","False"],"statements":[{"label":"a","text":"oral acyclovir is effective in preventing recurrence of herpetic keratitis","answer":"True","answer_bool":true},{"label":"b","text":"oral acyclovir is not effective in preventing uveitis","answer":"False","answer_bool":false},{"label":"c","text":"oral acyclovir is effective in preventing stromal keratitis","answer":"True","answer_bool":true},{"label":"d","text":"topical acyclovir is effective in preventing stromal keratitis","answer":"False","answer_bool":false},{"label":"e","text":"topical corticosteroids are safe and effective in stromal keratitis.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"Oral acyclovir is effective in preventing the recurrence of herpetic keratitis and uveitis but not stromal keratitis. Topical corticosteroids are safe and effective in stromal keratitis.","quick_fix_ids":["QF013"],"source":{"question_pdf_page":114,"question_book_page":103,"answer_pdf_page":115,"answer_book_page":104},"primary_topic":"Cornea & External Eye","tags":["Pharmacology","Inflammation","Cornea","Uveitis & Ocular Inflammation","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF198","question_number":198,"stem":"During retinal detachment, the following conditions favour the use of an encircling scleral buckle:","options":["True","False"],"statements":[{"label":"a","text":"posterior breaks","answer":"False","answer_bool":false},{"label":"b","text":"U-shaped tear with 'fish-mouthing'","answer":"False","answer_bool":false},{"label":"c","text":"extensive retinal detachment without detectable breaks","answer":"True","answer_bool":true},{"label":"d","text":"aphakic retinal detachment","answer":"True","answer_bool":true},{"label":"e","text":"lattice degeneration in three or more quadrants.","answer":"True","answer_bool":true}],"correct_labels":["c","d","e"],"explanation":"A radial scleral buckle is preferable in patients with posterior breaks or large U-shaped tears to prevent 'fish-mouthing'. Other indications for encirclage include: multiple breaks in three or more quadrants, mild proliferative vitreoretinopathy, excessive drainage or subretinal fluid.","quick_fix_ids":["QF013"],"source":{"question_pdf_page":114,"question_book_page":103,"answer_pdf_page":115,"answer_book_page":104},"primary_topic":"Retina & Vitreous","tags":["Surgery","Genetics","Retinal detachment"]},{"id":"FF199","question_number":199,"stem":"In Brown's syndrome, the following features are observed:","options":["True","False"],"statements":[{"label":"a","text":"hypotropia of the affected eye","answer":"True","answer_bool":true},{"label":"b","text":"poor elevation in abduction","answer":"False","answer_bool":false},{"label":"c","text":"V pattern","answer":"True","answer_bool":true},{"label":"d","text":"downshoot in adduction","answer":"True","answer_bool":true},{"label":"e","text":"widening of the palpebral fissure in adduction.","answer":"True","answer_bool":true}],"correct_labels":["a","c","d","e"],"explanation":"Brown's syndrome is characterised by defective elevation in adduction. The affected eye may be hypotropic in the primary position. Other features include: V pattern, downshoot in adduction, positive forced duction test and widening of the palpebral fissure in adduction.","quick_fix_ids":["QF013"],"source":{"question_pdf_page":114,"question_book_page":103,"answer_pdf_page":115,"answer_book_page":104},"primary_topic":"Ocular Motility & Strabismus","tags":["Genetics"]},{"id":"FF200","question_number":200,"stem":"A 40-year-old patient presents with a 4-week history of persistent right red eye despite using chloramphenicol eye drops for the past 3 weeks. Further examination may reveal the following:","options":["True","False"],"statements":[{"label":"a","text":"history of facial trauma","answer":"True","answer_bool":true},{"label":"b","text":"delayed fluorescence disappearance test","answer":"True","answer_bool":true},{"label":"c","text":"history of non-specific urethritis","answer":"True","answer_bool":true},{"label":"d","text":"positive conjunctival swab for Haemophilus species","answer":"False","answer_bool":false},{"label":"e","text":"acne rosacea.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"This patient has a chronic conjunctivitis defined as the presence of conjunctivitis for more than 1 week despite treatment. Blockage of the nasolacrimal duct can cause chronic conjunctivitis. Therefore, a history of facial trauma and delayed fluorescence disappearance test are relevant. Non-specific urethritis may be caused by chlamydia which in turn is a cause of chronic follicular conjunctivitis. Acne rosacea is associated with posterior blepharitis which may lead to chronic conjunctivitis. Haemophilus species can cause acute bacterial conjunctivitis which responds to chloramphenicol.","quick_fix_ids":[],"source":{"question_pdf_page":116,"question_book_page":105,"answer_pdf_page":117,"answer_book_page":106},"primary_topic":"Cornea & External Eye","tags":["Infection","Trauma","Oculoplastics, Lacrimal & Orbit"]},{"id":"FF201","question_number":201,"stem":"The following are true about candida endophthalmitis:","options":["True","False"],"statements":[{"label":"a","text":"it occurs exclusively in immunocompromised patients","answer":"False","answer_bool":false},{"label":"b","text":"retinal infiltrates may give rise to Roth spots","answer":"True","answer_bool":true},{"label":"c","text":"a 'string of pearls' appearance occurs with retinal infiltrates","answer":"False","answer_bool":false},{"label":"d","text":"intravenous fluconazole is the preferred treatment rather than amphotericin B","answer":"True","answer_bool":true},{"label":"e","text":"intravitreal amphotericin B is more effective than intravenous amphotericin B.","answer":"True","answer_bool":true}],"correct_labels":["b","d","e"],"explanation":"Candida endophthalmitis occurs in disseminated candidiasis and can occur in immunocompetent patients such as intravenous drug users. The lesion usually begins in the subretinal areas and extends into the retina and the vitreous. Roth spots can occur with retinal infiltrates. Vitreous infiltrate can give rise to a 'string of pearls' appearance. Amphotericin B is highly protein bound and therefore penetrates ocular tissue poorly. Systemic fluconazole is the treatment of choice for ocular endophthalmitis. In severe cases, vitrectomy and intravitreal amphotericin B are effective.","quick_fix_ids":[],"source":{"question_pdf_page":116,"question_book_page":105,"answer_pdf_page":117,"answer_book_page":106},"primary_topic":"Retina & Vitreous","tags":["Pharmacology","Surgery","Infection","Retinal detachment"]},{"id":"FF202","question_number":202,"stem":"In cystoid macular oedema following cataract surgery:","options":["True","False"],"statements":[{"label":"a","text":"the cause is an increased permeability of the perifoveal capillaries","answer":"True","answer_bool":true},{"label":"b","text":"the majority of patients are asymptomatic","answer":"True","answer_bool":true},{"label":"c","text":"a common presentation is poor vision 1 week after cataract extraction","answer":"False","answer_bool":false},{"label":"d","text":"chronic cystoid macular oedema does not respond to treatment","answer":"False","answer_bool":false},{"label":"e","text":"macular grid laser is effective.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"Cystoid macular oedema (CMO) following cataract surgery is caused by increased perifoveal capillary permeability. Fluorescein angiography shows the condition to be common but clinically most patients are asymptomatic. CMO typically occurs 2-6 months after cataract surgery. It is more common in the presence of complications such as a ruptured posterior capsule, lens malposition and chronic uveitis. Topical adrenaline and latanoprost also increase the incidence. In patients with chronic CMO associated with lens malposition or adherence of vitreous to the wound, lens repositioning or exchange and vitrectomy can result in resolution of the oedema. Macular grid laser has not been shown to be effective.","quick_fix_ids":[],"source":{"question_pdf_page":116,"question_book_page":105,"answer_pdf_page":117,"answer_book_page":106},"primary_topic":"Retina & Vitreous","tags":["Pharmacology","Surgery","Laser","Imaging","Inflammation","Macula"]},{"id":"FF203","question_number":203,"stem":"The findings of the United Kingdom Prospective Diabetes Study (UKPDS) include:","options":["True","False"],"statements":[{"label":"a","text":"an improved glucose control reduces the risk of developing retinopathy in type II diabetes","answer":"True","answer_bool":true},{"label":"b","text":"intensive glucose control with either insulin or oral hypoglycaemic drugs can reduce microvascular complications","answer":"True","answer_bool":true},{"label":"c","text":"a decrease in the glycosylated haemoglobin concentration reduces the risk of microvascular complications","answer":"True","answer_bool":true},{"label":"d","text":"tight control of hypertension reduces microvascular complications","answer":"True","answer_bool":true},{"label":"e","text":"an angiotensin-converting enzyme (ACE) inhibitor is better than a j3-blocker in preventing macrovascular complications.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c","d"],"explanation":"The UKPDS is a randomised, prospective clinical trial of type II diabetes. The study shows that intensive control of blood glucose with either insulin or oral hypoglycaemic drugs slows down the progression of retinopathy and other microvascular complications of diabetes. Intensive blood pressure control slows down the progression of retinopathy and reduces the risk of both microvascular and macrovascular complications of diabetes. There are no clinical differences between ACE inhibitors and,B-blockers","quick_fix_ids":[],"source":{"question_pdf_page":116,"question_book_page":105,"answer_pdf_page":117,"answer_book_page":106},"primary_topic":"Systemic Disease & Ocular Associations","tags":["Pharmacology","Diabetes","Retina & Vitreous"]},{"id":"FF204","question_number":204,"stem":"AMPPE (acute multifocal placoid pigment epitheliopathy):","options":["True","False"],"statements":[{"label":"a","text":"is usually a bilateral condition","answer":"True","answer_bool":true},{"label":"b","text":"affects young males more commonly than females","answer":"False","answer_bool":false},{"label":"c","text":"is a self-limiting condition","answer":"True","answer_bool":true},{"label":"d","text":"shows hypofluorescence in the early phase of fluorescein angiography","answer":"True","answer_bool":true},{"label":"e","text":"shows reduced ERG and EOG recordings.","answer":"True","answer_bool":true}],"correct_labels":["a","c","d","e"],"explanation":"First described by Cass in 1968, acute posterior multifocal placoid pigment epitheliopathy (APMPPE) is an acquired inflammatory disorder affecting the retina, retinal pigment epithelium and choroid of otherwise young healthy adults, with equal male to female incidence. The disease is self-limited and is characterised by multiple yellowish-white placoid subretinal lesions of the posterior pole. The lesions are frequently bilateral and in various stages of evolution, typically resolving in weeks to months and leaving circumscribed areas of retinal pigment epithelial disturbance. Fluorescein angiography shows hypofluorescence in the early phase and this is either the result of blockage by the RPE or choroidal ischaemia. Electrophysiology tests show reduced ERG and EOG • recordings.","quick_fix_ids":[],"source":{"question_pdf_page":118,"question_book_page":107,"answer_pdf_page":119,"answer_book_page":108},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Imaging","Electrophysiology","Retinal detachment","Retina & Vitreous"]},{"id":"FF205","question_number":205,"stem":"Pavingstone retinal degeneration:","options":["True","False"],"statements":[{"label":"a","text":"is present in 50% of people over the age of 20","answer":"False","answer_bool":false},{"label":"b","text":"represents areas of ischaemic outer retina","answer":"True","answer_bool":true},{"label":"c","text":"is found mainly in the superior quadrants","answer":"False","answer_bool":false},{"label":"d","text":"does not predispose to retinal breaks","answer":"True","answer_bool":true},{"label":"e","text":"coalesces and gives rise to retinoschisis.","answer":"False","answer_bool":false}],"correct_labels":["b","d"],"explanation":"Pavingstone retinal degeneration represents discrete areas of ischaemia involving the outer retina. It is seen in 22% of patients over the age of 20. It is most commonly located in the inferior retinal quadrant anterior to the equator. It does not give rise to retinal breaks. Retinoschisis is caused by coalescence of peripheral cystoid degeneration.","quick_fix_ids":[],"source":{"question_pdf_page":118,"question_book_page":107,"answer_pdf_page":119,"answer_book_page":108},"primary_topic":"Retina & Vitreous","tags":["Genetics"]},{"id":"FF206","question_number":206,"stem":"Disc drusen:","options":["True","False"],"statements":[{"label":"a","text":"are of similar histology to retinal drusen","answer":"False","answer_bool":false},{"label":"b","text":"become progressively embedded with age","answer":"False","answer_bool":false},{"label":"c","text":"are associated with peripapillary haemorrhage","answer":"True","answer_bool":true},{"label":"d","text":"are associated with angioid streaks","answer":"True","answer_bool":true},{"label":"e","text":"are associated with retinitis pigmentosa.","answer":"True","answer_bool":true}],"correct_labels":["c","d","e"],"explanation":"Disc drusen are of different composition to retinal drusen. With age, the drusen become exposed. They are associated with peripapillary subretinal neovascular membrane formation, angioid streaks and retinitis pigmentosa.","quick_fix_ids":[],"source":{"question_pdf_page":118,"question_book_page":107,"answer_pdf_page":119,"answer_book_page":108},"primary_topic":"Neuro-ophthalmology","tags":["Trauma","Retinal detachment","Retina & Vitreous"]},{"id":"FF207","question_number":207,"stem":"Plus disease in retinopathy of prematurity is characterised by:","options":["True","False"],"statements":[{"label":"a","text":"vitreous haze","answer":"True","answer_bool":true},{"label":"b","text":"lens opacities","answer":"False","answer_bool":false},{"label":"c","text":"pupillary rigidity","answer":"True","answer_bool":true},{"label":"d","text":"corneal haze","answer":"False","answer_bool":false},{"label":"e","text":"tortuosity of retinal vessels.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"Plus disease implies dilation and tortuosity of the blood vessels near the optic nerve. It also includes the growth and dilation of abnormal blood vessels on the surface of the iris, rigidity of the pupil and vitreous haze. The diagnosis of plus disease is usually based on the appearance of the vessels near the optic nerve, as compared with standard retinal photographs. The presence of plus disease suggests a more fulminant or rapidly progressive course.","quick_fix_ids":[],"source":{"question_pdf_page":118,"question_book_page":107,"answer_pdf_page":119,"answer_book_page":108},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Paediatrics","Pupil","Optic nerve","Cornea","Retina & Vitreous","Neuro-ophthalmology"]},{"id":"FF208","question_number":208,"stem":"Common ocular findings in Goldenhar's syndrome include:","options":["True","False"],"statements":[{"label":"a","text":"hypertelorism","answer":"False","answer_bool":false},{"label":"b","text":"eyelid coloboma","answer":"True","answer_bool":true},{"label":"c","text":"optic disc coloboma","answer":"True","answer_bool":true},{"label":"d","text":"microphthalmos","answer":"True","answer_bool":true},{"label":"e","text":"decreased corneal sensation.","answer":"False","answer_bool":false}],"correct_labels":["b","c","d"],"explanation":"Goldenhar's syndrome is also called oculoauriculovertebral dysplasia. Eye signs include Iimbal dermoid, lid coloboma and microphthalmos.","quick_fix_ids":["QF014"],"source":{"question_pdf_page":120,"question_book_page":109,"answer_pdf_page":121,"answer_book_page":110},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Optic nerve","Cornea","Cornea & External Eye"]},{"id":"FF209","question_number":209,"stem":"The following features distinguish optic disc swelling from papilloedema:","options":["True","False"],"statements":[{"label":"a","text":"the presence of relative afferent pupillary defect","answer":"True","answer_bool":true},{"label":"b","text":"normal visual acuity","answer":"False","answer_bool":false},{"label":"c","text":"absence of venous pulsation","answer":"False","answer_bool":false},{"label":"d","text":"leakage of fluorescein from the optic nerve head during fluorescein angiography","answer":"False","answer_bool":false},{"label":"e","text":"an enlarged blind spot.","answer":"False","answer_bool":false}],"correct_labels":["a"],"explanation":"Optic disc swelling causes abnormal optic nerve function with a relative afferent pupillary defect, colour desaturation and decreased visual acuity. Absence of venous pulsation, an enlarged blind spot and leakage of fluorescein from the optic nerve head occur in both optic disc swelling and papilloedema.","quick_fix_ids":["QF014"],"source":{"question_pdf_page":120,"question_book_page":109,"answer_pdf_page":121,"answer_book_page":110},"primary_topic":"Neuro-ophthalmology","tags":["Imaging","Pupil","Optic nerve"]},{"id":"FF210","question_number":210,"stem":"In vernal keratoconjunctivitis:","options":["True","False"],"statements":[{"label":"a","text":"the condition is more common in cold than warm climates","answer":"False","answer_bool":false},{"label":"b","text":"cobblestone appearance of the conjunctiva is seen almost exclusively in the upper tarsal conjunctiva","answer":"True","answer_bool":true},{"label":"c","text":"interpalpebral corneal staining is a feature","answer":"False","answer_bool":false},{"label":"d","text":"a shield ulcer seen in the superior cornea is always surrounded by infiltrates","answer":"False","answer_bool":false},{"label":"e","text":"eye rubbing increases the severity of symptoms.","answer":"True","answer_bool":true}],"correct_labels":["b","e"],"explanation":"Vernal keratoconjunctivitis is more common in warm than cold climates. It is characterised by the presence of conjunctival cobblestones confined almost exclusively to the superior tarsal conjunctiva. Interpalebral corneal staining is a feature of dry eye. Shield ulcers are not associated with corneal infiltration. Eye rubbing can increase the discharge of mast cell mediators and increase the severity of symptoms.","quick_fix_ids":["QF014"],"source":{"question_pdf_page":120,"question_book_page":109,"answer_pdf_page":121,"answer_book_page":110},"primary_topic":"Cornea & External Eye","tags":["Cornea"]},{"id":"FF211","question_number":211,"stem":"The following are indications for temporal clear corneal incision under local anaesthesia:","options":["True","False"],"statements":[{"label":"a","text":"an unco-operative patient","answer":"False","answer_bool":false},{"label":"b","text":"deep sulcus","answer":"True","answer_bool":true},{"label":"c","text":"presence of a superior filtering bleb","answer":"True","answer_bool":true},{"label":"d","text":"with-the-rule astigmatism","answer":"False","answer_bool":false},{"label":"e","text":"small pupil.","answer":"False","answer_bool":false}],"correct_labels":["b","c"],"explanation":"The advantages of a temporal clear corneal incision include less astigmatic changes because the horizontal corneal diameter is longer than the vertical diameter. In addition, it allows easy access to the eye in patients with sunken globes. A superior filtering bleb may be compromised if the phacoemulsification is performed through a superior corneal incision. An unco-operative patient should have general anaesthesia. A temporal incision will worsen with-the-rule astigmatism. The location of the incision site does not affect pupil size.","quick_fix_ids":["QF014"],"source":{"question_pdf_page":120,"question_book_page":109,"answer_pdf_page":121,"answer_book_page":110},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Genetics","Pupil","Cataract","Cornea","Cornea & External Eye"]},{"id":"FF212","question_number":212,"stem":"With regard to cataract surgery in a patient with diabetes mellitus:","options":["True","False"],"statements":[{"label":"a","text":"progression of non-proliferative diabetic retinopathy in the operated eye is a feature","answer":"True","answer_bool":true},{"label":"b","text":"progression of non-proliferative diabetic retinopathy in the non-operated eye is a feature","answer":"False","answer_bool":false},{"label":"c","text":"progression of non-proliferative diabetic retinopathy is more common in women than men","answer":"True","answer_bool":true},{"label":"d","text":"a small capsulorrhexis is preferable to avoid extrusion of the implant","answer":"False","answer_bool":false},{"label":"e","text":"an implant with a large optic is preferable.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"Diabetes mellitus is associated with progression of non-proliferative diabetic retinopathy in the operated eye following cataract surgery. This progression is more common in women, in particular those who are overweight. A large capsulorrhexis and an implant with a large optic are preferable as this would allow better visualisation of the periphery and facilitate pan-photocoagulation.","quick_fix_ids":["QF015"],"source":{"question_pdf_page":122,"question_book_page":111,"answer_pdf_page":123,"answer_book_page":112},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Diabetes","Cataract","Systemic Disease & Ocular Associations","Retina & Vitreous"]},{"id":"FF213","question_number":213,"stem":"The following techniques are useful in repairing a large lower lid defect involving the margin following excision of basal cell carcinoma:","options":["True","False"],"statements":[{"label":"a","text":"Cutler-Beard's procedure","answer":"False","answer_bool":false},{"label":"b","text":"Tenzel flap","answer":"True","answer_bool":true},{"label":"c","text":"Hughes' procedure","answer":"True","answer_bool":true},{"label":"d","text":"Mustarde rotation flap","answer":"True","answer_bool":true},{"label":"e","text":"glabellar flap.","answer":"False","answer_bool":false}],"correct_labels":["b","c","d"],"explanation":"Cutler-Beard's procedure is used in the repair of upper lid defect. A glabellar flap is used for the repair of medial canthal skin defects..••••••.","quick_fix_ids":["QF015"],"source":{"question_pdf_page":122,"question_book_page":111,"answer_pdf_page":123,"answer_book_page":112},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Surgery","Oncology","Ocular Oncology & Pathology"]},{"id":"FF214","question_number":214,"stem":"Meningioma of the orbit:","options":["True","False"],"statements":[{"label":"a","text":"results from intracranial extension in 90% of cases","answer":"True","answer_bool":true},{"label":"b","text":"occurs more commonly in females than males","answer":"True","answer_bool":true},{"label":"c","text":"is associated with neurofibromatosis type I","answer":"True","answer_bool":true},{"label":"d","text":"is more often benign in children than adults","answer":"False","answer_bool":false},{"label":"e","text":"can be treated with chemotherapy.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Only 10% of orbital meningiomas arise within the orbit, the rest result from intracranial extension, usually from the sphenoid bone or the olfactory groove. It is more common in females than males and is associated with neurofibromatosis type I. In children, orbital meningioma tends to be more aggressive with a propensity for intracranial spread. Well-circumscribed meningioma can be excised and the diffuse form treated with radiotherapy. Chemotherapy is not useful.","quick_fix_ids":["QF015"],"source":{"question_pdf_page":122,"question_book_page":111,"answer_pdf_page":123,"answer_book_page":112},"primary_topic":"Ocular Oncology & Pathology","tags":["Paediatrics","Orbit","Oncology","Oculoplastics, Lacrimal & Orbit","Paediatric Ophthalmology & Genetics"]},{"id":"FF215","question_number":215,"stem":"In a 6-month-old child with poor vision, myopic refraction is seen in:","options":["True","False"],"statements":[{"label":"a","text":"gyrate atrophy","answer":"False","answer_bool":false},{"label":"b","text":"Leber's congenital amaurosis","answer":"False","answer_bool":false},{"label":"c","text":"X-linked congenital stationary blindness","answer":"True","answer_bool":true},{"label":"d","text":"blue cone monochromatism","answer":"True","answer_bool":true},{"label":"e","text":"Norrie's disease.","answer":"False","answer_bool":false}],"correct_labels":["c","d"],"explanation":"Gyrate atrophy is associated with myopia but the vision is not affected until adulthood. Leber's congenital amaurosis is associated with. hypermetropic refraction. Myopic shift is a feature of X-linked congenital stationary blindness and blue cone monochromatism.","quick_fix_ids":["QF015"],"source":{"question_pdf_page":122,"question_book_page":111,"answer_pdf_page":123,"answer_book_page":112},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Paediatrics","Neuro-ophthalmology"]},{"id":"FF216","question_number":216,"stem":"Features of de Morsier's syndrome include:","options":["True","False"],"statements":[{"label":"a","text":"optic nerve hypoplasia","answer":"True","answer_bool":true},{"label":"b","text":"nystagmus","answer":"True","answer_bool":true},{"label":"c","text":"growth failure","answer":"True","answer_bool":true},{"label":"d","text":"absent septum callosum","answer":"False","answer_bool":false},{"label":"e","text":"basal encephalocele.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"de Morsier's syndrome or septo-optic dysplasia consists of a triad of optic nerve hypoplasia, nystagmus and growth failure. Neuro-imaging typically shows an absent septum pellucidum and basal encephalocele.","quick_fix_ids":["QF016"],"source":{"question_pdf_page":124,"question_book_page":113,"answer_pdf_page":125,"answer_book_page":114},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Optic nerve","Strabismus","Neuro-ophthalmology","Ocular Motility & Strabismus"]},{"id":"FF217","question_number":217,"stem":"The effects of pregnancy include:","options":["True","False"],"statements":[{"label":"a","text":"enlargement of uveal melanoma","answer":"True","answer_bool":true},{"label":"b","text":"progression of Grave's disease","answer":"True","answer_bool":true},{"label":"c","text":"reduction in the size of prolactinoma","answer":"False","answer_bool":false},{"label":"d","text":"increased incidence of diabetic macular oedema","answer":"True","answer_bool":true},{"label":"e","text":"enlargement of meningioma.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"During pregnancy, uveal melanoma, prolactinoma and meningioma can undergo enlargement. Grave's disease becomes more severe. Diabetic retinopathy of any type tends to progress during pregnancy.","quick_fix_ids":["QF016"],"source":{"question_pdf_page":124,"question_book_page":113,"answer_pdf_page":125,"answer_book_page":114},"primary_topic":"Systemic Disease & Ocular Associations","tags":["Electrophysiology","Diabetes","Macula","Oncology","Ocular Oncology & Pathology","Retina & Vitreous"]},{"id":"FF218","question_number":218,"stem":"Diabetic papillopathy:","options":["True","False"],"statements":[{"label":"a","text":"results from intracranial hypertension","answer":"False","answer_bool":false},{"label":"b","text":"is a feature of poor diabetic control","answer":"False","answer_bool":false},{"label":"c","text":"is associated with optic disc neovascularisation","answer":"False","answer_bool":false},{"label":"d","text":"usually resolves with laser photocoagulation","answer":"False","answer_bool":false},{"label":"e","text":"indicates poor visual prognosis.","answer":"False","answer_bool":false}],"correct_labels":[],"explanation":"Diabetic papillopathy is an uncommon complication of diabetes mellitus. It can occur in young or old patients and in type I or type II diabetes. There is no intracranial hypertension, the swelling may be unilateral or bilateral. Poor diabetic control is not a feature and laser photocoagulation does not help. The swelling may be the result of optic nerve head ischaemia, and telangiectasia may be seen, which can be confused with neovascularisation. The swelling usually resolves spontaneously and the vision is not affected.","quick_fix_ids":["QF016"],"source":{"question_pdf_page":124,"question_book_page":113,"answer_pdf_page":125,"answer_book_page":114},"primary_topic":"Neuro-ophthalmology","tags":["Laser","Diabetes","Optic nerve","Systemic Disease & Ocular Associations"]},{"id":"FF219","question_number":219,"stem":"In superior oblique myokymia:","options":["True","False"],"statements":[{"label":"a","text":"there is repetitive large oscillation of the affected eye","answer":"False","answer_bool":false},{"label":"b","text":"ocular oscillation can be heard with a stethoscope","answer":"True","answer_bool":true},{"label":"c","text":"the oscillation is usually precipitated by reading","answer":"True","answer_bool":true},{"label":"d","text":"there is an association with cerebellar lesion","answer":"False","answer_bool":false},{"label":"e","text":"carbamazepine is useful.","answer":"True","answer_bool":true}],"correct_labels":["b","c","e"],"explanation":"Superior oblique myokymia is a rare disorder characterised by repetitive small amplitude oscillation of the globe. This oscillation may be vertical or oblique. The patient usually complains of diplopia, blurred vision or oscillopsia. The oscillation is best observed with a slit-lamp and can be heard with a stethoscope. It is often precipitated by reading. The condition is benign and a central nervous disorder is uncommon. Carbamazepine can reduce the oscillation.","quick_fix_ids":["QF016"],"source":{"question_pdf_page":124,"question_book_page":113,"answer_pdf_page":125,"answer_book_page":114},"primary_topic":"Ocular Motility & Strabismus","tags":[]},{"id":"FF220","question_number":220,"stem":"The pairing of the following are correct:","options":["True","False"],"statements":[{"label":"a","text":"opsoclonus - pituitary lesion","answer":"False","answer_bool":false},{"label":"b","text":"ocular bobbing - coma","answer":"True","answer_bool":true},{"label":"c","text":"ocular flutter - cerebellar lesion","answer":"True","answer_bool":true},{"label":"d","text":"ocular myoclonus - pontine stroke","answer":"True","answer_bool":true},{"label":"e","text":"spasmus nutan - neuroblastoma.","answer":"False","answer_bool":false}],"correct_labels":["b","c","d"],"explanation":"Opsoclonus is characterised by spontaneous chaotic rapid conjugate bursts of ocular saccades in all directions. In children it may be associated with neuroblastoma. Other associations include occult visceral carcinoma in adults and post-viral encephalitis. Ocular bobbing is characterised by fast downward ocular movements followed by a slow return of the eyes to the primary position. It is seen in comatose patients with major intracranial haemorrhage. Ocular flutter involves to-and-fro horizontal oscillations that occur when the patient attempts to fixate on a: target in the primary position. It is associated with cerebellar lesion. Ocular myoclonus initially resembles ocular bobbing and then becomes more pendular. It is seen in patients with pontine stroke. Spasmus nutan is made up of a triad of nystagmus, involuntary head movement and an abnormal head posture. It usually resolves spontaneously and has no underlying cause.","quick_fix_ids":[],"source":{"question_pdf_page":126,"question_book_page":115,"answer_pdf_page":127,"answer_book_page":116},"primary_topic":"Diagnostics, Pharmacology & Perioperative","tags":["Paediatrics","Infection","Trauma","Strabismus","Oncology","Ocular Motility & Strabismus"]},{"id":"FF221","question_number":221,"stem":"In a patient with a choroidal melanoma, the risk of metastasis is increased in the presence of:","options":["True","False"],"statements":[{"label":"a","text":"epithelioid cell type","answer":"True","answer_bool":true},{"label":"b","text":"an anterior location","answer":"True","answer_bool":true},{"label":"c","text":"involvement of the vortex vein","answer":"True","answer_bool":true},{"label":"d","text":"the tumour extending through the Bruch's membrane","answer":"False","answer_bool":false},{"label":"e","text":"a large tumour.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"The risk of met
