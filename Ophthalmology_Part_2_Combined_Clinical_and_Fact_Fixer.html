s useful in breaking the cyst","answer":"True","answer_bool":true},{"label":"d","text":"injection of 5-fluorouracil is useful","answer":"False","answer_bool":false},{"label":"e","text":"needling is contraindicated due to the risk of developing a persistent non-healing fistula.","answer":"False","answer_bool":false}],"correct_labels":["a","c"],"explanation":"Tenon's cyst results from adhesion between the episclera and Tenon's capsule, causing trapping of the aqueous. It appears as a dome-shaped mass over the operated site. Digital pressure either over it or on the lower globe may break the adhesion. If this fails, needling may be used to break the adhesion. Revision of the bleb or repeat trabeculectomy with antimetabolite agents may be required.","quick_fix_ids":[],"source":{"question_pdf_page":40,"question_book_page":29,"answer_pdf_page":41,"answer_book_page":30},"primary_topic":"Glaucoma","tags":["Surgery","Glaucoma","Cataract","Lens, Cataract & Refractive Surgery"]},{"id":"FF058","question_number":58,"stem":"The following steps can reduce the effect of oculocardiac reflex during operation:","options":["True","False"],"statements":[{"label":"a","text":"peri bulbar anaesthesia","answer":"True","answer_bool":true},{"label":"b","text":"use of suxamethonium","answer":"False","answer_bool":false},{"label":"c","text":"use of atropine","answer":"True","answer_bool":true},{"label":"d","text":"increasing the blood oxygen saturation","answer":"False","answer_bool":false},{"label":"e","text":"using light sedation.","answer":"False","answer_bool":false}],"correct_labels":["a","c"],"explanation":"Oculocardiac reflex occurs during manipulation of the eye, especially the extraocular muscle during strabismus or retinal surgery. Both the heart rate and blood pressure drop when this happens. The use of peribulbar anaesthesia reduces the transmission of nerve impulses from the eye and therefore dampens the reflex. The use of atropine prevents bradycardia and is used to abolish the reflex. Other measures mentioned are ineffective.","quick_fix_ids":[],"source":{"question_pdf_page":40,"question_book_page":29,"answer_pdf_page":41,"answer_book_page":30},"primary_topic":"Ocular Motility & Strabismus","tags":["Surgery","Strabismus","Retina & Vitreous","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF059","question_number":59,"stem":"The following are true about exotropia:","options":["True","False"],"statements":[{"label":"a","text":"intermittent exotropia improves with time in the majority of cases","answer":"False","answer_bool":false},{"label":"b","text":"intermittent exotropia usually present with diplopia","answer":"False","answer_bool":false},{"label":"c","text":"the angle of deviation tends to be larger for distant fixation compared with near fixation","answer":"True","answer_bool":true},{"label":"d","text":"bilateral lateral rectus recession is more effective than resect/recess surgery in basic exotropia","answer":"False","answer_bool":false},{"label":"e","text":"overcorrection of up to 10 prism dioptres prevents recurrence of exotropia.","answer":"True","answer_bool":true}],"correct_labels":["c","e"],"explanation":"Intermittent exotropia seldom resolves spontaneously. The majority of patients present with aesthenopia due to the extra effort needed to hold the two eyes together or due to awareness of the strabismus. Diplopia is not usually noticed because of suppression. Intermittent exotropia tends to have a larger angle of deviation at distant compared with near fixation (basic exotropia). In basic exotropia, resect/recess surgery is the treatment of choice whereas in simulated exotropia, bilateral lateral rectus recession appears to be more effective. Initial overcorrection of up to 10 prism dioptres reduces the incidence of recurrence. The initial esotropia tends to lessen with time.","quick_fix_ids":[],"source":{"question_pdf_page":40,"question_book_page":29,"answer_pdf_page":41,"answer_book_page":30},"primary_topic":"Ocular Motility & Strabismus","tags":["Surgery","Strabismus"]},{"id":"FF060","question_number":60,"stem":"With regard to cataract extraction in eyes with uveitis:","options":["True","False"],"statements":[{"label":"a","text":"prophylactic systemic steroid should be given to all patients with a history of uveitis to avoid post-operative macular oedema","answer":"False","answer_bool":false},{"label":"b","text":"posterior capsule opacification is more common compared with the general population","answer":"True","answer_bool":true},{"label":"c","text":"acrylic implants reduce the risk of giant cell formation on the lens","answer":"True","answer_bool":true},{"label":"d","text":"intraocular lens implant should be avoided in juvenile idiopathic arthritis","answer":"True","answer_bool":true},{"label":"e","text":"a large capsulorrhexis is recommended.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"Prophylactic systemic steroid treatment is only recommended in patients with previous macular oedema caused by the uveitis. Post-operative uveitis and posterior capsule opacification are more common compared with the general population. To prevent deposits of materials on the lens, either an acrylic- or heparin-coated lens may be used. Lens implant in juvenile idiopathic arthritis is associated with fibrovascular proliferation over the lens and risk of phthisis bulbi. A large capsulorrhexis reduces the incidence of synechiae between the iris and the lens capsule.","quick_fix_ids":[],"source":{"question_pdf_page":40,"question_book_page":29,"answer_pdf_page":41,"answer_book_page":30},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Surgery","Genetics","Inflammation","Macula","Cataract","Lens, Cataract & Refractive Surgery"]},{"id":"FF061","question_number":61,"stem":"The following are true about the development of orbital emphysema following orbital injury:","options":["True","False"],"statements":[{"label":"a","text":"it is most often seen in orbital floor fracture","answer":"False","answer_bool":false},{"label":"b","text":"prophylactic antibiotic is needed to prevent orbital cellulitis","answer":"True","answer_bool":true},{"label":"c","text":"CT scan can usually identify the location","answer":"False","answer_bool":false},{"label":"d","text":"infraorbital nerve anaesthesia is a feature","answer":"False","answer_bool":false},{"label":"e","text":"repair is needed in about 50% of cases.","answer":"False","answer_bool":false}],"correct_labels":["b"],"explanation":"Orbital emphysema usually results from medial wall fractures such that sneezing or nose-blowing forces air from the paranasal sinuses into the orbital tissue. Prophylactic antibiotic prevents orbital cellulitis. The fracture is often small and difficult to locate even with a CT scan. The majority of cases resolve spontaneously and surgery is rarely required. Infraorbital nerve anaesthesia is a feature of orbital floor fractures.","quick_fix_ids":[],"source":{"question_pdf_page":42,"question_book_page":31,"answer_pdf_page":43,"answer_book_page":32},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Surgery","Imaging","Trauma","Orbit","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF062","question_number":62,"stem":"The following are true about lattice degeneration:","options":["True","False"],"statements":[{"label":"a","text":"it is found in 8% of the general population","answer":"True","answer_bool":true},{"label":"b","text":"the vitreous over the lesion is firmly attached to the retina","answer":"False","answer_bool":false},{"label":"c","text":"atrophic holes within the lattice degeneration are the most common cause of retinal detachment","answer":"False","answer_bool":false},{"label":"d","text":"about 50% of patients with retinal detachment have lattice degeneration","answer":"True","answer_bool":true},{"label":"e","text":"sclerosed blood vessels occur within the lattice degeneration.","answer":"True","answer_bool":true}],"correct_labels":["a","d","e"],"explanation":"Lattice degeneration occurs in 8% of the population but only a small minority of these patients develop retinal detachment. However, it is found in 50% of patients with retinal detachment. The cause of detachment is usually due to a retinal tear surrounding the lattice degeneration, where the vitreous is firmly attached to the retina. Over the lesion, the vitreous is typically liquefied. Pigmentation and sclerosed vessels are common features within the lesion.","quick_fix_ids":[],"source":{"question_pdf_page":42,"question_book_page":31,"answer_pdf_page":43,"answer_book_page":32},"primary_topic":"Retina & Vitreous","tags":["Genetics","Retinal detachment"]},{"id":"FF063","question_number":63,"stem":"The following are true about strabismus surgery:","options":["True","False"],"statements":[{"label":"a","text":"during a resect/recess operation, resection should be performed before recession","answer":"False","answer_bool":false},{"label":"b","text":"operating on the medial rectus has a more significant effect on the amount of strabismus correction compared with the lateral rectus","answer":"True","answer_bool":true},{"label":"c","text":"a combined resect/recess operation has a greater effect than if the two procedures are carried out on separate occasions","answer":"True","answer_bool":true},{"label":"d","text":"adjustable suture should be avoided in inferior rectus surgery","answer":"True","answer_bool":true},{"label":"e","text":"resection of the superior rectus is associated with lid retraction.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"Resection involves cutting and shortening of the muscle, whereas recession involves moving the muscle insertion to a more posterior position. Recession is reversible, whereas resection is not; therefore, recession should always be performed before resection in case of iatrogenic mishaps such as erroneous identification of the muscle. The medial rectus is stronger than the lateral rectus and, therefore, operation on this muscle has a greater effect. The inferior rectus muscle has a tendency to slip into the orbit when detached -therefore, adjustable sutures are not recommended. Superior rectus resection can cause upper lid retraction.","quick_fix_ids":[],"source":{"question_pdf_page":42,"question_book_page":31,"answer_pdf_page":43,"answer_book_page":32},"primary_topic":"Ocular Motility & Strabismus","tags":["Surgery","Orbit","Strabismus"]},{"id":"FF064","question_number":64,"stem":"The findings of the following are in favour of neurogenic rather than mechanical muscle palsy:","options":["True","False"],"statements":[{"label":"a","text":"duction of the affected eye results in more movement than version","answer":"True","answer_bool":true},{"label":"b","text":"Hess chart of the affected eye is smaller","answer":"False","answer_bool":false},{"label":"c","text":"the intraocular pressure is normal in all directions of gaze","answer":"True","answer_bool":true},{"label":"d","text":"the absence of retraction of the globe","answer":"True","answer_bool":true},{"label":"e","text":"abnormal head posture may be adopted to reduce diplopia.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"Duction refers to movement of one eye, whereas version refers to conjugate movement of both eyes. Because of Hering's law of equal innervation, conjugate eye movement of the affected eye is less than duction. Hess charts in both cases are reduced - however, in a neurogenic palsy, there is proportional spacing between the inner and the outer fields. Intraocular pressures are elevated in a mechanical muscle palsy when the patient looks away from the site of the mechanical lesion. Globe retraction occurs in a mechanical palsy when the patient looks away from the site of the lesion. Abnormal head posture may be adopted in both conditions.","quick_fix_ids":[],"source":{"question_pdf_page":42,"question_book_page":31,"answer_pdf_page":43,"answer_book_page":32},"primary_topic":"Ocular Motility & Strabismus","tags":["Glaucoma"]},{"id":"FF065","question_number":65,"stem":"The following are true about myelinated nerve fibres in the eye:","options":["True","False"],"statements":[{"label":"a","text":"myelination of the optic tract begins at the optic nerve head before birth","answer":"False","answer_bool":false},{"label":"b","text":"myelination is produced by astrocytes","answer":"False","answer_bool":false},{"label":"c","text":"it is more common in males than females","answer":"True","answer_bool":true},{"label":"d","text":"it has no visual consequence","answer":"False","answer_bool":false},{"label":"e","text":"spontaneous disappearance occurs in multiple sclerosis.","answer":"True","answer_bool":true}],"correct_labels":["c","e"],"explanation":"Myelination of the optic tract begins at the lateral geniculate body and is produced by the oligodendrocytes. The incidence is about 0.3% and affects males more than females. It is associated with amblyopia and myopia. In multiple sclerosis, demyelination occurs and may cause spontaneous resolution of the condition.","quick_fix_ids":[],"source":{"question_pdf_page":44,"question_book_page":33,"answer_pdf_page":45,"answer_book_page":34},"primary_topic":"Retina & Vitreous","tags":["Optic nerve"]},{"id":"FF066","question_number":66,"stem":"In retinal detachment caused by retinal dialysis:","options":["True","False"],"statements":[{"label":"a","text":"trauma is the major cause","answer":"True","answer_bool":true},{"label":"b","text":"the most common site is the inferotemporal region","answer":"True","answer_bool":true},{"label":"c","text":"folding of the posterior edge of the retinal dialysis is common","answer":"False","answer_bool":false},{"label":"d","text":"the prognosis is poorer than for the patient with retinal detachment caused by retinal tear","answer":"False","answer_bool":false},{"label":"e","text":"high scleral buckling is essential for successful closure of retinal dialysis.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"The most common cause of retinal dialysis is trauma. The most common site is the inferotemporal region followed by the superonasal region. The posterior edge of the retinal dialysis remains attached to the vitreous base, which prevents it from curling over, unlike a giant retinal tear. Compared with retinal detachment, the prognosis for retinal dialysis is good. High buckling should be avoided during the operation as this would cause fish-mouthing and prevent closure.","quick_fix_ids":[],"source":{"question_pdf_page":44,"question_book_page":33,"answer_pdf_page":45,"answer_book_page":34},"primary_topic":"Retina & Vitreous","tags":["Trauma","Retinal detachment"]},{"id":"FF067","question_number":67,"stem":"The following are true about diabetic retinopathy:","options":["True","False"],"statements":[{"label":"a","text":"diabetic retinopathy is rare before the onset of puberty","answer":"True","answer_bool":true},{"label":"b","text":"the severity of diabetic retinopathy is related to the control of diabetes mellitus","answer":"True","answer_bool":true},{"label":"c","text":"the probability of progression from pre-proliferative to proliferative diabetic retinopathy is 50% over a 2-year period","answer":"True","answer_bool":true},{"label":"d","text":"the major cause of visual loss in diabetic retinopathy is vitreous haemorrhage","answer":"False","answer_bool":false},{"label":"e","text":"aspirin is useful in delaying the progression of diabetic retinopathy.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Diabetic retinopathy occurs in 50% of patients with diabetes mellitus who have had the disease for more than 7 years. The Diabetic Control and Complications Trial shows that good diabetic control significantly reduces the incidence of diabetic retinopathy. While the visual loss from vitreous haemorrhage is often profound, the major cause of visual loss in diabetic retinopathy is macular oedema. The Early Treatment of Diabetic Retinopathy Study shows that aspirin has no effect on either non-proliferative or proliferative diabetic retinopathy.","quick_fix_ids":[],"source":{"question_pdf_page":44,"question_book_page":33,"answer_pdf_page":45,"answer_book_page":34},"primary_topic":"Retina & Vitreous","tags":["Diabetes","Trauma","Macula","Systemic Disease & Ocular Associations"]},{"id":"FF068","question_number":68,"stem":"The following are true about retinopathy of prematurity:","options":["True","False"],"statements":[{"label":"a","text":"screening should be performed for all babies born with a weight of less than 1500g or less than 31 weeks of gestational age","answer":"True","answer_bool":true},{"label":"b","text":"retinopathy of prematurity typically occurs at about 4 weeks after delivery","answer":"False","answer_bool":false},{"label":"c","text":"rush disease refers to the presence of vitreous cells and tortuous blood vessels","answer":"False","answer_bool":false},{"label":"d","text":"threshold disease is determined by the stage as well as the zone of the disease","answer":"True","answer_bool":true},{"label":"e","text":"increased kappa angle is seen in patients with cicatricial stage of the disease.","answer":"True","answer_bool":true}],"correct_labels":["a","d","e"],"explanation":"Risk factors for retinopathy of prematurity (ROP) are low birth weight «1500g) and early gestational age «31 weeks). ROP typically occurs 6 to 8 weeks after delivery and is estimated to occur in about 5% of all premature babies. Rush disease refers to rapid progression of ROP, whereas plus disease refers to the presence of vitreous cells and tortuous blood vessels. Threshold disease is defined as stage 3 ROP with 5 or more contiguous, or 8 or more interrupted, clock hours in the presence of plus disease in zone I or II. Increased kappa angle occurs in cicatricial stages of the disease, with dragged disc causing the fovea to be displaced laterally.","quick_fix_ids":[],"source":{"question_pdf_page":44,"question_book_page":33,"answer_pdf_page":45,"answer_book_page":34},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Paediatrics","Retina & Vitreous"]},{"id":"FF069","question_number":69,"stem":"The following features favour a diagnosis of choroidal melanoma rather than naevus:","options":["True","False"],"statements":[{"label":"a","text":"a height of more than 3mm on ultrasound","answer":"True","answer_bool":true},{"label":"b","text":"high internal reflectivity on A-scan","answer":"False","answer_bool":false},{"label":"c","text":"presence of drusen on the surface","answer":"False","answer_bool":false},{"label":"d","text":"visual field defects","answer":"True","answer_bool":true},{"label":"e","text":"presence of choroidal neovascular membrane.","answer":"False","answer_bool":false}],"correct_labels":["a","d"],"explanation":"The most important differential diagnosis of choroidal melanoma is the choroidal naevus. There are certain features that favour the diagnosis of choroidal melanoma and these include:\n\n• a height of more than 3mm • overlying orange pigment in the retinal pigment epithelium (lipofuscin) as compared to drusen in choroidal naevi • presence of subretinal fluid • high internal reflectivity on A-scan • visual field defect.\n\nChoroidal neovascular membrane can occur in both conditions and are of little use in differentiation.","quick_fix_ids":[],"source":{"question_pdf_page":46,"question_book_page":35,"answer_pdf_page":47,"answer_book_page":36},"primary_topic":"Ocular Oncology & Pathology","tags":["Imaging","Visual field","Retinal detachment","Oncology","Retina & Vitreous","Neuro-ophthalmology"]},{"id":"FF070","question_number":70,"stem":"The following are true about central retinal vein occlusion:","options":["True","False"],"statements":[{"label":"a","text":"haematological disorders are more common in patients less than 60 years of age than those over 60 years of age","answer":"True","answer_bool":true},{"label":"b","text":"the prognosis for younger patients is better than for older patients","answer":"True","answer_bool":true},{"label":"c","text":"the Central Retinal Vein Occlusion Study (CRVOS) shows that aspirin can prevent recurrence in the affected eye or involvement of the fellow eye","answer":"False","answer_bool":false},{"label":"d","text":"the Central Vein Occlusion Study shows clear benefit of prophylactic laser treatment in ischaemic eyes","answer":"False","answer_bool":false},{"label":"e","text":"grid laser photocoagulation is useful in the presence of macular oedema with a visual acuity of 6/18.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"In central retinal vein occlusion, haematological disorders such as protein S or C deficiency are more commonly detected in patients under the age of 60. Compared with the older age group, the visual prognosis for younger patients is better. The Central Retinal Vein Occlusion Study shows no distinct advantage of prophylactic laser treatment in ischaemic eyes provided the patients can be followed up regularly for the development of neovascularisation. The effect of aspirin was not considered in this study. Grid photocoagulation in macular oedema with a visual acuity of 6/18 has not been found to be useful in this study.","quick_fix_ids":[],"source":{"question_pdf_page":46,"question_book_page":35,"answer_pdf_page":47,"answer_book_page":36},"primary_topic":"Retina & Vitreous","tags":["Laser","Macula"]},{"id":"FF071","question_number":71,"stem":"The following are true about the management of branch retinal vein occlusion:","options":["True","False"],"statements":[{"label":"a","text":"laser treatment should be carried out within 3 months from the onset of the event to be effective","answer":"False","answer_bool":false},{"label":"b","text":"clinical diagnosis is usually sufficient to decide on the advantage of laser treatment in a patient with macular oedema","answer":"False","answer_bool":false},{"label":"c","text":"patients with hypertension are unlikely to benefit from laser treatment","answer":"False","answer_bool":false},{"label":"d","text":"if the vision is less than 6/60, macular laser is unlikely to be beneficial","answer":"True","answer_bool":true},{"label":"e","text":"laser treatment should be carried out in the presence of retinal non-perfusion of 5 disc diameter or more, based on the fluorescein angiography.","answer":"False","answer_bool":false}],"correct_labels":["d"],"explanation":"Based on the findings of the Branch Retinal Vein Occlusion Study Group, laser treatment is useful in macular oedema secondary to branch retinal vein occlusion if: first, the foveal vasculature is intact and, second, the vision is between 6/12 and 6/60. Fluorescein angiography is essential in identifying patients who would benefit from laser treatment. Laser treatment should also be delayed until 3 to 6 months after the event to allow for spontaneous resolution of oedema and intraretinal haemorrhages. While retinal non-perfusion of 5 disc diameter or more increases the risk of peripheral neovascularisation, laser need not be performed provided the patients can be followed up at regular intervals.","quick_fix_ids":[],"source":{"question_pdf_page":46,"question_book_page":35,"answer_pdf_page":47,"answer_book_page":36},"primary_topic":"Retina & Vitreous","tags":["Laser","Imaging","Trauma","Macula"]},{"id":"FF072","question_number":72,"stem":"In the management of cytomegalovirus (CMV) retinitis with HAART (highly active anti-retroviral therapy):","options":["True","False"],"statements":[{"label":"a","text":"HAART compresses steroids and gancyclovir","answer":"False","answer_bool":false},{"label":"b","text":"HAART improves the survival rate of AIDS patients with CMV retinitis","answer":"True","answer_bool":true},{"label":"c","text":"CMV virus is eradicated","answer":"False","answer_bool":false},{"label":"d","text":"the risk of opportunistic infection is reduced","answer":"True","answer_bool":true},{"label":"e","text":"severe vitritis is a complication.","answer":"True","answer_bool":true}],"correct_labels":["b","d","e"],"explanation":"HAART involves the combination of anti-retroviral drugs such as nucleoside reverse transcriptase inhibitors (nucleosides), non-nucleoside reverse transcriptase inhibitors (NNRTI) and protease inhibitors (PI). It has been shown to improve the survival rate of AIDS patients with CMV retinitis. During + treatment, the CD4 T lymphocytes are increased and the risk of opportunistic infection is reduced. In addition, the time interval between relapses of CMV retinitis is increased. However, the CMV virus is not eradicated but merely suppressed. One of the commonly encountered complications of HAART is severe vitritis, thought to be caused by the restored T lymphocytes which act against the CMV virus. Vitritis can lead to cystoid macular oedema, which impairs the patient's vision.","quick_fix_ids":[],"source":{"question_pdf_page":48,"question_book_page":37,"answer_pdf_page":49,"answer_book_page":38},"primary_topic":"Retina & Vitreous","tags":["Pharmacology","Infection","Macula","Uveitis & Ocular Inflammation"]},{"id":"FF073","question_number":73,"stem":"The following are the guidelines based on the Diabetic Retinopathy Study (DRS):","options":["True","False"],"statements":[{"label":"a","text":"immediate laser treatment should be administered to eyes with optic disc neovascularisation, irrespective of size","answer":"False","answer_bool":false},{"label":"b","text":"immediate laser treatment should be administered to all pregnant women with severe non-proliferative diabetic retinopathy","answer":"False","answer_bool":false},{"label":"c","text":"pan-retinal photocoagulation should be administered in one session for maximal effect","answer":"False","answer_bool":false},{"label":"d","text":"retinal neovascularisation should never be lasered directly","answer":"False","answer_bool":false},{"label":"e","text":"argon laser is more effective than diode laser in retinal pan-photocoagulation.","answer":"False","answer_bool":false}],"correct_labels":[],"explanation":"The guidelines based on the DRS are as follows. • Immediate laser treatment should be given to an eye with optic disc neovascularisation which is associated with retinal or vitreous haemorrhage, and in the absence of the latter when the extent of disc neovascularisation is at least one-quarter to one-third disc area. • Laser treatment is also recommended for neovascularisation elsewhere which is at least one-half disc area in extent with pre-retinal or vitreous haemorrhage. • Pan-photocoagulation should be divided into several sessions in close succession rather than in a single visit, to prevent complications such as macular oedema. • Direct laser can be applied to flat neovascularisation elsewhere but not to disc vessels or vessels elsewhere which are elevated.","quick_fix_ids":[],"source":{"question_pdf_page":48,"question_book_page":37,"answer_pdf_page":49,"answer_book_page":38},"primary_topic":"Retina & Vitreous","tags":["Laser","Diabetes","Trauma","Optic nerve","Macula","Neuro-ophthalmology"]},{"id":"FF074","question_number":74,"stem":"The following are true for the phakomatoses and the location of their abnormal gene:","options":["True","False"],"statements":[{"label":"a","text":"type I neurofibromatosis -chromosome 21","answer":"False","answer_bool":false},{"label":"b","text":"tuberous sclerosis - chromosome 9","answer":"True","answer_bool":true},{"label":"c","text":"von Hippel-Lindau's syndrome -chromosome 3","answer":"True","answer_bool":true},{"label":"d","text":"ataxic telangiectasia -chromosome 13","answer":"True","answer_bool":true},{"label":"e","text":"Wyburn-Mason syndrome -X chromosome.","answer":"False","answer_bool":false}],"correct_labels":["b","c","d"],"explanation":"There are nine conditions classified under phakomatoses and their genetic loci are as follows: • neurofibromatosis type I -autosomal dominant -chromosome 17 • type II - autosomal dominant -chromosome 22 • tuberous sclerosis - autosomal dominant - chromosome 9 • Sturge-Weber's syndrome -sporadic • von Hippel-Lindau's syndrome -autosomal dominant -chromosome 3 • Louis-Bar syndrome-autosomal recessive - chromosome 11 • Wyburn-Mason syndrome -sporadic • Klippel-Trenaunay-Weber syndrome - autosomal dominant - chromosome unknown • cutis marmarata telangiectasia congenita - sporadic.","quick_fix_ids":[],"source":{"question_pdf_page":48,"question_book_page":37,"answer_pdf_page":49,"answer_book_page":38},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Systemic Disease & Ocular Associations"]},{"id":"FF075","question_number":75,"stem":"The following are true about systemic drugs used in the treatment of glaucoma:","options":["True","False"],"statements":[{"label":"a","text":"acetazolamide causes tachypnoea","answer":"True","answer_bool":true},{"label":"b","text":"acetazolamide should be avoided in patients with hepatic failure","answer":"True","answer_bool":true},{"label":"c","text":"mannitol should be warmed to room temperature before intravenous administration to avoid formation of crystals","answer":"True","answer_bool":true},{"label":"d","text":"glycerol is administered by rapid intravenous infusion","answer":"False","answer_bool":false},{"label":"e","text":"glycerol is more effective than mannitol in lowering intraocular pressure.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Acetazolamide causes metabolic acidosis which in turn causes tachypnoea. It should be avoided in patients with renal or hepatic failure as it can cause fatal acid-base imbalance. Mannitol is an effective osmotic diuresis and more effective than glycerol in lowering the intraocular pressure. Glycerol should not be given intravenously as it causes severe vasoconstriction of the afferent glomerular arterioles and resultant haematuria.","quick_fix_ids":[],"source":{"question_pdf_page":50,"question_book_page":39,"answer_pdf_page":51,"answer_book_page":40},"primary_topic":"Glaucoma","tags":["Pharmacology","Glaucoma","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF076","question_number":76,"stem":"The following are true about macular holes:","options":["True","False"],"statements":[{"label":"a","text":"epiretinal membrane is commonly associated with macular hole","answer":"False","answer_bool":false},{"label":"b","text":"only half of stage 1 macular holes progress","answer":"True","answer_bool":true},{"label":"c","text":"Watzke-Allen's sign is positive in stage 1 macular hole","answer":"False","answer_bool":false},{"label":"d","text":"posterior vitreous detachment occurs in stage 3 macular hole","answer":"False","answer_bool":false},{"label":"e","text":"following successful macular hole surgery, cataract is a common cause of poor vision.","answer":"True","answer_bool":true}],"correct_labels":["b","e"],"explanation":"Epiretinal membrane can give rise to pseudo hole and is not a feature of idiopathic macular hole. About 50% of stage 1 macular holes progress. Watzke-Allen's sign, in which a break in the slit beam is observed, occurs in full-thickness hole, usually at stage 3 and 4. Posterior vitreous detachment occurs in stage 4. Cataract is a common complication of vitrectomy and a significant cause of poor vision following macular hole surgery.","quick_fix_ids":[],"source":{"question_pdf_page":50,"question_book_page":39,"answer_pdf_page":51,"answer_book_page":40},"primary_topic":"Retina & Vitreous","tags":["Surgery","Macula","Cataract","Lens, Cataract & Refractive Surgery"]},{"id":"FF077","question_number":77,"stem":"With regard to central serous retinopathy:","options":["True","False"],"statements":[{"label":"a","text":"it is associated with the use of inhaled steroid","answer":"True","answer_bool":true},{"label":"b","text":"90% show classical smoke stack appearance on fluorescein angiography","answer":"False","answer_bool":false},{"label":"c","text":"optic disc pit is present in 25% of cases","answer":"False","answer_bool":false},{"label":"d","text":"laser photocoagulation reduces the incidence of recurrence","answer":"False","answer_bool":false},{"label":"e","text":"laser photocoagulation increases the risk of choroidal neovascularisation.","answer":"True","answer_bool":true}],"correct_labels":["a","e"],"explanation":"Central serous retinopathy gives rise to sensory retinal detachment due to an abnormality of the retinal pigment epithelium. The cause is unknown. It is more common in males than in females and is associated with a type A personality. Systemic and inhaled steroids have also been implicated. While a smoke stack is a classical picture in fluorescein angiography of this condition, it is seen in only 10% of cases. The rest give an ink blot appearance. Laser photocoagulation can speed up recovery but does not prevent recurrence. There is a small risk (2%) of inducing choroidal neovascularisation with laser.","quick_fix_ids":[],"source":{"question_pdf_page":50,"question_book_page":39,"answer_pdf_page":51,"answer_book_page":40},"primary_topic":"Retina & Vitreous","tags":["Laser","Imaging","Optic nerve","Retinal detachment"]},{"id":"FF078","question_number":78,"stem":"In the following conditions, there is reduction of ERG b-wave amplitude as compared to the a-wave:","options":["True","False"],"statements":[{"label":"a","text":"siderosis","answer":"True","answer_bool":true},{"label":"b","text":"Best's disease","answer":"False","answer_bool":false},{"label":"c","text":"central retinal vein occlusion","answer":"True","answer_bool":true},{"label":"d","text":"vigabatrin toxicity","answer":"True","answer_bool":true},{"label":"e","text":"cancer-associated retinopathy.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"Reduction of b-wave with relative normal a-wave occurs in disorders that result in a diffuse degeneration or dysfunction of cells in the inner nuclear layer (Muller or bipolar cells). Best's disease typically shows abnormal EOG and cancer-associated retinopathy causes generalised reduction of a- and b-waves.","quick_fix_ids":[],"source":{"question_pdf_page":50,"question_book_page":39,"answer_pdf_page":51,"answer_book_page":40},"primary_topic":"Retina & Vitreous","tags":["Pharmacology","Electrophysiology","Genetics"]},{"id":"FF079","question_number":79,"stem":"The following are true about the visual evoked potential (VEP):","options":["True","False"],"statements":[{"label":"a","text":"it is abnormal in patients with poor vision due to age-related macular degeneration","answer":"True","answer_bool":true},{"label":"b","text":"delayed P100 latency with normal visual acuity is a feature of recovered optic neuritis","answer":"True","answer_bool":true},{"label":"c","text":"it is useful in detecting early glaucomatous changes","answer":"False","answer_bool":false},{"label":"d","text":"the use of miotics can affect the result","answer":"True","answer_bool":true},{"label":"e","text":"ischaemic optic neuropathy causes a decrease in VEP amplitude in the presence of normal latency.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"Visual evoked potential (VEP) is a cortical response to pattern or flash stimuli. The two parameters analysed are the latency and the amplitude. A delayed latency of pattern VEP is suggestive of a demyelination process. The amplitude of pattern VEP is useful, especially in children because it correlates well with visual acuity. Patients with abnormal visual acuity such as age-related macular degeneration will have abnormal VEPs. VEPs are not useful for visual field defects. In miotic pupils, the amount of retinal illumination is reduced and this can give rise to delayed latency. Therefore, it is important to standardise the testing conditions.","quick_fix_ids":[],"source":{"question_pdf_page":52,"question_book_page":41,"answer_pdf_page":53,"answer_book_page":42},"primary_topic":"Neuro-ophthalmology","tags":["Electrophysiology","Genetics","Paediatrics","Pupil","Optic nerve","Visual field"]},{"id":"FF080","question_number":80,"stem":"In albinism:","options":["True","False"],"statements":[{"label":"a","text":"the number of melanocytes is usually normal","answer":"True","answer_bool":true},{"label":"b","text":"visual acuity is better in tyrosine-positive than tyrosine-negative oculocutaneous albinism","answer":"True","answer_bool":true},{"label":"c","text":"visual evoked potential is always abnormal","answer":"True","answer_bool":true},{"label":"d","text":"bleeding diathesis due to poor platelet aggregation is a feature of Hermansky-Pudlak syndrome","answer":"True","answer_bool":true},{"label":"e","text":"recurrent pyogenic infection is a feature in Chediak-Higashi syndrome.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","d","e"],"explanation":"Albinism is a group of genetic disorders with hypopigmentation of the eye, skin and hair (oculocutaneous type) or the eye only (ocular type). The oculocutaneous type is inherited in an autosomal recessive fashion, and the ocular type in an X-linked fashion. Patients with pigment production, i.e. tyrosine-positive type, tend to have better vision. Visual evoked potential is abnormal and there is increased decussation of the optic nerve. Two types of syndromes have been described for oculocutaneous albinism: • Chediak-Higashi syndrome: recurrent pyogenic infection and bleeding diathesis • Hermansky-Pudlak syndrome: bleeding diatheses, pulmonary fibrosis, inflammatory bowel disease, renal failure and cardiomyopathy.\n\nThe bleeding diathesis in Hermansky-Pudlak syndrome is due to abnormal aggregation of platelets.","quick_fix_ids":[],"source":{"question_pdf_page":52,"question_book_page":41,"answer_pdf_page":53,"answer_book_page":42},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Electrophysiology","Genetics","Infection","Optic nerve","Systemic Disease & Ocular Associations","Neuro-ophthalmology"]},{"id":"FF081","question_number":81,"stem":"In pseudoexfoliation syndrome:","options":["True","False"],"statements":[{"label":"a","text":"deposition of pigment in the trabecular meshwork often precedes the appearance of dandruff-like material on the lens","answer":"True","answer_bool":true},{"label":"b","text":"pupil dilatation is usually poor with mydriatics","answer":"True","answer_bool":true},{"label":"c","text":"peripheral transillumination is a common feature","answer":"False","answer_bool":false},{"label":"d","text":"chronic open angle glaucoma occurs in about 50% of cases","answer":"True","answer_bool":true},{"label":"e","text":"raised intraocular pressure should always be treated, irrespective of visual field loss.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"Pseudoexfoliation syndrome is an important cause of secondary open-angle glaucoma. Although the appearance of dandruff-like material is characteristic of this condition, the earliest sign is the deposition of pigment in the trabecular meshwork, lens and iris. Pupil dilatation is poor and cataract extraction may be difficult. Complications of cataract surgery are also increased due to weakened zonules, which can lead to zonulysis and vitreous loss. In about 50% of patients, chronic open angle glaucoma occurs. Intraocular pressures are often unstable and can lead to severe glaucoma. Therefore, any evidence of raised intraocular pressure should be treated early.","quick_fix_ids":[],"source":{"question_pdf_page":52,"question_book_page":41,"answer_pdf_page":53,"answer_book_page":42},"primary_topic":"Glaucoma","tags":["Surgery","Genetics","Pupil","Visual field","Glaucoma","Cataract"]},{"id":"FF082","question_number":82,"stem":"In progressive outer retinal necrosis (PORN):","options":["True","False"],"statements":[{"label":"a","text":"the disease is preceded by ophthalmic shingles in the majority of patients","answer":"False","answer_bool":false},{"label":"b","text":"this condition is found almost exclusively in AIDS patients","answer":"True","answer_bool":true},{"label":"c","text":"involvement of the macula occurs early in the course of the disease","answer":"True","answer_bool":true},{"label":"d","text":"vitritis is usually severe","answer":"False","answer_bool":false},{"label":"e","text":"intravenous acyclovir is usually effective in controlling the disease.","answer":"False","answer_bool":false}],"correct_labels":["b","c"],"explanation":"PORN is caused by the varicella zoster virus, resulting in inflammation of the outer retina. Preceding ophthalmic shingles is not common. The disease has only been described in AIDS patients. Clinically, there is early involvement of the macula with little or no vitritis. Antiviral treatment, including acyclovir, has not been effective and severe visual loss is common.","quick_fix_ids":["QF009"],"source":{"question_pdf_page":54,"question_book_page":43,"answer_pdf_page":55,"answer_book_page":44},"primary_topic":"Retina & Vitreous","tags":["Infection","Inflammation","Macula","Uveitis & Ocular Inflammation"]},{"id":"FF083","question_number":83,"stem":"In a child who presents with leukocoria, the following features are in favour of retinoblastoma rather than toxocariasis:","options":["True","False"],"statements":[{"label":"a","text":"involvement of both eyes","answer":"True","answer_bool":true},{"label":"b","text":"presence of calcification","answer":"True","answer_bool":true},{"label":"c","text":"age of less than 2 years","answer":"True","answer_bool":true},{"label":"d","text":"presence of hypopyon","answer":"False","answer_bool":false},{"label":"e","text":"male sex.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Retinoblastoma can be bilateral, whereas toxocariasis has not been reported to affect both eyes. Calcification of the lesion is typically seen in retinoblastoma. Toxocariasis is acquired from ingestion of ova and tends to occur in older patients. Hypopyon from severe inflammation can occur in both diseases. There is no gender predilection for either condition.","quick_fix_ids":["QF009"],"source":{"question_pdf_page":54,"question_book_page":43,"answer_pdf_page":55,"answer_book_page":44},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Paediatrics","Inflammation","Oncology","Ocular Oncology & Pathology"]},{"id":"FF084","question_number":84,"stem":"The following are true about sympathetic ophthalmia:","options":["True","False"],"statements":[{"label":"a","text":"bilateral granulomatous pan-uveitis is a feature","answer":"True","answer_bool":true},{"label":"b","text":"fluorescein angiography is useful for diagnostic purposes","answer":"False","answer_bool":false},{"label":"c","text":"removal of the injured eye should be performed within a week to avoid this complication","answer":"False","answer_bool":false},{"label":"d","text":"the choroid is typically thickened with occlusion of the choriocapillaris","answer":"False","answer_bool":false},{"label":"e","text":"Dalen-Fuchs' nodules are found on the retinal side of Bruch's membrane.","answer":"True","answer_bool":true}],"correct_labels":["a","e"],"explanation":"Sympathetic ophthalmia occurs most commonly following a perforating injury but has been described in ophthalmic procedures such as cataract surgery and glaucoma surgery. Sympathetic ophthalmia is a clinical diagnosis. Fluorescein angiography does not show features typical of this condition. Although sympathetic ophthalmia has been reported as early as 5 days, the general consensus is to remove an injured sightless eye within 2 weeks of trauma. Thickening of the choroid is caused by cellular infiltration but the choriocapillaris are not involved. Dalen-Fuchs' nodules contain aggregates of lymphocytes and macrophages. They are found on the retinal side of Bruch's membrane. It is not pathognomonic of the condition as it is also seen in Vogt-Koyanagi-Harada's syndrome.","quick_fix_ids":["QF009"],"source":{"question_pdf_page":54,"question_book_page":43,"answer_pdf_page":55,"answer_book_page":44},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Surgery","Imaging","Genetics","Inflammation","Trauma","Glaucoma"]},{"id":"FF085","question_number":85,"stem":"With regard to acanthoamoeba keratitis:","options":["True","False"],"statements":[{"label":"a","text":"it is equally common in rigid gas permeable contact lens users as in soft contact lens users","answer":"False","answer_bool":false},{"label":"b","text":"the most common types are A hatchetti","answer":"False","answer_bool":false},{"label":"c","text":"swimming with contact lenses is a risk factor","answer":"True","answer_bool":true},{"label":"d","text":"radial perineuritis is diagnostic","answer":"True","answer_bool":true},{"label":"e","text":"the cyst wall can be visualised with ultraviolet light following staining with calcofluor white.","answer":"True","answer_bool":true}],"correct_labels":["c","d","e"],"explanation":"Acanthoamoeba keratitis is caused by a free-living protozoan. The most common species involved are A polyphaga and A castellani. Improper disinfection of the contact lenses is a major risk factor as is swimming with contact lenses. Although both rigid gas permeable and soft contact lenses have been implicated in acanthoamoeba keratitis, the incidence is higher amongst soft contact lens users. Clinically, the condition is very painful for the amount of clinical signs seen. Initially, it can present with dendrites which can be mistaken for herpes simplex keratitis. Radial perineuritis is a characteristic and diagnostic feature. The protozoan can be visualised under ultraviolet light after staining with calcofluor white. In vivo visualisation can be achieved with confocal microscopy. The medium used to culture the organism is a nutrient-poor agar overlaid with E coli.","quick_fix_ids":[],"source":{"question_pdf_page":56,"question_book_page":45,"answer_pdf_page":57,"answer_book_page":46},"primary_topic":"Cornea & External Eye","tags":["Infection","Inflammation","Cornea","Lens, Cataract & Refractive Surgery"]},{"id":"FF086","question_number":86,"stem":"In sebaceous cell carcinoma of the eyelid:","options":["True","False"],"statements":[{"label":"a","text":"unilateral blepharitis is a common feature","answer":"True","answer_bool":true},{"label":"b","text":"previous eyelid radiation is a risk factor","answer":"True","answer_bool":true},{"label":"c","text":"the upper lid is more commonly involved than the lower lid","answer":"True","answer_bool":true},{"label":"d","text":"compared with non-ocular sebaceous cell carcinoma, those affecting the eyelids tend to be more aggressive","answer":"True","answer_bool":true},{"label":"e","text":"Sudan black is used to differentiate the tumour from squamous cell carcinoma.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","d","e"],"explanation":"Sebaceous cell carcinoma of the upper lid is an aggressive tumour which can metastasise early. It typically presents as unilateral blepharitis or a recurrent chalazion. The upper lid is more commonly involved than the lower lid due to the larger number of meibomian glands in the upper lids. Risk factors include old age and previous radiation to the head. In a poorly differentiated tumour, it may be difficult to differentiate it from squamous cell carcinoma. However, the use of Sudan black or Oil red 0 can be useful as both will stain for the presence of fat in tumour cells seen in sebaceous cell carcinoma.","quick_fix_ids":[],"source":{"question_pdf_page":56,"question_book_page":45,"answer_pdf_page":57,"answer_book_page":46},"primary_topic":"Ocular Oncology & Pathology","tags":["Oncology","Oculoplastics, Lacrimal & Orbit","Diagnostics, Pharmacology & Perioperative"]},{"id":"FF087","question_number":87,"stem":"In a patient with a pale optic disc, the following test may be useful in reaching a diagnosis:","options":["True","False"],"statements":[{"label":"a","text":"full blood count and film","answer":"True","answer_bool":true},{"label":"b","text":"serum folate level","answer":"False","answer_bool":false},{"label":"c","text":"colour vision test","answer":"False","answer_bool":false},{"label":"d","text":"serum FTA Abs","answer":"True","answer_bool":true},{"label":"e","text":"visual evoked potential.","answer":"False","answer_bool":false}],"correct_labels":["a","d"],"explanation":"Optic atrophy is a physical sign and further tests are needed to find the underlying cause. Vitamin B12 deficiency is a cause of optic atrophy and a full blood count may show macrocytosis and hypersegmentation of the neutrophils. Serum folate may give the same haematological pictures but optic atrophy is not a feature of folate deficiency. Positive serum FTA Abs may suggest syphilis as a cause of the optic atrophy. Colour vision test and visual evoked potential are abnormal in optic atrophy and do not provide information about the underlying cause.","quick_fix_ids":[],"source":{"question_pdf_page":56,"question_book_page":45,"answer_pdf_page":57,"answer_book_page":46},"primary_topic":"Neuro-ophthalmology","tags":["Electrophysiology","Optic nerve"]},{"id":"FF088","question_number":88,"stem":"In essential blepharospasm:","options":["True","False"],"statements":[{"label":"a","text":"symptoms usually begin as excessive blinking","answer":"True","answer_bool":true},{"label":"b","text":"symptoms usually improve during sleep","answer":"True","answer_bool":true},{"label":"c","text":"the presence of facial grimace and retrocollic spasm constitute Meige's disease","answer":"True","answer_bool":true},{"label":"d","text":"compression of the facial nerve by the inferior cerebellar artery is a recognised cause","answer":"False","answer_bool":false},{"label":"e","text":"stripping of the orbicularis oculi is curative.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"Essential blepharospasm is characterised by bilateral orbicularis oculi and facial spasm. It usually begins as excessive blinking and may lead to functional blindness. The cause is unknown. Symptoms usually improve during sleep and are worsened under stressful circumstances. Meige's disease is essential blepharospasm with facial grimace, mouth retraction and retrocollic spasm. It suggests a dysfunction of the basal ganglia. Compression of the facial nerve by the inferior cerebellar artery is a recognised cause in hemifacial spasm. Treatment is usually with botulinum injection into the orbicularis oculi. In resistant cases, stripping of the orbicularis oculi may be effective.","quick_fix_ids":[],"source":{"question_pdf_page":58,"question_book_page":47,"answer_pdf_page":59,"answer_book_page":48},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Pharmacology"]},{"id":"FF089","question_number":89,"stem":"In stem cell deficiency:","options":["True","False"],"statements":[{"label":"a","text":"corneal cells at the limbus are absent","answer":"True","answer_bool":true},{"label":"b","text":"the cornea is covered by cells resembling those of conjunctiva","answer":"True","answer_bool":true},{"label":"c","text":"impression cytology reveals goblet cells","answer":"True","answer_bool":true},{"label":"d","text":"corneal oedema is a common feature","answer":"False","answer_bool":false},{"label":"e","text":"amniotic membrane graft is used to treat this condition.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"In stem cell deficiency, the cells at the limbus are absent or defective. The result is conjunctivalisation of the corneal epithelium. Goblet cells may be present. Corneal oedema is not a feature because the endothelial function remains normal. Autograft transplant of limbal cells from the fellow eye, allograft transplant from a cadavertic eye or a living related donor, or amniotic membrane transplant has been used to treat stem cell deficiency.","quick_fix_ids":[],"source":{"question_pdf_page":58,"question_book_page":47,"answer_pdf_page":59,"answer_book_page":48},"primary_topic":"Cornea & External Eye","tags":["Cornea"]},{"id":"FF090","question_number":90,"stem":"The following are true about mitomycin C:","options":["True","False"],"statements":[{"label":"a","text":"it is isolated from a fungus","answer":"False","answer_bool":false},{"label":"b","text":"it inhibits DNA synthesis","answer":"True","answer_bool":true},{"label":"c","text":"it is used to prevent recurrence of pterygium following its excision","answer":"True","answer_bool":true},{"label":"d","text":"it has an antifibrotic effect which is proportional to the concentration used","answer":"True","answer_bool":true},{"label":"e","text":"its use in trabeculectomy is associated with a higher incidence of hypotony as compared with the use of 5-FU.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"Mitomycin C is isolated from Streptomyces caespitosus and acts as an alkylating agent which inhibits DNA synthesis. In ophthalmology, it is used mainly to prevent pterygium recurrence and in high-risk trabeculectomies. Mitomycin C is a more potent anti-metabolite than 5-FU and its use in glaucoma is isolated, with an increased risk of wound leak and hypotony.","quick_fix_ids":[],"source":{"question_pdf_page":58,"question_book_page":47,"answer_pdf_page":59,"answer_book_page":48},"primary_topic":"Diagnostics, Pharmacology & Perioperative","tags":["Pharmacology","Surgery","Glaucoma"]},{"id":"FF091","question_number":91,"stem":"The following are true about adenovirus keratoconjunctivitis:","options":["True","False"],"statements":[{"label":"a","text":"membranous conjunctivitis causing puntal occlusion is a complication","answer":"True","answer_bool":true},{"label":"b","text":"the keratitis is caused by viral replication within the epithelial cells","answer":"True","answer_bool":true},{"label":"c","text":"subepithelial infiltrates typically develop about 2 weeks after the onset of conjunctivitis","answer":"True","answer_bool":true},{"label":"d","text":"corneal neovascularisation is a late complication","answer":"False","answer_bool":false},{"label":"e","text":"systemic acyclovir is useful in the acute stage.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Adenoviral keratoconjunctivitis can occasionally give rise to severe membranous conjunctivitis with punctal occlusion and symblepharon. The keratitis seen is caused by viral replication within the epithelium. With time, the keratitis progresses to subepithelial infiltration which is likely to be an immune response. Corneal neovascularisation is not a feature of this condition. Systemic acyclovir is of no use. In patients with severe keratoconjunctivitis, or those with reduced vision from the keratitis, steroids may be used with caution.","quick_fix_ids":[],"source":{"question_pdf_page":58,"question_book_page":47,"answer_pdf_page":59,"answer_book_page":48},"primary_topic":"Cornea & External Eye","tags":["Infection","Inflammation","Cornea"]},{"id":"FF092","question_number":92,"stem":"In vitamin A deficiency:","options":["True","False"],"statements":[{"label":"a","text":"the blood film often shows characteristic features","answer":"False","answer_bool":false},{"label":"b","text":"visual loss is usually due to retinal degeneration","answer":"False","answer_bool":false},{"label":"c","text":"lipid components of tear are usually affected early","answer":"False","answer_bool":false},{"label":"d","text":"Bitot's spots are found only in the temporal bulbar conjunctiva","answer":"False","answer_bool":false},{"label":"e","text":"nyctalopia usually precedes xerophthalmia.","answer":"True","answer_bool":true}],"correct_labels":["e"],"explanation":"The blood film is normal in vitamin A deficiency. Abetalipoproteinaemia, a rare recessive disorder, is associated with vitamin A deficiency and the presence of astrocytic red blood cells in the blood film. Visual loss is usually caused by keratomalacia leading to perforation. Dry eye is often due to abnormal mucous membrane with goblet cell dysfunction. Night blindness (nyctalopia) occurs before xerophthalmia.","quick_fix_ids":[],"source":{"question_pdf_page":60,"question_book_page":49,"answer_pdf_page":61,"answer_book_page":50},"primary_topic":"Cornea & External Eye","tags":["Genetics","Systemic Disease & Ocular Associations","Retina & Vitreous"]},{"id":"FF093","question_number":93,"stem":"Steven-johnson's syndrome:","options":["True","False"],"statements":[{"label":"a","text":"is most often caused by drugs","answer":"True","answer_bool":true},{"label":"b","text":"is characterised by formation of blisters on the skin","answer":"False","answer_bool":false},{"label":"c","text":"may be confined to the skin","answer":"False","answer_bool":false},{"label":"d","text":"is commonly associated with mucopurulent discharge from the eyes in the acute stage","answer":"True","answer_bool":true},{"label":"e","text":"rarely causes long-term ocular sequelae.","answer":"False","answer_bool":false}],"correct_labels":["a","d"],"explanation":"Steven-johnson's syndrome refers to acute inflammation of the skin and mucous membrane. Lesion confined to the skin is called erythema multiforme. The skin lesion typically appears as target lesions. Mucopurulent ocular discharge is common at the acute stage. Ocular complications are common and consist of dry eyes, symblepharon and eyelid malposition.","quick_fix_ids":[],"source":{"question_pdf_page":60,"question_book_page":49,"answer_pdf_page":61,"answer_book_page":50},"primary_topic":"Cornea & External Eye","tags":["Pharmacology","Genetics","Inflammation"]},{"id":"FF094","question_number":94,"stem":"The following mucopolysaccharidoses often give rise to corneal clouding:","options":["True","False"],"statements":[{"label":"a","text":"Hunter's syndrome","answer":"False","answer_bool":false},{"label":"b","text":"Hurler's syndrome","answer":"True","answer_bool":true},{"label":"c","text":"Morquio's syndrome","answer":"True","answer_bool":true},{"label":"d","text":"Sanfilippo's syndrome","answer":"False","answer_bool":false},{"label":"e","text":"Scheie's syndrome.","answer":"True","answer_bool":true}],"correct_labels":["b","c","e"],"explanation":"Mucopolysaccharidoses are a group of lysosomal storage diseases which are inherited in an autosomal recessive fashion with the exception of Hunter's syndrome which is X-linked. Although all of them can give rise to corneal clouding through deposition of accumulated metabolites, corneal clouding is only occasionally seen in Sanfilippo's syndrome and Hurler's syndrome.","quick_fix_ids":[],"source":{"question_pdf_page":60,"question_book_page":49,"answer_pdf_page":61,"answer_book_page":50},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Cornea","Cornea & External Eye"]},{"id":"FF095","question_number":95,"stem":"In keratoconus:","options":["True","False"],"statements":[{"label":"a","text":"the onset is usually in childhood","answer":"False","answer_bool":false},{"label":"b","text":"progressive astigmatic myopia is the most common refractive change","answer":"True","answer_bool":true},{"label":"c","text":"patients should avoid contact sport due to the risk of corneal perforation","answer":"False","answer_bool":false},{"label":"d","text":"hydrops is an indication for early corneal graft","answer":"False","answer_bool":false},{"label":"e","text":"corneal graft has a good success rate.","answer":"True","answer_bool":true}],"correct_labels":["b","e"],"explanation":"Keratoconus is an ectatic condition characterised by progressive thinning of the cornea. The condition usually begins at adolescence. Progressive astigmatic myopia is the most common finding. Despite the thinning, perforation is rare. Hydrop results from a break in Descemet's membrane leading to cornea swelling. With time, hydrops usually resolves, leaving behind a small scar. Compared with other inflammatory conditions, corneal graft in keratoconus has a higher success rate.","quick_fix_ids":[],"source":{"question_pdf_page":60,"question_book_page":49,"answer_pdf_page":61,"answer_book_page":50},"primary_topic":"Cornea & External Eye","tags":["Paediatrics","Cornea"]},{"id":"FF096","question_number":96,"stem":"A man develops left trochlear nerve palsy following head injury. He is likely to experience increased vertical diplopia in the following situations:","options":["True","False"],"statements":[{"label":"a","text":"right gaze","answer":"True","answer_bool":true},{"label":"b","text":"head tilt to the right","answer":"False","answer_bool":false},{"label":"c","text":"down-gaze","answer":"True","answer_bool":true},{"label":"d","text":"near reading","answer":"True","answer_bool":true},{"label":"e","text":"up-gaze.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"Following fourth cranial nerve palsy, vertical diplopia is usually worse on contralateral gaze (in this case right gaze), head tilt to the same (left) side, down-gaze (such as walking downstairs) and near reading.","quick_fix_ids":["QF010"],"source":{"question_pdf_page":62,"question_book_page":51,"answer_pdf_page":63,"answer_book_page":52},"primary_topic":"Ocular Motility & Strabismus","tags":["Trauma"]},{"id":"FF097","question_number":97,"stem":"In a patient with Horner's syndrome, the following signs are seen:","options":["True","False"],"statements":[{"label":"a","text":"decreased intraocular pressure","answer":"True","answer_bool":true},{"label":"b","text":"ptosis which improves with phenylephrine","answer":"True","answer_bool":true},{"label":"c","text":"enophthalmos measurable with an exophthal mometer","answer":"False","answer_bool":false},{"label":"d","text":"anisocoria which is most noticeable in bright light","answer":"False","answer_bool":false},{"label":"e","text":"problem with accommodation.","answer":"False","answer_bool":false}],"correct_labels":["a","b"],"explanation":"In Horner's syndrome, the loss of sympathetic tone will decrease intraocular pressure. Ptosis improves with the sympathomimetic effect of phenylephrine. Enophthalmos is an apparent sign rather than a true one, due to updrawing of the lower lids. Anisocoria is typically more noticeable in dim light. Accommodation is normal.","quick_fix_ids":["QF010"],"source":{"question_pdf_page":62,"question_book_page":51,"answer_pdf_page":63,"answer_book_page":52},"primary_topic":"Neuro-ophthalmology","tags":["Pharmacology","Genetics","Inflammation","Pupil","Glaucoma","Oculoplastics, Lacrimal & Orbit"]},{"id":"FF098","question_number":98,"stem":"The following are true about divisional oculomotor nerve palsy:","options":["True","False"],"statements":[{"label":"a","text":"it is more common than infranuclear third nerve palsy","answer":"False","answer_bool":false},{"label":"b","text":"it suggests a lesion in the cavernous sinus","answer":"True","answer_bool":true},{"label":"c","text":"superior division involvement is associated with hypotropia","answer":"True","answer_bool":true},{"label":"d","text":"superior division involvement is associated with poor accommodation","answer":"False","answer_bool":false},{"label":"e","text":"inferior division involvement causes mydriasis.","answer":"True","answer_bool":true}],"correct_labels":["b","c","e"],"explanation":"Divisional oculomotor nerve palsy is less common than complete third nerve palsy. It suggests a lesion in the anterior cavernous sinus. Superior division involvement causes ptosis and hypotropia, whereas inferior division involvement causes exotropia, hypertropia, intorsion and mydriasis.","quick_fix_ids":["QF010"],"source":{"question_pdf_page":62,"question_book_page":51,"answer_pdf_page":63,"answer_book_page":52},"primary_topic":"Ocular Motility & Strabismus","tags":["Strabismus"]},{"id":"FF099","question_number":99,"stem":"The following association with the respective eye movements are correct:","options":["True","False"],"statements":[{"label":"a","text":"see-saw nystagmus - lesion in the chiasm","answer":"True","answer_bool":true},{"label":"b","text":"down beat nystagmus -Arnold-Chiari malformation","answer":"True","answer_bool":true},{"label":"c","text":"ocular flutter - neuroblastoma","answer":"False","answer_bool":false},{"label":"d","text":"convergence retraction nystagmus - mid-brain lesion","answer":"True","answer_bool":true},{"label":"e","text":"pendular nystagmus - unilateral congenital cataract.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"See-saw nystagmus is indicative of a lesion in the chiasmal region. Arnold-Chiari malformation can present with down beat nystagmus. Opsodonus but not ocular flutter may be a sign of neuroblastoma. Convergence retraction nystagmus is a feature of mid-brain lesion such as pinealoma. Pendular nystagmus is a common feature in patients with poor vision due to congenital cataract, and this can be unilateral.","quick_fix_ids":["QF010"],"source":{"question_pdf_page":62,"question_book_page":51,"answer_pdf_page":63,"answer_book_page":52},"primary_topic":"Ocular Motility & Strabismus","tags":["Electrophysiology","Paediatrics","Cataract","Strabismus","Lens, Cataract & Refractive Surgery","Retina & Vitreous"]},{"id":"FF100","question_number":100,"stem":"In a patient with proliferative diabetic retinopathy, vitrectomy is recommended in:","options":["True","False"],"statements":[{"label":"a","text":"an only eye with tractional retinal detachment nasal to the optic disc","answer":"False","answer_bool":false},{"label":"b","text":"the presence of bilateral pre-retinal haemorrhages","answer":"False","answer_bool":false},{"label":"c","text":"the presence of neovascularisation in the inferior arcade with pre-retinal haemorrhage, despite pan-retinal photocoagulation","answer":"True","answer_bool":true},{"label":"d","text":"vitreous haemorrhage of more than 4 months duration in type I diabetes","answer":"True","answer_bool":true},{"label":"e","text":"simultaneous presence of optic disc and peripheral neovascularisation with pre-retinal haemorrhages.","answer":"False","answer_bool":false}],"correct_labels":["c","d"],"explanation":"The indications for vitrectomy in diabetes have been outlined in the Diabetic Retinopathy Vitrectomy Study. These include tractional retinal detachment involving the fovea, non-clearing vitreous haemorrhage especially in type I diabetes, and progressive fibrovascular proliferation despite pan-retinal photocoagulation.","quick_fix_ids":[],"source":{"question_pdf_page":64,"question_book_page":53,"answer_pdf_page":65,"answer_book_page":54},"primary_topic":"Retina & Vitreous","tags":["Surgery","Diabetes","Trauma","Optic nerve","Retinal detachment","Neuro-ophthalmology"]},{"id":"FF101","question_number":101,"stem":"The following contraindications are correct:","options":["True","False"],"statements":[{"label":"a","text":"systemic acetazolamide in patients who develop Steven-Johnson' s syndrome to sulphonamide","answer":"True","answer_bool":true},{"label":"b","text":"topical timolol in patients on peripheral calcium channel blockers","answer":"False","answer_bool":false},{"label":"c","text":"apraclonidine in patients taking monoamine oxidase inhibitors","answer":"True","answer_bool":true},{"label":"d","text":"latanoprost in patients with skin melanoma","answer":"False","answer_bool":false},{"label":"e","text":"pilocarpine in patients with raised intraocular pressure secondary to uveitis.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"Acetazolamide is a sulphonamide derivative and can cause Steven-Johnson's syndrome in patients with reaction to either drug. Topical timolol is only contraindicated in the presence of central-acting calcium channel blockers. The concurrent use of both can lead to heart block. Apraclonidine may cause a hypertensive crisis in patients taking monoamine oxidase inhibitors. Latanoprost can increase melanin production in the iris but has not been shown to affect skin melanoma. Pilocarpine can exacerbate the breakdown of the blood aqueous barrier and is contraindicated in the uveitic patient..•. \" vqgJ '","quick_fix_ids":[],"source":{"question_pdf_page":64,"question_book_page":53,"answer_pdf_page":65,"answer_book_page":54},"primary_topic":"Diagnostics, Pharmacology & Perioperative","tags":["Pharmacology","Genetics","Inflammation","Glaucoma","Oncology","Ocular Oncology & Pathology"]},{"id":"FF102","question_number":102,"stem":"The following are true about ciliary body ablation:","options":["True","False"],"statements":[{"label":"a","text":"the procedure is painless","answer":"False","answer_bool":false},{"label":"b","text":"it increases uveoscleral outflow of aqueous","answer":"False","answer_bool":false},{"label":"c","text":"it decreases aqueous production by the ciliary body","answer":"True","answer_bool":true},{"label":"d","text":"it is not effective in neovascular glaucoma","answer":"False","answer_bool":false},{"label":"e","text":"sympathetic ophthalmia has been reported as a complication.","answer":"True","answer_bool":true}],"correct_labels":["c","e"],"explanation":"'.\"...• •...•..•.••.• Ciliary body ablation involves the use of a cryoprobe or a laser to destroy the ciliary body, thereby reducing aqueous production. The procedure can be painful and sympathetic ophthalmia has been reported as a complication. Overtreatment can lead to hypotony and, rarely, phthisis may develop. It is the treatment of choice in patients with poor visual prognosis, with high intraocular pressures (such as neovascular glaucoma), inadequately controlled with medication and/or surgery.","quick_fix_ids":[],"source":{"question_pdf_page":64,"question_book_page":53,"answer_pdf_page":65,"answer_book_page":54},"primary_topic":"Glaucoma","tags":["Pharmacology","Surgery","Laser","Inflammation","Glaucoma","Uveitis & Ocular Inflammation"]},{"id":"FF103","question_number":103,"stem":"In a newborn with a cloudy cornea, the differential diagnoses should include:","options":["True","False"],"statements":[{"label":"a","text":"sclerocornea","answer":"True","answer_bool":true},{"label":"b","text":"congenital hereditary endothelial dystrophy","answer":"True","answer_bool":true},{"label":"c","text":"Peter's anomaly","answer":"True","answer_bool":true},{"label":"d","text":"granular dystrophy","answer":"False","answer_bool":false},{"label":"e","text":"megalocornea.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Granular dystrophy does not occur in the newborn but develops later. Megalocornea occurs when the cornea in the neonate is 12mm or more in diameter - it is associated with corneal cloudiness. A useful mnemonic for neonatal corneal opacity is STUMPED: Sclerocornea, Tear in Descemet's membrane (congenital glaucoma or trauma), Ulcer (infections), Metabolic (mucopolysaccharidoses), Posterior corneal defects (posterior keratoconus or Peters' anomaly), Endothelial dystrophies (congenital hereditary stromal, posterior polymorphous dystrophy or congenital hereditary endothelial dystrophy), Dermoid.","quick_fix_ids":[],"source":{"question_pdf_page":64,"question_book_page":53,"answer_pdf_page":65,"answer_book_page":54},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Paediatrics","Infection","Trauma","Glaucoma","Cornea"]},{"id":"FF104","question_number":104,"stem":"The following are true about intraocular pressure measurement with the applanation tonometer:","options":["True","False"],"statements":[{"label":"a","text":"following LASIK surgery, the lOP reading may be inaccurately high","answer":"False","answer_bool":false},{"label":"b","text":"excessive fluorescein may give an inaccurately high reading","answer":"True","answer_bool":true},{"label":"c","text":"pressure may be falsely elevated in the presence of increased corneal thickness","answer":"True","answer_bool":true},{"label":"d","text":"myopia may give an inaccurately low pressure measurement due to decreased rigidity of the eyeball","answer":"False","answer_bool":false},{"label":"e","text":"breath holding may give a low pressure reading.","answer":"False","answer_bool":false}],"correct_labels":["b","c"],"explanation":"With applanation tonometry, increased corneal thickness gives an inaccurately high reading, whereas decreased thickness gives an inaccurately low reading such as following LASIK. Myopia does not affect the reading with an applanation tonometer as with an indentation tonometer. Excessive fluorescein causes wide mires which may give falsely high readings. Breath holding increases the episcleral venous pressure and may result in a higher pressure measurement.","quick_fix_ids":[],"source":{"question_pdf_page":66,"question_book_page":55,"answer_pdf_page":67,"answer_book_page":56},"primary_topic":"Glaucoma","tags":["Surgery","Imaging","Glaucoma","Cornea","Cornea & External Eye","Lens, Cataract & Refractive Surgery"]},{"id":"FF105","question_number":105,"stem":"The following are true about perimetry:","options":["True","False"],"statements":[{"label":"a","text":"the peripheral visual field is better tested with Goldmann perimetry rather than Humphrey perimetry","answer":"True","answer_bool":true},{"label":"b","text":"both cataract and miosis can cause decreased sensitivity","answer":"True","answer_bool":true},{"label":"c","text":"short-term fluctuation is used in Humphrey perimetry to test the reliability of the subject","answer":"True","answer_bool":true},{"label":"d","text":"a contracted visual field is encountered if the correcting lens is placed too far from the eye","answer":"True","answer_bool":true},{"label":"e","text":"a normal visual field excludes the presence of glaucoma.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c","d"],"explanation":"The Goldmann perimetry covers a wider visual field than Humphrey field tests which only test the central 30 degrees of visual field. Decreased sensitivity occurs in cataract, miosis, fatigue and old age. Short-term fluctuation analyses the response of the patient to the same stimulus at the same location to assess reliability. The visual field is contracted if the correcting lens is placed too far in front of the patient's eye. Glaucoma may still be present despite a normal visual field because visual field defects occur only in the presence of significant nerve fibre loss.","quick_fix_ids":[],"source":{"question_pdf_page":66,"question_book_page":55,"answer_pdf_page":67,"answer_book_page":56},"primary_topic":"Glaucoma","tags":["Visual field","Glaucoma","Cataract","Lens, Cataract & Refractive Surgery","Neuro-ophthalmology"]},{"id":"FF106","question_number":106,"stem":"The following are true about normal tension glaucoma:","options":["True","False"],"statements":[{"label":"a","text":"brain scan reveals a cause in about 10% of patients","answer":"False","answer_bool":false},{"label":"b","text":"optic nerve meningioma is a cause of normal tension glaucoma","answer":"False","answer_bool":false},{"label":"c","text":"a dense paracentral scotoma encroaching upon fixation is a common finding","answer":"True","answer_bool":true},{"label":"d","text":"the use of betaxolol has been shown to delay progression","answer":"False","answer_bool":false},{"label":"e","text":"a reduction of more than 30% of intraocular pressure has been shown to delay the progression of visual field defect.","answer":"True","answer_bool":true}],"correct_labels":["c","e"],"explanation":"By definition, normal tension glaucoma is diagnosed after excluding other causes. Optic nerve meningioma causes compressive optic neuropathy. Brain scan seldom reveals a cause in most cases of normal tension glaucoma. A dense paracentral scotoma encroaching upon fixation is a common finding. Although betaxolol has been shown to be neuroprotective in animal models, there has been no convincing evidence which proves its use in delaying progression in normal tension glaucoma. The Collaborative Normal Tension Glaucoma Study found that reducing lOP by greater than 30% delayed the rate of visual field progression.","quick_fix_ids":[],"source":{"question_pdf_page":66,"question_book_page":55,"answer_pdf_page":67,"answer_book_page":56},"primary_topic":"Glaucoma","tags":["Optic nerve","Visual field","Glaucoma","Oncology","Neuro-ophthalmology","Ocular Oncology & Pathology"]},{"id":"FF107","question_number":107,"stem":"The following are true about Down's syndrome:","options":["True","False"],"statements":[{"label":"a","text":"genetic analysis invariably shows trisomy 21","answer":"False","answer_bool":false},{"label":"b","text":"discrete lens opacities in the anterior and posterior cortex are common","answer":"True","answer_bool":true},{"label":"c","text":"Brushfield's spots are more commonly seen in blue than brown irides","answer":"True","answer_bool":true},{"label":"d","text":"hypermetropia is a common finding","answer":"False","answer_bool":false},{"label":"e","text":"keratoconus with a tendency to developing hydrops is a recognised association.","answer":"True","answer_bool":true}],"correct_labels":["b","c","e"],"explanation":"Down's syndrome is often caused by trisomy 21 but in a small minority it can result from chromosomal translocation without an increase in chromosome numbers. Cataract with snowflake opacities in the cortex, keratoconus with a tendency to developing hydrops, high myopia and esotropia are associated with Down's syndrome. Brushfield's spots are made up of aggregates of iris stromal fibres. They are more commonly seen in blue irides than brown irides.","quick_fix_ids":[],"source":{"question_pdf_page":66,"question_book_page":55,"answer_pdf_page":67,"answer_book_page":56},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Cataract","Cornea","Strabismus","Lens, Cataract & Refractive Surgery","Cornea & External Eye"]},{"id":"FF108","question_number":108,"stem":"In aniridia:","options":["True","False"],"statements":[{"label":"a","text":"there is complete absence of iris structure","answer":"False","answer_bool":false},{"label":"b","text":"poor vision usually results from excessive photophobia","answer":"False","answer_bool":false},{"label":"c","text":"limbal stem cell deficiency with corneal neovascularisation is a feature","answer":"True","answer_bool":true},{"label":"d","text":"Wilm's tumour is most commonly seen in sporadic cases","answer":"False","answer_bool":false},{"label":"e","text":"lens subluxation is a feature.","answer":"True","answer_bool":true}],"correct_labels":["c","e"],"explanation":"In aniridia, there is a remnant of iris tissue. The main cause of poor vision is foveal hypoplasia. Other associated features include glaucoma and limbal stem cell failure with an increased risk of corneal neovascularisation. Wilm's tumour is most often seen in familial cases, especially in those with abnormalities of chromosome 11. The zonules are weak and lens subluxation is common.","quick_fix_ids":[],"source":{"question_pdf_page":68,"question_book_page":57,"answer_pdf_page":69,"answer_book_page":58},"primary_topic":"Paediatric Ophthalmology & Genetics","tags":["Genetics","Glaucoma","Cornea","Oncology","Cornea & External Eye","Ocular Oncology & Pathology"]},{"id":"FF109","question_number":109,"stem":"In a patient with peripheral bone-spicule pigmentation, the following tests are useful:","options":["True","False"],"statements":[{"label":"a","text":"serum ACE concentration","answer":"False","answer_bool":false},{"label":"b","text":"serum phytanic acid","answer":"True","answer_bool":true},{"label":"c","text":"plasma ornithine level","answer":"False","answer_bool":false},{"label":"d","text":"plasma lipoprotein B","answer":"True","answer_bool":true},{"label":"e","text":"urine glycosaminoglycans.","answer":"Tr
