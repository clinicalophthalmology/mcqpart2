astasis in choroidal melanoma is increased in the presence of a large tumour, an anterior location of the tumour, a tumour composed mainly of epithelioid cells and involvement of the vortex vein. Extension of the tumour through Bruch's membrane is not associated with metastasis.","quick_fix_ids":[],"source":{"question_pdf_page":126,"question_book_page":115,"answer_pdf_page":127,"answer_book_page":116},"primary_topic":"Ocular Oncology & Pathology","tags":["Oncology","Retina & Vitreous"]},{"id":"FF222","question_number":222,"stem":"Proliferative vitreoretinopathy:","options":["True","False"],"statements":[{"label":"a","text":"results from proliferation of retinal pigment epithelial cells","answer":"True","answer_bool":true},{"label":"b","text":"is more common in younger patients","answer":"False","answer_bool":false},{"label":"c","text":"is increased in the presence of vitreous haemorrhage","answer":"True","answer_bool":true},{"label":"d","text":"is more common in retinal detachment treated with a scleral buckle compared with a vitrectomy","answer":"True","answer_bool":true},{"label":"e","text":"can be prevented with systemic steroid.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"Proliferative vitreoretinopathy is a late complication of retinal surgery. It is caused by proliferation of retinal pigment epithelial cells on the retina. It is associated with vitreous haemorrhage and vitreous surgery. Conditions that release retinal pigment epithelial cells into the vitreous increase the risk of proliferative vitreoretinopathy, and include multiple or large breaks and the use of cryopexy.","quick_fix_ids":[],"source":{"question_pdf_page":126,"question_book_page":115,"answer_pdf_page":127,"answer_book_page":116},"primary_topic":"Retina & Vitreous","tags":["Surgery","Trauma","Retinal detachment"]},{"id":"FF223","question_number":223,"stem":"Features of multiple evanescent white dot syndrome include the following:","options":["True","False"],"statements":[{"label":"a","text":"female predilection","answer":"True","answer_bool":true},{"label":"b","text":"presence of an enlarged blind spot despite a normal optic disc","answer":"True","answer_bool":true},{"label":"c","text":"vitritis being a prominent feature","answer":"False","answer_bool":false},{"label":"d","text":"fluorescein angiography shows early hyperfluorescence of the white lesions","answer":"True","answer_bool":true},{"label":"e","text":"electrophysiology studies indicate dysfunction of the inner retinal layer.","answer":"False","answer_bool":false}],"correct_labels":["a","b","d"],"explanation":"Multiple evanescent white dot syndrome is often a unilateral condition affecting young female patients. The presentation is usually decreased vision with multiple white dots in the retinal pigment epithelium layer. An enlarged blind spot is common despite a normal optic disc. Vitritis is usually mild. Fluorescein angiography shows early hyperfluorescence of the white lesions. ERG shows a decreased a-wave, suggesting abnormal outer retinal dysfunction. The condition usually resolves spontaneously with good visual recovery.","quick_fix_ids":[],"source":{"question_pdf_page":126,"question_book_page":115,"answer_pdf_page":127,"answer_book_page":116},"primary_topic":"Uveitis & Ocular Inflammation","tags":["Imaging","Electrophysiology","Genetics","Optic nerve","Retina & Vitreous","Neuro-ophthalmology"]},{"id":"FF224","question_number":224,"stem":"In lamellar cataracts:","options":["True","False"],"statements":[{"label":"a","text":"the lens opacity is between the cortex and the embryonic nucleus","answer":"True","answer_bool":true},{"label":"b","text":"progression of the cataract after birth is common","answer":"False","answer_bool":false},{"label":"c","text":"there are usually linear opacities extending from the cataract into the clear peripheral cortex","answer":"True","answer_bool":true},{"label":"d","text":"the insult leading to the cataract usually occurs in the first trimester","answer":"False","answer_bool":false},{"label":"e","text":"abnormal maternal calcium metabolism is a cause.","answer":"True","answer_bool":true}],"correct_labels":["a","c","e"],"explanation":"Lamellar or zonular cataract is a congenital cataract characterised by the presence of lens opacities between the cortex and the embryonic nucleus. Two additional features are the presence of an envelope, which is a thin opacity surrounding the main cataract, and the presence of riders, which are linear opacities extending from the cataract into the clear cortex. The insult is thought to occur in late pregnancy. Abnormal maternal calcium metabolism such as hypoparathyroidism is a known factor. The condition is usually static.","quick_fix_ids":[],"source":{"question_pdf_page":128,"question_book_page":117,"answer_pdf_page":129,"answer_book_page":118},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Paediatrics","Cataract","Systemic Disease & Ocular Associations"]},{"id":"FF225","question_number":225,"stem":"The following are true about piggyback intraocular lens implant:","options":["True","False"],"statements":[{"label":"a","text":"it is usually carried out in patients with a refraction of more than 30D","answer":"True","answer_bool":true},{"label":"b","text":"spherical aberrations are more common than using one single lens","answer":"False","answer_bool":false},{"label":"c","text":"a larger incision is required during surgery","answer":"False","answer_bool":false},{"label":"d","text":"the lens with higher power is usually placed anterior to the lens with lower power","answer":"True","answer_bool":true},{"label":"e","text":"interlenticular opacification is a complication.","answer":"True","answer_bool":true}],"correct_labels":["a","d","e"],"explanation":"Piggyback intraocular lens implants involve the use of two or more intraocular lenses to achieve the required post-operative power following cataract surgery. It is used mainly in patients with intraocular lens power of 30D or more. It has the advantage of causing fewer spherical and chromatic aberrations. The implants may be foldable and therefore the incision does not have to be larger. Lenses with lower power are usually placed anterior to lenses with higher power to facilitate intraocular lens exchange should adjustment of the refractive power be required. Opacification between the implants is a complication.","quick_fix_ids":[],"source":{"question_pdf_page":128,"question_book_page":117,"answer_pdf_page":129,"answer_book_page":118},"primary_topic":"Lens, Cataract & Refractive Surgery","tags":["Surgery","Cataract"]},{"id":"FF226","question_number":226,"stem":"Periorbital haematoma is a feature of:","options":["True","False"],"statements":[{"label":"a","text":"basal skull fracture","answer":"True","answer_bool":true},{"label":"b","text":"amyloidosis","answer":"True","answer_bool":true},{"label":"c","text":"neuroblastoma","answer":"True","answer_bool":true},{"label":"d","text":"haemophilia A","answer":"False","answer_bool":false},{"label":"e","text":"sickle cell anaemia.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Basal skull fracture can cause bilateral periorbital haematoma (racoon's sign). Amyloidosis may lead to formation of fragile blood vessels which may bleed spontaneously. Orbital metastasis of neuroblastoma is also associated with spontaneous haemorrhage. Haemophilia A results in an abnormal clotting profile but does not cause spontaneous bleeding and neither does sickle cell anaemia.","quick_fix_ids":[],"source":{"question_pdf_page":128,"question_book_page":117,"answer_pdf_page":129,"answer_book_page":118},"primary_topic":"Oculoplastics, Lacrimal & Orbit","tags":["Trauma","Orbit","Systemic Disease & Ocular Associations"]},{"id":"FF227","question_number":227,"stem":"In a patient whose pupils do not react to light but constrict with accommodation, the following signs may be an associated finding:","options":["True","False"],"statements":[{"label":"a","text":"vermiform movement of the eye","answer":"True","answer_bool":true},{"label":"b","text":"small irregular pupils","answer":"True","answer_bool":true},{"label":"c","text":"presence of optic atrophy in both eyes","answer":"True","answer_bool":true},{"label":"d","text":"presence of extensive pan-photocoagulation","answer":"True","answer_bool":true},{"label":"e","text":"convergence-retraction nystagmus.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","d","e"],"explanation":"Vermiform movement of the eye occurs in Adie's pupil. Small irregular pupils are seen in tertiary neuro-syphilis. Optic atrophy may stop the pupils from responding to light but not to accommodation. Extensive pan-photocoagulation can cause damage to the long ciliary nerve and subsequent aberrant regeneration can give rise to light-near dissociation. Convergence-retraction nystagmus is a feature of Parinaud's syndrome which in turn is associated with light-near dissociation.","quick_fix_ids":[],"source":{"question_pdf_page":128,"question_book_page":117,"answer_pdf_page":129,"answer_book_page":118},"primary_topic":"Neuro-ophthalmology","tags":["Electrophysiology","Genetics","Pupil","Strabismus","Retina & Vitreous","Ocular Motility & Strabismus"]},{"id":"FF228","question_number":228,"stem":"The following pairings are correct:","options":["True","False"],"statements":[{"label":"a","text":"Gerstmann's syndrome - dominant parietal lobe","answer":"True","answer_bool":true},{"label":"b","text":"prosopagnosia - bilateral frontal lobe lesion","answer":"False","answer_bool":false},{"label":"c","text":"achromatopsia - bilateral occipital lobe lesion","answer":"True","answer_bool":true},{"label":"d","text":"akinetopsia - middle temporal gyrus lesion","answer":"True","answer_bool":true},{"label":"e","text":"Anton's syndrome - bilateral parietal lobe lesion.","answer":"False","answer_bool":false}],"correct_labels":["a","c","d"],"explanation":"Gerstmann's syndrome results from a lesion in the dominant parietal lobe. It is characterised by acalculia, agraphia, finger agnosia and left-right confusion. Prosopagnosia is an inability to recognise familiar faces and usually results from bilateral occipitotemporal involvement. Achromatopsia is abnormal colour discrimination and can arise from bilateral parietal or occipital lobe abnormalities. Akinetopsia implies insensitivity to motion and can result from a lesion in the middle temporal gyrus. Anton's syndrome occurs in blind patients who deny they are blind. It is seen in bilateral occipital lesions.","quick_fix_ids":[],"source":{"question_pdf_page":130,"question_book_page":119,"answer_pdf_page":131,"answer_book_page":120},"primary_topic":"Diagnostics, Pharmacology & Perioperative","tags":["Genetics"]},{"id":"FF229","question_number":229,"stem":"In retinitis pigmentosa:","options":["True","False"],"statements":[{"label":"a","text":"the X-linked type tends to have worse visual prognosis than the autosomal dominant type","answer":"True","answer_bool":true},{"label":"b","text":"electrophysiology typically shows a normal a-wave but abnormal b-wave","answer":"False","answer_bool":false},{"label":"c","text":"visual field shows ring scotoma best shown on Humphrey perimetry","answer":"False","answer_bool":false},{"label":"d","text":"the macula may have oedema which does not leak on fluorescein angiography","answer":"True","answer_bool":true},{"label":"e","text":"the sectorial type typically involves the inferior retina.","answer":"True","answer_bool":true}],"correct_labels":["a","d","e"],"explanation":"Retinitis pigmentosa may be autosomal dominant, X-linked or autosomal recessive. The autosomal dominant type tends to have the best visual prognosis. ERG shows abnormal a- and b-waves with eventual obliteration of both. The ring scotoma involves the periphery and is best shown on Goldman visual field. Cystoid macular oedema may occur but fluorescein angiography may not reveal leakage. Oral acetazolamide may be helpful. Sectorial retinitis pigmentosa is a variant and usually involves the lower retina.","quick_fix_ids":[],"source":{"question_pdf_page":130,"question_book_page":119,"answer_pdf_page":131,"answer_book_page":120},"primary_topic":"Retina & Vitreous","tags":["Imaging","Electrophysiology","Genetics","Visual field","Macula","Paediatric Ophthalmology & Genetics"]},{"id":"FF230","question_number":230,"stem":"The following conditions are associated with deafness:","options":["True","False"],"statements":[{"label":"a","text":"Bardet-Biedl's syndrome","answer":"True","answer_bool":true},{"label":"b","text":"Norrie's disease","answer":"True","answer_bool":true},{"label":"c","text":"Kearne-Sayre's syndrome","answer":"True","answer_bool":true},{"label":"d","text":"Cogan's interstitial keratitis","answer":"True","answer_bool":true},{"label":"e","text":"Leber's congenital amaurosis.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","d","e"],"explanation":"Other conditions associated with deafness include:\n\n• Usher's syndrome • mucopolysaccharidoses • Alport's disease • congenital syphilis • congenital rubella • Vogt-Koyanagi-Harada's syndrome.","quick_fix_ids":[],"source":{"question_pdf_page":130,"question_book_page":119,"answer_pdf_page":131,"answer_book_page":120},"primary_topic":"Systemic Disease & Ocular Associations","tags":["Genetics","Paediatrics","Inflammation","Cornea","Paediatric Ophthalmology & Genetics","Uveitis & Ocular Inflammation"]},{"id":"FF231","question_number":231,"stem":"Kaposi's sarcoma:","options":["True","False"],"statements":[{"label":"a","text":"is caused by human herpes virus type 8","answer":"True","answer_bool":true},{"label":"b","text":"arises from the endothelium","answer":"True","answer_bool":true},{"label":"c","text":"typically causes blockage of lymphatic drainage","answer":"True","answer_bool":true},{"label":"d","text":"is confined to the skin","answer":"False","answer_bool":false},{"label":"e","text":"can be treated with antiviral agents.","answer":"False","answer_bool":false}],"correct_labels":["a","b","c"],"explanation":"Kaposi's sarcoma is most commonly seen in AIDS patients. It is caused by human herpes virus type 8. The tumour originates in the endothelium of either blood or lymphatic vessels. The tumour commonly invades the lymphatic system, causing lymphoedema. It can affect not only the skin but the conjunctiva and orbit. Antiviral agents do not appear to be effective. Excision, radiation and systemic chemotherapy with either vincristine or vinblastine are effective.","quick_fix_ids":[],"source":{"question_pdf_page":130,"question_book_page":119,"answer_pdf_page":131,"answer_book_page":120},"primary_topic":"Ocular Oncology & Pathology","tags":["Infection","Orbit","Oncology"]},{"id":"FF232","question_number":232,"stem":"The cover test:","options":["True","False"],"statements":[{"label":"a","text":"gives the same information as the alternating cover test","answer":"False","answer_bool":false},{"label":"b","text":"can detect abnormal retinal correspondence","answer":"False","answer_bool":false},{"label":"c","text":"can detect eccentric fixation","answer":"False","answer_bool":false},{"label":"d","text":"is the best test for tropia","answer":"True","answer_bool":true},{"label":"e","text":"can be used to detect dissociated vertical deviation.","answer":"True","answer_bool":true}],"correct_labels":["d","e"],"explanation":"The cover test is used to detect tropia, whereas the alternating cover/uncover test detects both tropia and phoria. Abnormal retinal correspondence and eccentric fixation cannot be detected with a cover test. Dissociated vertical deviation shows an upward movement of the eye when it is covered.","quick_fix_ids":[],"source":{"question_pdf_page":132,"question_book_page":121,"answer_pdf_page":133,"answer_book_page":122},"primary_topic":"Ocular Motility & Strabismus","tags":["Retina & Vitreous"]},{"id":"FF233","question_number":233,"stem":"In pituitary apoplexy:","options":["True","False"],"statements":[{"label":"a","text":"severe sudden headache is the typical presentation","answer":"True","answer_bool":true},{"label":"b","text":"decreased vision with ophthalmoplegia is common","answer":"True","answer_bool":true},{"label":"c","text":"occurs mostly in malignant tumour","answer":"False","answer_bool":false},{"label":"d","text":"urgent resection of the tumour with steroid cover is necessary","answer":"True","answer_bool":true},{"label":"e","text":"hypopituitarism is common.","answer":"True","answer_bool":true}],"correct_labels":["a","b","d","e"],"explanation":"Pituitary apoplexy occurs as a result of sudden enlargement of a pituitary adenoma either due to haemorrhage or infarction. The tumour is usually benign. The resultant mass can expand into the cavernous sinus, causing compression of the cranial nerves. Altered consciousness with decreased vision and ophthalmoplegia are common. In the acute stage, resection of the tumour with steroid cover can be life-saving. Hypopituitarism is a common outcome with or without surgery.","quick_fix_ids":[],"source":{"question_pdf_page":132,"question_book_page":121,"answer_pdf_page":133,"answer_book_page":122},"primary_topic":"Neuro-ophthalmology","tags":["Surgery","Trauma","Oncology","Ocular Oncology & Pathology"]},{"id":"FF234","question_number":234,"stem":"During repair of a rhegmatogenous retinal detachment, the following are true regarding drainage of subretinal fluid:","options":["True","False"],"statements":[{"label":"a","text":"drainage is indicated if there is significant vitreoretinal traction","answer":"False","answer_bool":false},{"label":"b","text":"drainage should be performed as close to the retinal hole as possible","answer":"False","answer_bool":false},{"label":"c","text":"it can help to localise the retinal hole","answer":"True","answer_bool":true},{"label":"d","text":"it is useful for softening the eye","answer":"True","answer_bool":true},{"label":"e","text":"drainage should be performed before buckling.","answer":"True","answer_bool":true}],"correct_labels":["c","d","e"],"explanation":"The indications for drainage of subretinal fluid are: presence of a bullous retinal detachment which is making localisation of a retinal tear or hole difficult; long-standing retinal detachment with viscous subretinal fluid; and inferior retinal detachment. Drainage should be performed before buckling and away from the retina break, as the use of cryotherapy at the site of drainage may cause problems.","quick_fix_ids":[],"source":{"question_pdf_page":132,"question_book_page":121,"answer_pdf_page":133,"answer_book_page":122},"primary_topic":"Retina & Vitreous","tags":["Surgery","Retinal detachment"]},{"id":"FF235","question_number":235,"stem":"Regarding herpes virus infections:","options":["True","False"],"statements":[{"label":"a","text":"conjunctival swapping for Lipschutz bodies is found in herpes simplex viral infections","answer":"True","answer_bool":true},{"label":"b","text":"Giemsa staining of epithelial cells helps in the diagnosis of herpes simplex viral infections","answer":"True","answer_bool":true},{"label":"c","text":"fluorescent antibody staining techniques demonstrate intracellular herpetic inclusion bodies","answer":"True","answer_bool":true},{"label":"d","text":"varicella zoster infection of the lids can be confirmed by staining for Henderson Patterson bodies","answer":"False","answer_bool":false},{"label":"e","text":"Tzanck smear is useful for identifying herpes virus.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","e"],"explanation":"Lipschutz bodies, also called Cowdry type A inclusions, are seen in cells infected with herpes simplex or varicella zoster virus. They are best seen with the infected epithelial cells fixed in Bouin's solution and stained with Papanicolaou method. Giemsa stain shows up cells infected by the herpetic virus. The infected cells show multi-nucleation with balloon degeneration. Immunofluorescence can identify cells infected with herpes virus. Henderson Patterson bodies refer to eosinophilic cytoplasmic inclusion bodies seen in molluscum contagiosum. Tzanck smear involves scraping the base of a vesicle and inoculating it onto a microscopic slide. The syncytial giant cells which are characteristic of cells infected with the herpes virus can be demonstrated with Wright's or Giemsa stain.","quick_fix_ids":[],"source":{"question_pdf_page":132,"question_book_page":121,"answer_pdf_page":133,"answer_book_page":122},"primary_topic":"Cornea & External Eye","tags":["Genetics","Infection"]},{"id":"FF236","question_number":236,"stem":"Superior limbic keratoconjunctivitis:","options":["True","False"],"statements":[{"label":"a","text":"is associated with superior follicular tarsal conjunctivitis","answer":"False","answer_bool":false},{"label":"b","text":"causes hypertrophy of the superior limbus","answer":"True","answer_bool":true},{"label":"c","text":"is associated with filamentary keratitis","answer":"True","answer_bool":true},{"label":"d","text":"can be diagnosed with impression cytology","answer":"True","answer_bool":true},{"label":"e","text":"shows a favourable response with silver nitrate to the upper tarsal conjunctiva.","answer":"True","answer_bool":true}],"correct_labels":["b","c","d","e"],"explanation":"Superior limbic keratoconjunctivitis is a chronic condition involving the superior limbus and cornea and the superior tarsal conjunctiva. The changes in the tarsal conjunctiva are typically papillary. The limbus is often thickened. Although the diagnosis is usually made clinically, in doubtful cases, impression cytology of the superior bulbar conjunctiva can be useful and this usually shows nuclear pyknosis, loss of goblet cells and keratinisation. Treatment includes the use of silver nitrate to the upper tarsal conjunctiva, resection of the bulbar conjunctiva and the use of a large-diameter contact lens.","quick_fix_ids":[],"source":{"question_pdf_page":134,"question_book_page":123,"answer_pdf_page":135,"answer_book_page":124},"primary_topic":"Cornea & External Eye","tags":["Surgery","Inflammation","Cornea"]},{"id":"FF237","question_number":237,"stem":"The ocular complications of bone marrow transplantation include:","options":["True","False"],"statements":[{"label":"a","text":"cataract","answer":"True","answer_bool":true},{"label":"b","text":"keratoconjunctivitis sicca","answer":"True","answer_bool":true},{"label":"c","text":"cotton wool spots","answer":"True","answer_bool":true},{"label":"d","text":"cicatricial lagophthalmos","answer":"True","answer_bool":true},{"label":"e","text":"corneal keratinisation.","answer":"True","answer_bool":true}],"correct_labels":["a","b","c","d","e"],"explanation":"Following bone marrow transplantation some patients can develop graft-versus-host disease. In the chronic form, patients may develop cataract, ocular surface abnormalities such as keratoconjunctivitis sicca, corneal keratinisation and skin abnormalities such as cicatricial lagophthalmos. Rarely, cotton wool spots and haemorrhages have been observed.","quick_fix_ids":[],"source":{"question_pdf_page":134,"question_book_page":123,"answer_pdf_page":135,"answer_book_page":124},"primary_topic":"Systemic Disease & Ocular Associations","tags":["Trauma","Cataract","Cornea","Cornea & External Eye","Lens, Cataract & Refractive Surgery"]},{"id":"FF238","question_number":238,"stem":"Enlargement of the optic canal occurs in:","options":["True","False"],"statements":[{"label":"a","text":"carotid cavernous fistula","answer":"False","answer_bool":false},{"label":"b","text":"fibrous dysplasia","answer":"False","answer_bool":false},{"label":"c","text":"sphenoidal meningioma","answer":"False","answer_bool":false},{"label":"d","text":"ophthalmic artery aneurysm","answer":"True","answer_bool":true},{"label":"e","text":"optic nerve glioma.","answer":"True","answer_bool":true}],"correct_labels":["d","e"],"explanation":"A lesion of the optic nerve can cause enlargement of the optic canal and this is seen in optic nerve meningioma and glioma. Ophthalmic artery aneurysm also causes enlargement. Carotid cavernous fistula does not affect the canal size. Sphenoidal meningioma causes hyperostosis and may reduce the size of the canal.","quick_fix_ids":[],"source":{"question_pdf_page":134,"question_book_page":123,"answer_pdf_page":135,"answer_book_page":124},"primary_topic":"Neuro-ophthalmology","tags":["Optic nerve","Oncology","Ocular Oncology & Pathology","Retina & Vitreous"]},{"id":"FF239","question_number":239,"stem":"Vitamin B12 deficiency:","options":["True","False"],"statements":[{"label":"a","text":"produces a decrease in central vision with relative sparing of peripheral vIsion","answer":"True","answer_bool":true},{"label":"b","text":"does not affect colour vision","answer":"False","answer_bool":false},{"label":"c","text":"may cause retinal haemorrhages","answer":"True","answer_bool":true},{"label":"d","text":"causes temporal pallor of the optic nerve in long-standing cases","answer":"True","answer_bool":true},{"label":"e","text":"is the actual cause of alcohol-tobacco amblyopia.","answer":"True","answer_bool":true}],"correct_labels":["a","c","d","e"],"explanation":"Vitamin B12 deficiency may give rise to optic neuropathy. Colour vision is affected and the visual field may show central or centro cecal scotoma. The posterior pole typically shows flame-shaped and dot-blot retinal haemorrhages. Temporal pallor of the optic nerve is common. It is a cause of amblyopia in alcohol-tobacco amblyopia.","quick_fix_ids":[],"source":{"question_pdf_page":134,"question_book_page":123,"answer_pdf_page":135,"answer_book_page":124},"primary_topic":"Neuro-ophthalmology","tags":["Trauma","Optic nerve","Visual field","Retina & Vitreous","Systemic Disease & Ocular Associations"]},{"id":"FF240","question_number":240,"stem":"The following lesions may be responsible for a Horner's pupil that dilates with 0.1 % adrenaline:","options":["True","False"],"statements":[{"label":"a","text":"Pancoast's tumour","answer":"False","answer_bool":false},{"label":"b","text":"syringomyelia","answer":"False","answer_bool":false},{"label":"c","text":"post-thyroidectomy","answer":"True","answer_bool":true},{"label":"d","text":"internal carotid artery aneurysm","answer":"True","answer_bool":true},{"label":"e","text":"post-sympathectomy for Raynaud's phenomenon.","answer":"True","answer_bool":true}],"correct_labels":["c","d","e"],"explanation":"A normal pupil does not react to 0.1 % adrenaline. However, in patients with post-ganglionic third-order lesions, denervation hypersensitivity develops, causing the pupil to dilate with 0.1 % adrenaline. Pancoast's tumour causes a second-order lesion and syringomyelia causes a first-order lesion. Third-order lesions may occur in post-thyroidectomy patients, internal carotid artery aneurysms and post-sympathectomy.","quick_fix_ids":["QF017"],"source":{"question_pdf_page":136,"question_book_page":125,"answer_pdf_page":137,"answer_book_page":126},"primary_topic":"Neuro-ophthalmology","tags":["Pharmacology","Pupil","Oncology","Ocular Oncology & Pathology","Systemic Disease & Ocular Associations"]}],"quick_fixes":[{"id":"QF001","title":"Quick fix","source_pdf_page":13,"source_book_page":2,"related_question_ids_on_page":["FF001","FF002","FF003","FF004"],"lead":null,"items":["Drugs that can cause retinal pigment epithelial dysfunction: (hydroxy)chloroquine, phenothiazine and desferrioxamine.","Drugs that can cause macular oedema: nicotinic acid, latanoprost and topical adrenaline.","Drugs that can cause crystalline retinopathy: tamoxifen, methoxyflurane and canthaxanthine."]},{"id":"QF002","title":"Quick fix","source_pdf_page":17,"source_book_page":6,"related_question_ids_on_page":["FF009","FF010","FF011","FF012"],"lead":null,"items":["The Optic Neuritis Treatment Trial (ONTT) showed that high-dose IV corticosteroids followed by oral corticosteroids accelerated visual recovery, but provided no long-term benefit to vision.","Oral corticosteroids alone did not improve visual outcome and were associated with an increased rate of recurrence of optic neuritis.","IV followed by oral corticosteroids reduced the rate of development of clinically definite multiple sclerosis during the first 2 years, particularly in patients with white lesions detected on MRI of the brain. This positive effect was no longer evident after 2 years."]},{"id":"QF003","title":"Quick fix","source_pdf_page":19,"source_book_page":8,"related_question_ids_on_page":["FF013","FF014","FF015","FF016"],"lead":null,"items":["Differentiation of unilateral from bilateral fourth nerve palsy is essential for successful surgical management.","Features of unilateral fourth nerve palsy include: head tilt to the affected side, unilateral hypertropia on lateral gaze, less than 5° of exocyclotorsion.","Features of bilateral fourth nerve palsy include: chin down posture with eyes looking up, alternating hypertropia on right and left gaze respectively, large exocyclotorsion of more than 10°."]},{"id":"QF004","title":"Quick fix","source_pdf_page":21,"source_book_page":10,"related_question_ids_on_page":["FF017","FF018","FF019","FF020"],"lead":null,"items":["The Diabetes Control and Complications Trial (DCCT) showed that tight glycaemic control in type I diabetes mellitus delayed onset and progression of diabetic retinopathy, neuropathy and nephropathy.","The United Kingdom Prospective Diabetes Study (UKPDS) showed that tight control of blood glucose and hypertension in type II diabetes mellitus reduces the risk of diabetic eye disease and macrovascular disorders such as stroke and renal disease."]},{"id":"QF005","title":"Quick fix","source_pdf_page":23,"source_book_page":12,"related_question_ids_on_page":["FF021","FF022","FF023","FF024"],"lead":null,"items":["Genetics of retinoblastoma are as follows: 94% sporadic and 6% familial.","Patients with bilateral retinoblastoma and some cases of unilateral retinoblastoma may have germline mutation.","The risk of offspring having the disease is as follows: if one parent has retinoblastoma: 40%; if both parents are normal and one sibling has unilateral retinoblastoma: 1%; if both parents are normal and one sibling has bilateral retinoblastoma: 6%."]},{"id":"QF006","title":"Quick fix","source_pdf_page":25,"source_book_page":14,"related_question_ids_on_page":["FF025","FF026","FF027","FF028"],"lead":"The risk of expulsive haemorrhage during cataract surgery may be reduced by the following measures:","items":["small incision surgery","control of intraocular pressure","control of systemic hypertension."]},{"id":"QF007","title":"Quick fix","source_pdf_page":27,"source_book_page":16,"related_question_ids_on_page":["FF029","FF030","FF031","FF032"],"lead":"Drugs that cause vortex keratopathy include:","items":["amiodarone","(hydroxyl) chloroquine","chlorpromazine","indomethacin","mepacrine","tamoxifen."]},{"id":"QF008","title":"Quick fix","source_pdf_page":29,"source_book_page":18,"related_question_ids_on_page":["FF033","FF034","FF035","FF036"],"lead":null,"items":["High intraocular pressure following trabeculectomy can be the result of either angle-closure glaucoma or malignant glaucoma.","In angle-closure glaucoma, a non-patent iridectomy is the usual cause. In malignant glaucoma, the iridectomy is patent.","In malignant glaucoma, the initial treatment of choice is medical with mydriatics and intravenous hyperosmotic agents."]},{"id":"QF009","title":"Quick fix","source_pdf_page":55,"source_book_page":44,"related_question_ids_on_page":["FF082","FF083","FF084"],"lead":null,"items":["The incidence of CMV retinitis in AIDS patients is related to the CD4 count. It is about 20% per year in AIDS patients with a CD4 count of less than 50 per cubic mm.","HAART (Highly Active AntiRetroviral Therapy) uses a combination of antiretroviral medication which increases the CD4 count and therefore reduces the incidence of CMV retinitis."]},{"id":"QF010","title":"Quick fix","source_pdf_page":63,"source_book_page":52,"related_question_ids_on_page":["FF096","FF097","FF098","FF099"],"lead":"Nystagmus of localising value include:","items":["down-beat nystagmus: lesion at the cervico-medullary junction","see-saw nystagmus: lesion at the optic chiasm","convergence-retraction nystagmus: mid-brain lesion","internuclear ophthalmoplegia: the lesion in the medial longitudinal fasciculus is ipsilateral to the side with the adduction deficit."]},{"id":"QF011","title":"Quick fix","source_pdf_page":83,"source_book_page":72,"related_question_ids_on_page":["FF135","FF136","FF137"],"lead":null,"items":["The benefit of photodynamic therapy (PDT) is shown in the TAP study (Photodynamic therapy of subfoveal choroidal neovascularisation in age-related macular degeneration with verteporfin).","PDT reduces visual loss from subfoveal subretinal neovascularisation caused by age-related macular degeneration."]},{"id":"QF012","title":"Quick fix","source_pdf_page":95,"source_book_page":84,"related_question_ids_on_page":["FF157","FF158","FF159","FF160"],"lead":null,"items":["Ultrasound travels slower in silicone oil (980m/sec) than in vitreous (1532m/sec).","Biometry in an eye with silicone oil gives a falsely longer axial length."]},{"id":"QF013","title":"Quick fix","source_pdf_page":115,"source_book_page":104,"related_question_ids_on_page":["FF196","FF197","FF198","FF199"],"lead":null,"items":["Herpetic eye disease studies showed that oral acyclovir does not have added benefit to herpetic keratitis if the patient is already on topical treatment.","Treatment with oral acyclovir during acute herpetic epithelial keratitis does not prevent the development of stromal keratitis.","Oral acyclovir following an acute attack of herpetic stromal keratitis may reduce the rate of recurrence.","Topical steroid is useful in speeding up the recovery of herpetic stromal keratitis."]},{"id":"QF014","title":"Quick fix","source_pdf_page":121,"source_book_page":110,"related_question_ids_on_page":["FF208","FF209","FF210","FF211"],"lead":null,"items":["Astigmatism following cataract surgery may be reduced by the following methods: limbal incision; temporal approach; smaller incision.","Indication for astigmatic keratotomy should be based on corneal astigmatism and not total astigmatism because of the contribution of lenticular astigmatism in the latter."]},{"id":"QF015","title":"Quick fix","source_pdf_page":123,"source_book_page":112,"related_question_ids_on_page":["FF212","FF213","FF214","FF215"],"lead":null,"items":["Full-thickness eyelid defects of extent up to 25% may be closed directly.","Defects of extent 25% to 66% require cantholysis for closure without undue tension.","Full-thickness eyelid defects of extent more than 66% require the use of flaps for satisfactory closure."]},{"id":"QF016","title":"Quick fix","source_pdf_page":125,"source_book_page":114,"related_question_ids_on_page":["FF216","FF217","FF218","FF219"],"lead":"Chemicals and drugs that may cause optic neuropathy include:","items":["alcohol","amiodarone","chloramphenicol","chlorpropamide","digitalis","ethambutol","isoniazide","methanol","streptomycin."]},{"id":"QF017","title":"Quick fix","source_pdf_page":137,"source_book_page":126,"related_question_ids_on_page":["FF240"],"lead":null,"items":["The following drops can be used to diagnose anisocoria: 4% cocaine, 1% pilocarpine, 0.1% pilocarpine, 1% hydroxyamphetamine and 0.1% adrenaline.","A miotic pupil that does not dilate with 4% cocaine suggests Horner's syndrome.","A miotic pupil caused by pre-ganglionic Horner's syndrome will dilate with 1% hydroxyamphetamine due to intact third-order neurones which release noradrenaline in response to 1% hydroxyamphetamine. A post-ganglionic Horner's pupil will not dilate with 1% hydroxyamphetamine.","A miotic pupil caused by post-ganglionic Horner's syndrome will dilate with 0.1% adrenaline due to denervation hypersensitivity. A pre-ganglionic Horner's pupil will not dilate with 0.1% adrenaline.","A mydriatic pupil that does not constrict with 1% pilocarpine suggests pharmacological mydriasis (for example, atropine).","A mydriatic pupil that constricts with 0.1% pilocarpine suggests Adie's pupil due to denervation hypersensitivity."]}]};

let ffStore=loadFF();let ffSession=null;let ffCurrent=0;let ffTimer=null;let ffDeadline=null;let ffFooterVerse=0;let ffAutosave=null;let drillState=null;let deckState=null;let pageSetState=null;
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function loadFF(){try{return {...FF_DEFAULT,...JSON.parse(localStorage.getItem(FF_KEY)||'{}')}}catch{return {...FF_DEFAULT}}}
function saveFF(){localStorage.setItem(FF_KEY,JSON.stringify(ffStore));if(location.hash==='#ff')updateFFTopProgress()}
function collectionStrip(name,meta=''){return `<div class="collection-strip"><button class="collection-back" data-library>← Collections</button><span class="collection-name">${esc(name)}</span><span class="collection-meta">${esc(meta)}</span></div>`}
function libraryStats(){let c={done:0,accuracy:0};try{const s=JSON.parse(localStorage.getItem(CLINICAL_KEY)||'{}');const arr=Object.values(s.attempts||{}).filter(x=>x?.checked);c.done=arr.length;const total=arr.length*5,correct=arr.reduce((n,a)=>n+(a.score||0),0);c.accuracy=total?Math.round(correct/total*100):0}catch{}const f=ffStats();return {c,f}}
function ffStats(){const seenGroups=new Set();let correct=0,seen=0;for(const [key,st] of Object.entries(ffStore.statementStats||{})){if((st.seen||0)>0){seenGroups.add(key.split(':')[0]);correct+=(st.correct||0);seen+=(st.seen||0)}}for(const [qid,a] of Object.entries(ffStore.attempts||{})){if(a?.checked)seenGroups.add(qid)}return{done:seenGroups.size,accuracy:seen?Math.round(correct/seen*100):0,seen,correct,flagged:(ffStore.flaggedQuestions||[]).length,due:dueQuickFixes().length}}

function renderLibrary(){document.body.className='';const {c,f}=libraryStats();OUTER.innerHTML=`<div class="library-shell"><main class="library-main"><div class="verse-panel home-verses"><blockquote class="verse">“In the name of Allah, the Most Gracious, the Most Merciful”<cite>Al-Quran 1:1</cite></blockquote><blockquote class="verse">“They said, ‘Glory be to You! We have no knowledge except what You have taught us. You are truly the All-Knowing, All-Wise.’”<cite>Al-Quran 2:32</cite></blockquote></div><section class="hero library-hero"><div class="eyebrow">Ophthalmology Part 2 · Study Library</div><h1>Choose your question collection.</h1><p>Two source-faithful true/false banks in one standalone file, with separate progress, saved sessions and review queues.</p></section><section class="collection-grid"><article class="card collection-card"><span class="collection-badge">Existing bank</span><h2>Clinical Ophthalmology</h2><p>Section-based MCQ bank from <em>MCQs in Clinical Ophthalmology</em>.</p><div class="collection-points"><span>300 question groups · 1,500 statements</span><span>10 clinical sections · Study, Test, Mock and Review</span><span>Identifiers shown as CO-001 to CO-300</span></div><div class="mini-meter"><i style="width:${c.done/3}%"></i></div><div class="progress-inline"><b>${c.done}/300</b> groups attempted${c.done?` · ${c.accuracy}% accuracy`:''}</div><div class="collection-actions"><button class="btn btn-primary" data-open-collection="clinical">Open Clinical Ophthalmology</button></div></article><article class="card collection-card"><span class="collection-badge">New collection</span><h2>Ophthalmology Fact Fixer</h2><p>240 deliberately mixed question groups with explanatory answers and 17 separate Quick Fix cards.</p><div class="collection-points"><span>240 groups · 1,200 True/False statements</span><span>Book order, guided study, source-style test and rapid drill</span><span>Identifiers FF-001 to FF-240 · no negative marking</span></div><div class="mini-meter"><i style="width:${f.done/2.4}%"></i></div><div class="progress-inline"><b>${f.done}/240</b> groups encountered${f.seen?` · ${f.accuracy}% statement accuracy`:''}</div><div class="collection-actions"><button class="btn btn-primary" data-open-collection="ff">Open Fact Fixer</button></div></article></section><div class="library-footer">Progress is stored locally in this browser and remains separate for each source.</div></main></div>`;wireOuter()}

function sourcePageSets(){const m=new Map();for(const q of FF_DATA.questions){const k=q.source.question_book_page;if(!m.has(k))m.set(k,{bookPage:k,pdfPage:q.source.question_pdf_page,answerBook:q.source.answer_book_page,answerPdf:q.source.answer_pdf_page,questions:[]});m.get(k).questions.push(q)}return [...m.values()].sort((a,b)=>a.bookPage-b.bookPage)}
function startPageSet(i){const pages=sourcePageSets(),p=pages[Math.max(0,Math.min(i,pages.length-1))],saved=ffStore.pageSet||{},same=(saved.pageIndex===i);pageSetState={pages,pageIndex:i,page:p,answers:same&&saved.answers?JSON.parse(JSON.stringify(saved.answers)):{},revealed:same&&!!saved.revealed};p.questions.forEach(q=>{if(!Array.isArray(pageSetState.answers[q.id]))pageSetState.answers[q.id]=[null,null,null,null,null]});renderPageSet()}
function renderPageSet(){const p=pageSetState.page;ffApp().innerHTML=`<section class="page"><div class="page-set-banner card"><div><div class="eyebrow">Original page set ${pageSetState.pageIndex+1} of ${pageSetState.pages.length}</div><h2 style="margin:4px 0 0">Book p.${p.bookPage} · PDF p.${p.pdfPage}</h2><p>${p.questions.map(q=>ffDisplayId(q.id)).join(' · ')}</p></div><button class="btn btn-ghost" data-ff-home>Exit</button></div><div class="page-set-shell">${p.questions.map(q=>pageSetQuestion(q)).join('')}</div>${pageSetState.revealed?`<div class="page-set-answer"><h3>Paired answer page · Book p.${p.answerBook} · PDF p.${p.answerPdf}</h3><p>Answers and source explanations are now shown beneath each question group.</p></div>`:`<button class="btn btn-primary" id="revealPageSet" style="width:100%;margin-top:18px">Reveal paired answer page</button>`}<div class="setup-actions" style="margin-top:18px"><button class="btn btn-ghost" id="prevPageSet" ${pageSetState.pageIndex===0?'disabled':''}>Previous page set</button><button class="btn btn-primary" id="nextPageSet" ${pageSetState.pageIndex===pageSetState.pages.length-1?'disabled':''}>Next page set</button></div>${ffFooter()}</section>`;wireFFGlobal();document.querySelectorAll('[data-page-answer]').forEach(b=>b.onclick=()=>{const qid=b.dataset.pageAnswer,idx=+b.dataset.iPage,v=b.dataset.v==='true';pageSetState.answers[qid][idx]=v;ffStore.pageSet={pageIndex:pageSetState.pageIndex,answers:pageSetState.answers,revealed:pageSetState.revealed};saveFF();renderPageSet()});document.querySelectorAll('[data-page-flag]').forEach(b=>b.onclick=()=>{togglePageFlag(b.dataset.pageFlag)});document.getElementById('revealPageSet')?.addEventListener('click',()=>{pageSetState.revealed=true;for(const q of p.questions)recordGroupAttempt(q,pageSetState.answers[q.id],'page-set',true);ffStore.pageSet={pageIndex:pageSetState.pageIndex,answers:pageSetState.answers,revealed:true};saveFF();renderPageSet()});document.getElementById('prevPageSet').onclick=()=>movePageSet(-1);document.getElementById('nextPageSet').onclick=()=>movePageSet(1)}
function pageSetQuestion(q){const ans=pageSetState.answers[q.id],reveal=pageSetState.revealed,score=reveal?scoreGroup(q,ans):null;return `<article class="card question-card"><div class="q-kicker">Fact Fixer · ${ffDisplayId(q.id)} · Question ${q.question_number}<span class="pill">${esc(q.primary_topic)}</span><span class="page-ref">Book p.${q.source.question_book_page} · PDF p.${q.source.question_pdf_page}</span></div><h2 class="q-title">${esc(q.stem)}</h2><div class="statements">${q.statements.map((s,i)=>`<div class="statement ${reveal?(ans[i]===null?'unanswered':ans[i]===s.answer_bool?'correct':'incorrect'):''}"><div class="statement-letter">${s.label}</div><div class="statement-text">${esc(s.text)}</div><div class="tf"><button data-page-answer="${q.id}" data-i-page="${i}" data-v="true" class="${ans[i]===true?'selected':''}" ${reveal?'disabled':''}>True</button><button data-page-answer="${q.id}" data-i-page="${i}" data-v="false" class="${ans[i]===false?'selected':''}" ${reveal?'disabled':''}>False</button></div>${reveal?`<div class="correct-answer">Correct answer: ${s.answer_bool?'True':'False'}</div>`:''}</div>`).join('')}</div>${reveal?revealedFFPanels(q,score,ans):''}<div class="q-actions"><button class="btn btn-ghost flag-btn ${(ffStore.flaggedQuestions||[]).includes(q.id)?'flagged':''}" data-page-flag="${q.id}">${(ffStore.flaggedQuestions||[]).includes(q.id)?'★ Flagged':'☆ Flag'}</button></div></article>`}
function togglePageFlag(qid){const a=ffStore.flaggedQuestions||(ffStore.flaggedQuestions=[]),i=a.indexOf(qid);if(i>=0)a.splice(i,1);else a.push(qid);saveFF();renderPageSet()}
function movePageSet(d){const ni=pageSetState.pageIndex+d;if(ni<0||ni>=pageSetState.pages.length)return;const p=pageSetState.pages[ni];pageSetState={pages:pageSetState.pages,pageIndex:ni,page:p,answers:{},revealed:false};p.questions.forEach(q=>pageSetState.answers[q.id]=[null,null,null,null,null]);ffStore.pageSet={pageIndex:ni};saveFF();renderPageSet();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')autosaveFF('hidden')});window.addEventListener('pagehide',()=>autosaveFF('pagehide'));route();
</script>
</body>
</html>
