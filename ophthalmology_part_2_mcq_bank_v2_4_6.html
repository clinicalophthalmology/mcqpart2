<script>window.BANK={"metadata":{"title":"Ophthalmology Part 2 MCQ Question Bank","source_title":"MCQs in Clinical Ophthalmology","source_authors":["Chua Chung Nen","Ngo Chek Tung","Chieng Lee Ling"],"source_edition":"First edition, 2010","question_format":"Five-statement true/false groups","total_question_groups":300,"total_statements":1500,"section_count":10,"provenance_note":"Questions, printed keys and explanations were transcribed from the supplied scanned PDF. OCR artefacts were normalized where identifiable.","clinical_note":"This historical source should be used for exam practice, not as a substitute for current clinical guidance."},"sections":[{"id":1,"name":"Cornea and external eye disease","question_groups":30,"statements":150},{"id":2,"name":"Lens and cataract","question_groups":30,"statements":150},{"id":3,"name":"Glaucoma","question_groups":30,"statements":150},{"id":4,"name":"Oculoplastic","question_groups":30,"statements":150},{"id":5,"name":"Uveitis","question_groups":30,"statements":150},{"id":6,"name":"Retina and vitreous","question_groups":30,"statements":150},{"id":7,"name":"Ocular motility","question_groups":30,"statements":150},{"id":8,"name":"Neuro-ophthalmology","question_groups":30,"statements":150},{"id":9,"name":"Paediatric ophthalmology","question_groups":30,"statements":150},{"id":10,"name":"Pathology","question_groups":30,"statements":150}],"questions":[{"section":"Cornea and external eye disease","section_question":1,"source_question_pdf_page":3,"source_question_printed_page":5,"stem":"Normal commensals of the human conjunctiva include","statements":[{"label":"a","text":"Staphylococcus aureus","answer":true},{"label":"b","text":"Staphylococcus epidermidis","answer":true},{"label":"c","text":"Streptococcus viridans","answer":false},{"label":"d","text":"Pseudomonas aeruginosa","answer":false},{"label":"e","text":"Bacillus cereus","answer":false}],"answer_key":"TTFFF","true_statements":["a","b"],"false_statements":["c","d","e"],"explanation":"Other commensals include Corynebacterium spp, Propionibacterium acnes, micrococcus spp. Haemophilus influenza, Moraxella spp. Bacillus spp and Demodex spp.","source_answer_pdf_page":9,"source_answer_printed_page":11,"id":1},{"section":"Cornea and external eye disease","section_question":2,"source_question_pdf_page":3,"source_question_printed_page":5,"stem":"Regarding Kaposi sarcoma of the conjunctiva","statements":[{"label":"a","text":"it may be mistaken for subconjunctival haemorrhage","answer":true},{"label":"b","text":"the superior fornix is more commonly involved than the lower fornix","answer":false},{"label":"c","text":"itarises from the venous endothelium","answer":true},{"label":"d","text":"without treatment, deep penetration is common","answer":false},{"label":"e","text":"radiation is an effective treatment","answer":true}],"answer_key":"TFTFT","true_statements":["a","c","e"],"false_statements":["b","d"],"explanation":"Kaposi's sarcoma may resemble subconjunctival haemorrhage but does not resolve spontaneously. Most cases are associated with AIDS. Inferior fornix is more commonly involved than the superior fornix. Deep penetration is rare, even without treatment. The tumour can be excised completely if small. External beam radiation is effective for extensive lesion.","source_answer_pdf_page":9,"source_answer_printed_page":11,"id":2},{"section":"Cornea and external eye disease","section_question":3,"source_question_pdf_page":3,"source_question_printed_page":5,"stem":"True statements about ocular mucous membrane pemphigoid (OMMP)","statements":[{"label":"a","text":"it is more common in female than male","answer":true},{"label":"b","text":"obliteration of the caruncle is common","answer":true},{"label":"c","text":"shortening of the inferior fornix usually precedes the formation of symblepharon","answer":true},{"label":"d","text":"the tear deficiency is caused by mucous deficiency","answer":true},{"label":"e","text":"dapsone can be used to control the inflammation","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"iit OMMP usually occur in female of more than 60 years old. Obliteration of the caruncle is a common feature. Repeated conjunctival inflammation leads to be shortening of the fornix and dry eye. The later is caused chiefly by deficiency of mucous production. Systemic steroid can control the disease activity but because of the side effects associated with its long term use, other immunosuppressive drugs are usually employed. Dapsone is recommended for mild-to-moderate inflammation provided the patient is not glucose-6-phosphate dehydrogenase : deficient.","source_answer_pdf_page":9,"source_answer_printed_page":11,"id":3},{"section":"Cornea and external eye disease","section_question":4,"source_question_pdf_page":3,"source_question_printed_page":5,"stem":"Regarding trachoma","statements":[{"label":"a","text":"itis transferred by flies","answer":true},{"label":"b","text":"in the acute phase papillary conjunctivitis is common","answer":false},{"label":"c","text":". Herbert's pits can be found at the limbus","answer":true},{"label":"d","text":"multiple recurrent infections are needed to cause visual disabling conditions","answer":true},{"label":"e","text":"the visual loss is caused by corneal scars as a result of entropion","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"Trachoma is transferred by common fly. It is associated with follicular conjunctivitis. Herbert's pits refer to cavities in the limbus seen after the healing of a limbal follicle in trachoma. Visual loss is due to corneal scarring as a result of cicatricial entropion. Recurrent infections are needed for this to occur.","source_answer_pdf_page":9,"source_answer_printed_page":11,"id":4},{"section":"Cornea and external eye disease","section_question":5,"source_question_pdf_page":3,"source_question_printed_page":5,"stem":"Pterygium","statements":[{"label":"a","text":"is commoner in tropical countries than temperate countries","answer":true},{"label":"b","text":"occurs mostly on the nasal side","answer":true},{"label":"c","text":"causes with the rule astigmatism","answer":false},{"label":"d","text":"causes ocular irritation through uneven distribution of tear film","answer":true},{"label":"e","text":"_ is best treated with bare sclera excision","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"Pterygium is associated with the length of ultraviolet exposure. Therefore, it is more common in the tropical than temperate regions. The majority occurs on the nasal side. Pterygium causes against the rule astigmatism. Irritation results from drying of the tissue as a result of uneven tear film distribution. Bare sclera excision is associated with a higher rate of recurrence. Conjunctival graft over the bare sclera is recommended after pterygium excision.","source_answer_pdf_page":9,"source_answer_printed_page":11,"id":5},{"section":"Cornea and external eye disease","section_question":6,"source_question_pdf_page":4,"source_question_printed_page":6,"stem":"Phthirus pubis (crab louse): u","statements":[{"label":"a","text":"is the only pediculosis that infest the eyelashes","answer":true},{"label":"b","text":"is usually acquired through sexual contact =","answer":true},{"label":"c","text":"is similar to the type that infest the scalp","answer":false},{"label":"d","text":"causes ocular irritation due to injection of toxic saliva into the eyelid","answer":true},{"label":"e","text":"canbe destroyed with physostigmine 0.25% a","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"Phithirus pubis also known as pubic louse. It is the only pediculosis that infests the _ eyelashes. It is different from head louse (Pediculus capiti). The majority is 25 acquired through sexual contact. Physostigmine 0.25% applied to the eyelashes can - kill the louse. =","source_answer_pdf_page":10,"source_answer_printed_page":12,"id":6},{"section":"Cornea and external eye disease","section_question":7,"source_question_pdf_page":4,"source_question_printed_page":6,"stem":"In acne rosacea","statements":[{"label":"a","text":"tear deficiency is due to poor lipid production","answer":true},{"label":"b","text":"chronic meibomianitis is the most common ocular manifestation ,","answer":true},{"label":"c","text":"keratopathy is usually more severe superiorly than inferiorly","answer":false},{"label":"d","text":"topical steroid should never be used","answer":false},{"label":"e","text":"prolonged doxycycline is useful in controlling ocular symptoms","answer":true}],"answer_key":"TTFFT","true_statements":["a","b","e"],"false_statements":["c","d"],"explanation":"Keratopathy is more severe inferiorly. Topical steroid reduces the inflammation but . should be used with cautions because of cornea thinning that may cause perforation. Doxycycline is useful against inflammatory pustules and papules. Its action is anti- : inflammatory rather than anti-bacterial.","source_answer_pdf_page":10,"source_answer_printed_page":12,"id":7},{"section":"Cornea and external eye disease","section_question":8,"source_question_pdf_page":4,"source_question_printed_page":6,"stem":"Infections that give rise to membranous or pseudomembraneous i conjunctivitis include","statements":[{"label":"a","text":"Staphylococcus aureus","answer":true},{"label":"b","text":"diphtheria","answer":true},{"label":"c","text":"gonococcus","answer":true},{"label":"d","text":"herpes simplex","answer":true},{"label":"e","text":"adult inclusion conjunctivitis","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Adult inclusion conjunctivitis causes follicular conjunctivitis but not membranous or pseudomembranous conjunctivitis.","source_answer_pdf_page":10,"source_answer_printed_page":12,"id":8},{"section":"Cornea and external eye disease","section_question":9,"source_question_pdf_page":4,"source_question_printed_page":6,"stem":"Conditions in which follicular conjunctivitis is more severe inferiorly than superiorly include","statements":[{"label":"a","text":"drug allergy","answer":true},{"label":"b","text":"trachoma","answer":false},{"label":"c","text":"adenoviral conjunctivitis","answer":true},{"label":"d","text":"adult inclusion conjunctivitis","answer":true},{"label":"e","text":"molluscum contagiosum","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"In trachoma, follicular conjunctivitis is more common superiorly than inferiorly. In the other conditions listed, the follicular conjunctivitis is more common inferiorly than superiorly. q","source_answer_pdf_page":10,"source_answer_printed_page":12,"id":9},{"section":"Cornea and external eye disease","section_question":10,"source_question_pdf_page":4,"source_question_printed_page":6,"stem":"Corneal oedema that is secondary to endothelium insufficiency is worsened by","statements":[{"label":"a","text":"dry environment","answer":false},{"label":"b","text":"prolonged eyelid closure","answer":true},{"label":"c","text":"wearing contact lens","answer":true},{"label":"d","text":"raised intraocular pressure","answer":true},{"label":"e","text":"use of topical acetazolamide","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"Dry environment increases evaporation and reduces corneal oedema. Prolonged eyelid closure and the use of contact lens reduce tear evaporation and increases corneal oedema. Raised intraocular pressure increases the movement of aqueous into the stroma. Acetazolamide impairs endothelium and worsens the oedema.","source_answer_pdf_page":10,"source_answer_printed_page":12,"id":10},{"section":"Cornea and external eye disease","section_question":11,"source_question_pdf_page":5,"source_question_printed_page":7,"stem":"Amniotic membrane has the following properties when applied to the corneal surface","statements":[{"label":"a","text":"anti-angiogenesis","answer":true},{"label":"b","text":"anti-inflammatory","answer":true},{"label":"c","text":"providing nerve growth factor","answer":false},{"label":"d","text":"provide limbal stem cell","answer":false},{"label":"e","text":"providing scaffolding for existing stem cell to grow","answer":true}],"answer_key":"TTFFT","true_statements":["a","b","e"],"false_statements":["c","d"],"explanation":"Amniotic membrane has anti-angiogenesis and anti-inflammatory properties. It also provides scaffolding for the limbal stem cells to populate the cornea. However, it does not provide limbal stem cells or nerve growth factors.","source_answer_pdf_page":10,"source_answer_printed_page":12,"id":11},{"section":"Cornea and external eye disease","section_question":12,"source_question_pdf_page":5,"source_question_printed_page":7,"stem":"Regarding herpetic disease and the eye","statements":[{"label":"a","text":"herpetic keratitis is the primary presentation of herpetic eye disease","answer":false},{"label":"b","text":"1/3 of herpetic keratitis progress to disciform keratitis","answer":false},{"label":"c","text":"oral acyclovir during acute herpetic keratitis prevents the development of disciform keratitis","answer":false},{"label":"d","text":"oral acyclovir reduces the recurrence of herpetic disciform keratitis","answer":true},{"label":"e","text":"topical steroid is contraindicated for disciform keratitis","answer":false}],"answer_key":"FFFTF","true_statements":["d"],"false_statements":["a","b","c","e"],"explanation":"Blepharoconjunctivitis is the primary presenting feature of herpetic eye disease. Less than 15% of the patients with recurrence herpetic eye disease develop disciform keratitis. Oral acyclovir has no effect on prevention of development of disciform keratitis. Topical steroid is useful in disciform keratitis.","source_answer_pdf_page":10,"source_answer_printed_page":12,"id":12},{"section":"Cornea and external eye disease","section_question":13,"source_question_pdf_page":5,"source_question_printed_page":7,"stem":"Congenital limbal stem cell deficiency occurs in","statements":[{"label":"a","text":"aniridia","answer":true},{"label":"b","text":"albinism","answer":false},{"label":"c","text":"ectodermal dysplasia","answer":true},{"label":"d","text":"congenital glaucoma","answer":false},{"label":"e","text":"Riley- Day's syndrome","answer":false}],"answer_key":"TFTFF","true_statements":["a","c"],"false_statements":["b","d","e"],"explanation":"the Limbal stem-cell deficiency can be primary, related to an insufficient stromal y is microenvironment to support stem cell function, such as aniridia, congenital i erythrokeratodermia, keratitis associated with multiple endocrine deficiencies, neurotrophic (neural and ischaemic) keratopathy and chronic limbitis; or secondary (more common) related to external factors that destroy limbal stem cells such as chemical (most common) or thermal injuries.","source_answer_pdf_page":11,"source_answer_printed_page":13,"id":13},{"section":"Cornea and external eye disease","section_question":14,"source_question_pdf_page":5,"source_question_printed_page":7,"stem":"Terrien's marginal degeneration","statements":[{"label":"a","text":"is more common in female than male","answer":false},{"label":"b","text":"is usually associated with systemic collagen vascular disease","answer":false},{"label":"c","text":"is painless","answer":true},{"label":"d","text":"causes poor vision mainly through astigmatism","answer":true},{"label":"e","text":"causes peripheral corneal thinning with loss of epithelium","answer":false}],"answer_key":"FFTTF","true_statements":["c","d"],"false_statements":["a","b","e"],"explanation":"Terrien's marginal degeneration is more common in male than female. It causes astigmatism. It is localized condition. Blurred vision is due to high astigmatism, which is usually against-the-rule or oblique. There is no loss of epithelium.","source_answer_pdf_page":11,"source_answer_printed_page":13,"id":14},{"section":"Cornea and external eye disease","section_question":15,"source_question_pdf_page":5,"source_question_printed_page":7,"stem":"The following corneal dystrophies show autosomal dominant inheritance","statements":[{"label":"a","text":"_ lattice dystrophy","answer":true},{"label":"b","text":"macular dystrophy","answer":false},{"label":"c","text":"granular dystrophy","answer":true},{"label":"d","text":"posterior polymorphous dystrophy","answer":true},{"label":"e","text":"Meesman dystrophy","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"Macular dystrophy is an autosomal recessive condition.","source_answer_pdf_page":11,"source_answer_printed_page":13,"id":15},{"section":"Cornea and external eye disease","section_question":16,"source_question_pdf_page":6,"source_question_printed_page":8,"stem":"True statements about keratoconus include","statements":[{"label":"a","text":"itis commoner in the Far East than in Europe /","answer":false},{"label":"b","text":"the irregular astigmatism can be corrected with soft contact lens","answer":false},{"label":"c","text":"the occurrence of hydrops requires immediate cornea surgery to avoid perforation","answer":false},{"label":"d","text":"Fleischer's ring refers to deposition of iron in the epithelium commonly found in the centre of the cone","answer":false},{"label":"e","text":"the risk of rejection is low following penetrating keratoplasty é","answer":true}],"answer_key":"FFFFT","true_statements":["e"],"false_statements":["a","b","c","d"],"explanation":"In Keratoconus is more common in European than in the Far East. The associated rly irregular astigmatism can only be corrected by hard contact lens. In hydrops breaks occurs in the Descemet layer leading to central stromal oedema. Treatment of hydrops is palliative, the application of contact lens and oral analgesia are usually adequate. If significant scarring occurs when the oedema resolves, keratoplasty may be indicated. Fleischer's ring is found at inferior of the cone. Corneal graft has a high success rate in keratoconus.","source_answer_pdf_page":11,"source_answer_printed_page":13,"id":16},{"section":"Cornea and external eye disease","section_question":17,"source_question_pdf_page":6,"source_question_printed_page":8,"stem":"Causes of filamentary keratitis include: F","statements":[{"label":"a","text":"blepharospasm","answer":true},{"label":"b","text":"floppy eyelid syndrome","answer":true},{"label":"c","text":"ocular cicatricial pemphigoid","answer":false},{"label":"d","text":"neurotrophic keratitis","answer":true},{"label":"e","text":"recurrent erosion syndrome","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"Ocular cicatricial pemphigoid destroys the mucous producing conjunctival surface and is therefore not associated with filamentary keratitis.","source_answer_pdf_page":11,"source_answer_printed_page":13,"id":17},{"section":"Cornea and external eye disease","section_question":18,"source_question_pdf_page":6,"source_question_printed_page":8,"stem":"Regarding abnormal corneal size","statements":[{"label":"a","text":"megalocornea is defined as a cornea with a vertical diameter greater than 13 mm","answer":false},{"label":"b","text":"megalocornea is more common in men than women","answer":true},{"label":"c","text":"megalocornea is associated with hyperopia","answer":false},{"label":"d","text":"microcornea is associated with shallow anterior chamber","answer":true},{"label":"e","text":"microcornea is associated with myopia","answer":false}],"answer_key":"FTFTF","true_statements":["b","d"],"false_statements":["a","c","e"],"explanation":"+3 Megalocornea is defined by a horizontal diameter of greater than 13mm. Megalocorea is associated with myopia and microcornea is associated with hyperopia","source_answer_pdf_page":11,"source_answer_printed_page":13,"id":18},{"section":"Cornea and external eye disease","section_question":19,"source_question_pdf_page":6,"source_question_printed_page":8,"stem":"Regarding bacterial corneal infection in contact lens users","statements":[{"label":"a","text":"corneal infection is commoner amongst soft contact lens than rigid gas permeable contact lens wearers","answer":true},{"label":"b","text":"Pseudomonas aeruginosa is the most common pathogen isolated","answer":true},{"label":"c","text":"intensive chloramphenicol is the initial treatment of choice","answer":false},{"label":"d","text":"anterior chamber wash-out of hypopyon helps to speed up recovery","answer":false},{"label":"e","text":"topical steroid should not be used at any stages of the healing to avoid corneal perforation","answer":false}],"answer_key":"TTFFF","true_statements":["a","b"],"false_statements":["c","d","e"],"explanation":"op : ; ' - of Fluoroquinolone is the initial treatment of choice. Hypopyon is usually sterile and the result of reactive inflammation. Topical steroid can be used at the healing stage to reduce scarring. =","source_answer_pdf_page":11,"source_answer_printed_page":13,"id":19},{"section":"Cornea and external eye disease","section_question":20,"source_question_pdf_page":6,"source_question_printed_page":8,"stem":"True statements about Acanthamoeba and its ocular features","statements":[{"label":"a","text":"culture requires the use of non-nutrient agar overlaid with Escherichia coli","answer":true},{"label":"b","text":"it is stained positive with Calcofluor white visible with fluorescence microscopy","answer":false},{"label":"c","text":"the cyst form is resistant to most chemicals","answer":true},{"label":"d","text":"_ perineural keratitis is common","answer":true},{"label":"e","text":"it causes pain out of proportion to the degree of corneal ulcer","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"In Acanthamoeba keratitis, the specimen should be cultured on non-nutrient agar with E. coli (or other coliform) overlay. Scrapings can be stained with Giemsa or valeafour white (which is visible with UV light). The cyst is the dormant form of > '{eanthamoeba. It is encased in a tough proteoglycan coat, making it difficult to treat, It can remain viable almost indefinitely in extremely adverse conditions. 3","source_answer_pdf_page":12,"source_answer_printed_page":14,"id":20},{"section":"Cornea and external eye disease","section_question":21,"source_question_pdf_page":7,"source_question_printed_page":9,"stem":"Acanthamoeba keratitis","statements":[{"label":"a","text":"may be mistreated as herpetic keratitis","answer":true},{"label":"b","text":"is easier to eradicate if the infection is confined to the epithelium","answer":true},{"label":"c","text":"can be treated with cationic antiseptics","answer":true},{"label":"d","text":"responds to diamidines","answer":true},{"label":"e","text":"can be treated with anti-fungal agent alone","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Acanthamoeba keratitis may mimic herpetic keratitis and many cases are initially managed with topical acyclovir. Keratitis is easier to eradicate if the infection has a hot invaded the stroma, Cationic antiseptic agents such as chlorhexidine (0.02%) or = polyhexamethylene biguanide (PHMB, 0.02%) are effective. They are often q combined with a diamidine, either propamidine (Brolene) or hexamidine .(Desmodine). Topical imidazoles, an anti-fungal agent, when applied in a 1% solution, are effective against trophozoites, but not against the cysts. 1","source_answer_pdf_page":12,"source_answer_printed_page":14,"id":21},{"section":"Cornea and external eye disease","section_question":22,"source_question_pdf_page":7,"source_question_printed_page":9,"stem":"Concerning fungal keratitis","statements":[{"label":"a","text":"an outdoor eye trauma is usually present","answer":true},{"label":"b","text":"Fusarium is the most common pathogen worldwide","answer":true},{"label":"c","text":"infiltrate with feathery margin is more common than immune ring","answer":true},{"label":"d","text":"topical amphotericin B is effective against most fungal keratitis","answer":false},{"label":"e","text":"about 1/3 of patients develop corneal perforation despite treatment.","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Fusarium species followed by Aspergillus species are the most common pathogens in fungal keratitis. The predisposing factors are trauma (especially if vegetation is involved), contact lens use and chronic topical steroid application. Infiltrates with feathery margins are seen in 70% of cases and immune ring is infrequently seen Amphotericin B covers Candida species and Aspergillus species but not Fusarium species, Corneal perforation is common with fungal keratitis despite treatment.","source_answer_pdf_page":12,"source_answer_printed_page":14,"id":22},{"section":"Cornea and external eye disease","section_question":23,"source_question_pdf_page":7,"source_question_printed_page":9,"stem":"Compared with dendrites caused by herpes simplex, those seen in herpes zoster","statements":[{"label":"a","text":"are larger","answer":false},{"label":"b","text":"more branching","answer":true},{"label":"c","text":"have no terminal bulb","answer":true},{"label":"d","text":"contain an overlying layer of epithelial plaque","answer":true},{"label":"e","text":"are not stained with rose Bengal","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"Dendrites caused by herpes zoster are smaller, have more branching and contain no terminal bulb. An overlying layer of epithelial plaque is commonly seen in herpes zoster dendrites. Unlike herpes simplex dendrites, the lesion does not stain with Rose Bengal.","source_answer_pdf_page":12,"source_answer_printed_page":14,"id":23},{"section":"Cornea and external eye disease","section_question":24,"source_question_pdf_page":7,"source_question_printed_page":9,"stem":"Regarding the use of tissue adhesive for corneal perforation","statements":[{"label":"a","text":"the corneal surface must be dry to ensure adhesion of the applied material","answer":true},{"label":"b","text":"success rate is higher with a small than large corneal perforation","answer":true},{"label":"c","text":"contact lens is required following the application","answer":true},{"label":"d","text":"solidification occurs rapidly on contact with the cornea","answer":true},{"label":"e","text":"corneal burnt is a problem from the heat released","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Tissue adhesive requires a dry surface for its application. A smaller perforation responds better than a large perforation. Contact lens should be applied over the adhesive to avoid movement of the eyelids from dislodging it. Heat release is too minimal to cause cornea burn.","source_answer_pdf_page":12,"source_answer_printed_page":14,"id":24},{"section":"Cornea and external eye disease","section_question":25,"source_question_pdf_page":7,"source_question_printed_page":9,"stem":"Regarding radial corneal incisions","statements":[{"label":"a","text":"they cause corneal flattening 90° away from the meridian of the incision","answer":true},{"label":"b","text":"they have more effect the deeper the cut","answer":true},{"label":"c","text":"they have more effect the longer the cut","answer":true},{"label":"d","text":"they have more effect the closer they are to the visual axis","answer":true},{"label":"e","text":"they weaken the cornea making it more prone to rupture during trauma","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Radial corneal incisions causes corneal flattening and thereby reduces the power of the cornea. It is used to treat myopia. However, corneal incision weakens the cornea and predisposes it to trauma","source_answer_pdf_page":13,"source_answer_printed_page":15,"id":25},{"section":"Cornea and external eye disease","section_question":26,"source_question_pdf_page":8,"source_question_printed_page":10,"stem":"Refractive procedures that flatten the cornea include","statements":[{"label":"a","text":"LASIK","answer":true},{"label":"b","text":"LASEK","answer":true},{"label":"c","text":"photorefractive keratectomy","answer":true},{"label":"d","text":"_intracorneal ring","answer":true},{"label":"e","text":"thermal keratoplasty","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Thermal keratoplasty increases the curvature of the cornea and its power and is used to correct hyperopia.","source_answer_pdf_page":13,"source_answer_printed_page":15,"id":26},{"section":"Cornea and external eye disease","section_question":27,"source_question_pdf_page":8,"source_question_printed_page":10,"stem":"The advantages of LASIK (laser-assisted in situ keratomileusis) over PRK (photorefractive keratectomy) include","statements":[{"label":"a","text":"reduced pain","answer":true},{"label":"b","text":"reduced stromal haze x","answer":false},{"label":"c","text":"faster epithelial healing '","answer":true},{"label":"d","text":"reduced incidence of endophthalmitis ts","answer":false},{"label":"e","text":"reduced incidence of corneal perforation \" a","answer":false}],"answer_key":"TFTFF","true_statements":["a","c"],"false_statements":["b","d","e"],"explanation":"jad Because the epithelium is not removed, LASIK is less painful than PRK. The Nor creation of flap in LASIK increases the risk of stromal haze. There were no fien documented benefits of LASIK over PRK in term of risk of endophthalmitis or line corneal perforation. 1%","source_answer_pdf_page":13,"source_answer_printed_page":15,"id":27},{"section":"Cornea and external eye disease","section_question":28,"source_question_pdf_page":8,"source_question_printed_page":10,"stem":"Regarding corneal allograft rejection:","statements":[{"label":"a","text":"epithelial rejection usually leads to subepithelial scarring","answer":false},{"label":"b","text":"epithelial rejection may give rise to subepithelial keratitis identical to epidemic keratoconjunctivitis","answer":true},{"label":"c","text":"immune mediated endothelium rejection in the first graft is uncommon before","answer":true},{"label":"d","text":"days post-operative","answer":true},{"label":"e","text":"suture removal may elicit endothelium rejection endothelium rejection is uncommon more than 10 years post-operative","answer":false}],"answer_key":"FTTTF","true_statements":["b","c","d"],"false_statements":["a","e"],"explanation":"Epithelial rejection is not associated with corneal scarring. The rejected epithelium is replaced by the host epithelium. Immune mediated endothelium rejection in the ens first graft rarely occurs before the first 14 days after penetrating keratoplasty. nis Suture may elicit corneal rejection and steroid cover is advisable. Endothelium vith rejection can occur many years after penetrating keratoplasty.","source_answer_pdf_page":13,"source_answer_printed_page":15,"id":28},{"section":"Cornea and external eye disease","section_question":29,"source_question_pdf_page":8,"source_question_printed_page":10,"stem":"Lamellar corneal graft is useful for the following conditions","statements":[{"label":"a","text":"_keratoconus","answer":true},{"label":"b","text":"pseudophakic bullous keratopathy","answer":false},{"label":"c","text":"Fuchs! endothelial dystrophy","answer":false},{"label":"d","text":"_ lattice dystrophy","answer":true},{"label":"e","text":"Reis-Buckler's dystrophy","answer":true}],"answer_key":"TFFTT","true_statements":["a","d","e"],"false_statements":["b","c"],"explanation":"Penetrating keratoplasty is needed if the cornea has insufficient endothelium population such as pseudophakic bullous keratopathy and Fuchs' endothelial dystrophy.","source_answer_pdf_page":13,"source_answer_printed_page":15,"id":29},{"section":"Cornea and external eye disease","section_question":30,"source_question_pdf_page":8,"source_question_printed_page":10,"stem":"The advantages of lamellar corneal graft over penetrating corneal graft include","statements":[{"label":"a","text":"easier operation to perform","answer":false},{"label":"b","text":"less haze between the host-donor interface","answer":false},{"label":"c","text":"less risk of endophthalmitis","answer":true},{"label":"d","text":"criteria for donor graft is less strict","answer":true},{"label":"e","text":"endothelium rejection does not occur","answer":true}],"answer_key":"FFTTT","true_statements":["c","d","e"],"false_statements":["a","b"],"explanation":"Lamellar corneal graft is technically more demanding. Haze and scarring between the host-donor interfaces. are common problems. As the anterior chamber is not entered, the risk of endophthalmitis is reduced. Endothelium rejection is not a problem as the endothelium is not replaced by the donor graft.","source_answer_pdf_page":13,"source_answer_printed_page":15,"id":30},{"section":"Lens and cataract","section_question":1,"source_question_pdf_page":14,"source_question_printed_page":16,"stem":"Posterior subcapsular cataract occurs in: 4 =","statements":[{"label":"a","text":"chronic steroid use a","answer":true},{"label":"b","text":"irradiation \"","answer":true},{"label":"c","text":"amiodarone ' fy z","answer":false},{"label":"d","text":"diabetes mellitus","answer":true},{"label":"e","text":"giant cell arteritis =","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"'Amiodarone is associated with anterior subcapsular cataract and vortex keratopathy; \" giant cell arteritis is not associated with cataract. Other conditions often associated with posterior subcapsular cataract include myotonic dystrophica, atopic dermatitis, neurofibromatosis type 2 and degenerative myopia.","source_answer_pdf_page":20,"source_answer_printed_page":22,"id":31},{"section":"Lens and cataract","section_question":2,"source_question_pdf_page":14,"source_question_printed_page":16,"stem":"The histological features of the following are true: E.","statements":[{"label":"a","text":"Elschnig pearls - proliferation of lens epithelium onto the posterior capsule =","answer":true},{"label":"b","text":"posterior subcapsular cataract - bladder cells","answer":true},{"label":"c","text":"cortical cataract - morgagnian globules","answer":true},{"label":"d","text":"glaucomflecken - Wedl cells .","answer":false},{"label":"e","text":"Soemmering ring - sequestration of proliferating lens fibres in the equatorial region of the capsule","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Morgagnian globules are eosinophilic globules present in slit-like spaces between a the lens fibres which signify cortical degeneration hence cortical cataract. Glaukomflecken are focal areas of necrotic lens epithelial cells secondary to - infarction beneath the anterior lens capsule. Bladder cell/ Wedl cells are lens ; epithelium which migrate posteriorly and swell to 6 times of their normal size and ; cause posterior capsular opacity.","source_answer_pdf_page":20,"source_answer_printed_page":22,"id":32},{"section":"Lens and cataract","section_question":3,"source_question_pdf_page":14,"source_question_printed_page":16,"stem":"The following are true about the rubella syndrome","statements":[{"label":"a","text":"it typically occurs when the mother acquires the disease in the third trimester","answer":false},{"label":"b","text":"sensory deafness is common","answer":true},{"label":"c","text":"cardiac abnormalities are common","answer":true},{"label":"d","text":"itis associated with posterior subcapsular cataract","answer":false},{"label":"e","text":"rubella virus may remain in the lens for up to years after birth","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"Rubella syndrome typically results from maternal infection in first trimester. Ocular features include retinopathy (most common) with fine, granular, salt pepper appearance; nucleus cataract; microphthalmos; glaucoma and corneal clouding. Systemic features include congenital heart disease; sensorineural deafness; anemia; thrombocytopenia; bone abnormalities; hepatitis and CNS abnormalities.","source_answer_pdf_page":20,"source_answer_printed_page":22,"id":33},{"section":"Lens and cataract","section_question":4,"source_question_pdf_page":14,"source_question_printed_page":16,"stem":"The following tests may predict the macular function in a patient with dense cataract","statements":[{"label":"a","text":"laser interferometry","answer":true},{"label":"b","text":"swinging light test","answer":false},{"label":"c","text":"Maddox rod test","answer":true},{"label":"d","text":"potential acuity meter","answer":true},{"label":"e","text":"glare testing","answer":false}],"answer_key":"TFTTF","true_statements":["a","c","d"],"false_statements":["b","e"],"explanation":"'Swinging light test is for assessment of the optic nerve function and glare testing is for documenting decreased vision in bright light in cataract patients. Other test for macular function include: photostress recovery test; blue light entoptoscopy; Purkinje's entopic phenomenon and electroretinography.","source_answer_pdf_page":20,"source_answer_printed_page":22,"id":34},{"section":"Lens and cataract","section_question":5,"source_question_pdf_page":14,"source_question_printed_page":16,"stem":"Regarding blunt trauma and lens changes","statements":[{"label":"a","text":"it is the most common cause of ectopia lentis","answer":true},{"label":"b","text":"_ it causes stellate-shaped posterior cataract","answer":false},{"label":"c","text":"pseudoexfoliation of the lens occurs with infrared exposure","answer":false},{"label":"d","text":"Vossius ring results from anterior uveitis","answer":false},{"label":"e","text":"Vossius ring is made of iris pigment","answer":true}],"answer_key":"TFFFT","true_statements":["a","e"],"false_statements":["b","c","d"],"explanation":"Blunt trauma cause anterior subcapsular cataract which is flower shape (Rosette). Exposure to infrared leads to truc exfoliation syndrome, which is not associated with glaucoma. Vossius ring results from blunt trauma.","source_answer_pdf_page":20,"source_answer_printed_page":22,"id":35},{"section":"Lens and cataract","section_question":6,"source_question_pdf_page":15,"source_question_printed_page":17,"stem":"The following symptoms may occur with cataract","statements":[{"label":"a","text":"difficulty with near reading more than distant","answer":true},{"label":"b","text":"glare","answer":true},{"label":"c","text":"increased myopia","answer":true},{"label":"d","text":"_ increased accommodation","answer":false},{"label":"e","text":"reduced contrast sensitivity","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Cataract is not associated with increased accommodation. Other symptoms include myopic shift and monocular diplopia.","source_answer_pdf_page":20,"source_answer_printed_page":22,"id":36},{"section":"Lens and cataract","section_question":7,"source_question_pdf_page":15,"source_question_printed_page":17,"stem":"The following drugs may induce myopia","statements":[{"label":"a","text":"atropine","answer":false},{"label":"b","text":"beta blocker","answer":false},{"label":"c","text":"steroids","answer":false},{"label":"d","text":"pilocarpine","answer":true},{"label":"e","text":"phenylephrine","answer":false}],"answer_key":"FFFTF","true_statements":["d"],"false_statements":["a","b","c","e"],"explanation":"Besides pilocarpine, other drugs which may induce myopia are sulphonamide, disothiazide, metronidazole, bromocriptine, hydrochlorothiazide and triamterene.","source_answer_pdf_page":21,"source_answer_printed_page":23,"id":37},{"section":"Lens and cataract","section_question":8,"source_question_pdf_page":15,"source_question_printed_page":17,"stem":"The following associations are correct","statements":[{"label":"a","text":"oil-drop cataract and galactosaemia","answer":true},{"label":"b","text":"posterior lenticonus and Alport's syndrome","answer":false},{"label":"c","text":"blue dot cataract and Down's syndrome","answer":true},{"label":"d","text":"anterior stellate cataract and chlorpromazine","answer":true},{"label":"e","text":"Christmas tree cataract and Wilson's disease","answer":false}],"answer_key":"TFTTF","true_statements":["a","c","d"],"false_statements":["b","e"],"explanation":"Alport's syndrome is associated with anterior lenticonus, posterior polymorphous corneal dystrophy, retinal flecks and cataract. Wilson disease is associated with sunflower cataract in 10%. Christmas tree cataract may be associated with uncombable hair syndrome, an autosomal dominant condition.","source_answer_pdf_page":21,"source_answer_printed_page":23,"id":38},{"section":"Lens and cataract","section_question":9,"source_question_pdf_page":15,"source_question_printed_page":17,"stem":"Regarding congenital cataract","statements":[{"label":"a","text":"80% of bilateral cases have an identifiable cause","answer":false},{"label":"b","text":"most inherited cases are autosomal recessive","answer":false},{"label":"c","text":"early surgery is associated with a better visual prognosis","answer":true},{"label":"d","text":"the visual prognosis after cataract extraction is better for unilateral cataract than bilateral cataract","answer":false},{"label":"e","text":"during cataract extraction it is essential to perform posterior capsulotomy and anterior vitrectomy","answer":true}],"answer_key":"FFTFT","true_statements":["c","e"],"false_statements":["a","b","d"],"explanation":"\"a 50% of the bilateral cases are without identifiable causes. Most of the inherited cal cases are AD. The visual prognosis for bilateral congenital cataract is better. Posterior CCC and anterior vitrectomy is routinely performed in paediatric cataract surgery to prevent PCO and opacification of the anterior hyaloid face.","source_answer_pdf_page":21,"source_answer_printed_page":23,"id":39},{"section":"Lens and cataract","section_question":10,"source_question_pdf_page":15,"source_question_printed_page":17,"stem":"Tests which may point to the aetiology of ectopia lentis include","statements":[{"label":"a","text":"brain CT scan","answer":false},{"label":"b","text":"cardiac echocardiogram","answer":true},{"label":"c","text":"serum lysine concentration","answer":true},{"label":"d","text":"serum FTA-Abs","answer":true},{"label":"e","text":"serum methionine","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"ee Cardiac echocardiogram can detect cardiac anomalies in Marfan syndrome. Serum # Lysine concentration is increased in hyperlysinaemia. Serum methionine - accumulation is seen in Homocystinuria. Serum FTA-Abs detects syphilis which is ; a cause of ectopia lentis.","source_answer_pdf_page":21,"source_answer_printed_page":23,"id":40},{"section":"Lens and cataract","section_question":11,"source_question_pdf_page":16,"source_question_printed_page":18,"stem":"In Morgagnian cataract","statements":[{"label":"a","text":"the anterior capsule is always wrinkled","answer":false},{"label":"b","text":"the cortex is liquefied","answer":true},{"label":"c","text":"the nucleus is freely mobile","answer":true},{"label":"d","text":"phacolytic glaucoma is a known complication","answer":true},{"label":"e","text":"there is an increased risk of radial tear during capsulorhexis a =","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"& In Morgagnian cataract, the anterior capsule is not always wrinkled. The nucleus is fd usually displaced inferiorly in the capsular bag. It causes phacolytic glaucoma | instead. Liquefied cortex may leak out upon penetration in CCC leaving the ry relatively empty capsular bag which may cause radial extension. This can be prevented by injecting viscoelastic into the capsular bag to maintain the shape.","source_answer_pdf_page":21,"source_answer_printed_page":23,"id":41},{"section":"Lens and cataract","section_question":12,"source_question_pdf_page":16,"source_question_printed_page":18,"stem":"Regarding anaesthetic in cataract surgery","statements":[{"label":"a","text":"the use of adrenaline should be avoided during peribulbar anaesthesia","answer":false},{"label":"b","text":"addition of sodium bicarbonate may speed up the action of anaesthetic","answer":true},{"label":"c","text":"lignocaine works faster than marcaine","answer":true},{"label":"d","text":"marcaine lasts longer than lignocaine","answer":true},{"label":"e","text":"accidental globe perforation is less common with subtenon anaesthesia than peribulbar anaesthesia","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"a Adrenaline should be avoided in retrobulbar injection because it may reduce the ocular perfusion pressure but not in peribulbar injection. Lignocaine onset is sooner than marcaine but marcaine lasts longer. Hence Marcaine should be used in difficult and prolonged surgery (more than 30 minutes). Adding of sodium bicarbonate reduces time of onset and improves quality of both anaesthesia and akinesia","source_answer_pdf_page":21,"source_answer_printed_page":23,"id":42},{"section":"Lens and cataract","section_question":13,"source_question_pdf_page":16,"source_question_printed_page":18,"stem":"Compared with retrobulbar anaesthesia, peribulbar anaesthesia","statements":[{"label":"a","text":"causes less side effect","answer":true},{"label":"b","text":"uses a longer needle","answer":false},{"label":"c","text":"causes more akinesia","answer":false},{"label":"d","text":"is more likely to result in temporary visual loss","answer":false},{"label":"e","text":"works faster","answer":false}],"answer_key":"TFFFF","true_statements":["a"],"false_statements":["b","c","d","e"],"explanation":"Peribulbar injection uses shorter needle which reduces the risk of globe perforation and less likely associated with vision loss, but it produces less akinesia, works slower and causes more chemosis.","source_answer_pdf_page":22,"source_answer_printed_page":24,"id":43},{"section":"Lens and cataract","section_question":14,"source_question_pdf_page":16,"source_question_printed_page":18,"stem":"Concerning viscoelastic substances","statements":[{"label":"a","text":"high viscosity dispersive agents will tamponade the vitreous well","answer":true},{"label":"b","text":"dispersive agents are better at maintaining space during capsulorrhexis","answer":false},{"label":"c","text":"cohesive agents tend to be easily aspirated","answer":true},{"label":"d","text":"cohesive agents tend to have a high molecular weight than dispersive agents","answer":true},{"label":"e","text":"cohesive agents protect endothelium better than dispersive agents","answer":false}],"answer_key":"TFTTF","true_statements":["a","c","d"],"false_statements":["b","e"],"explanation":"Cohesive agents are better in maintaining space whereas dispersive agents protect endothelium better because it adheres more to the endothelium hence difficult to aspirate out. During capsulorrhexis, cohesive agents are preferred. Newer \"soft shell\" technique use dispersive as protective cover, followed by cohesive to create desired space maintaining effect.","source_answer_pdf_page":22,"source_answer_printed_page":24,"id":44},{"section":"Lens and cataract","section_question":15,"source_question_pdf_page":16,"source_question_printed_page":18,"stem":"The advantages of capsulorrhexis over capsulotomy include","statements":[{"label":"a","text":"easier to prolapse the lens into the anterior chamber","answer":false},{"label":"b","text":"ensure intraocular lens centration","answer":true},{"label":"c","text":"decreased risk of vitreous loss","answer":true},{"label":"d","text":"easier to perform","answer":false},{"label":"e","text":"allow lens implant behind the iris even if the posterior capsule is ruptured","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"Lens is more difficult to prolapse into anterior chamber in capsulorrhexis because opening in the capsule of capsulorrhexis is continuous, hence it distributes tearing forces evenly and becomes more resistant. IOL implantation in the bag is more accurate in capsulorhexis hence ensuring centration of IOL. Smaller than optic size capsulorthexis can be use to support sulcus PCIOL in cases of PC rupture. It is less easy to perform.","source_answer_pdf_page":22,"source_answer_printed_page":24,"id":45},{"section":"Lens and cataract","section_question":16,"source_question_pdf_page":17,"source_question_printed_page":19,"stem":"A sudden shallow of the anterior chamber during phacoemulsification occurs in","statements":[{"label":"a","text":"zonulysis","answer":false},{"label":"b","text":"suprachoroidal haemorrhage","answer":true},{"label":"c","text":"inadequate infusion","answer":true},{"label":"d","text":"retinal detachment","answer":false},{"label":"e","text":"posterior capsule rupture","answer":false}],"answer_key":"FTTFF","true_statements":["b","c"],"false_statements":["a","d","e"],"explanation":"Zonulysis and posterior capsule rupture will cause nucleus drop which shows as anterior chamber deepening instead. Retinal detachment is not known to cause sudden anterior chamber shallowing.","source_answer_pdf_page":22,"source_answer_printed_page":24,"id":46},{"section":"Lens and cataract","section_question":17,"source_question_pdf_page":17,"source_question_printed_page":19,"stem":"The following are true about the findings in Endophthalmitis Vitrectomy Study","statements":[{"label":"a","text":"endophthalmitis is more common with ECCE than phacoemulsification","answer":false},{"label":"b","text":"Staphylococcal epidermidis was the most commonly identified organism","answer":true},{"label":"c","text":"IV antibiotics were of no benefit","answer":true},{"label":"d","text":"intravitreal corticosteroids were beneficial","answer":false},{"label":"e","text":"vitrectomy was of benefit only for patients presenting with LP vision","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"Endophthalmitis is not shown to be more common in ECCE than Phacoemulsification in this study. This study showed intravitreal corticosteroids were not beneficial.","source_answer_pdf_page":22,"source_answer_printed_page":24,"id":47},{"section":"Lens and cataract","section_question":18,"source_question_pdf_page":17,"source_question_printed_page":19,"stem":"The following are true about antibiotics used in endophthalmitis","statements":[{"label":"a","text":"amikacin is less toxic to the retina than gentamicin","answer":true},{"label":"b","text":"amikacin covers Gram negative bacteria","answer":true},{"label":"c","text":"ceftazidime covers Gram positive bacteria","answer":true},{"label":"d","text":"vancomycin is active against Gram positive bacteria","answer":true},{"label":"e","text":"intravitreal vancomycin is associated with red man syndrome","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Intravitreal vancomycin is not associated with red man syndrome.","source_answer_pdf_page":22,"source_answer_printed_page":24,"id":48},{"section":"Lens and cataract","section_question":19,"source_question_pdf_page":17,"source_question_printed_page":19,"stem":"The following can reduce postoperative cystoid macular oedema","statements":[{"label":"a","text":"avoidance of posterior capsule rupture","answer":true},{"label":"b","text":"use of intraocular lens with ultraviolet filter","answer":true},{"label":"c","text":"avoid postoperative hypotony","answer":true},{"label":"d","text":"use of topical non-steroidal anti-inflammatory agent","answer":true},{"label":"e","text":"use of intraoperative intracameral cholinesterase","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Use of intraoperative intracameral cholinesterase is not known to reduce the incident of postoperative CMO .","source_answer_pdf_page":22,"source_answer_printed_page":24,"id":49},{"section":"Lens and cataract","section_question":20,"source_question_pdf_page":17,"source_question_printed_page":19,"stem":"The following are true","statements":[{"label":"a","text":"hydrodissection may cause nucleus loss in posterior polar cataract","answer":true},{"label":"b","text":"_hydrodissection can be performed by injecting the fluid into the nucleus","answer":false},{"label":"c","text":"a'golden ring' sign is seen in good hydrodissection","answer":false},{"label":"d","text":"hydrodelineation help to reduce the risk of posterior capsule rupture during phacoemulsification","answer":true},{"label":"e","text":"hydrodelineation facilitates cortex removal","answer":true}],"answer_key":"TFFTT","true_statements":["a","d","e"],"false_statements":["b","c"],"explanation":"a Hydrodissection is performed by injecting BSS between the capsule and the cortex. : Golden ring sign is seen in good hydrodelineation.","source_answer_pdf_page":23,"source_answer_printed_page":25,"id":50},{"section":"Lens and cataract","section_question":21,"source_question_pdf_page":18,"source_question_printed_page":20,"stem":"With regard to the materials used in intraocular lens: *","statements":[{"label":"a","text":"PMMA is the most common material used in making foldable lens","answer":false},{"label":"b","text":"PMMA transmits a broader spectrum of light than natural lens .","answer":true},{"label":"c","text":"silicone is associated with increased capsular fibrosis","answer":true},{"label":"d","text":"silicone lens tends to be thinner than PMMA for the same dioptre power","answer":false},{"label":"e","text":"hydrogel lens has a lower tensile strength than PMMA","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"Silicone and acrylic are the most common material for fordable IOL. Silicone lens t tend to be thicker than PMMA for the same Diopteric power as it has lower ; refractive index.","source_answer_pdf_page":23,"source_answer_printed_page":25,"id":51},{"section":"Lens and cataract","section_question":22,"source_question_pdf_page":18,"source_question_printed_page":20,"stem":"The following are advantages of phacoemulsification over extracapsular cataract extraction: e","statements":[{"label":"a","text":"faster visual rehabilitation","answer":true},{"label":"b","text":"decreased incidence of endophthalmitis .","answer":true},{"label":"c","text":"easier to master s","answer":false},{"label":"d","text":"reduced incidence of expulsive haemorrhage","answer":true},{"label":"e","text":"more accurate implantation of the lens in the capsular bag .","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"Phacoemulsification has a steeper learning curve and less easy to master.","source_answer_pdf_page":23,"source_answer_printed_page":25,"id":52},{"section":"Lens and cataract","section_question":23,"source_question_pdf_page":18,"source_question_printed_page":20,"stem":"The advantages of temporal incision over superior incision during ; phacoemulsification include","statements":[{"label":"a","text":"lessen 'with the rule' astigmatism","answer":false},{"label":"b","text":"decreased incidence of endophthalmitis","answer":false},{"label":"c","text":"faster healing","answer":false},{"label":"d","text":"easier to rest the surgeon's hands during operation","answer":false},{"label":"e","text":"more patient's comfort","answer":false}],"answer_key":"FFFFF","true_statements":[],"false_statements":["a","b","c","d","e"],"explanation":"j Temporal incision is noted to increase incidence of endophthalmitis as the incision is not covered by lids postoperatively. Hence it is associated with slower healing phase and less patient comfort. Surgeon hands are not supported as in superior incision in which surgeon can rest his hands on patient's forehead.","source_answer_pdf_page":23,"source_answer_printed_page":25,"id":53},{"section":"Lens and cataract","section_question":24,"source_question_pdf_page":18,"source_question_printed_page":20,"stem":"The following conditions increase the risk of expulsive haemorrhage during cataract surgery","statements":[{"label":"a","text":"hypertension","answer":true},{"label":"b","text":"glaucoma","answer":true},{"label":"c","text":"coughing","answer":true},{"label":"d","text":"younger patients","answer":false},{"label":"e","text":"previous expulsive haemorrhage in the contralateral eye","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Advanced age is associated with increase risk of expulsive hemorrhage. Other associated risk factors are increased axial length and vitreous loss.","source_answer_pdf_page":23,"source_answer_printed_page":25,"id":54},{"section":"Lens and cataract","section_question":25,"source_question_pdf_page":18,"source_question_printed_page":20,"stem":"A poorly dilated pupil during cataract surgery may occur in","statements":[{"label":"a","text":"pigment dispersion syndrome","answer":false},{"label":"b","text":"Fuchs' heterochromic cyclitis","answer":true},{"label":"c","text":"pseudoexfoliation syndrome","answer":true},{"label":"d","text":"chronic miotic use","answer":true},{"label":"e","text":"previous acute angle-closure glaucoma","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"In pseudoexfoliation syndrome, Fuchs' heterochromic cyclitis and acute angle closure glaucoma, the iris is atrophied and therefore dilate poorly to mydriatic.","source_answer_pdf_page":23,"source_answer_printed_page":25,"id":55},{"section":"Lens and cataract","section_question":26,"source_question_pdf_page":19,"source_question_printed_page":21,"stem":"The following are true about postoperative endophthalmitis from Propionibacterium acne","statements":[{"label":"a","text":"it typically occurs within 6 weeks from operation","answer":false},{"label":"b","text":"it causes mutton fat keratitic precipitates","answer":true},{"label":"c","text":"hypopyon is a common finding","answer":false},{"label":"d","text":"it may present as an enlarging white capsular plaque","answer":true},{"label":"e","text":"it is sensitive to amikacin","answer":false}],"answer_key":"FTFTF","true_statements":["b","d"],"false_statements":["a","c","e"],"explanation":"Endophthalmitis from propionibacterium acne occurs weeks and months after the surgery. Hypopyon is less commonly seen than mutton fat keratic precipitates. It is sensitive to intravitreal vancomycin.","source_answer_pdf_page":23,"source_answer_printed_page":25,"id":56},{"section":"Lens and cataract","section_question":27,"source_question_pdf_page":19,"source_question_printed_page":21,"stem":"Regarding loss of lens fragment during cataract surgery","statements":[{"label":"a","text":"itis more common during ECCE than phacoemulsification","answer":false},{"label":"b","text":"cortical material causes more intraocular inflammation than nuclear material","answer":false},{"label":"c","text":"it should be removed in all instances","answer":false},{"label":"d","text":"it may be prevented by the injection of viscoelastic behind the lens","answer":true},{"label":"e","text":"hydration of the vitreous is a useful means of floating the lost fragment","answer":false}],"answer_key":"FFFTF","true_statements":["d"],"false_statements":["a","b","c","e"],"explanation":"Lens fragments loss is more common in phacoemulsification because in ECCE, the lens comes out in a complete piece. Lens nucleus material causes more intense inflammatory reaction. Lens fragments of less than a quarter sizes can be watchfully left in the vitreous. Hydration of the vitreous is not helpful to float the sinking lens fragment.","source_answer_pdf_page":23,"source_answer_printed_page":25,"id":57},{"section":"Lens and cataract","section_question":28,"source_question_pdf_page":19,"source_question_printed_page":21,"stem":"The following complications may occur if an intraocular lens is displaced inferiorly because one of the haptic is in the sulcus and the other in the capsular bag","statements":[{"label":"a","text":"_ the post-operative spherical equivalent will be more hyperopic than expected","answer":false},{"label":"b","text":"irregular astigmatism","answer":true},{"label":"c","text":"arefractive astigmatism that is different from that measured on keratometer","answer":true},{"label":"d","text":"_ hypophoria of the affected eye","answer":true},{"label":"e","text":"risk of pupillary capture of the lens","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"Patient will become more myopic as the periphery of the lens has less power. The , resultant refractive astigmatism is lens induced and can not be measured with 1 keratometry which only measures corneal astigmatism.","source_answer_pdf_page":24,"source_answer_printed_page":26,"id":58},{"section":"Lens and cataract","section_question":29,"source_question_pdf_page":19,"source_question_printed_page":21,"stem":"Posterior capsule thickening","statements":[{"label":"a","text":"is usually caused by retained cortex","answer":false},{"label":"b","text":"is more common in the elderly than in the young","answer":false},{"label":"c","text":"is reduced if intraocular lens with convex posterior surface is used","answer":true},{"label":"d","text":"is commoner after extracapsular cataract extraction than phacoemulsification","answer":false},{"label":"e","text":"irrigation of the bag with 5-fluouracil may reduce the risk","answer":true}],"answer_key":"FFTFT","true_statements":["c","e"],"false_statements":["a","b","d"],"explanation":"Posterior capsule opacification (PCO) is usually caused by continued viability of remaining lens epithelial cells. It is more common in younger age group. Other lens ; design noted to reduce the PCO include: square optic edge and use of acrylic material, There is no difference in incidence of PCO between ECCE and Phacoemulsification.","source_answer_pdf_page":24,"source_answer_printed_page":26,"id":59},{"section":"Lens and cataract","section_question":30,"source_question_pdf_page":19,"source_question_printed_page":21,"stem":"YAG capsulotomy","statements":[{"label":"a","text":"increases the risk of retinal detachment","answer":true},{"label":"b","text":"more likely to cause lens pitting in silicone lens than PMMA lens","answer":true},{"label":"c","text":"can cause intraocular lens dislocation","answer":true},{"label":"d","text":"can cause acute endophthalmitis","answer":false},{"label":"e","text":"is less likely to cause cystoid macular oedema if performed more than 6 months after the surgery","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"YAG laser capsulotomy is associated with RD especially if it is done within one year after the cataract operation. Plate haptic IOL is noted to be more easily dislocated after YAG capsulotomy. It usually causes chronic endophthalmitis as it may release the entrapped pathogen in the capsular bag into the vitreous.","source_answer_pdf_page":24,"source_answer_printed_page":26,"id":60},{"section":"Glaucoma","section_question":1,"source_question_pdf_page":25,"source_question_printed_page":27,"stem":"Regarding Humphrey automated perimetry","statements":[{"label":"a","text":"the central 24-2 measures the central 24°","answer":true},{"label":"b","text":"in central 24-2 the targets are located at 3° on either sides of the midlines","answer":true},{"label":"c","text":"total deviation is more accurate in picking up glaucomatous field defect than pattern deviation","answer":false},{"label":"d","text":"the fixation loss is tested by presenting suprathreshold target in the blind spot","answer":true},{"label":"e","text":"the test is affected by ametropia.","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"The number before the dash ( 24- or 30- ) indicate the area of the tested field in degree from fixation. The number after the dash ( -I or -2 ) describes the pattern of the points tested. The -2 strategy involves a grid of test points spaced 6° apart \\cous offset from the vertical and horizontal meridian; so that the 2 innermost test points are about 3° from fixation spot. Cataract or small pupil can cause generalized depression of the visual field (total deviation), the pattern deviation plot will subtract that out and may unmask any glaucomatous damage","source_answer_pdf_page":31,"source_answer_printed_page":33,"id":61},{"section":"Glaucoma","section_question":2,"source_question_pdf_page":25,"source_question_printed_page":27,"stem":"The short wavelength automated perimetry (SWAP) test","statements":[{"label":"a","text":"is ablue-on-yellow perimetry","answer":true},{"label":"b","text":"takes longer than the conventional automated perimetry","answer":true},{"label":"c","text":"detects glaucoma earlier than conventional perimetry","answer":true},{"label":"d","text":"_ is not affected by cataract","answer":false},{"label":"e","text":"itis abnormal in patients with diabetic retinopathy","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Short Wavelength Automated Perimetry (SWAP) uses a blue stimulus on a yellow background. SWAP requires longer testing time with 3-minute adaptation to yellow background. SWAP may detect visual loss or progression up to 3 - 5 years earlier. SWAP is a good method of detecting early defects in young patients but lensinduced artifacts have limited its use in elderly patients. Diabetic retinopathy or any disease processes that affect the visual pathway may reduce retinal threshold sensitivity and depress the visual field.","source_answer_pdf_page":31,"source_answer_printed_page":33,"id":62},{"section":"Glaucoma","section_question":3,"source_question_pdf_page":25,"source_question_printed_page":27,"stem":"The central corneal thickness","statements":[{"label":"a","text":"in normal people is about 600um","answer":false},{"label":"b","text":"shows diurnal variation","answer":true},{"label":"c","text":"affects the reading of applanation tonometer","answer":true},{"label":"d","text":"is thinner when measured with optical coherence tomography (OCT) than with ultrasound pachymeter.","answer":true},{"label":"e","text":"a thin cornea is an independent risk factor for glaucoma in patient with ocular hypertension","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"Normal corneal thickness measures about 550 jm centrally, increasing to about 800 um in the corneal periphery. Corneal hydration increases as a result of lid closure during sleep therefore affecting central corneal thickness. Optical coherence tomography (OCT) produces a thinner measurement of cornea when compared with ultrasound pachymetry.","source_answer_pdf_page":31,"source_answer_printed_page":33,"id":63},{"section":"Glaucoma","section_question":4,"source_question_pdf_page":25,"source_question_printed_page":27,"stem":"Regarding frequency doubling perimetry","statements":[{"label":"a","text":"it takes a shorter time to perform than conventional perimetry","answer":true},{"label":"b","text":"it tests the magnocellular pathway","answer":true},{"label":"c","text":"it tests neurones that are sensitive to motion","answer":true},{"label":"d","text":"itcan pick up visual field earlier than conventional perimetry","answer":true},{"label":"e","text":"itis not affected by room illumination","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"EDP (Frequency doubling perimeter) is designed to target visual function provided by magnocellular pathway; neurons that are sensitive to motion. FDP perimetry has demonstrated better patient reliability, less intratest and intertest variability. FDP results are comparable to or better than standard automated perimetry for the detection of glaucoma. FDT perimetry will tolerate up to 6 diopters of blur and is not affected by external room illumination or variations in the pupil size, so long as the pupil diameter is greater than 2 mm.","source_answer_pdf_page":31,"source_answer_printed_page":33,"id":64},{"section":"Glaucoma","section_question":5,"source_question_pdf_page":25,"source_question_printed_page":27,"stem":"The following are risk factors for ocular hypertension to progress to glaucoma","statements":[{"label":"a","text":"C/D ratio asymmetry of greater than 0.2","answer":true},{"label":"b","text":"previous optic disc haemorrhage","answer":true},{"label":"c","text":"presence of nerve fibre layer defect despite normal optic disc head","answer":true},{"label":"d","text":"thinner than average central corneal thickness","answer":true},{"label":"e","text":"large horizontal cup/disc ratio","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"'The Ocular Hypertension Treatment Study (OHTS) shows that thin central cornea 'as most predictive of progression to glaucoma in ocular hypertensive patients. Patients with a central corneal thickness of 555m or less had a three-fold greater risk of developing POAG than those with a central corneal thickness of S88m or i greater. The arcuate fibers are most vulnerable while the papillomacular bundles are the most resistant. In early glaucoma, loss of retinal nerve fibers proceed at the as superotemporal and inferotemporal aspects. This is represented by large vertical sam cup-dise ratio. =","source_answer_pdf_page":31,"source_answer_printed_page":33,"id":65},{"section":"Glaucoma","section_question":6,"source_question_pdf_page":26,"source_question_printed_page":28,"stem":"The following are risk factors for primary open angle glaucoma: u","statements":[{"label":"a","text":"myopia =","answer":true},{"label":"b","text":"migraine »","answer":false},{"label":"c","text":"family history of glaucoma =","answer":true},{"label":"d","text":"increasing age é","answer":true},{"label":"e","text":"short axial length","answer":false}],"answer_key":"TFTTF","true_statements":["a","c","d"],"false_statements":["b","e"],"explanation":"Short axial length is associated with acute angle closure glaucoma.","source_answer_pdf_page":32,"source_answer_printed_page":34,"id":66},{"section":"Glaucoma","section_question":7,"source_question_pdf_page":26,"source_question_printed_page":28,"stem":"The following lenses are used for direct gonioscopy: z","statements":[{"label":"a","text":"Goldmann lens","answer":false},{"label":"b","text":"Zeiss lens ,","answer":false},{"label":"c","text":"Koeppe lens .","answer":false},{"label":"d","text":"Barkan lens","answer":true},{"label":"e","text":"Hruby lens","answer":false}],"answer_key":"FFFTF","true_statements":["d"],"false_statements":["a","b","c","e"],"explanation":"Goldman and Zeiss lenses are indirect gonioscopes. Koeppe and Barkan lenses are x direct gonioscopes. Hruby lens is an indirect lens used in conjunction with slit-lamp & for viewing fundus. =","source_answer_pdf_page":32,"source_answer_printed_page":34,"id":67},{"section":"Glaucoma","section_question":8,"source_question_pdf_page":26,"source_question_printed_page":28,"stem":"The following are true about Goldmann applanation tonometry","statements":[{"label":"a","text":"it displaces 0.5ul of aqueous from the anterior chamber","answer":true},{"label":"b","text":"it indents an area of 3.06mm*","answer":false},{"label":"c","text":"the force required to indent the cornea is measured in grams with 1 gram corresponding to 10mm Hg.","answer":true},{"label":"d","text":"its measurement is affected by high astigmatism","answer":true},{"label":"e","text":"itis less affected by scleral rigidity than Schiotz tonometry","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"Goldmann applanation tonometer displaces little fluid (0.5 ul) during the - measurement. The area indented has a diameter of 3.06mm. The result is affected - by high astigmatism but this can be corrected by rotating the prism head. Scleral = rigidity affects Schiotz tonometry to a greater degree than Goldmann applanation 2 tonometry. é","source_answer_pdf_page":32,"source_answer_printed_page":34,"id":68},{"section":"Glaucoma","section_question":9,"source_question_pdf_page":26,"source_question_printed_page":28,"stem":"A falsely low reading during Goldmann applanation tonometry may occur if there is","statements":[{"label":"a","text":"corneal scarring","answer":false},{"label":"b","text":"acontact lens on","answer":true},{"label":"c","text":"laser in situ keratomileusis (LASIK)","answer":true},{"label":"d","text":"scleral buckling","answer":true},{"label":"e","text":"too much fluorescein instillation","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"A falsely low reading may be registered by the Goldmann applanation tonometry . when the patient has a contact lens on, a thinner cornea such as after LASIK, _ scleral buckling and excessive fluorescein instillation. z","source_answer_pdf_page":32,"source_answer_printed_page":34,"id":69},{"section":"Glaucoma","section_question":10,"source_question_pdf_page":26,"source_question_printed_page":28,"stem":"Signs suggestive of previous acute angle closure glaucoma include","statements":[{"label":"a","text":"posterior subcapsular cataract","answer":false},{"label":"b","text":"anterior subepithelial lens opacity","answer":true},{"label":"c","text":"iris transillumination","answer":true},{"label":"d","text":"irregular pupil shape","answer":true},{"label":"e","text":"Sampaolesi's line","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"'Acute angle closure glaucoma causes iris ischaemia and therefore iris atrophy. The atrophy results in iris transillumination and an irregular pupil shape. Ischaemia of : the anterior epithelial cells of the lens results in glaucomflecken. Sampaolesi's line 7 refers to a line of pigment deposition anterior to Schwalbe's line, it is seen in C various conditions such as acute angle closure glaucoma, trauma, surgery, 7 malignant glaucoma and pseudoexfoliation syndrome.","source_answer_pdf_page":32,"source_answer_printed_page":34,"id":70},{"section":"Glaucoma","section_question":11,"source_question_pdf_page":27,"source_question_printed_page":29,"stem":"Risk factors for primary acute angle closure glaucoma include","statements":[{"label":"a","text":"Far Eastern race","answer":true},{"label":"b","text":"short corneal diameter","answer":true},{"label":"c","text":"short axial length","answer":true},{"label":"d","text":"female gender","answer":true},{"label":"e","text":"a positive family history","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Far Eastern race has an increased incidence of acute angle glaucoma compared with other races by virtue of shorter anterior chamber depth. Other predisposing factors for acute angle closure glaucoma include a smaller eye, female gender and cataract. A positive family history is also a risk factor.","source_answer_pdf_page":32,"source_answer_printed_page":34,"id":71},{"section":"Glaucoma","section_question":12,"source_question_pdf_page":27,"source_question_printed_page":29,"stem":"Regarding primary congenital glaucoma","statements":[{"label":"a","text":"itis the most common type of congenital glaucoma (about 50% )","answer":true},{"label":"b","text":"most inherited cases are autosomal recessive","answer":true},{"label":"c","text":"70% of the cases are bilateral.","answer":true},{"label":"d","text":"more female than male are affected","answer":false},{"label":"e","text":"the majority of cases are diagnosed at older than 1 year of age","answer":false}],"answer_key":"TTTFF","true_statements":["a","b","c"],"false_statements":["d","e"],"explanation":"at the Most cases of primary congenital glaucoma are sporadic in occurrence. However, rtical some disease may be transmitted through an autosomal recessive pattern, with variable penetrance, or a polygenic inheritance pattern. Primary congenital glaucoma occurs more often in male (65%) than in female. Photophobia and tearing are the most common presentation with most cases being diagnosed in the first year of life.","source_answer_pdf_page":33,"source_answer_printed_page":35,"id":72},{"section":"Glaucoma","section_question":13,"source_question_pdf_page":27,"source_question_printed_page":29,"stem":"Regarding the management of primary congenital glaucoma","statements":[{"label":"a","text":"long-term medical treatment without surgery is successful in more than 50% of the patients","answer":false},{"label":"b","text":"goniotomy requires the presence of a clear cornea","answer":true},{"label":"c","text":"Zeiss's lens is useful for goniotomy","answer":false},{"label":"d","text":"trabeculotomy involves the creation of iridectomy","answer":false},{"label":"e","text":"trabeculotomy is more successful operation than goniotomy in controlling intraocular pressure","answer":false}],"answer_key":"FTFFF","true_statements":["b"],"false_statements":["a","c","d","e"],"explanation":"Surgical treatment is needed for the long-term control of intraocular pressure in primary congenital glaucoma. Goniotomy requires the presence of a clear cornea es are otherwise trabeculotomy is the technique of choice. Goniotomy is performed with a lamp direct goniolens. Iridectomy is not required in trabeculotomy as in trabeculectomy. Both trabeculotomy and goniotomy have the same success rate.","source_answer_pdf_page":33,"source_answer_printed_page":35,"id":73},{"section":"Glaucoma","section_question":14,"source_question_pdf_page":27,"source_question_printed_page":29,"stem":"In primary congenital glaucoma","statements":[{"label":"a","text":"a membrane covering the trabecular meshwork can be visualized in over 50% of the patients","answer":false},{"label":"b","text":"Haab's striae are breaks in the Descemet's membrane","answer":true},{"label":"c","text":"buphthalmos is pathognomonic for primary congenital glaucoma","answer":false},{"label":"d","text":"a corneal diameter of greater 12 mm in the first year of life is suggestive of this condition","answer":true},{"label":"e","text":"increased cupping may reverse when the intraocular pressure is controlled","answer":true}],"answer_key":"FTFTT","true_statements":["b","d","e"],"false_statements":["a","c"],"explanation":"g the The presence of a membrane covering the trabecular meshwork has been postulated fected but this is not seen in the majority of cases. Haab's striae are breaks in the scleral Descemet's membrane. Buphthalmos refers to an enlarged globe which is a feature nsaon of but not pathognomonic for primary congential glaucoma. An enlarged corneal diameter greater than 12 mm is suggestive of this condition.","source_answer_pdf_page":33,"source_answer_printed_page":35,"id":74},{"section":"Glaucoma","section_question":15,"sou
