lse}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"With the use of HAART in AIDS patients, a chronic vitritis termed immune recovery uveitis (IRU) has been identified in AIDS patients with a history of treated, regressed cytomegalovirus (CMV) retinitis. Although seen mainly in AIDS, it has been described in other patients who recovered from other immunocompromised conditions. Prior intravenous cidofovir use appears to be a risk factor and more widespread CMV retinitis involvement also appears to be a predisposing factor, although anti-CMV treatment is not effective for IRU.","source_answer_pdf_page":60,"source_answer_printed_page":62,"id":144},{"section":"Uveitis","section_question":25,"source_question_pdf_page":53,"source_question_printed_page":55,"stem":"The following drugs are useful for toxoplasmosis chorioretinitis","statements":[{"label":"a","text":"erythromycin","answer":false},{"label":"b","text":"pyrimedine","answer":true},{"label":"c","text":"sulphonamide","answer":true},{"label":"d","text":"ciprofloxacin","answer":false},{"label":"e","text":"atovaquone","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"Combination of drugs that can be used for toxoplasmosis chorioretinitis include: trimethoprim-sulphamethoxazole, clindamycin/ sulfadiazine, or pyrimethamine / sulfadiazine / folinic acid, or atovaquone azithromycin Atovaquone reduces recurrences as it is active against bradyzoites and tachyzoites. Prednisolone is usually co-administered to reduce inflammation.","source_answer_pdf_page":60,"source_answer_printed_page":62,"id":145},{"section":"Uveitis","section_question":26,"source_question_pdf_page":54,"source_question_printed_page":56,"stem":"Indications for systemic treatment of toxoplasma retinitis include","statements":[{"label":"a","text":"involvement of the macula","answer":true},{"label":"b","text":"lesion adjacent to major retinal vessels","answer":true},{"label":"c","text":"severe anterior uveitis","answer":false},{"label":"d","text":"AIDS patients irrespective of location","answer":true},{"label":"e","text":"severe vitritis","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"For immunocompromised patients, treatment for toxoplasmosis chorioretinitis is indicated if lesion is within the temporal arcade lesion is abutting the optic nerve or threatening a large retinal vessel ~ lesion that has induced enough of a vitreal inflammatory response so that the vision has dropped below 20/40 in previously 20/20 eye or at least has sustained a two-line drop from the visual acuity before the acute infection. All toxoplasmosis chorioretinitis in immunocompromised should be treated.","source_answer_pdf_page":61,"source_answer_printed_page":63,"id":146},{"section":"Uveitis","section_question":27,"source_question_pdf_page":54,"source_question_printed_page":56,"stem":"Punctate inner choroidopathy (PIC)","statements":[{"label":"a","text":"affects mainly female with hypermetropia","answer":false},{"label":"b","text":"presents with severe vitritis","answer":false},{"label":"c","text":"causes significant visual loss mainly through cystoid macular oedema","answer":false},{"label":"d","text":"typically runs a chronic recurring cause","answer":true},{"label":"e","text":"causes subretinal neovascular membrane in 25 % of patients","answer":true}],"answer_key":"FFFTT","true_statements":["d","e"],"false_statements":["a","b","c"],"explanation":"Punctate inner choroidopathy (PIC) has a predilection for young myopic female patients. PIC typically present with blurred vision, central or paracentral scotomas, and photopsias. Vitritis is not a prominent symptom. The anterior chamber and vitreous tend to be quiet. The fundus shows yellow lesions with indistinct borders that measure 100 to 300 um in size and are located in the posterior pole or midperiphery. Active lesions may be associated with small amounts of subretinal fluid or serous retinal detachment. Cystoid macular oedema is uncommon. Old lesions develop a punched-out appearance. Subretinal neovascularization occurs in 25% of eyes with PIC.","source_answer_pdf_page":61,"source_answer_printed_page":63,"id":147},{"section":"Uveitis","section_question":28,"source_question_pdf_page":54,"source_question_printed_page":56,"stem":"Regarding acute retinal necrosis (ARN)","statements":[{"label":"a","text":"itaffects mainly patients who are immunocompromised","answer":false},{"label":"b","text":"varicella-zoster virus is the most common cause","answer":false},{"label":"c","text":"the vitritis is usually severe and may occlude the retinal view","answer":true},{"label":"d","text":"aspirin is useful in reducing the incidence of occlusive vasculopathy","answer":true},{"label":"e","text":"argon laser to area surrounding the necrosis prevents rhegmatogenous retinal detachment","answer":true}],"answer_key":"FFTTT","true_statements":["c","d","e"],"false_statements":["a","b"],"explanation":"Acute retinal necrosis (ARN) usually affects patients who are otherwise healthy. The most common cause is herpes simplex virus. The vitritis is typically dense and may occlude the retinal view. Occlusive vasculopathy and rhegmatogenous retinal detachment are important causes of visual loss in these patients. Aspirin can reduce the incidence of occlusive vasculopathy and argon laser to areas surrounding the necrosis prevents rhegmatogenous retinal detachment.","source_answer_pdf_page":61,"source_answer_printed_page":63,"id":148},{"section":"Uveitis","section_question":29,"source_question_pdf_page":54,"source_question_printed_page":56,"stem":"Vasculitis that primarily affect arterioles include","statements":[{"label":"a","text":"sarcoidosis","answer":false},{"label":"b","text":"systemic lupus erythematosus","answer":true},{"label":"c","text":"necrotizing herpetic retinitis","answer":true},{"label":"d","text":"multiple sclerosis","answer":false},{"label":"e","text":"_birdshot chorioretinopathy","answer":false}],"answer_key":"FTTFF","true_statements":["b","c"],"false_statements":["a","d","e"],"explanation":"Retinal vasculitis that affect primarily the arterioles occur in systemic lupus erythematosus, polyarteritis nodosa and acute retinal necrosis. Retinal vasculitis that affect primarily the venules include sarcoidosis, multiple sclerosis, Eales disease and birdshot chorioretinopathy.","source_answer_pdf_page":61,"source_answer_printed_page":63,"id":149},{"section":"Uveitis","section_question":30,"source_question_pdf_page":54,"source_question_printed_page":56,"stem":"The following immunosuppressive medications work by inhibiting T-cell function","statements":[{"label":"a","text":"sirolimus","answer":true},{"label":"b","text":"cyclophosphamide","answer":false},{"label":"c","text":"tacrolimus","answer":true},{"label":"d","text":"infliximab","answer":false},{"label":"e","text":"methotrexate","answer":false}],"answer_key":"TFTFF","true_statements":["a","c"],"false_statements":["b","d","e"],"explanation":"T-cell inhibitors: Tacrolimus, cyclosporine, and sirolimus. Antimetabolites : Azathioprine, mycophenolate mofetil, and methotrexate. Alkylating agents: Cyclophosphamide and chlorambucil. TNF inhibitors: Infliximab, adalimumab, and etanercept.","source_answer_pdf_page":62,"source_answer_printed_page":64,"id":150},{"section":"Retina and vitreous","section_question":1,"source_question_pdf_page":63,"source_question_printed_page":65,"stem":"The optical coherence tomography (OCT)","statements":[{"label":"a","text":"uses infrared light to create images","answer":true},{"label":"b","text":"gives better image than B scan ultrasound","answer":true},{"label":"c","text":"image quality is adversely affected by vitreous haemorrhage","answer":true},{"label":"d","text":"provides quantitative value for macular thickness","answer":true},{"label":"e","text":"can be used to measured corneal thickness","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"'OCT is a noninvasive imaging technology that uses the principle of low-coherence interferometry (near infrared light beam) to map the structure of the retina and 'adjacent structures, It has a better resolution than ultrasound. It can also be used to measure corneal thickness.","source_answer_pdf_page":69,"source_answer_printed_page":71,"id":151},{"section":"Retina and vitreous","section_question":2,"source_question_pdf_page":63,"source_question_printed_page":65,"stem":"Electrooculogram (EOG)","statements":[{"label":"a","text":"is more useful than electroretinogram (ERG) in detecting most retinal disorders","answer":true},{"label":"b","text":"diminished with dark adaptation","answer":false},{"label":"c","text":"in normal people has the dark-peak to light-trough ratio of > 1.75","answer":false},{"label":"d","text":"makes use of the fact that the corneal surface is positive relative to sclera","answer":true},{"label":"e","text":"is measured by getting the patients to move the eyes from side to side","answer":true}],"answer_key":"TFFTT","true_statements":["a","d","e"],"false_statements":["b","c"],"explanation":"Arden ratio is the ratio of the light peak to the dark trough. This ratio in normal people is 1.85 or above. EOG is not as useful as ERG in detecting retinal disorders.","source_answer_pdf_page":69,"source_answer_printed_page":71,"id":152},{"section":"Retina and vitreous","section_question":3,"source_question_pdf_page":63,"source_question_printed_page":65,"stem":"True statements about central serous retinopathy (CSR) include","statements":[{"label":"a","text":"affects men more often than women","answer":true},{"label":"b","text":"the reduced vision can be improved with myopic glasses","answer":false},{"label":"c","text":"smoke-stack appearance is seen in fluorescein angiography in over 90% of cases","answer":false},{"label":"d","text":"focal laser shortens the attack","answer":true},{"label":"e","text":"focal laser increases the final visual outcome","answer":false}],"answer_key":"TFFTF","true_statements":["a","d"],"false_statements":["b","c","e"],"explanation":"CSR is much more common in men who represent 85-90% of the cases. In CSR, the retina is pushed forward so that the vision may be improved with hyperopic lens. The classic \"smokestack\" appearance of the fluorescein leak is seen only in 10-15% of cases and most cases exhibits the ink blot appearance. Laser treatment shortens the course of the disease but does not appear to improve the final visual prognosis.","source_answer_pdf_page":69,"source_answer_printed_page":71,"id":153},{"section":"Retina and vitreous","section_question":4,"source_question_pdf_page":63,"source_question_printed_page":65,"stem":"Lattice degeneration","statements":[{"label":"a","text":"is found in 8% of the general population","answer":true},{"label":"b","text":"is found in 25% of retinal detachment","answer":true},{"label":"c","text":"is characterized by thinning of the underlying inner retina","answer":true},{"label":"d","text":"contains liquefied vitreous gel over it","answer":true},{"label":"e","text":"causes retinal detachment mainly through the presence of round hole","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Lattice degeneration occurs in 8 to 11 % of the general population but is associated with as many as 40% of all rhegmatogenous retinal detachments. A localized pocket of missing vitreous overlies lattice degeneration of the retina. Retinal detachments caused by lattice degeneration occur most commonly by a tractional tear at the cuff or posterior margin of the lattice lesion, or less commonly by means of an atrophic hole within the zone of lattice.","source_answer_pdf_page":69,"source_answer_printed_page":71,"id":154},{"section":"Retina and vitreous","section_question":5,"source_question_pdf_page":63,"source_question_printed_page":65,"stem":"Senile Retinoschisis","statements":[{"label":"a","text":"_ is bilateral in more than 50% of cases","answer":true},{"label":"b","text":"is more common in myopes than hypermetropes","answer":false},{"label":"c","text":"is usually posterior to the equator","answer":false},{"label":"d","text":"causes absolute scotoma","answer":true},{"label":"e","text":"accounts for 25% of retinal detachment","answer":false}],"answer_key":"TFFTF","true_statements":["a","d"],"false_statements":["b","c","e"],"explanation":"Senile retinoschisis is bilateral in 50% of the cases and about 70% of patients are hyperopic. It develops from the coalescence of intraretinal microcysts located in an area of peripheral cystoid degeneration near the ora serrata. A low clinical risk exists of retinal detachment. Extension into the posterior pole can cause an absolute field defect.","source_answer_pdf_page":69,"source_answer_printed_page":71,"id":155},{"section":"Retina and vitreous","section_question":6,"source_question_pdf_page":64,"source_question_printed_page":66,"stem":"Regarding true macular hole","statements":[{"label":"a","text":"itis more common in male than female","answer":false},{"label":"b","text":"itis bilateral in 10-20% of cases","answer":true},{"label":"c","text":"itusually measures about 1/3 the optic disc diameter","answer":true},{"label":"d","text":"itcan be differentiated from lamellar hole using the Allen-Watzke's test","answer":true},{"label":"e","text":"stage 1 macular hole may resolve spontaneously without treatment","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"Macular hole is more common in female than male. It is bilateral in 10 to 20% of cases. It measures about one third the size of the optic disc. The Watzke-Allen test can be used to distinguish full-thickness macular holes from pseudoholes. Stage 1 macular hole refers to partial thickness separation of the retina and about 50% of Stage 1 macular holes resolve spontaneously.","source_answer_pdf_page":69,"source_answer_printed_page":71,"id":156},{"section":"Retina and vitreous","section_question":7,"source_question_pdf_page":64,"source_question_printed_page":66,"stem":"Features of chronic rhegmatogenous retinal detachment include","statements":[{"label":"a","text":"shifting fluid level","answer":false},{"label":"b","text":"_ intraretinal cysts","answer":true},{"label":"c","text":"demarcation line","answer":true},{"label":"d","text":"retinal thinning","answer":true},{"label":"e","text":"proliferative vitreoretinopathy","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"Chronic rhegmatogenous retinal detachment may present with retinal thinning, intraretinal cysts, subretinal fibrosis, and demarcation lines. These lines usually are at the junction of attached and detached retina. Proliferative vitreoretinopathy is caused by the proliferation and contraction of membranes on the inner retinal surface (epiretinal membranes), on the posterior surface of the detached hyaloid and occasionally also on the outer retinal surface (subretinal membranes).","source_answer_pdf_page":70,"source_answer_printed_page":72,"id":157},{"section":"Retina and vitreous","section_question":8,"source_question_pdf_page":64,"source_question_printed_page":66,"stem":"Regarding retinal tears","statements":[{"label":"a","text":"they are U-shaped with the flap pointing towards the ora serrata","answer":false},{"label":"b","text":"the superior nasal quadrant is the most commonly involved site","answer":false},{"label":"c","text":"giant retinal tear is said to occur if more than 2 clock hours are involved","answer":false},{"label":"d","text":"failure of identifying all retinal tears is the most common reason for failed retinal detachment","answer":true},{"label":"e","text":"all retinal tears lead to retinal detachment","answer":false}],"answer_key":"FFFTF","true_statements":["d"],"false_statements":["a","b","c","e"],"explanation":"The flap is pointing away from the ora serrata. 60% of the breaks are located in the upper temporal quadrant and 15% are in the upper nasal quadrant. If the retinal tear is very great (one quarter of the retina or more), it is called a giant retinal tear.","source_answer_pdf_page":70,"source_answer_printed_page":72,"id":158},{"section":"Retina and vitreous","section_question":9,"source_question_pdf_page":64,"source_question_printed_page":66,"stem":"Indications for subretinal fluid drainage during scleral buckling procedure","statements":[{"label":"a","text":"retina detachment include","answer":true},{"label":"b","text":"difficulty in localizing break","answer":true},{"label":"c","text":"immobile retina","answer":true},{"label":"d","text":"longstanding retinal detachment","answer":true},{"label":"e","text":"inferior retinal detachment giant tear","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Reasons for drainage include poor view in localizing the break, immobile retina, reduction in intraocular volume which allows better buckling without causing increased intraocular pressure. Giant tear should be managed with vitrectomy and tamponade.","source_answer_pdf_page":70,"source_answer_printed_page":72,"id":159},{"section":"Retina and vitreous","section_question":10,"source_question_pdf_page":64,"source_question_printed_page":66,"stem":"Regarding the silicone oil","statements":[{"label":"a","text":"itis more effective than sulphur hexafluoride in tamponading the retina","answer":true},{"label":"b","text":"it can be left in the eye without causing retina toxicity for up to one year","answer":true},{"label":"c","text":"itis non-expansile","answer":true},{"label":"d","text":"it can affect the biometry because of changes to the sound velocity","answer":true},{"label":"e","text":"it can cause band keratopathy if leaks into the anterior chamber","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Compared to SF6 gas, silicone oil is heavier and non-expansile; therefore offer more effective tamponade to the retina, However, it's large molecular weight reduces sound velocity and affect accurate biometric measurement. Silicone oif in anterior chamber leads to anterior segment inflammation and band keratopathy","source_answer_pdf_page":70,"source_answer_printed_page":72,"id":160},{"section":"Retina and vitreous","section_question":11,"source_question_pdf_page":65,"source_question_printed_page":67,"stem":"The following factors predispose a patient to rhegmatogenous retinal","statements":[{"label":"a","text":"high myopia","answer":true},{"label":"b","text":"Ehlers-Danlos's syndrome","answer":true},{"label":"c","text":"Stickler's syndrome","answer":true},{"label":"d","text":"Marfan's syndrome","answer":true},{"label":"e","text":"diabetes mellitus","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"The first four conditions predispose the eyes to posterior vitreous detachment by prematurely accelerating the liquefaction of the vitreous gel. Diabetes mellitus om the other hand causes tractional retinal detachment through proliferative diabese retinopathy.","source_answer_pdf_page":70,"source_answer_printed_page":72,"id":161},{"section":"Retina and vitreous","section_question":12,"source_question_pdf_page":65,"source_question_printed_page":67,"stem":"The risk of proliferative vitreoretinopathy following retinal detachment is in","statements":[{"label":"a","text":"multiple retinal breaks","answer":true},{"label":"b","text":"giant tears","answer":true},{"label":"c","text":"epiretinal membrane","answer":false},{"label":"d","text":"heavy cryopexy","answer":true},{"label":"e","text":"use of heavy liquid","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"Proliferative vitreoretinopathy is related to the amount of pigments relesset through the retinal holes. As a result, the risk is increased by more and bigse retinal tears. Heavy cryopexy also increases the release of pigment cells.","source_answer_pdf_page":70,"source_answer_printed_page":72,"id":162},{"section":"Retina and vitreous","section_question":13,"source_question_pdf_page":65,"source_question_printed_page":67,"stem":"Angioid streaks","statements":[{"label":"a","text":"appears as window defect on fluorescence angiogram","answer":true},{"label":"b","text":"often radiates from the optic disc T","answer":true},{"label":"c","text":"result from breaks in the Bruch's membrane T","answer":true},{"label":"d","text":"occurs in 90% of patients with pseudoxanthoma elasticum T","answer":true},{"label":"e","text":"predispose the eye to subretinal neovascular membrane T","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"In angioid streaks, fluorescein angiography shows hyperfluorescence due to RPE window defects over the streaks. The streaks intercommunicate in a ring-like fashion around the optic disc and then radiate outwards from the parapapillary area. Subretinal neovascular membrane is a known complication and an important cause of poor vision in these patients.","source_answer_pdf_page":71,"source_answer_printed_page":73,"id":163},{"section":"Retina and vitreous","section_question":14,"source_question_pdf_page":65,"source_question_printed_page":67,"stem":"Angioid streaks are seen in","statements":[{"label":"a","text":"multiple myeloma","answer":false},{"label":"b","text":"Paget's disease","answer":true},{"label":"c","text":"Marfan's syndrome","answer":false},{"label":"d","text":"Ehlers-Danlos' syndrome","answer":true},{"label":"e","text":"sickle cell disease","answer":true}],"answer_key":"FTFTT","true_statements":["b","d","e"],"false_statements":["a","c"],"explanation":"Causes of angioid streaks include: — pseudoxanthoma elasticum Ehlers-Danlos syndrome Paget's disease acromegaly haemoglobinopathies hereditary spherocytosis","source_answer_pdf_page":71,"source_answer_printed_page":73,"id":164},{"section":"Retina and vitreous","section_question":15,"source_question_pdf_page":65,"source_question_printed_page":67,"stem":"Epiretinal membrane of the macular may result from","statements":[{"label":"a","text":"retinal tear","answer":true},{"label":"b","text":"pan-photocoagulation","answer":true},{"label":"c","text":"posterior uveitis","answer":true},{"label":"d","text":"branch retinal vein occlusion","answer":true},{"label":"e","text":"advanced glaucoma","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Epiretinal membrane is fibrocellular and avascular, and are thought to arise from the proliferation of retinal glial cells which have migrated through defects in the internal limiting membrane. It is also seen in eyes with vascular diseases.","source_answer_pdf_page":71,"source_answer_printed_page":73,"id":165},{"section":"Retina and vitreous","section_question":16,"source_question_pdf_page":66,"source_question_printed_page":68,"stem":"Clinically significant macular oedema as defined by the Early Treatment Diabetic Retinopathy Study (ETDRS) include","statements":[{"label":"a","text":"hard exudate within 500,m of the centre of the macular +/- retina thickening","answer":false},{"label":"b","text":"any retinal thickening within the macula","answer":false},{"label":"c","text":"an area of retinal thickening >1 disc area, any part of which lies within 1 disc diameter of the centre of the macula","answer":true},{"label":"d","text":"foveal non-perfusion on fluorescein angiogram more than 20 microaneurysm within the macula","answer":false},{"label":"e","text":"best corrected visual acuity of less than 6/9 in the absence of cataract","answer":false}],"answer_key":"FFTFF","true_statements":["c"],"false_statements":["a","b","d","e"],"explanation":"Clinically significant macular oedema in diabetic retinopathy is said to be present if either one of the following is present: retinal thickening at or within 500 um of the center of the macula ¢ hard exudates at or within 500 um of the center of the macula if associated with adjacent retinal thickening retinal thickening of > 1 dise area any part of which is within 1 disc diameter of the center of the macula","source_answer_pdf_page":71,"source_answer_printed_page":73,"id":166},{"section":"Retina and vitreous","section_question":17,"source_question_pdf_page":66,"source_question_printed_page":68,"stem":"Regarding Diabetes Control and Complications Trial (DCCT)","statements":[{"label":"a","text":"Hb Ajcis used to monitor the diabetic control","answer":true},{"label":"b","text":"the results only applied to type 1 diabetes","answer":true},{"label":"c","text":"there is initial worsening of retinopathy in patients undergoing intensive diabetic control","answer":true},{"label":"d","text":"the benefit of intensive control may not be realized for 3 to 5 years intensive diabetic control improves also the neuropathy and nephropathy","answer":true},{"label":"e","text":"good diabetic control reduces the risk of neuropathy and nephropathy","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"For type | diabetes mellitus, the Diabetes Control and Complications Trial (DCCT ) demonstrated that tight control ( HBAlc 7.2% versus 9% ) was associated with 76% reduction in retinopathy, 60% reduction in neuropathy and 54% reduction in nephropathy. Although good glycemic control is advised, there is some evidence that rapid improvement of long-standing poor control may increase the risk of retinopathy progression over the first year in some type 1 diabetic patients. Specifically, there may be a transient increase in the number of cotton-wool spots seen on retinal examination.","source_answer_pdf_page":71,"source_answer_printed_page":73,"id":167},{"section":"Retina and vitreous","section_question":18,"source_question_pdf_page":66,"source_question_printed_page":68,"stem":"In the United Kingdom Prospective Diabetic Study (UKPDS)","statements":[{"label":"a","text":"tight diabetic control is defined as HbA,, of 7% or less","answer":true},{"label":"b","text":"it only applies to type II diabetes mellitus","answer":true},{"label":"c","text":"the tight diabetic control is achieved with drugs only","answer":false},{"label":"d","text":"tight diabetic control reduces microvascular diseases by 25%","answer":true},{"label":"e","text":"simultaneous control of blood pressure has an add on effect in reducing microvascular diseases","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"The United Kingdom Prospective Diabetes Study (UKPDS) was a randomized controlled clinical trial of blood glucose control which enrolled 3867 patients with newly diagnosed type 2 diabetes. Tight glycemic control ( HBAlc 7% vs 7.9% ) was associated with 25% reduction in microvascular disease. Additionally tight BP control ( 144/82 vs 155/87 ) was associated with 37% reduction in microvascular disease and 32% reduction in diabetes related deaths.","source_answer_pdf_page":72,"source_answer_printed_page":74,"id":168},{"section":"Retina and vitreous","section_question":19,"source_question_pdf_page":66,"source_question_printed_page":68,"stem":"Regarding diabetic retinopathy","statements":[{"label":"a","text":"diabetic retinopathy is rare in type 1 diabetes mellitus at diagnosis","answer":true},{"label":"b","text":"diabetic retinopathy is present in 20% of type 2 diabetes mellitus at diagnosis","answer":true},{"label":"c","text":"diabetic retinopathy is worsened by pregnancy","answer":true},{"label":"d","text":"diabetic retinopathy is worsened by hypopituitarism","answer":false},{"label":"e","text":"_hypercholesterolaemia worsens maculopathy","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Type I diabetes mellitus is often diagnosed in children and diabetic retinopathy usually does not occur until puberty. Diabetic retinopathy is present in over 90% of patients after 15 years. In type 2 diabetes mellitus, retinopathy is present in 20% at diagnosis, but only rises to 60% after 15 years. Risk factors associated with worsening of diabetic retinopathy are duration of disease, glycemic control, hypertension, hypercholesterolaemia, nephropathy, pregnancy and intraocular surgery. Hypopituitarism protects the eye against proliferative diabetic retinopathy.","source_answer_pdf_page":72,"source_answer_printed_page":74,"id":169},{"section":"Retina and vitreous","section_question":20,"source_question_pdf_page":66,"source_question_printed_page":68,"stem":"The following are features of high risk proliferative diabetic retinopathy","statements":[{"label":"a","text":"presence of new vessels in the superior temporal arcade","answer":false},{"label":"b","text":"_ presence of new vessels covering one quarter the optic disc","answer":true},{"label":"c","text":"presence of new vessels anywhere outside the optic disc with haemorrhage","answer":true},{"label":"d","text":"presence of new vessels in the nasal nasal arcade","answer":false},{"label":"e","text":"presence of new vessels within 1 disc diameter of the optic disc with an ares about 1/4 of the disc area","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"High risk proliferative diabetic retinopathy is defined as: — neovascularization within 1 disc diameter of the optic disc; % to 1/3 area in size or larger, or any NVD associated with preretinal or vitreous haemorrhage, or neovascularization elsewhere associated with preretinal or vitreous haemorrhage","source_answer_pdf_page":72,"source_answer_printed_page":74,"id":170},{"section":"Retina and vitreous","section_question":21,"source_question_pdf_page":67,"source_question_printed_page":69,"stem":"In diabetic eye disease","statements":[{"label":"a","text":"the patient should be reviewed 4 weekly following laser treatment for focal maculopathy","answer":false},{"label":"b","text":"the patient should be reviewed at 2 months following panphotocoagulation for diabetic retinopathy","answer":false},{"label":"c","text":"photocoagulation should be applied first to the inferior retina in proliferative if the treatment were to be carried out in more than one session","answer":true},{"label":"d","text":"cataract treatment may lead to rubeotic glaucoma","answer":true},{"label":"e","text":"intravitreal triamcinolone is useful in macular oedema unresponsive to focal","answer":true}],"answer_key":"FFTTT","true_statements":["c","d","e"],"false_statements":["a","b"],"explanation":"New vessels regress in 2-4 weeks following pan-photocoagulation. They should be followed up in 4 — 6 weeks. Any vitreous haemorrhage will gravitate inferiorly and obscure this area, precluding further treatment. Diabetic maculopathy takes longer to resolve. Intravitreal triamcinolone is effective in reducing central macular thickness but its effects are not permanent","source_answer_pdf_page":72,"source_answer_printed_page":74,"id":171},{"section":"Retina and vitreous","section_question":22,"source_question_pdf_page":67,"source_question_printed_page":69,"stem":"The following are risk factors for central retinal vein occlusion","statements":[{"label":"a","text":"vasculitis","answer":true},{"label":"b","text":"raised intraocular pressure","answer":true},{"label":"c","text":"polycythaemia","answer":true},{"label":"d","text":"hypertension","answer":true},{"label":"e","text":"diabetes mellitus","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Central retinal vein occlusion occurs in: atherosclerotic: hypertension, hypercholesterolaemia, diabetes, smoking haematological: protein S, protein C or antithrombin deficiency, activated protein C_ resistance, factor V Leiden, myeloma, Waldenstrom's macroglobulinaemia, antiphospholipid syndrome inflammatory: Behcet's disease, polyarteritis nodosa, sarcoidosis, Wegener's granulomatosis, SLE, Goodpasture's syndrome. — ophthalmic: glaucoma, trauma, orbital pathology.","source_answer_pdf_page":72,"source_answer_printed_page":74,"id":172},{"section":"Retina and vitreous","section_question":23,"source_question_pdf_page":67,"source_question_printed_page":69,"stem":"Features that suggest a central retinal vein occlusion is ischaemic include","statements":[{"label":"a","text":"extensive venous dilatation","answer":true},{"label":"b","text":"extensive cotton wool spots","answer":true},{"label":"c","text":"presence of relative afferent pupillary defect","answer":true},{"label":"d","text":"a dark adapted electroretinography (ERG) of b-wave to a-wave ratio of \u003c1.0","answer":true},{"label":"e","text":"extensive areas of non-perfusion on fluorescein angiography","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Ischemic central retinal vein occlusion usually presented with severe clinical features as above. The prognosis is extremely poor due to macular ischemia. Rubeosis iridis develops in ischaemic cases and usually occurs 3 months (100 day glaucoma) after the attack. Pan-photocoagulation can prevent new vessels formation in central retinal vein occlusion.","source_answer_pdf_page":73,"source_answer_printed_page":75,"id":173},{"section":"Retina and vitreous","section_question":24,"source_question_pdf_page":67,"source_question_printed_page":69,"stem":"In central retinal vein occlusion","statements":[{"label":"a","text":"occlusion is caused by vein thrombosis at the level of the lamina cribrosa","answer":true},{"label":"b","text":"panphotocoagulation may prevent the development of rubeotic glaucoma in central retinal vein occlusion","answer":true},{"label":"c","text":"focal macular laser is useful in improving the visual acuity","answer":false},{"label":"d","text":"non-ischaemic central vein occlusion progresses to ischaemic central vein in 15% of cases by 4 months","answer":true},{"label":"e","text":"the risk of central retinal vein occlusion to the contralateral eye is 7% by 2","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"Thrombosis occur at the level where the caliber of the central retinal vein is smallest (at the level of lamina cribrosa). Rubeosis iridis develops in about 50% of eyes, usually between 2 and 4 months ( 100 day glaucoma ) and unless treated vigorously with pan-photocoagulation, there is a high risk of neovascular glaucoma. Focal macular laser does not influence visual outcome.","source_answer_pdf_page":73,"source_answer_printed_page":75,"id":174},{"section":"Retina and vitreous","section_question":25,"source_question_pdf_page":67,"source_question_printed_page":69,"stem":"In Branch Vein Occlusion Study, macular laser is useful if","statements":[{"label":"a","text":"there is foveal ischaemia","answer":false},{"label":"b","text":"visual acuity of 6/12 or worse","answer":true},{"label":"c","text":"no spontaneous improvement of macular oedema after 3-6 months","answer":true},{"label":"d","text":"multiple microaneurysms at and around the fovea","answer":false},{"label":"e","text":"hard exudates at the fovea","answer":false}],"answer_key":"FTTFF","true_statements":["b","c"],"false_statements":["a","d","e"],"explanation":"Macular laser is beneficial in branch retinal vein occlusion in the present of the following conditions: macular oedema visual acuity \u003c 6/12 no spontaneous improvement by 3 — 6 months","source_answer_pdf_page":73,"source_answer_printed_page":75,"id":175},{"section":"Retina and vitreous","section_question":26,"source_question_pdf_page":68,"source_question_printed_page":70,"stem":"Regarding retinal artery occlusion","statements":[{"label":"a","text":"most cases of branch retinal artery occlusion are caused by emboli","answer":true},{"label":"b","text":"vision is usually reduced to light perception","answer":false},{"label":"c","text":"the central vision may is preserved if the cilioretinal artery is present","answer":true},{"label":"d","text":"giant cell arteritis as is commoner in Asians than Europeans","answer":false},{"label":"e","text":"cherry red spot seen in central retinal artery occlusion is a permanent sign","answer":false}],"answer_key":"TFTFF","true_statements":["a","c"],"false_statements":["b","d","e"],"explanation":"The main cause of retinal arterial occlusions is an embolism lodging in the central retinal artery, where it constricts to pass through the lamina cribrosa or in a smaller branch arteriole. The most common presenting complaint is an acute, persistent painless loss of vision in the range of counting fingers to light perception in 90% of patients. If a cilioretinal artery is present there will be an area of perfusion from the optic disc to the macula. Giant cell arteritis is rare in Asian populations. Cherry red spot is not permanent","source_answer_pdf_page":73,"source_answer_printed_page":75,"id":176},{"section":"Retina and vitreous","section_question":27,"source_question_pdf_page":68,"source_question_printed_page":70,"stem":"Regarding post-operative cystoid macular oedema","statements":[{"label":"a","text":"it is more common in the diabetes than the general population","answer":true},{"label":"b","text":"fluorescence angiogram shows petalloid pattern of leakage","answer":true},{"label":"c","text":"_itcan be reduced with post-operative topical NSAID","answer":true},{"label":"d","text":"it can be diagnosed with optical coherence tomography","answer":true},{"label":"e","text":"both systemic acetazolamide and prednisolone may reduce the oedema","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Cystoid macular edema occur as a result of vascular compromise leading to leakage of serous fluid out of incompetent intraretinal capillaries. Fluid collects in the loosely arranged outer plexiform layer of Henle. This produces petaloid pattern in fluorescein angiography. The first line of treatment for CME is anti-inflammatory drops ( steroidal or nonsteroidal )The effort to move fluid from the retina through the choroid requires transport of fluid ions by the retinal pigment epithelium. Studies have shown that Acetazolamide use results in small but. statistical significant decreases in CME, but does not improve vision.","source_answer_pdf_page":73,"source_answer_printed_page":75,"id":177},{"section":"Retina and vitreous","section_question":28,"source_question_pdf_page":68,"source_question_printed_page":70,"stem":"In the Age-Related Eye Disease Study (AREDS) on age-related macular degeneration (ARMD)","statements":[{"label":"a","text":"lutein is shown to be of benefit in patients with ARMD.","answer":false},{"label":"b","text":"vitamin A, B, C and E were used in the study","answer":false},{"label":"c","text":"zine and copper are the two minerals included in the study","answer":true},{"label":"d","text":"supplements reduced the risk of progression of moderate to advanced ARMD","answer":true},{"label":"e","text":"25% supplements were useful in family members of patients with advanced ARMD","answer":false}],"answer_key":"FFTTF","true_statements":["c","d"],"false_statements":["a","b","e"],"explanation":"The Age-Related Eye Disease Study (AREDS) evaluated the effect of high-dose micronutrient supplements (antioxidants and vitamins consisting of vitamin A, C and E and minerals consisting of zinc and copper) on ARMD and vision loss. The results showed that patients with intermediate AMD (few intermediate or at least one large drusen, or non-subfoveal geographic atrophy) or advanced unilateral AMD (vision loss due to AMD in one eye) who are on the supplements had a 25% reduction of risk for progression to advanced AMD and a 19% risk reduction in rates of moderate vision loss (3 lines of visual acuity) by 5 years. Patients with no ARMD or only early ARMD (few small drusen) did not derive any benefit. The effects of lutein is not included in this study.","source_answer_pdf_page":74,"source_answer_printed_page":76,"id":178},{"section":"Retina and vitreous","section_question":29,"source_question_pdf_page":68,"source_question_printed_page":70,"stem":"Regarding choroidal neovascular membrane (CNVM) in age-related macular degeneration (ARMD)","statements":[{"label":"a","text":"type 1 CNVM is confined to the sub-RPE space","answer":true},{"label":"b","text":"type 2 CNVM involves both the sub-RPE and subretinal spaces.","answer":true},{"label":"c","text":"fluorescein angiogram is required to differentiate classic from occult CNVM","answer":true},{"label":"d","text":"photodynamic therapy is superior to focal laser in sub foveal CNVM","answer":true},{"label":"e","text":"photodynamic therapy is not useful for occult subfoveal CNVM","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Exudative age-related macular degeneration (AMD) is caused by choroidal neovascularization (CNV) originating from the choriocapillaris which grow through defects in Bruch membrane. CNV may remain confined to the sub-RPE space (type 1) or subsequently extend into the subretinal space (type 2). The main advantage of photodynamic therapy is the ability to selectively damage tissue, attributable to both preferential localization of the photosensitizer to the CNV and irradiation confined to the target tissue. The CNV is irradiated with light travels far lower than those required for thermal destruction by argon laser therapy, enabling treatment of subfoveal CNV.","source_answer_pdf_page":74,"source_answer_printed_page":76,"id":179},{"section":"Retina and vitreous","section_question":30,"source_question_pdf_page":68,"source_question_printed_page":70,"stem":"Regarding Lucentis (ranibizumab) and Avastin (bevacizumab)","statements":[{"label":"a","text":"they are monoclonal antibodies against vascular endothelial growth factor (VEGF)","answer":true},{"label":"b","text":"Avastin (bevacizumab) is a bigger molecule than Lucentis (ranibizumab)","answer":true},{"label":"c","text":"they are given via pars plana injection to treat posterior segment new vessels","answer":true},{"label":"d","text":"classic but not occult choroidal neovascularization in age-related macular degeneration responds to these substances","answer":false},{"label":"e","text":"stroke is a side effect of Lucentis (ranibizumab) when used to treat age-related macular degeneration","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Lucentis (ranibizumab) and Avastin (bevacizumab) are monoclonal antibody that actively bind and inactivate one group of the VEGF family, VEGF-A. Given intravitreally, they have been noted to cause regression of neovascularization in the posterior segment. Most of the studies so far have been done with Lucentis which is more expensive than Avastin. As Lucentis is a Fab fragment derived from the same parent molecule as Avastin both are expected to have the same ocular effects. In MARINA and ANCHOR trials that look at treatment for macular degeneration, 33% to 40% of patients gained 3 or more lines of visual acuity following intravitreal injection of Lucentis . Both occult and classic form of lesions appear to respond to Lucentis: MARINA looked at minimally classic and occult lesions and ANCHOR looked at predominantly classic lesions. A safety study (SAILOR) of intravitreal Lucentis for ARMD showed that the risk for stroke was significantly higher in patients receiving the recommended dose of ranibizumab (0.5 mg) compared with a 0.3 mg dose.","source_answer_pdf_page":74,"source_answer_printed_page":76,"id":180},{"section":"Ocular motility","section_question":1,"source_question_pdf_page":75,"source_question_printed_page":77,"stem":"Ina right sixth nerve palsy, the following may be observed","statements":[{"label":"a","text":"a right esotropia which is worse for distance than near","answer":true},{"label":"b","text":"a face turn to the left","answer":false},{"label":"c","text":"improved right eye movement when the left eye is closed","answer":true},{"label":"d","text":"V pattern on upgaze","answer":false},{"label":"e","text":"upshooting of the right eye on left gaze","answer":false}],"answer_key":"TFTFF","true_statements":["a","c"],"false_statements":["b","d","e"],"explanation":"During reading the two eyes converge and therefore the esotropia is less for near than distant in sixth nerve palsy. In a right sixth nerve palsy, the face turn will be to the right to eliminate the diplopia. Upshooting occurs in inferior oblique palsy and Duane's syndrome. Lateral rectus underaction may cause 'A' pattern not \"V' pattern","source_answer_pdf_page":81,"source_answer_printed_page":83,"id":181},{"section":"Ocular motility","section_question":2,"source_question_pdf_page":75,"source_question_printed_page":77,"stem":"The following muscle sequelae may occur in a right sixth nerve palsy","statements":[{"label":"a","text":"contraction of the right lateral rectus","answer":false},{"label":"b","text":"contraction of the right medial rectus","answer":true},{"label":"c","text":"inhibitional palsy of the left lateral rectus","answer":true},{"label":"d","text":"overaction of the left medial rectus","answer":true},{"label":"e","text":"contraction of the left lateral rectus","answer":false}],"answer_key":"FTTTF","true_statements":["b","c","d"],"false_statements":["a","e"],"explanation":"The muscle sequelae in extraocular muscle palsy occur in three stages and can be explained using the Hering's and Sherrington's law. i. Overaction of the contralateral synergist according to Hering's law. ii. Overaction of the ipsilateral antagonist as its action is unopposed by the paralysed muscle. iii. Secondary underaction of the contralateral antagonist. This occurs for two reasons: as the ipsilateral antagonist action is unopposed, less impulse is needed to move it into its desired position and consequently according to Hering's law, its contralateral synergist received less impulse and therefore underact. overaction of the contralateral synergist means that its ipsilateral antagonist will receive equal impulse to relax according to the Sherrington's law.","source_answer_pdf_page":81,"source_answer_printed_page":83,"id":182},{"section":"Ocular motility","section_question":3,"source_question_pdf_page":75,"source_question_printed_page":77,"stem":"In a case of unilateral sixth nerve palsy, the following additional signs may the location of the lesion","statements":[{"label":"a","text":"bilateral swollen discs - posterior fossa tumour","answer":false},{"label":"b","text":"right miosis and ptosis - cavernous sinus lesion","answer":true},{"label":"c","text":"fourth nerve palsy — orbital intraconal lesion","answer":false},{"label":"d","text":"right facial nerve palsy and analgesia and loss of taste to anterior two third of","answer":true},{"label":"e","text":"tongue - dorsal pon left hemiplegia - ventral pon","answer":true}],"answer_key":"FTFTT","true_statements":["b","d","e"],"false_statements":["a","c"],"explanation":"Bilateral swollen discs are commonly seen in patients with raised intracranial pressure and therefore have no localizing value (false localizing sign). The fourth nerve enters the orbit outside the circle of Zinn through the superior oblique fissure; therefore its involvement suggests the lesion is extraconal.","source_answer_pdf_page":81,"source_answer_printed_page":83,"id":183},{"section":"Ocular motility","section_question":4,"source_question_pdf_page":75,"source_question_printed_page":77,"stem":"Treatment of a right lateral rectus palsy include","statements":[{"label":"a","text":"injection of botulinum toxin into the right medial rectus","answer":true},{"label":"b","text":"base out Fresnel prism over the right eye","answer":true},{"label":"c","text":"Faden operation of the left medial rectus","answer":true},{"label":"d","text":"recession of the left medial rectus and resection of the right lateral rectus","answer":true},{"label":"e","text":"recession of the right medial rectus and resection of the lateral rectus","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Botox injection to the ipsilateral antagonist muscle causes palsy of the muscle and may allow the eye to return to the primary position. Squint surgery can be performed for either eye to reduce the deviation.","source_answer_pdf_page":81,"source_answer_printed_page":83,"id":184},{"section":"Ocular motility","section_question":5,"source_question_pdf_page":75,"source_question_printed_page":77,"stem":"In a patient with unilateral third nerve palsy, the following signs localize the to the cavernous sinus","statements":[{"label":"a","text":"dilatation of the pupil","answer":false},{"label":"b","text":"impaired ipsilateral corneal reflex","answer":true},{"label":"c","text":"miosis","answer":true},{"label":"d","text":"failure of the eye to abduct","answer":true},{"label":"e","text":"hearing loss","answer":false}],"answer_key":"FTTTF","true_statements":["b","c","d"],"false_statements":["a","e"],"explanation":"Compression of the third nerve along its path can result in mydriasis and does not localize the site to cavernous sinus. Impaired corneal reflex suggests involvement of the ophthalmic branch of the fifth nerve; miosis sympathetic nerve involvement and failure of the eye to abduct sixth nerve palsy. Hearing loss is related to cighth cranial nerve which does not pass through the cavernous sinus.","source_answer_pdf_page":81,"source_answer_printed_page":83,"id":185},{"section":"Ocular motility","section_question":6,"source_question_pdf_page":76,"source_question_printed_page":78,"stem":"The following are features of aberrant third nerve regeneration","statements":[{"label":"a","text":"elevation of the upper lid on downgaze","answer":true},{"label":"b","text":"eyelid opening on adduction","answer":true},{"label":"c","text":"intorsion of the globe on downgaze","answer":false},{"label":"d","text":"the pupil dilates on downgaze","answer":false},{"label":"e","text":"the pupil constricts on adduction","answer":true}],"answer_key":"TTFFT","true_statements":["a","b","e"],"false_statements":["c","d"],"explanation":"Aberrant regeneration of the third nerve is seen only in compressive lesion and never in medical cause of third nerve palsy. The physical signs are the results of misdirection of the third nerve fibres. The commonest ones being : Lid-gaze dyskinesis: the most common one being upper lid elevation on downgaze (see picture above). Less commonly there is lid elevation on adduction. Pupil-gaze dyskinesis: the pupil constricts on down-gaze or adduction.","source_answer_pdf_page":82,"source_answer_printed_page":84,"id":186},{"section":"Ocular motility","section_question":7,"source_question_pdf_page":76,"source_question_printed_page":78,"stem":"In a patient with a right superior oblique palsy","statements":[{"label":"a","text":"the left eye may be hypotropic","answer":true},{"label":"b","text":"the right eye may be hypertropic","answer":true},{"label":"c","text":"vertical diplopia occurs with left gaze","answer":true},{"label":"d","text":"the diplopia is usually worse for distance than near","answer":true},{"label":"e","text":"the diplopia is worse on tilting the head to the right","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"In right superior oblique palsy, the left eye may be hypotropic if the right eye is fixating. However, if the left eye is fixating, the right eye may be hypertropic. Due to inferior oblique overaction, the right eye will overshoot with left gaze causing vertical diplopia.","source_answer_pdf_page":82,"source_answer_printed_page":84,"id":187},{"section":"Ocular motility","section_question":8,"source_question_pdf_page":76,"source_question_printed_page":78,"stem":"Features favoring a congenital rather than an acquired fourth nerve palsy include","statements":[{"label":"a","text":"absence of cyclotorsion","answer":true},{"label":"b","text":"abnormal head posture","answer":false},{"label":"c","text":"V pattern on upgaze","answer":false},{"label":"d","text":"vertical fusional amplitude greater than 4 prism dioptre","answer":true},{"label":"e","text":"absence of binocular single vision","answer":false}],"answer_key":"TFFTF","true_statements":["a","d"],"false_statements":["b","c","e"],"explanation":"Feature of congenital fourth nerve palsy include: absence of cyclotorsion higher vertical fusional amplitude Abnormal head posture occurs in any long-standing fourth nerve palsy as a compensatory device and is not specific to congenital palsy.","source_answer_pdf_page":82,"source_answer_printed_page":84,"id":188},{"section":"Ocular motility","section_question":9,"source_question_pdf_page":76,"source_question_printed_page":78,"stem":"The following favours a bilateral to an unilateral fourth nerve palsy","statements":[{"label":"a","text":"extorsion of more than 10 degrees","answer":true},{"label":"b","text":"an abnormal head posture consists mainly of chin depression","answer":true},{"label":"c","text":"positive Bielschowsky head tilt test to either side","answer":true},{"label":"d","text":"significant hyperdeviation in the primary position","answer":false},{"label":"e","text":"large V pattern","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Features in favour of bilateral fourth nerve palsy include: slight hyperdeviation in primary position «reversal of hyperdeviation and diplopia on lateral versions ~ large V pattern chin depression being the main abnormal head posture with little or no head tilt extorsion of more than 10 degrees positive Bielschowsky head tilt test with head tilt to either shoulder","source_answer_pdf_page":82,"source_answer_printed_page":84,"id":189},{"section":"Ocular motility","section_question":10,"source_question_pdf_page":76,"source_question_printed_page":78,"stem":"Surgical treatment for right fourth nerve palsy may include","statements":[{"label":"a","text":"right inferior oblique recession","answer":true},{"label":"b","text":"right super rectus recession","answer":false},{"label":"c","text":"left inferior rectus recession","answer":true},{"label":"d","text":"right Harada-Ito procedure","answer":true},{"label":"e","text":"Faden procedure of the right superior oblique muscle","answer":false}],"answer_key":"TFTTF","true_statements":["a","c","d"],"false_statements":["b","e"],"explanation":"Harada-Ito procedures involves the transposition of the anterior half of the superior oblique tendon and is used to reduce torsion in superior oblique palsy. Faden procedure is for rectus muscle palsy.","source_answer_pdf_page":82,"source_answer_printed_page":84,"id":190},{"section":"Ocular motility","section_question":11,"source_question_pdf_page":77,"source_question_printed_page":79,"stem":"The following are true about latent nystagmus","statements":[{"label":"a","text":"it is absent when both eyes are open","answer":true},{"label":"b","text":"it is usually associated with accommodative esotropia","answer":false},{"label":"c","text":"itis a pendular nystagmus","answer":false},{"label":"d","text":"the fast phase is towards the side of the fixing eye","answer":true},{"label":"e","text":"CT scan should be ordered to exclude intracranial pathology","answer":false}],"answer_key":"TFFTF","true_statements":["a","d"],"false_statements":["b","c","e"],"explanation":"Latent nystagmus is usually associated with infantile esotropia. No nystagmus is present with both eyes open. When either eye is occluded, a horizontal jerk nystagmus occurs, the slow components are toward the occluded eye and the fast components beat toward the uncovered, fixing eye. It is a benign condition.","source_answer_pdf_page":83,"source_answer_printed_page":85,"id":191},{"section":"Ocular motility","section_question":12,"source_question_pdf_page":77,"source_question_printed_page":79,"stem":"The following are true about nystagmus","statements":[{"label":"a","text":"see-saw nystagmus is associated with homonymous hemianopia","answer":false},{"label":"b","text":"down-beat nystagmus is associated with lesion in the foramen magnum","answer":true},{"label":"c","text":"manifest latent nystagmus occur in unilateral congenital cataract","answer":true},{"label":"d","text":"gaze-evoked nystagmus is specific for cerebellar lesion","answer":false},{"label":"e","text":"convergence retraction nystagmus is associated with mid-brain tumours","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"See-saw nystagmus is associated with bitemporal hemianopia cause by lesion affecting optic chiasm. Gaze evoked nystagmus is specific for vestibular lesion.","source_answer_pdf_page":83,"source_answer_printed_page":85,"id":192},{"section":"Ocular motility","section_question":13,"source_question_pdf_page":77,"source_question_printed_page":79,"stem":"In idiopathic congenital nystagmus","statements":[{"label":"a","text":"fixation decreases the nystagmus","answer":false},{"label":"b","text":"head turn is common to minimize the nystagmus","answer":true},{"label":"c","text":"oscillopsia is a common complaint","answer":false},{"label":"d","text":"convergence decreases the nystagmus","answer":true},{"label":"e","text":"Kestenbaum-Anderson procedure is used to correct head turn","answer":true}],"answer_key":"FTFTT","true_statements":["b","d","e"],"false_statements":["a","c"],"explanation":"Fixation worsens but convergence dampens the nystagmus in idiopathic congenital nystagmus. Head turn is common to put the eyes in the null point in order to dampen the nystagmus and improves the vision. Oscillopsia is rarely a complaint. Kestenbaum-Anderson procedure involves operation on the rectus muscle to move the null point so that the face turn is eliminated or reduced, the operation can also decrease the nystagmus and improves the visual acuity.","source_answer_pdf_page":83,"source_answer_printed_page":85,"id":193},{"section":"Ocular motility","section_question":14,"source_question_pdf_page":77,"source_question_printed_page":79,"stem":"Synoptophore can be used to","statements":[{"label":"a","text":"detect abnormal retinal correspondence","answer":true},{"label":"b","text":"detect suppression","answer":true},{"label":"c","text":"grade binocular vision","answer":true},{"label":"d","text":"measure the angle of deviation","answer":true},{"label":"e","text":"measure fusional amplitudes","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"All the statements are true.","source_answer_pdf_page":83,"source_answer_printed_page":85,"id":194},{"section":"Ocular motility","section_question":15,"source_question_pdf_page":77,"source_question_printed_page":79,"stem":"Regarding tests for ocular alignment","statements":[{"label":"a","text":"Maddox wing tests near fixation","answer":true},{"label":"b","text":"Maddox rod can not measure cyclotropia","answer":false},{"label":"c","text":"Maddox rod does not distinguish between tropia and phoria","answer":true},{"label":"d","text":"Bagolini's test can be used to detect abnormal retinal correspondence","answer":true},{"label":"e","text":"Worth's four dots test is useful in detecting suppression","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"Maddox can be used to measure cyclotropia.","source_answer_pdf_page":83,"source_answer_printed_page":85,"id":195},{"section":"Ocular motility","section_question":16,"source_question_pdf_page":78,"source_question_printed_page":80,"stem":"With regard to test for ocular misalignment","statements":[{"label":"a","text":"cover/uncover test can distinguish comitant from incomitant squint","answer":false},{"label":"b","text":"cover/uncover test is useful for detecting latent ocular misalignment","answer":false},{"label":"c","text":"alternate cover test does not distinguish between the phoric and tropic deviations","answer":false},{"label":"d","text":"Hirschberg's test uses the corneal light reflex to determine the amount of ocular deviation","answer":true},{"label":"e","text":"Krimsky test uses prism to determine the amount of ocular deviation","answer":true}],"answer_key":"FFFTT","true_statements":["d","e"],"false_statements":["a","b","c"],"explanation":"Cover/uncover test is useful for detecting tropia but does not distinguish between comitant and incomitant squint. Alternate cover test unmasks phoria and latent ocular misalignment.","source_answer_pdf_page":83,"source_answer_printed_page":85,"id":196},{"section":"Ocular motility","section_question":17,"source_question_pdf_page":78,"source_question_printed_page":80,"stem":"True statements about microtropia include","statements":[{"label":"a","text":"it may result from operation for congenital esotropia","answer":true},{"label":"b","text":"the angle of deviation is typically between 15 and 20 A","answer":false},{"label":"c","text":"stereopsis is usually absent","answer":false},{"label":"d","text":"occlusion therapy is not indicated","answer":false},{"label":"e","text":"a base out 4 dioptre prism can be used to detect central scotoma","answer":true}],"answer_key":"TFFFT","true_statements":["a","e"],"false_statements":["b","c","d"],"explanation":"Angle of deviation for microtropia is less than 8A prism dioptres. Stereopsis will be reduced but not absent. Amblyopia which is usually slight is a common finding. However, in some cases the reduced vision may be significant enough to require occlusion therapy.","source_answer_pdf_page":83,"source_answer_printed_page":85,"id":197},{"section":"Ocular motility","section_question":18,"source_question_pdf_page":78,"source_question_printed_page":80,"stem":"In intermittent exotropia","statements":[{"label":"a","text":"most cases have an onset in childhood","answer":true},{"label":"b","text":"females are more commonly affected than male","answer":true},{"label":"c","text":"a positive family history is often present","answer":true},{"label":"d","text":"the exotropia is worse following alcohol","answer":true},{"label":"e","text":"diplopia is a common complaint","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"The onset of intermittent exotropia usually occurs in early childhood. The exotropia becomes more obvious late in the day with fatigue or during illness, inattention or after alcohol consumption. In the presence of bright light the patient usually closes one eye by reflex. Intermittent exotropia usually progresses to constant exotropia with time. Diplopia is rare.","source_answer_pdf_page":84,"source_answer_printed_page":86,"id":198},{"section":"Ocular motility","section_question":19,"source_question_pdf_page":78,"source_question_printed_page":80,"stem":"In exotropia","statements":[{"label":"a","text":"of the divergence excess type, the exotropia is worse with distant than near fixation","answer":true},{"label":"b","text":"due to convergence insufficiency, the exotropia is worse for near than distant fixation","answer":true},{"label":"c","text":"of the basic type, the magnitude of the exotropia is the same for distance and near","answer":true},{"label":"d","text":"tinted glasses is useful to reduce ocular dissociation","answer":true},{"label":"e","text":"plus lenses are useful for cases of convergence insufficiency.","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Minus lenses stimulate accommodate and therefore convergence and is useful in patient with convergence insufficiency.","source_answer_pdf_page":84,"source_answer_printed_page":86,"id":199},{"section":"Ocular motility","section_question":20,"source_question_pdf_page":78,"source_question_printed_page":80,"stem":"The following features are common in infantile esotropia","statements":[{"label":"a","text":"amblyopia","answer":false},{"label":"b","text":"large angle esotropia","answer":true},{"label":"c","text":"onset after 2 years of age","answer":false},{"label":"d","text":"absence of binocular function","answer":true},{"label":"e","text":"mental retardation","answer":false}],"answer_key":"FTFTF","true_statements":["b","d"],"false_statements":["a","c","e"],"explanation":"Amblyopia is not a feature as the two eyes fixate alternately. The onset of infantile esotropia is within first 6 months. Mental retardation is not a feature.","source_answer_pdf_page":84,"source_answer_printed_page":86,"id":200},{"section":"Ocular motility","section_question":21,"source_question_pdf_page":79,"source_question_printed_page":81,"stem":"In accommodative esotropia secondary hypermetropia","statements":[{"label":"a","text":"the onset is usually between 2 and 4 years of age","answer":true},{"label":"b","text":"the condition is worse for distance than near","answer":false},{"label":"c","text":"amblyopia rarely occur even without treatment","answer":false},{"label":"d","text":"early squint operation is beneficial in restoring binocular function","answer":false},{"label":"e","text":"the refractive correction should be based on cycloplegic refraction","answer":true}],"answer_key":"TFFFT","true_statements":["a","e"],"false_statements":["b","c","d"],"explanation":"Accommodative esotropia secondary to hypermetropia develops between two and four years of age. It is worse for near than for distance as accommodation worsen the esotropia. Treatment with glasses is important to prevent amblyopia, surgery is not beneficial.","source_answer_pdf_page":84,"source_answer_printed_page":86,"id":201},{"section":"Ocular motility","section_question":22,"source_question_pdf_page":79,"source_question_printed_page":81,"stem":"Elevation of the globe on adduction is seen in","statements":[{"label":"a","text":"ipsilateral superior oblique palsy","answer":true},{"label":"b","text":"Duane's syndrome","answer":true},{"label":"c","text":"Brown's syndrome","answer":false},{"label":"d","text":"congenital esotropia","answer":true},{"label":"e","text":"accommodative esotropia","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"Elevation of the globe on adduction occurs in ipsilateral superior oblique palsy as a result of ipsilateral oblique overaction. Inferior oblique overaction is also a feature of congenital esotropia. Upshooting is a feature of Duane's syndrome.","source_answer_pdf_page":84,"source_answer_printed_page":86,"id":202},{"section":"Ocular motility","section_question":23,"source_question_pdf_page":79,"source_question_printed_page":81,"stem":"In Duane's syndrome","statements":[{"label":"a","text":"esotropia is common in Type 1","answer":true},{"label":"b","text":"there is narrowing of the palpebral fissure on adduction","answer":true},{"label":"c","text":"15% are bilateral","answer":true},{"label":"d","text":"females are more often affected than male","answer":true},{"label":"e","text":"surgical correction usually restore the abnormal eye movement","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Duane's syndrome can be divided into three types: Type 1 consists of poor abduction, often with primary position esotropia; type 2 consists of poor adduction and exotropia; and type 3 consists of poor abduction and adduction, with esotropia, exotropia, or no primary position deviation. Narrowing of the palpebral fissure on attempted adduction is a common feature due to co-contraction of the horizontal recti. Surgery is only useful if there is significant face turn, it does not restore the normal eye movement.","source_answer_pdf_page":84,"source_answer_printed_page":86,"id":203},{"section":"Ocular motility","section_question":24,"source_question_pdf_page":79,"source_question_printed_page":81,"stem":"The following are features of Mébius syndrome","statements":[{"label":"a","text":"autosomal dominant inheritance","answer":false},{"label":"b","text":"_ bilateral sixth nerve palsy","answer":true},{"label":"c","text":"bilateral upper facial nerve palsy","answer":false},{"label":"d","text":"wasting of the tongue","answer":true},{"label":"e","text":"association with abnormalities of the upper extremities","answer":true}],"answer_key":"FTFTT","true_statements":["b","d","e"],"false_statements":["a","c"],"explanation":"Mobius syndrome is a rare condition characterized by bilateral sixth and seventh cranial nerve palsies. The patient often appears expressionless. There is no inheritance pattern noted. It is associated with bir lowe nerve palsy. Wasting of the tongue is a common feature. Some patients may have peripheral limb anomalies (Poland's syndrome).","source_answer_pdf_page":85,"source_answer_printed_page":87,"id":204},{"section":"Ocular motility","section_question":25,"source_question_pdf_page":79,"source_question_printed_page":81,"stem":"Regarding Brown's syndrome","statements":[{"label":"a","text":"dog bite to the face is a recognized cause of acquired Brown's syndrome","answer":true},{"label":"b","text":"there is restrictive elevation in abduction","answer":false},{"label":"c","text":"hypertropia in primary position is a recognized feature.","answer":false},{"label":"d","text":"clinically the signs may resemble inferior oblique palsy","answer":true},{"label":"e","text":"diagnosis of the condition is made by CT scan appearance of the superior oblique muscle.","answer":false}],"answer_key":"TFFTF","true_statements":["a","d"],"false_statements":["b","c","e"],"explanation":"Brown's syndrome may be congenital or acquired. Acquired forms include rheumatoid arthritis, sinusitis and trauma such as dog's bite. The main clinical feature is restrictive elevation on adduction. In severe cases, there may be hypotropia in the primary position. Clinically it may resemble inferior oblique muscle palsy. It is diagnosed with forced duction test.","source_answer_pdf_page":85,"source_answer_printed_page":87,"id":205},{"section":"Ocular motility","section_question":26,"source_question_pdf_page":80,"source_question_printed_page":82,"stem":"A patient presents with poor eye movement in one eye in all directions but without proptosis. The possibilities include","statements":[{"label":"a","text":"cavernous sinus thrombosis","answer":true},{"label":"b","text":"carcinomatous meningitis","answer":true},{"label":"c","text":"chronic progressive external ophthalmoplegia","answer":false},{"label":"d","text":"myotonic dystrophica","answer":false},{"label":"e","text":"myasthenia gravis","answer":true}],"answer_key":"TTFFT","true_statements":["a","b","e"],"false_statements":["c","d"],"explanation":"In both chronic progressive external ophthalmoplegia and myotonic dystrophica, poor eye movement occurs bilaterally.","source_answer_pdf_page":85,"source_answer_printed_page":87,"id":206},{"section":"Ocular motility","section_question":27,"source_question_pdf_page":80,"source_question_printed_page":82,"stem":"Spasmus nutans","statements":[{"label":"a","text":"usually begins at 3 years of age","answer":false},{"label":"b","text":"is associated with head nodding","answer":true},{"label":"c","text":"has jerky and large amplitude nystagmus","answer":false},{"label":"d","text":"is rarely associated with neurological disorders","answer":true},{"label":"e","text":"isa life long condition","answer":true}],"answer_key":"FTFTT","true_statements":["b","d","e"],"false_statements":["a","c"],"explanation":"Spasmus nutans is an acquired nystagmus that develops in the first 2 years of life and disappears by age 3 to 4 years. It consists of a triad of nystagmus, head nodding, and torticollis. The nystagmus is typically fine and can be horizontal, vertical, or rotary and is occasionally intermittent. It is a benign condition but occasionally associated with chiasmal or suprachiasmal lesions.","source_answer_pdf_page":85,"source_answer_printed_page":87,"id":207},{"section":"Ocular motility","section_question":28,"source_question_pdf_page":80,"source_question_printed_page":82,"stem":"Monocular elevation deficiency","statements":[{"label":"a","text":"refers to deficient elevation in all horizontal orientation of the eye","answer":true},{"label":"b","text":"is usually associated with hypotropia","answer":true},{"label":"c","text":"is associated with ptosis","answer":true},{"label":"d","text":"can be caused by inferior rectus restriction","answer":true},{"label":"e","text":"can be caused by weakness of the superior oblique muscle","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Monocular elevation deficiency is now the preferred termed for double elevator palsy. It can be caused by inferior rectus restriction of weakness of the elevators (superior rectus and inferior oblique). It is associated with hypotropia and ptosis.","source_answer_pdf_page":85,"source_answer_printed_page":87,"id":208},{"section":"Ocular motility","section_question":29,"source_question_pdf_page":80,"source_question_printed_page":82,"stem":"Regarding strabismus operation","statements":[{"label":"a","text":"it should always be performed on the deviating eye","answer":false},{"label":"b","text":"recession should always be performed before resection","answer":true},{"label":"c","text":"recession has a greater effect than resection on tropia","answer":false},{"label":"d","text":"hang-back procedure is useful for large muscle recession","answer":true},{"label":"e","text":"anterior ischaemic syndrome is a risk if operation involves more than two recti","answer":true}],"answer_key":"FTFTT","true_statements":["b","d","e"],"false_statements":["a","c"],"explanation":"The operation can be performed on the contralateral eye especially if the deviating eye has been previously operated on. Resection can result in muscle spasm and therefore should be performed after recession to avoid muscle slippage. Hang-back procedure is useful for large muscle recession especially if the scleral surface is difficult to access. Anterior ischaemic syndrome is a problem if more than two recti are operated on.","source_answer_pdf_page":85,"source_answer_printed_page":87,"id":209},{"section":"Ocular motility","section_question":30,"source_question_pdf_page":80,"source_question_printed_page":82,"stem":"Inferior oblique recession","statements":[{"label":"a","text":"need careful prism measurement","answer":false},{"label":"b","text":"is performed in ipsilateral fourth nerve palsy to remove cyclotorsion","answer":false},{"label":"c","text":"is performed in V-pattern esotropia","answer":true},{"label":"d","text":"is performed in contralateral superior rectus palsy","answer":false},{"label":"e","text":"is easier to perform than inferior oblique myectomy","answer":false}],"answer_key":"FFTFF","true_statements":["c"],"false_statements":["a","b","d","e"],"explanation":"Careful prism measurement is not needed for inferior oblique recession. It is performed in ipsilateral 4\" nerve to eliminate hypertropia. Inferior oblique myectomy is faster and easier to perform than recession.","source_answer_pdf_page":86,"source_answer_printed_page":88,"id":210},{"section":"Neuro-ophthalmology","section_question":1,"source_question_pdf_page":87,"source_question_printed_page":89,"stem":"In Adie's pupil","statements":[{"label":"a","text":"the lesion is in the midbrain","answer":false},{"label":"b","text":"the pupil becomes smaller with time","answer":true},{"label":"c","text":"iris vermiform movement observed on slit-lamp is caused by regeneration of","answer":true},{"label":"d","text":"sympathetic nerve","answer":true},{"label":"e","text":"pupil constriction in response to 0.1% pilocarpine is the result of denervation is a delay in pupil dilatation following near reflex","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"The lesion of Adie's pupil is in the ciliary ganglion. The pupil may become smaller with time and if bilateral may be mistaken for Argyll-Robertson's pupils. The vermiform movement is due to regeneration of the sympathetic nerve. Denervation supersensitivity is believed to explain pupillary constriction to 0.1% pilocarpine Following accommodation, there is a delay in pupil dilatation.","source_answer_pdf_page":93,"source_answer_printed_page":95,"id":211},{"section":"Neuro-ophthalmology","section_question":2,"source_question_pdf_page":87,"source_question_printed_page":89,"stem":"Causes of light near dissociation include","statements":[{"label":"a","text":"Argyll-Robertson's pupils","answer":true},{"label":"b","text":"myotonic dystrophy","answer":true},{"label":"c","text":"Adie's pupil","answer":true},{"label":"d","text":"pupils dilated with tropicamide","answer":false},{"label":"e","text":"Parinaud's syndrome","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Pupils that have been dilated with tropicamide do not respond to either light or accommodation.","source_answer_pdf_page":93,"source_answer_printed_page":95,"id":212},{"section":"Neuro-ophthalmology","section_question":3,"source_question_pdf_page":87,"source_question_printed_page":89,"stem":"A dilated pupil that does not respond to topical pilocarpine occurs in","statements":[{"label":"a","text":"third nerve palsy","answer":false},{"label":"b","text":"pupil dilated with phenylephrine","answer":false},{"label":"c","text":"pupil dilated with atropine","answer":true},{"label":"d","text":"Adie's pupil","answer":false},{"label":"e","text":"siderosis bulbi","answer":true}],"answer_key":"FFTFT","true_statements":["c","e"],"false_statements":["a","b","d"],"explanation":"In third nerve palsy, the pupil responds to parasympathetic stimulation. Phenylephrine dilates the pupil by stimulating the dilator but the constrictor remains sensitive to pilocarpine. Atropine is a strong mydriatic and the pupil cannot be overcome with pilocarpine. In Adie's pupil, the parasympathetic system can still be stimulated. In siderosis bulbi, there is loss of nervous tissue so that the pupil cannot be stimulated by pilocarpine.","source_answer_pdf_page":93,"source_answer_printed_page":95,"id":213},{"section":"Neuro-ophthalmology","section_question":4,"source_question_pdf_page":87,"source_question_printed_page":89,"stem":"In myotonic dystrophica","statements":[{"label":"a","text":"the inheritance is mitochondrial","answer":false},{"label":"b","text":"poor facial expression is caused by bilateral facial nerve palsy","answer":false},{"label":"c","text":"frontal balding occurs only in male","answer":false},{"label":"d","text":"ocular movement is limited","answer":false},{"label":"e","text":"lens subluxation is a feature","answer":false}],"answer_key":"FFFFF","true_statements":[],"false_statements":["a","b","c","d","e"],"explanation":"Myotonic dystrophica is an autosomal dominant condition. The poor facial expression results from muscle dystrophy-Frontal balding occurs in both males and females. The ocular movement isnormal. Cataract and no lens subluxation is a feature. AS","source_answer_pdf_page":93,"source_answer_printed_page":95,"id":214},{"section":"Neuro-ophthalmology","section_question":5,"source_question_pdf_page":87,"source_question_printed_page":89,"stem":"In the diagnosis of myasthenia gravis (MG)","statements":[{"label
