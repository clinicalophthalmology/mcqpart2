":"a","text":"a positive anticholinesterase receptor antibodies is commoner in generalized MG than ocular MG","answer":true},{"label":"b","text":"muscle biopsy is useful for diagnosis","answer":false},{"label":"c","text":"nerve conduction study is useful for diagnosis","answer":false},{"label":"d","text":"a positive Tensilon test is essential for diagnosis","answer":true},{"label":"e","text":"single fibre EMG shows fatiguability","answer":false}],"answer_key":"TFFTF","true_statements":["a","d"],"false_statements":["b","c","e"],"explanation":"In myasthenia gravis (MG), a positive anticholinesterase receptor antibodies is commoner in generalized MG than localized MG as in ocular MG. Muscle biopsy is not useful for diagnosis neither is nerve conduction study. Single fibre EMG and repetitive nerve stimulation test (not part of the nerve conduction study) are useful in diagnosing MG. A positive Tensilon test is essential for diagnosing MG. Single fibre EMG shows jittering impulse. pr","source_answer_pdf_page":93,"source_answer_printed_page":95,"id":215},{"section":"Neuro-ophthalmology","section_question":6,"source_question_pdf_page":88,"source_question_printed_page":90,"stem":"In ocular myasthenia gravis (MG)","statements":[{"label":"a","text":"horizontal recti are more commonly affected than vertical recti accounts for 50% of myasthenia gravis","answer":false},{"label":"b","text":"ptosis is usually worse in the morning than evening","answer":true},{"label":"c","text":"ptosis can be improved with ice cube application","answer":false},{"label":"d","text":"Cogan's twitch sign refers to overshooting of the eyelid when the patient looks","answer":true},{"label":"e","text":"from the downgaze position. the pupil response to light is sluggish","answer":false}],"answer_key":"FTFTF","true_statements":["b","d"],"false_statements":["a","c","e"],"explanation":"Vertical recti are commonly involved in myasthenia gravis (MG). 50% of MG involves the eyes only. Ptosis worsens towards the end of the day. Ptosis improves when ice cubes are applied. Cogan's twitch is seen in ocular MG involving the eyelid. Pupil response to light is normal.","source_answer_pdf_page":93,"source_answer_printed_page":95,"id":216},{"section":"Neuro-ophthalmology","section_question":7,"source_question_pdf_page":88,"source_question_printed_page":90,"stem":"pomat pupil that failed to dilate with 4% cocaine but dilates with 0.1% adrenaline occurs in","statements":[{"label":"a","text":"lesion in the upper chest","answer":true},{"label":"b","text":"syringobulbia","answer":false},{"label":"c","text":"dissecting carotid artery","answer":true},{"label":"d","text":"internal carotid artery aneurysm","answer":true},{"label":"e","text":"complication of thyroidectomy","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"Post-ganglionic Horner's pupil dilates with 0.1% adrenaline due to denervation hypersensitivity. Syringobulbia causes pre-ganglionic Homer's syndrome.","source_answer_pdf_page":94,"source_answer_printed_page":96,"id":217},{"section":"Neuro-ophthalmology","section_question":8,"source_question_pdf_page":88,"source_question_printed_page":90,"stem":"Examples of aberrant regeneration include","statements":[{"label":"a","text":"Meige's syndrome","answer":false},{"label":"b","text":"Duane's syndrome","answer":true},{"label":"c","text":"Marin-Amat's syndrome","answer":true},{"label":"d","text":"crocodile tears","answer":true},{"label":"e","text":"Marcus Gunn jaw winking ptosis","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"Duane's syndrome is related to aberrant sixth nerve regeneration. Marin- Amat's syndrome (winking of the eye with eating) and crocodile tear are related to facial nerve regeneration. Marcus Gunn jaw winking ptosis is caused by aberrant regeneration of the fifth nerve.","source_answer_pdf_page":94,"source_answer_printed_page":96,"id":218},{"section":"Neuro-ophthalmology","section_question":9,"source_question_pdf_page":88,"source_question_printed_page":90,"stem":"Ina patient with paralysis of the inferior branch of the oculomotor nerve, the following ipsilateral signs may be seen","statements":[{"label":"a","text":"dilated pupil","answer":true},{"label":"b","text":"adduction defect","answer":true},{"label":"c","text":"failure of globe elevation","answer":false},{"label":"d","text":"failure of extortion when the eye is abducted","answer":true},{"label":"e","text":"hypotropia","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"The inferior branch of the oculomotor nerve supplies the pupil, medical rectus, inferior rectus and inferior oblique muscles.","source_answer_pdf_page":94,"source_answer_printed_page":96,"id":219},{"section":"Neuro-ophthalmology","section_question":10,"source_question_pdf_page":88,"source_question_printed_page":90,"stem":"The following are true about third nerve palsy","statements":[{"label":"a","text":"the dilated pupil does not respond to accommodation","answer":true},{"label":"b","text":"_intorsion is intact if the fourth nerve is normal","answer":true},{"label":"c","text":"aberrant regeneration occurs only in compressive lesion","answer":false},{"label":"d","text":"aberrant regeneration can occur in the absence of previous third nerve palsy","answer":true},{"label":"e","text":"the presence of resting tremor in the contralateral side suggests a lesion in the red nucleus","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"The dilated pupil does not react to either light or accommodation. If the fourth nerve is intact, intorsion is normal. Aberrant regeneration occurs in traumatic and compressive lesion. It may occur in the absence of previous third nerve palsy as in meningioma of the cavernous sinus which can slowly compress the third nerve but at the same time allows its regeneration. Contralateral tremor in the presence of third nerve palsy suggests a lesion in the red nucleus (Benedikt Syndrome).","source_answer_pdf_page":94,"source_answer_printed_page":96,"id":220},{"section":"Neuro-ophthalmology","section_question":11,"source_question_pdf_page":89,"source_question_printed_page":91,"stem":"A patient developed a right trochlear palsy from head injury. On ocular testing, the following may be present","statements":[{"label":"a","text":"vertical diplopia worse on right gaze","answer":false},{"label":"b","text":"vertical diplopia worse for distant","answer":true},{"label":"c","text":"vertical diplopia worse on upgaze","answer":false},{"label":"d","text":"vertical diplopia worse on left head tilt","answer":false},{"label":"e","text":"vertical diplopia worse on levo-depression","answer":true}],"answer_key":"FTFFT","true_statements":["b","e"],"false_statements":["a","c","d"],"explanation":"Vertical diplopia in trochlear nerve palsy is worse when: patient looks at distant rather than near; on looking to the opposite side; on tilting the head to the same side and on looking down and to the opposite side","source_answer_pdf_page":94,"source_answer_printed_page":96,"id":221},{"section":"Neuro-ophthalmology","section_question":12,"source_question_pdf_page":89,"source_question_printed_page":91,"stem":"Ina left sixth nerve palsy","statements":[{"label":"a","text":"the diplopia is worse on right gaze","answer":false},{"label":"b","text":"the presence of Horner's syndrome suggests a cavernous sinus lesion","answer":true},{"label":"c","text":"the presence of ipsilateral seventh nerve palsy suggests the presence of a lesion","answer":false},{"label":"d","text":"the medulla","answer":true},{"label":"e","text":"the right eye becomes esotropic when the left eye fixates at a distant object skull invasion from nasopharyngeal carcinoma should be excluded","answer":true}],"answer_key":"FTFTT","true_statements":["b","d","e"],"false_statements":["a","c"],"explanation":"In sixth nerve palsy, the diplopia is worse when the patient looks to the same side of the lesion. The sixth nerve palsy passes through the cavernous sinus in close proximity to the sympathetic nerves that ascend along the wall of the internal carotid artery. According to the Herring's law, when left affected eye is fixating, there will be hyperaction of the contralateral medial rectus (yolk muscle) causing the right esotropia. In Foville syndrome there is conjugate ocular paralysis of the sixth and seventh cranial nerves, with hemiplegia on the opposite side. The lesion is in the pons. Skull base invasion from nasopharyngeal carcinoma is a common cause of sixth nerve palsy in the Far East","source_answer_pdf_page":94,"source_answer_printed_page":96,"id":222},{"section":"Neuro-ophthalmology","section_question":13,"source_question_pdf_page":89,"source_question_printed_page":91,"stem":"The following associations are true","statements":[{"label":"a","text":"see-saw nystagmus and tumour at 6Cigor of the thirg Yetricle","answer":true},{"label":"b","text":"upbeat nystagmus and lithium ee","answer":true},{"label":"c","text":"downbeat nystagmus and lesion at the cervical-medullary junction","answer":true},{"label":"d","text":"opsoclonus and neuroblastoma","answer":true},{"label":"e","text":"pendular nystagmus and bilateral cataract","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"The type of nystagmus mentioned can occur with the pathologies mentioned.","source_answer_pdf_page":95,"source_answer_printed_page":97,"id":223},{"section":"Neuro-ophthalmology","section_question":14,"source_question_pdf_page":89,"source_question_printed_page":91,"stem":"The following are true about internuclear ophthalmoplegia","statements":[{"label":"a","text":"the lesion is in the pons","answer":false},{"label":"b","text":"diplopia does not occur","answer":false},{"label":"c","text":"left lesion causes left adduction deficit and a right abduction nystagmus","answer":true},{"label":"d","text":"ipsilateral cases in the elderly is suggestive of cerebrovascular accident","answer":true},{"label":"e","text":"bilateral cases in a young person are suggestive of demyelinating disease","answer":true}],"answer_key":"FFTTT","true_statements":["c","d","e"],"false_statements":["a","b"],"explanation":"Internuclear ophthalmoplegia is caused by a lesion of the medial longitudinal fasciculus of the medulla. It causes problem with adduction and an abduction nystagmus. In ipsilateral case, the lesion is always on the same side as the eye with the adduction deficit. In the elderly, cerebrovascular accident is the commonest cause whereas in young person demyelination is commoner.","source_answer_pdf_page":95,"source_answer_printed_page":97,"id":224},{"section":"Neuro-ophthalmology","section_question":15,"source_question_pdf_page":89,"source_question_printed_page":91,"stem":"Causes of bilateral lower facial nerve facial palsy include","statements":[{"label":"a","text":"Miller Fisher's syndrome","answer":true},{"label":"b","text":"Moebius' syndrome","answer":true},{"label":"c","text":"sarcoidosis","answer":true},{"label":"d","text":"lyme's disease","answer":true},{"label":"e","text":"bilateral cerebral cortex infarction OL","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Bilateral cerebral cortex infarction causes bilateral upper facial nerve palsy which may resemble bilateral lower facial nerve palsy.","source_answer_pdf_page":95,"source_answer_printed_page":97,"id":225},{"section":"Neuro-ophthalmology","section_question":16,"source_question_pdf_page":90,"source_question_printed_page":92,"stem":"Features of lower facial nerve palsy include","statements":[{"label":"a","text":"brow ptosis","answer":true},{"label":"b","text":"upper lid retraction","answer":true},{"label":"c","text":"poor blink reflex","answer":true},{"label":"d","text":"lower lid ectropion","answer":true},{"label":"e","text":"impaired tear drainage","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"All these occur with lower facial nerve palsy.","source_answer_pdf_page":95,"source_answer_printed_page":97,"id":226},{"section":"Neuro-ophthalmology","section_question":17,"source_question_pdf_page":90,"source_question_printed_page":92,"stem":"Regarding optic neuritis","statements":[{"label":"a","text":"_itaffects female more commonly than males","answer":true},{"label":"b","text":"the vision worsens during exercise","answer":true},{"label":"c","text":"the presence of periventricular white maters on MRI scan increases the risk of multiple sclerosis","answer":true},{"label":"d","text":"pain on eye movement is more common during adduction than abduction","answer":true},{"label":"e","text":"more than 70% of multiple sclerosis patients develop optic neuritis,","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Females are more commonly affected than males. Increase body temperature as during exercise worsens the vision.","source_answer_pdf_page":95,"source_answer_printed_page":97,"id":227},{"section":"Neuro-ophthalmology","section_question":18,"source_question_pdf_page":90,"source_question_printed_page":92,"stem":"The findings of ONTT (Optic Neuritis Treatment Trial) include","statements":[{"label":"a","text":"the number of plaques seen on MRI correlates with the risk of multiple sclerosis","answer":true},{"label":"b","text":"IV methylprednisolone should be given to all patients with optic neuritis","answer":false},{"label":"c","text":"the final visual outcome in those treated with oral steroid is better than IV methylprednisolone","answer":false},{"label":"d","text":"patients treated with oral prednisolone has a higher rate of relapse than those treated with IV methylprednisolone","answer":true},{"label":"e","text":"IV methylprednisolone reduces the risk of multiple sclerosis","answer":false}],"answer_key":"TFFTF","true_statements":["a","d"],"false_statements":["b","c","e"],"explanation":"Intravenous methylprednisolone followed by oral prednisone speeds the recovery of visual loss due to optic neuritis and results in slightly better vision at six months. Oral prednisone alone, as prescribed in this study, is an ineffective treatment and increases the risk of new episodes of optic neuritis.","source_answer_pdf_page":95,"source_answer_printed_page":97,"id":228},{"section":"Neuro-ophthalmology","section_question":19,"source_question_pdf_page":90,"source_question_printed_page":92,"stem":"In acoustic neuroma","statements":[{"label":"a","text":"there is abnormal corneal reflex.","answer":true},{"label":"b","text":"the tumour arises from the Schwann cells","answer":true},{"label":"c","text":"_ bilateral cases is seen in type II neurofibromatosis","answer":true},{"label":"d","text":"most patients present with facial nerve palsy","answer":false},{"label":"e","text":"nystagmus occurs on looking to either side even if the lesion is unilateral","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"The involvement of the trigeminal nerve causes abnormal corneal reflex. Hearing loss and tinnitus are the most common presentation of acoustic neuroma. The tumour arises from Schwann cells. Nystagmus due to acoustic neuroma is coarse and slow upon gaze directed to the side of the lesion and is rapid and fine when gaze is directed away from the side of the lesion.","source_answer_pdf_page":95,"source_answer_printed_page":97,"id":229},{"section":"Neuro-ophthalmology","section_question":20,"source_question_pdf_page":90,"source_question_printed_page":92,"stem":"The following are appropriate treatment of benign intracranial hypertension","statements":[{"label":"a","text":"weight loss","answer":false},{"label":"b","text":"optic nerve fenestration","answer":true},{"label":"c","text":"long term steroid use","answer":false},{"label":"d","text":"cerebral shunt","answer":true},{"label":"e","text":"oral acetazolamide","answer":true}],"answer_key":"FTFTT","true_statements":["b","d","e"],"false_statements":["a","c"],"explanation":"Optic nerve fenestration is used if there is progressive visual loss to relieve the pressure on the optic nerve.","source_answer_pdf_page":96,"source_answer_printed_page":98,"id":230},{"section":"Neuro-ophthalmology","section_question":21,"source_question_pdf_page":91,"source_question_printed_page":93,"stem":"The following are associated with benign intracranial hypertension include","statements":[{"label":"a","text":"vitamin A overdose","answer":true},{"label":"b","text":"use of acne medication","answer":true},{"label":"c","text":"sleep apnea","answer":true},{"label":"d","text":"superior sagittal sinus thrombosis","answer":false},{"label":"e","text":"pituitary tumour","answer":false}],"answer_key":"TTTFF","true_statements":["a","b","c"],"false_statements":["d","e"],"explanation":"By definition, there is no obvious intracranial pathology such as tumours in benign raised intracranial hypertension.","source_answer_pdf_page":96,"source_answer_printed_page":98,"id":231},{"section":"Neuro-ophthalmology","section_question":22,"source_question_pdf_page":91,"source_question_printed_page":93,"stem":"Papilloedema is associated with","statements":[{"label":"a","text":"normal visual acuity","answer":true},{"label":"b","text":"increased blind spot","answer":true},{"label":"c","text":"absence venous pulsation","answer":true},{"label":"d","text":"visual obscuration","answer":true},{"label":"e","text":"break down of the blood retina barrier","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"The vision is normal in papilloedema and abnormal in optic nerve compression or inflammation. The blind spot is increased. Sudden transient visual loss called visual obscuration is common.","source_answer_pdf_page":96,"source_answer_printed_page":98,"id":232},{"section":"Neuro-ophthalmology","section_question":23,"source_question_pdf_page":91,"source_question_printed_page":93,"stem":"The following are true","statements":[{"label":"a","text":"left incongruous homonymous hemianopia: lesion in the right optic tract","answer":true},{"label":"b","text":"left superior homonymous quadrantanopia: lesion in the right parietal lobe","answer":false},{"label":"c","text":"left inferior homonymous quadrantanopia: lesion in the left temporal lobe","answer":false},{"label":"d","text":"left homonymous hemianopia: lesion in the right occipital lobe","answer":true},{"label":"e","text":"left temporal crescenteric visual field loss: lesion in the right temporal lobe","answer":true}],"answer_key":"TFFTT","true_statements":["a","d","e"],"false_statements":["b","c"],"explanation":"Lesion in the optic tract causes incongruous homonymous visual field loss. Lesions at and behind the geniculate body cause congruous homonymous visual field loss. Lesions in the optic tract and radiation cause contralateral visual field loss.","source_answer_pdf_page":96,"source_answer_printed_page":98,"id":233},{"section":"Neuro-ophthalmology","section_question":24,"source_question_pdf_page":91,"source_question_printed_page":93,"stem":"The following are true about bitemporal hemianopia","statements":[{"label":"a","text":"pituitary tumour typically affects the lower visual field first","answer":false},{"label":"b","text":"_craniopharyngioma typically affects the upper visual field first","answer":false},{"label":"c","text":"vertical diplopia may be present","answer":true},{"label":"d","text":"retinal detachment may be a cause","answer":true},{"label":"e","text":"bow tie optic atrophy is a feature","answer":true}],"answer_key":"FFTTT","true_statements":["c","d","e"],"false_statements":["a","b"],"explanation":"Pituitary tumour compresses the nerve fibre from the lower retina and therefore causes upper visual field defect early. The craniopharyngioma compresses the nerve fibres from the upper retina and therefore causes lower visual field defect initially. Bilateral retinal detachment may cause bitemporal hemianopia which do not obey the midline. Vertical diplopia in bitemporal hemianopia results from hemifield slip.","source_answer_pdf_page":96,"source_answer_printed_page":98,"id":234},{"section":"Neuro-ophthalmology","section_question":25,"source_question_pdf_page":91,"source_question_printed_page":93,"stem":"Optic nerve glioma","statements":[{"label":"a","text":"typically occurs in the second decade of life","answer":false},{"label":"b","text":"develops proptosis early","answer":true},{"label":"c","text":"shows optic nerve canal enlargement on CT scan","answer":true},{"label":"d","text":"calcification is common","answer":false},{"label":"e","text":"is associated with type 1 neurofibromatosis","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"Optic nerve glioma is seen in 15% of patients with type 1 neurofibromatosis, 80% presents before the age of 15. Proptosis occurs carly. CT scan shows optic nerve canal enlargement. Calcification is rare.","source_answer_pdf_page":96,"source_answer_printed_page":98,"id":235},{"section":"Neuro-ophthalmology","section_question":26,"source_question_pdf_page":92,"source_question_printed_page":94,"stem":"The following are features of optic nerve sheath meningioma","statements":[{"label":"a","text":"it accounts for 1-2% of all meningioma","answer":true},{"label":"b","text":"itis more common in females than males","answer":true},{"label":"c","text":"_ proptosis occurs early","answer":false},{"label":"d","text":"optociliary shunt is a feature","answer":true},{"label":"e","text":"tram-track calcification may be seen on CT scan","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"Optic nerve sheath meningioma is less common than intracranial meningioma, It is commoner in females than males. Proptosis typically occurs late (cf with optic nerve glioma). Optociliary shunt results from optic nerve compression. optic nerve sheath meningioma accounts for 1-2% of all meningioma, it is 1.5 time more common in females than males","source_answer_pdf_page":97,"source_answer_printed_page":99,"id":236},{"section":"Neuro-ophthalmology","section_question":27,"source_question_pdf_page":92,"source_question_printed_page":94,"stem":"In carotid-cavernous fistula","statements":[{"label":"a","text":"the bruit is best heard with the bell of the stethoscope","answer":true},{"label":"b","text":"ruptured internal carotid artery aneurysm is a cause","answer":true},{"label":"c","text":"high flow fistula is more common than low flow fistula","answer":false},{"label":"d","text":"low flow variety is more common in post-menopausal woman","answer":true},{"label":"e","text":"CT scan shows dilatation of the superior ophthalmic vein","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"Low flow fistula (75%) is more common than high flow. The increase cavernous sinus pressure causes dilatation of the superior ophthalmic vein.","source_answer_pdf_page":97,"source_answer_printed_page":99,"id":237},{"section":"Neuro-ophthalmology","section_question":28,"source_question_pdf_page":92,"source_question_printed_page":94,"stem":"The following signs occur in right lateral right medullary syndrome (Wallenberg's syndrome)","statements":[{"label":"a","text":"right Horner's syndrome","answer":true},{"label":"b","text":"dysarthria","answer":true},{"label":"c","text":"decreased left body pain sensation","answer":true},{"label":"d","text":"decreased right face temperature sensation","answer":true},{"label":"e","text":"gaze-evoked nystagmus","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"In Wallenberg's syndrome, the following signs are observed: contralateral deficits in pain and temperature sensation from body (dysfunction of lateral spinothalamic tract): ipsilateral loss of pain and temperature sensation from face (dysfunction of spinal trigeminal nucleus); ipsilateral dysphagia, hoarseness, diminished gag reflex (dysfunction of nucleus ambiguus, which affects vagus and glossopharyngeal nerves); vestibular dysfunction (vertigo, diplopia, nystagmus, vomiting); ipsilateral Horner's syndrome (dysfunction of descending sympathetic fibers). Patient may present with ataxia on the side of lesion. Patient might present with hiccoughs. There will be facial numbness on side of the lesion whereas there will be contralateral body numbness.","source_answer_pdf_page":97,"source_answer_printed_page":99,"id":238},{"section":"Neuro-ophthalmology","section_question":29,"source_question_pdf_page":92,"source_question_printed_page":94,"stem":"In midbrain tumour","statements":[{"label":"a","text":"there is convergence-retraction nystagmus","answer":true},{"label":"b","text":"ptosis is a feature","answer":true},{"label":"c","text":"upper lid retraction is a feature","answer":true},{"label":"d","text":"paresis of upgaze","answer":true},{"label":"e","text":"restricted horizontal eye movement","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"In midbrain tumour, both ptosis and eyelid retraction may occur. There is upgaze paresis with convergence-retraction nystagmus.","source_answer_pdf_page":97,"source_answer_printed_page":99,"id":239},{"section":"Neuro-ophthalmology","section_question":30,"source_question_pdf_page":92,"source_question_printed_page":94,"stem":"Gerstmann's syndrome is characterized by","statements":[{"label":"a","text":"dyscalculia","answer":true},{"label":"b","text":"left right disorientation","answer":true},{"label":"c","text":"left inferior homonymous quadrantanopia in a right handed person","answer":false},{"label":"d","text":"abnormal saccade when tested with the opticokinetic drum","answer":false},{"label":"e","text":"dyschromatopsia","answer":false}],"answer_key":"TTFFF","true_statements":["a","b"],"false_statements":["c","d","e"],"explanation":"Gerstmann's syndrome occurs in parietal lobe lesion. In a right handed person, the lesion is usually in the left parietal lobe. The four main symptoms are: dysgraphia, dyscalculia, left-right disorientation and finger agnosia. There is right inferior homonymous quadrantanopia. The pursuit is abnormal but the saccade which is controlled by the frontal lobe is normal.","source_answer_pdf_page":97,"source_answer_printed_page":99,"id":240},{"section":"Paediatric ophthalmology","section_question":1,"source_question_pdf_page":98,"source_question_printed_page":100,"stem":"The following are true about retinopathy of prematurity","statements":[{"label":"a","text":"the temporal retina is more often affected than the nasal retina","answer":true},{"label":"b","text":"65% of babies with birth weight less than 1250g has some stages of the disease","answer":true},{"label":"c","text":"first examination of at risk babies should occur at 32-34 weeks post- conceptional age","answer":true},{"label":"d","text":"all stages of the disease need treatment to avoid visual loss","answer":false},{"label":"e","text":"pseudoexotropia can occur due to peripheral cicatrization","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Vascularization of the temporal retina occurs later than the nasal retina and hence ROP tends to affect the temporal retina.ROP rarely occurs before 32 weeks postconceptional age and the disease activity rarely lasts beyond 42 weeks. The first examination should be between 32 -34 weeks post-conceptional age. 65% of babies with birth weight \u003c 1250g has some stages of ROP. Only threshold disease in ROP needs treatment. Dragged disc causes foveal displacement and pseudoexotropia.","source_answer_pdf_page":104,"source_answer_printed_page":106,"id":241},{"section":"Paediatric ophthalmology","section_question":2,"source_question_pdf_page":98,"source_question_printed_page":100,"stem":"The following are true about retinopathy of prematurity include","statements":[{"label":"a","text":"the extent of the disease is measured according to the zone involved","answer":false},{"label":"b","text":"zone I is defined as circle centre on the disc, with radius twice the disc fovea distance","answer":true},{"label":"c","text":"it is divided into 5 stages","answer":true},{"label":"d","text":"threshold disease will always progress without treatment","answer":false},{"label":"e","text":"in plus disease the retinal view is poor due to vitreous haze","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"The extent of ROP is described by how many clock hours of the retina are involved. The three zones as used in ROP staging are: e Zone I - Area centered on the optic disc and extending from the disc to twice the distance between the disc and the macula. ¢ Zone II - A ring, concentric to Zone I, which extends to the edge of the retina on the side of the eye toward the nose. ¢ Zone III - The remaining crescent area of the retina toward the side and away from the nose. The 5 stages of ROP are: Stage 1 Demarcation line (line where the normal and abnormal vessels meet) Stage 2 Intraretinal ridge (ridge that rises up from the retina as a result of the growth of the abnormal vessels) Stage 3 Ridge with extraretinal fibrovascular proliferation (the ridge grows from the spread of the abnormal vessels and extends into the vitreous) ¢ Stage 4 Subtotal retinal detachment (the partial detachment of the retina) Stage 5 Total retinal detachment Plus disease describes a significant level of vascular dilation and tortuosity observed at the posterior retinal vessels. This reflects the increase of blood flow through the retina. Poor fundal view may result from vitreous haze.","source_answer_pdf_page":104,"source_answer_printed_page":106,"id":242},{"section":"Paediatric ophthalmology","section_question":3,"source_question_pdf_page":98,"source_question_printed_page":100,"stem":"Ocular toxocariasis","statements":[{"label":"a","text":"usually results from ingestion of soils contaminated by puppy faeces","answer":true},{"label":"b","text":"typically contains a peripheral granuloma","answer":true},{"label":"c","text":", shows no calcification on CT scan","answer":true},{"label":"d","text":"results from the presence of larva in the choroid","answer":true},{"label":"e","text":"of the eye is treated with steroid","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Toxocariasis occurs in children with a history of soil ingestion contaminated by the droppings of puppies. The inflammation results from immune response to the presence of dead larva in the posterior segment so steroid is useful for controlling the inflammation. Granuloma is common in the peripheral retina, It may be mistaken for retinoblastoma but unlike retinoblastoma, the granuloma does not contain calcification on CT scan.","source_answer_pdf_page":104,"source_answer_printed_page":106,"id":243},{"section":"Paediatric ophthalmology","section_question":4,"source_question_pdf_page":98,"source_question_printed_page":100,"stem":"True statements about Coat's disease include","statements":[{"label":"a","text":"it is usually bilateral","answer":false},{"label":"b","text":"it is an autosomal recessive condition","answer":false},{"label":"c","text":"it affects boys more commonly than girls","answer":true},{"label":"d","text":"it causes exudative retinal detachment","answer":true},{"label":"e","text":"it is best treated with intravitreal steroid","answer":false}],"answer_key":"FFTTF","true_statements":["c","d"],"false_statements":["a","b","e"],"explanation":"Coats disease is a rare unilateral congenital retinal condition found mostly in boys 4 to 8 years of age. The condition is not inherited. It is characterized by the presence of peripheral telangiectasia which leaks and causes exudative retinal detachment. The management is with laser to close the abnormal vessels if the disease were detected early.","source_answer_pdf_page":105,"source_answer_printed_page":107,"id":244},{"section":"Paediatric ophthalmology","section_question":5,"source_question_pdf_page":98,"source_question_printed_page":100,"stem":"With regard to retinoblastoma","statements":[{"label":"a","text":"it affects about 1:20,000 live births","answer":true},{"label":"b","text":"90% of cases are diagnosed before 3 years of age","answer":true},{"label":"c","text":"calcification on CT scan is common","answer":true},{"label":"d","text":"osteogenic sarcoma is a common secondary cancer","answer":true},{"label":"e","text":"pineal tumour is common in bilateral retinoblastoma","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"The incidence of retinoblastoma worldwide ranges from 1 in 14,000 live births to 1 in 34,000. Most cases are detected before the age of 3. Calcification is common on CT scan. It is associated with osteogenic sarcoma and pineal tumour.","source_answer_pdf_page":105,"source_answer_printed_page":107,"id":245},{"section":"Paediatric ophthalmology","section_question":6,"source_question_pdf_page":99,"source_question_printed_page":101,"stem":"Concerning the genetics of retinoblastoma","statements":[{"label":"a","text":"the abnormal gene is located on the short arm of chromosome 13","answer":false},{"label":"b","text":"about 6% of the cases have a family history","answer":true},{"label":"c","text":"the offspring of a parent with bilateral retinoblastoma has almost 50% chance","answer":true},{"label":"d","text":"developing the tumour","answer":true},{"label":"e","text":"healthy parents with one affected child with unilateral retinoblastoma has a 1% chance of producing another affected child healthy parents with one affected child with bilateral retinoblastoma has a 6% chance of producing another affected child","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"The abnormal gene is located on the long arm of chromosome 13 (13q14). Only 6% of patients have a family history. The offspring of a parent with bilateral retinoblastoma has a 40% of developing the tumour as the genetic penetrance is about 80%. Healthy parents with one affected child with unilateral retinoblastoma has a 1% chance of producing another affected child, if the affected child has bilateral retinoblastoma the risk is 6%.","source_answer_pdf_page":105,"source_answer_printed_page":107,"id":246},{"section":"Paediatric ophthalmology","section_question":7,"source_question_pdf_page":99,"source_question_printed_page":101,"stem":"Features of congenital toxoplasmosis include","statements":[{"label":"a","text":"_ intracranial calcification","answer":true},{"label":"b","text":"epilepsy","answer":true},{"label":"c","text":"diffuse pigmentary retinopathy","answer":false},{"label":"d","text":"_hepatosplenomegaly","answer":true},{"label":"e","text":"deafness","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"The classic clinical triad of retinochoroiditis, cerebral calcifications, and convulsions defines congenital toxoplasmosis. Other findings _ include | hydrocephalus, microcephaly, organomegaly and psychomotor retardation.","source_answer_pdf_page":105,"source_answer_printed_page":107,"id":247},{"section":"Paediatric ophthalmology","section_question":8,"source_question_pdf_page":99,"source_question_printed_page":101,"stem":"Test that may support congenital toxoplasmosis include","statements":[{"label":"a","text":"infant Ig M antibody to toxoplasmosis","answer":true},{"label":"b","text":"infant Ig G antibody to toxoplasmosis","answer":false},{"label":"c","text":"maternal Ig M antibody to toxoplasmosis","answer":true},{"label":"d","text":"maternal Ig G antibody to toxoplasmosis","answer":false},{"label":"e","text":"head CT scan","answer":true}],"answer_key":"TFTFT","true_statements":["a","c","e"],"false_statements":["b","d"],"explanation":"Antitoxoplasma immunoglobulin M (IgM) antibodies are present in 75% of infants with congenital toxoplasmosis. Maternal Ig M antibody to toxoplasmosis indicates recent infection and hence passing the infection to the foetus. Ig M of mother could not cross placental, thus any level of Ig M in the neonate indicate vertical infection. Head CT scan typically shows intracranial calcifications which are supportive of congenital toxoplasmosis.","source_answer_pdf_page":105,"source_answer_printed_page":107,"id":248},{"section":"Paediatric ophthalmology","section_question":9,"source_question_pdf_page":99,"source_question_printed_page":101,"stem":"Regarding ophthalmia neonatorum","statements":[{"label":"a","text":"the term refers to conjunctivitis that occurs within the first 4 weeks of life","answer":true},{"label":"b","text":"gonococeal conjunctivitis is uncommon in babies delivered by caesarean section","answer":true},{"label":"c","text":"topical silver nitrate is routinely used in all babies in Malaysia","answer":false},{"label":"d","text":"gonococeal conjunctivitis tends to occur much earlier than chlamydial conjunctivitis","answer":true},{"label":"e","text":"chlamydial conjunctivitis is best treated with topical tetracycline ointment","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"Gonococcal conjunctivitis is acquired during the passage through the infected birth canal. Topical silver nitrate is not routinely used in Malaysian hospitals. Gonococcal conjunctivitis usually occurs 3 to 5 days after birth and chlamydial conjunctivitis usually occurs 5 to 14 days after birth. Chlamydial conjunctivitis should be treated with systemic antibiotic such as erythromycin because of the risk of pneumonitis.","source_answer_pdf_page":105,"source_answer_printed_page":107,"id":249},{"section":"Paediatric ophthalmology","section_question":10,"source_question_pdf_page":99,"source_question_printed_page":101,"stem":"Features that form the Hutchinson's triads of congenital syphilis include","statements":[{"label":"a","text":"saddle nose","answer":true},{"label":"b","text":"interstitial keratitis","answer":true},{"label":"c","text":"peg-shaped teeth","answer":true},{"label":"d","text":"retinitis pigmentosa","answer":false},{"label":"e","text":"deafness","answer":false}],"answer_key":"TTTFF","true_statements":["a","b","c"],"false_statements":["d","e"],"explanation":"The combination of peg-shaped tecth, interstitial keratitis, and deafness due to lesions of the eighth cranial nerve form the Hutchinson's triads.","source_answer_pdf_page":106,"source_answer_printed_page":108,"id":250},{"section":"Paediatric ophthalmology","section_question":11,"source_question_pdf_page":100,"source_question_printed_page":102,"stem":"In congenital glaucoma","statements":[{"label":"a","text":"presence of afferent pupillary defect suggests poor prognosis","answer":true},{"label":"b","text":"optic disc cupping is a poor prognostic factor","answer":false},{"label":"c","text":"the intraocular pressure is usually (repeated) in the 50s mmHg","answer":false},{"label":"d","text":"scrum anti rubella antibody is useful for determining the actiology","answer":true},{"label":"e","text":"urinalysis for protein or amino acid is usefull for diagnosing the cause","answer":true}],"answer_key":"TFFTT","true_statements":["a","d","e"],"false_statements":["b","c"],"explanation":"Cupping may be reversible in congenital glaucoma but the presence of relative afferent pupillary defect indicates permanent optic nerve damage. The intraocular pressure is usually in the mid-20s. Congenital~rubella causes cataract and glaucoma. Lowe's syndrome is associated waa and the presence of protein in the urine is seen in this condition.","source_answer_pdf_page":106,"source_answer_printed_page":108,"id":251},{"section":"Paediatric ophthalmology","section_question":12,"source_question_pdf_page":100,"source_question_printed_page":102,"stem":"Causes of poor vision in aniridia include","statements":[{"label":"a","text":"optic nerve hypoplasia","answer":true},{"label":"b","text":"lens dislocation","answer":true},{"label":"c","text":"macular hypoplasia","answer":true},{"label":"d","text":"glaucoma","answer":true},{"label":"e","text":"corneal neovascularization","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Poor vision in aniridia may be caused by lens dislocation, glaucoma or corneal neovascularization. Glaucoma is caused by the stump of iris that blocks the aqueous outflow and corneal neovascularization results from stem cell deficiency. Optic nerve and macular hypoplasia are causes of poor vision in aniridia.","source_answer_pdf_page":106,"source_answer_printed_page":108,"id":252},{"section":"Paediatric ophthalmology","section_question":13,"source_question_pdf_page":100,"source_question_printed_page":102,"stem":"Systemic association is rare in","statements":[{"label":"a","text":"anterior lenticonus","answer":false},{"label":"b","text":"posterior lenticonus","answer":true},{"label":"c","text":"bilateral cataract","answer":false},{"label":"d","text":"monocular cataract without family history","answer":false},{"label":"e","text":"cataract with retina pigmentary changes","answer":false}],"answer_key":"FTFFF","true_statements":["b"],"false_statements":["a","c","d","e"],"explanation":"Anterior lenticonus is the pathognomonic feature of Alport's syndrome. Posterior lenticonus is usually isolated. About 2/3 of bilateral cataract may have systemic association. Monocular cataract especially those without family history usually has no systemic association. Presence of retinal pigmentary changes should alert the clinicians to look for associated signs outside the eyes.","source_answer_pdf_page":106,"source_answer_printed_page":108,"id":253},{"section":"Paediatric ophthalmology","section_question":14,"source_question_pdf_page":100,"source_question_printed_page":102,"stem":"In a patient with bilateral cataract, the following tests are useful","statements":[{"label":"a","text":"serum calcium","answer":true},{"label":"b","text":"chromosome analysis","answer":true},{"label":"c","text":"urine test for reducing agents","answer":true},{"label":"d","text":"hearing test","answer":true},{"label":"e","text":"urine culture","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Hypocalcaemia occurs in hypoparathyroidism is associated with cataract. Trisomy 13, 18 and 21 are associated with cataract as is deletion of chromosome 5 (Cri du chat syndrome). Diabetes mellitus causes cataract and may be detected by finding reducing agents in the urine. Hearing test is abnormal in congenital rubella. Urine culture may also be positive for congenital rubella.","source_answer_pdf_page":106,"source_answer_printed_page":108,"id":254},{"section":"Paediatric ophthalmology","section_question":15,"source_question_pdf_page":100,"source_question_printed_page":102,"stem":"Congenital colobomas of the eyelids are associated with","statements":[{"label":"a","text":"Down's syndrome","answer":false},{"label":"b","text":"Goldenhar's syndrome","answer":true},{"label":"c","text":"Pierre-Robin's syndrome","answer":false},{"label":"d","text":"Treacher-Collins syndrome","answer":true},{"label":"e","text":"_Stickler's syndrome","answer":false}],"answer_key":"FTFTF","true_statements":["b","d"],"false_statements":["a","c","e"],"explanation":"Eyelid colobomas occur in the upper lids of Goldenhar's syndrome and the lower lids of Treacher-Collins syndrome.","source_answer_pdf_page":106,"source_answer_printed_page":108,"id":255},{"section":"Paediatric ophthalmology","section_question":16,"source_question_pdf_page":101,"source_question_printed_page":103,"stem":"Regarding congenital nasolacrimal duct blockage in an infant","statements":[{"label":"a","text":"the site of blockage is usually at the valve of Hasner","answer":true},{"label":"b","text":"orbital cellulitis is a common complication","answer":false},{"label":"c","text":"_syringing and probing should be performed as soon as possible","answer":false},{"label":"d","text":"the majority opens up spontaneously","answer":true},{"label":"e","text":"spontaneous opening is uncommon is the duct remains blocked after 15 months","answer":true}],"answer_key":"TFFTT","true_statements":["a","d","e"],"false_statements":["b","c"],"explanation":"Orbital cellulitis is uncommon as the lacrimal sac is outside the orbital septum. Syringing and probing is usually not done in the first years as up to 95% of patients with blocked nasolacrimal duct opens spontaneously after the first years. However, if the blockage persists beyond 15 months it is unlikely to open spontaneously and syringing and probing is then required.","source_answer_pdf_page":107,"source_answer_printed_page":109,"id":256},{"section":"Paediatric ophthalmology","section_question":17,"source_question_pdf_page":101,"source_question_printed_page":103,"stem":"Features of vernal keratoconjunctivitis include","statements":[{"label":"a","text":"superior corneal pannus","answer":true},{"label":"b","text":"deep stromal vascularization","answer":false},{"label":"c","text":"oval-shaped central epithelial defect","answer":true},{"label":"d","text":"subtarsal follicles","answer":false},{"label":"e","text":"punctate keratitis","answer":true}],"answer_key":"TFTFT","true_statements":["a","c","e"],"false_statements":["b","d"],"explanation":"Vernal keratoconjunctivitis (VKC) is a recurrent ocular inflammatory disease that has a seasonal incidence. It tends to occur more in dry and warm climates. It is a disease that affects children and young adults. Common features including giant papillae, superior corneal pannus, oval-shaped central epithelial defect and punctate keratitis. Superficial rather than deep stromal vascularization is seen.","source_answer_pdf_page":107,"source_answer_printed_page":109,"id":257},{"section":"Paediatric ophthalmology","section_question":18,"source_question_pdf_page":101,"source_question_printed_page":103,"stem":"In albinism","statements":[{"label":"a","text":"there is an increased decussation of the optic nerve fibres","answer":true},{"label":"b","text":"tyrosinase negative type has more severe visual impairment than tyrosinase cases","answer":true},{"label":"c","text":"strabismus is common","answer":true},{"label":"d","text":"_ pendular nystagmus is common","answer":true},{"label":"e","text":"there is an increased risk of basal cell carcinoma","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"About 90% of the optic nerve decussate. Absence of any pigments tend to be associated with poorer visual outcome than those with some pigments production. Strabismus is common as the patients do not have binocular single vision. Pendular nystagmus is a feature. The absence or decreased pigment increases the chance of skin cancer.","source_answer_pdf_page":107,"source_answer_printed_page":109,"id":258},{"section":"Paediatric ophthalmology","section_question":19,"source_question_pdf_page":101,"source_question_printed_page":103,"stem":"Regarding neuroblastoma","statements":[{"label":"a","text":"the age of onset is an important predictor of survival","answer":true},{"label":"b","text":"_ periorbital ecchymosis is common in orbital metastasis","answer":true},{"label":"c","text":"orbital metastasis occurs in 1/3 of the patients","answer":true},{"label":"d","text":"Horner's syndrome may be the presenting sign","answer":true},{"label":"e","text":"opsoclonus is the most common paraneoplastic syndrome seen","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Children younger than one years of age appear to do better than older patients. Periorbital ecchymosis occurs in orbital metastasis and occurs due to stretching of blood vessels from rapidly expanding tumours. Opsoclonus is the most common F paraneoplastic syndrome seen in this condition.","source_answer_pdf_page":107,"source_answer_printed_page":109,"id":259},{"section":"Paediatric ophthalmology","section_question":20,"source_question_pdf_page":101,"source_question_printed_page":103,"stem":"Capillary haemangioma of the face","statements":[{"label":"a","text":"is more common in girls than boys","answer":true},{"label":"b","text":"blanches with pressure","answer":true},{"label":"c","text":"may be associated with thrombocytopaenia","answer":true},{"label":"d","text":"requires treatment if it causes significant astigmatism","answer":true},{"label":"e","text":"undergoes regression with intralesional triamcinolone","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Capillary haemangioma is commoner in girls than boys. The lesion blanches with pressure. If large, the lesion can trap platelets causing thrombocytopenia. The ' lesion tends to involute spontaneously and requires treatment only if it causes vision problem through astigmatism or occlusion. Intralesional triamcinolone can cause tumour regression.","source_answer_pdf_page":107,"source_answer_printed_page":109,"id":260},{"section":"Paediatric ophthalmology","section_question":21,"source_question_pdf_page":102,"source_question_printed_page":104,"stem":"Metabolic disorders with corneal findings include","statements":[{"label":"a","text":"Tay-Sachs' disease","answer":false},{"label":"b","text":"Fabry's disease","answer":true},{"label":"c","text":"Hurler's disease","answer":true},{"label":"d","text":"Hunter's disease","answer":false},{"label":"e","text":"Sanfilippo's disease","answer":false}],"answer_key":"FTTFF","true_statements":["b","c"],"false_statements":["a","d","e"],"explanation":"Fabry's disease gives vortex keratopathy. Mucopolysaccharidoses commonly cause corneal cloudiness except hunter's and Sanfilippo.","source_answer_pdf_page":107,"source_answer_printed_page":109,"id":261},{"section":"Paediatric ophthalmology","section_question":22,"source_question_pdf_page":102,"source_question_printed_page":104,"stem":"Ocular features seen in Down's syndrome include","statements":[{"label":"a","text":"tortuous retinal vessels","answer":true},{"label":"b","text":"cataract","answer":true},{"label":"c","text":"ptosis","answer":false},{"label":"d","text":"Brushfield's spots","answer":true},{"label":"e","text":"refractive error","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"Ptosis is not a feature of Down's syndrome. The rest are common in Down's syndrome.","source_answer_pdf_page":108,"source_answer_printed_page":110,"id":262},{"section":"Paediatric ophthalmology","section_question":23,"source_question_pdf_page":102,"source_question_printed_page":104,"stem":"Ocular features of fetal alcohol syndrome include","statements":[{"label":"a","text":"shortened palpebral width","answer":true},{"label":"b","text":"ptosis","answer":true},{"label":"c","text":"optic nerve hypoplasia","answer":true},{"label":"d","text":"anterior segment dysgenesis","answer":false},{"label":"e","text":"tortuous retinal vessels","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Fetal alcohol syndrome happens to infants whose mothers drink heavily during pregnancy. Facial appearance include short palpebral fissures and epicanthal folds. ptosis, strabismus. 48% have optic disc anomalies with hypoplasia being the commonest. The retinal vessels show tortuosity.","source_answer_pdf_page":108,"source_answer_printed_page":110,"id":263},{"section":"Paediatric ophthalmology","section_question":24,"source_question_pdf_page":102,"source_question_printed_page":104,"stem":"Myopia is a feature in","statements":[{"label":"a","text":"delayed visual maturation","answer":false},{"label":"b","text":"achromatopsia","answer":true},{"label":"c","text":"congenital Leber's amaurosis","answer":true},{"label":"d","text":"congenital stationary blindness","answer":false},{"label":"e","text":"Norrie's disease","answer":false}],"answer_key":"FTTFF","true_statements":["b","c"],"false_statements":["a","d","e"],"explanation":"Myopia is common in congenital stationary blindness.","source_answer_pdf_page":108,"source_answer_printed_page":110,"id":264},{"section":"Paediatric ophthalmology","section_question":25,"source_question_pdf_page":102,"source_question_printed_page":104,"stem":"In craniosynostosis","statements":[{"label":"a","text":"the underlying pathology is early fusion of the skull bones","answer":true},{"label":"b","text":"_papilloedema is a complication","answer":true},{"label":"c","text":"V-pattern exotropia is the most common ocular misalignment seen","answer":true},{"label":"d","text":"optic atrophy results from narrow optic canal","answer":true},{"label":"e","text":"_pseudoproptosis results from shallow orbit","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Craniosynostosis results from early fusion of skull bones. The orbits are shallow causing pseudoproptosis. Papillocdema results from a confined intracranial space. Optic nerve compression can occur due to narrow optic canal. Exotropia is common with a V pattern.","source_answer_pdf_page":108,"source_answer_printed_page":110,"id":265},{"section":"Paediatric ophthalmology","section_question":26,"source_question_pdf_page":103,"source_question_printed_page":105,"stem":"Features of neurofibromatosis type II include","statements":[{"label":"a","text":"café au lait spot","answer":false},{"label":"b","text":"bilateral acoustic neuroma","answer":true},{"label":"c","text":"cataract","answer":true},{"label":"d","text":"Lisch's nodule","answer":false},{"label":"e","text":"open angle glaucoma","answer":false}],"answer_key":"FTTFF","true_statements":["b","c"],"false_statements":["a","d","e"],"explanation":"Type II neurofibromatosis is an autosomal dominant condition and the gene is located on chromosome 22. Unlike type I, it does not have cutaneous manifestation X The most common ocular sign is presenile cataract. Combined hamartomas of RPE and retina are also a feature. Bilateral acoustic neuroma is common.","source_answer_pdf_page":108,"source_answer_printed_page":110,"id":266},{"section":"Paediatric ophthalmology","section_question":27,"source_question_pdf_page":103,"source_question_printed_page":105,"stem":"The following are associated with neurofibromatosis type I","statements":[{"label":"a","text":"_uvea ectopia","answer":true},{"label":"b","text":"optic nerve glioma","answer":true},{"label":"c","text":"optic nerve meningioma","answer":true},{"label":"d","text":"astrocytoma of the retina","answer":true},{"label":"e","text":"plexiform neuroma","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Neurofibromatosis type I is located on chromosome 17. There is an increased incidence of uvea ectopia, optic nerve tumours, astrocytoma of the retina. Plexiform neuroma may affect the eyelid causing ptosis.","source_answer_pdf_page":108,"source_answer_printed_page":110,"id":267},{"section":"Paediatric ophthalmology","section_question":28,"source_question_pdf_page":103,"source_question_printed_page":105,"stem":"In tuberous sclerosis","statements":[{"label":"a","text":"the abnormal gene is located in chromosome 3","answer":false},{"label":"b","text":"there is an increased risk of glaucoma","answer":true},{"label":"c","text":"retinal angioma is common","answer":false},{"label":"d","text":"retinal astrocytoma is a feature","answer":true},{"label":"e","text":"shagreen patches visible only with Wood's light are useful for diagnosis","answer":false}],"answer_key":"FTFTF","true_statements":["b","d"],"false_statements":["a","c","e"],"explanation":"Tuberous sclerosis is an autosomal dominant condition and the gene is located on chromosome 9434. The classical triad consists of mental handicap, epilepsy, adenoma sebaceum. Retinal astrocytoma is found in 50% of cases. Ash leaf lesions are white patches best seen with Wood's light. Shagreen patches are round localized thickening of the skin.","source_answer_pdf_page":108,"source_answer_printed_page":110,"id":268},{"section":"Paediatric ophthalmology","section_question":29,"source_question_pdf_page":103,"source_question_printed_page":105,"stem":"Sturge-Weber's syndrome","statements":[{"label":"a","text":"is an inherited condition","answer":false},{"label":"b","text":"contains discoloured areas which blanch with pressure","answer":false},{"label":"c","text":"causes homonymous visual field defect","answer":true},{"label":"d","text":"causes glaucoma by raising the episcleral vessels pressure","answer":true},{"label":"e","text":"is associated with choroidal haemangioma which commonly causes exudative retinal detachment","answer":false}],"answer_key":"FFTTF","true_statements":["c","d"],"false_statements":["a","b","e"],"explanation":"Sturge-Weber's syndrome is not inherited. The discoloured areas do not blanch with pressure. The lesion may affect the ipsilateral visual pathway causing homonymous hemi- or quadrantanopia. The intraocular pressure may rise due to increased pressure of the episcleral vessels. Choroidal haemangioma is common but rarely | causes problem.","source_answer_pdf_page":109,"source_answer_printed_page":111,"id":269},{"section":"Paediatric ophthalmology","section_question":30,"source_question_pdf_page":103,"source_question_printed_page":105,"stem":"von Hippel-Lindau's disease is associated with","statements":[{"label":"a","text":"medulloepithelioma","answer":true},{"label":"b","text":"polycythaemia","answer":true},{"label":"c","text":"cystic liver","answer":true},{"label":"d","text":"renal cell carcinoma","answer":true},{"label":"e","text":"retina angioma","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Von Hippel-Lindau's disease is an autosomal dominant phakomatoses. The gene has been located on chromosome bands 3p25-26. It is associated with: Retina - Hemangioblastoma and retinal angiomatosis. Central nervous system - Hemangioblastoma and medulloepithelioma. Also increased incidence of meningioma Heart - Rhabdomyoma Kidney - Hemangioblastoma, renal cell adenoma, renal cell carcinoma Adrenal gland - Pheochromocytoma cyst Pancreas - Hemangioblastoma, cystadenoma, islet cell adenoma, and islet cell carcinoma Liver - Cyst, adenoma, angioma, and carcinoid of the common bile duct Spleen - Angioma and cyst Skin - Naevus and café au lait spot Bone - Cyst and hemangioma","source_answer_pdf_page":109,"source_answer_printed_page":111,"id":270},{"section":"Pathology","section_question":1,"source_question_pdf_page":110,"source_question_printed_page":112,"stem":"The following are true about fixatives used in histopathology","statements":[{"label":"a","text":"10% formalin is the most commonly used fixative","answer":true},{"label":"b","text":"glutaraldehyde is the fixative of choice for electron microscopy","answer":true},{"label":"c","text":"ethyl alcohol is suitable for fixating cytology specimen","answer":true},{"label":"d","text":"fixatives prevent discoloration of the tissue","answer":false},{"label":"e","text":"fixatives prevent autolysis","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"10% formalin is the most common fixative used in histopathology. It prevents postmortem enzymatic action (autolysis) but does not prevent discoloration. j Glutaraldehyde reacts rapidly with proteins and that stabilises structures by cross: linking before there is any opportunity for extraction by the buffer. Hence more ground substance of the cytoplasm (glycogen) and of the extracellular matrices is preserved. It is commonly used in electron microscopy. Ethyl alcohol is a protein denaturant and is not used routinely for tissues fixation because it causes too much ) brittleness and hardness. However, it is very good for cytologic smears because it acts quickly and gives good nuclear detail","source_answer_pdf_page":116,"source_answer_printed_page":118,"id":271},{"section":"Pathology","section_question":2,"source_question_pdf_page":110,"source_question_printed_page":112,"stem":"Compared with limbal dermoid, dermolipomas","statements":[{"label":"a","text":"most frequently occur in the superotemporal quadrant of the fornix.","answer":true},{"label":"b","text":"are softer than limbal dermoids","answer":true},{"label":"c","text":"have absent dermal adnexal structures","answer":true},{"label":"d","text":"are hamartomas","answer":false},{"label":"e","text":"are not seen in Goldenhar's syndrome","answer":false}],"answer_key":"TTTFF","true_statements":["a","b","c"],"false_statements":["d","e"],"explanation":"The presence of fatty tissue makes dermolipomas softer than dermoid. Dermolipomas do not contain dermal adnexal structures. Both are choristomas ie. Congenital proliferations of mature tissue not normally found at the site of occurrence. Both conditions occur in Goldenhar's syndrome and linear naevus sebaceous syndrome","source_answer_pdf_page":116,"source_answer_printed_page":118,"id":272},{"section":"Pathology","section_question":3,"source_question_pdf_page":110,"source_question_printed_page":112,"stem":"Orbital rhabdomyosarcoma","statements":[{"label":"a","text":"is the most common soft tissue tumour of the orbit in children","answer":true},{"label":"b","text":"typically presents with rapid proptosis without pyrexia","answer":true},{"label":"c","text":"of the embryonal type is the most common","answer":true},{"label":"d","text":"responds poorly to chemotherapy","answer":false},{"label":"e","text":"requires exenteration in the majority of patients","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Rhabdomyosarcoma is the most common soft tissue sarcoma in childhood. A rapidly expanding swelling is the usual initial presentation. Embryonal thabdomyosarcoma is the most common subtype observed in children, accounting for approximately 60% of all cases. Chemotherapy has dramatically improves the survival rate and reduces the need for radical surgery.","source_answer_pdf_page":116,"source_answer_printed_page":118,"id":273},{"section":"Pathology","section_question":4,"source_question_pdf_page":110,"source_question_printed_page":112,"stem":"Mucormycosis of the orbit","statements":[{"label":"a","text":"usually begins in the sinus","answer":true},{"label":"b","text":"causes central retinal artery occlusion","answer":true},{"label":"c","text":"commonly causes tissue necrosis","answer":true},{"label":"d","text":"isa complication in patients with poorly controlled diabetes mellitus.","answer":true},{"label":"e","text":"is associated with injury involving vegetation","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Mucormycosis is an opportunistic fungal infection, which typically occurs in patients with poor immune system such as poorly controlled diabetes mellitus especially in those with diabetic ketoacidosis. Treatment requires fungicides as well ) as extensive debridement.","source_answer_pdf_page":116,"source_answer_printed_page":118,"id":274},{"section":"Pathology","section_question":5,"source_question_pdf_page":110,"source_question_printed_page":112,"stem":"The following are true about conjunctival papillae","statements":[{"label":"a","text":"they contain lymphoid tissue","answer":false},{"label":"b","text":"they contain small central arteries","answer":true},{"label":"c","text":"clinically, they appear as flat top elevations","answer":true},{"label":"d","text":"_ they are seen in viral conjunctivitis","answer":false},{"label":"e","text":"they are seen in bacterial conjunctivitis","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"Lymphoid tissues occur in follicles. Follicles are seen in viral conjunctivitis Papillae are usually of bigger sizes","source_answer_pdf_page":116,"source_answer_printed_page":118,"id":275},{"section":"Pathology","section_question":6,"source_question_pdf_page":111,"source_question_printed_page":113,"stem":"Concerning juvenile xanthogranulomas","statements":[{"label":"a","text":"they typically affect infants and young children","answer":true},{"label":"b","text":"they contain proliferation of histiocytes","answer":true},{"label":"c","text":"they cause spontaneous hyphaema","answer":true},{"label":"d","text":"Touton giant cells are exclusive to this condition","answer":false},{"label":"e","text":"spontaneous resolution rarely occur","answer":false}],"answer_key":"TTTFF","true_statements":["a","b","c"],"false_statements":["d","e"],"explanation":"Juvenile xanthogranuloma(JXG) mainly affects infants and young children. It is a spectrum of histiocytic disorders. It is the most frequent cause of spontaneous hyphema in children and can result in secondary glaucoma. Touton giant cells are present in 85% of cases of IXG but not exclusive to this condition.","source_answer_pdf_page":117,"source_answer_printed_page":119,"id":276},{"section":"Pathology","section_question":7,"source_question_pdf_page":111,"source_question_printed_page":113,"stem":"Histological features of basal cell carcinoma include","statements":[{"label":"a","text":"palisading of the cells at the periphery of the tumour","answer":true},{"label":"b","text":"_hyperchromatic nuclei","answer":true},{"label":"c","text":"metastasis along the lymphatic channels","answer":false},{"label":"d","text":"hyperkeratosis","answer":true},{"label":"e","text":"inclusion bodies","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"Peripheral palisading of cells is seen in basal cell carcinoma. Hyperchromatic nuclei is a feature. Basal cell carcinoma invades locally. It does not metastasize. Hyperkeratosis may occur and mask the clinical features of basal cell carcinoma.","source_answer_pdf_page":117,"source_answer_printed_page":119,"id":277},{"section":"Pathology","section_question":8,"source_question_pdf_page":111,"source_question_printed_page":113,"stem":"The following are AIDS defining conditions","statements":[{"label":"a","text":"Kaposi's sarcoma","answer":true},{"label":"b","text":"conjunctival squamous cell carcinoma","answer":true},{"label":"c","text":"molluscum contagiosum","answer":true},{"label":"d","text":"cotton wool spots of the retina","answer":false},{"label":"e","text":"cytomegalovirus retinitis","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Cotton wool spots may occur in healthy HIV patients and not regarded as an AIDS defining illness.","source_answer_pdf_page":117,"source_answer_printed_page":119,"id":278},{"section":"Pathology","section_question":9,"source_question_pdf_page":111,"source_question_printed_page":113,"stem":"Thickened Descemet's membrane is a histological feature of","statements":[{"label":"a","text":"keratoconus","answer":false},{"label":"b","text":"Fuchs! corneal dystrophy","answer":true},{"label":"c","text":"pseudophakic bullous keratopathy","answer":true},{"label":"d","text":"lattice dystrophy","answer":false},{"label":"e","text":"congenital glaucoma","answer":false}],"answer_key":"FTTFF","true_statements":["b","c"],"false_statements":["a","d","e"],"explanation":"Descemet's membrane increases in thickness with age. In disease processes that damage the endothelium, the endothelial cells respond by producing new layer of Descemet's membrane.","source_answer_pdf_page":117,"source_answer_printed_page":119,"id":279},{"section":"Pathology","section_question":10,"source_question_pdf_page":111,"source_question_printed_page":113,"stem":"Prussian blue staining of the cornea is positive in","statements":[{"label":"a","text":"Kayser-Fleischer ring","answer":false},{"label":"b","text":"Ferry's line","answer":true},{"label":"c","text":"band keratopathy","answer":false},{"label":"d","text":"Hudson-Stahli's line","answer":true},{"label":"e","text":"Stocker's line","answer":true}],"answer_key":"FTFTT","true_statements":["b","d","e"],"false_statements":["a","c"],"explanation":"Prussian blue stains for iron. Ferry's line results from iron deposit in the anterior cornea found anterior to trabeculectomy bleb. Iron deposition line in the corneal epithelium, located at the corneal leading edge of a pterygium (Stocker's line) Hudson-Stahli's line also results from iron deposit in the epithelium of normal ageing population. Kayser-Fleisher rings results from copper deposit in Descemet's membrane. Band keratopathy results from calcium deposit in the Bowman layer and the superficial stroma of the cornea.","source_answer_pdf_page":117,"source_answer_printed_page":119,"id":280},{"section":"Pathology","section_question":11,"source_question_pdf_page":112,"source_question_printed_page":114,"stem":"Alcian blue stains the following blue","statements":[{"label":"a","text":"hyaluronic acid in the vitreous","answer":true},{"label":"b","text":"Schnabel's optic atrophy","answer":true},{"label":"c","text":"granular dystrophy","answer":false},{"label":"d","text":"macular dystrophy","answer":true},{"label":"e","text":"lens with pseudoex foliation syndrome","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"Alcian blue stains tissue containing mucopolysaccharide. In Schnabel's cavernous optic atrophy, there are large cystic spaces with cupping and loss of nerve fibers The material within the cystic spaces contains mucopolysaccharide that stains with Alcian Blue.","source_answer_pdf_page":117,"source_answer_printed_page":119,"id":281},{"section":"Pathology","section_question":12,"source_question_pdf_page":112,"source_question_printed_page":114,"stem":"Posterior embryotoxon","statements":[{"label":"a","text":"is caused by thickening of the Schwalbe's line","answer":false},{"label":"b","text":"is caused by anterior displacement of the Schwalbe's line","answer":true},{"label":"c","text":"is anormal finding in 10% of the population","answer":true},{"label":"d","text":"is associated with glaucoma in 50% of cases","answer":false},{"label":"e","text":"in the presence of iris processes that extend to the posterior surface of the cornea, is called Axenfeld's anomaly","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"Posterior embryotoxon represents thickening and anterior displacement of the Schwalbe's line which is the transitional zone between the cornea and the trabecular meshwork. It is a normal finding in 10 % of the population.","source_answer_pdf_page":118,"source_answer_printed_page":120,"id":282},{"section":"Pathology","section_question":13,"source_question_pdf_page":112,"source_question_printed_page":114,"stem":"A scrape from the periphery of a corneal ulcer revealed Gram negative bacilli, the possible causative agent may be","statements":[{"label":"a","text":"Neisseria gonorrhoeae","answer":false},{"label":"b","text":"Pseudomonas aeruginosa","answer":true},{"label":"c","text":"Moraxella spp","answer":false},{"label":"d","text":"Streptococcus spp","answer":false},{"label":"e","text":"Brucella spp","answer":true}],"answer_key":"FTFFT","true_statements":["b","e"],"false_statements":["a","c","d"],"explanation":"Both Pseudomonas aeruginosa and Brucellae are Gram negative bacilli. Neisseria gonorrhoeae and Moraxella are Gram negative diplococci. Streptococcus is a Gram positive coccus.","source_answer_pdf_page":118,"source_answer_printed_page":120,"id":283},{"section":"Pathology","section_question":14,"source_question_pdf_page":112,"source_question_printed_page":114,"stem":"Sudan black stains positive in the following conditions","statements":[{"label":"a","text":"sebaceous cell carcinoma","answer":true},{"label":"b","text":"xanthoma","answer":true},{"label":"c","text":"lattice dystrophy","answer":false},{"label":"d","text":"Schneider's crystalline dystrophy","answer":true},{"label":"e","text":"band keratopathy","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"Sudan black is a dye used to demonstrate triglycerides in frozen sections. Staining is positive in sebaceous cell carcinoma, xanthoma and Schneider's crystalline dystrophy. Staining is negative in lattice dystrophy (presence of amyloid) and band keratopathy (calcium).","source_answer_pdf_page":118,"source_answer_printed_page":120,"id":284},{"section":"Pathology","section_question":15,"source_question_pdf_page":112,"source_question_printed_page":114,"stem":"Risk factors for acanthamoeba keratitis include","statements":[{"label":"a","text":"use of hydrogen peroxide saline for cleaning contact lens","answer":false},{"label":"b","text":"use of tap water as cleaning solution","answer":true},{"label":"c","text":"swimming with contact lens in","answer":true},{"label":"d","text":"use of hot tub with contact lens in","answer":true},{"label":"e","text":"use of home made saline solution","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"Acanthamoeba keratitis occurs mainly in contact lens wearers. The risk factors include the use of tap water or home made saline to clean the lenses; swimming or using hot tubs with the contact lenses in.","source_answer_pdf_page":118,"source_answer_printed_page":120,"id":285},{"section":"Pathology","section_question":16,"source_question_pdf_page":113,"source_question_printed_page":115,"stem":"True statements about pleomorphic adenoma of the lacrimal gland include","statements":[{"label":"a","text":"itusually occurs in the elderly","answer":false},{"label":"b","text":"incisional biopsy is recommended for diagnosis","answer":false},{"label":"c","text":"itis surrounded by a true capsule","answer":false},{"label":"d","text":"malignant transformation occurs in long-standing cases","answer":true},{"label":"e","text":"it contains more than one cell component on histological examination","answer":true}],"answer_key":"FFFTT","true_statements":["d","e"],"false_statements":["a","b","c"],"explanation":"Pleomorphic adenoma affects men more common than women with a median age of 35. Excisional biopsy is recommended in suspected cases to avoid leaving behind any residual lesion which may recur and worse undergoes malignant transformation. It contains no true capsule, the apparent capsule is made up of compressed adjacent tissue. As the name implies it contains more than one component: epithelial and stromal components.","source_answer_pdf_page":118,"source_answer_printed_page":120,"id":286},{"section":"Pathology","section_question":17,"source_question_pdf_page":113,"source_question_printed_page":115,"stem":"The following pathological terms as applied to the lens are true","statements":[{"label":"a","text":"Wed cells are found in posterior subcapsular cataract","answer":true},{"label":"b","text":"Glaucomflecken is the result of anterior lenticular epithelium necrosis","answer":true},{"label":"c","text":"Mittendorf's dot is the anterior remnant of the hyaloid artery","answer":true},{"label":"d","text":"Soemmering's ring is made up of lenticular nucleus","answer":true},{"label":"e","text":"Elschnig's pearl contains cortical remnants","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Wedl or bladder cells are swollen cells found in posterior subcapsular cataract. Glaucomflecken occurs in acute glaucoma and results from anterior lenticular epithelium necrosis. Mittendorf's dot is the anterior remnant of the hyaloid artery. Soemmering's ring is made up of proliferating lens fibres in the equatorial region. Elschnig's pearl results from proliferating epithelial cells that cover the inner surface of the posterior capsule.","source_answer_pdf_page":118,"source_answer_printed_page":120,"id":287},{"section":"Pathology","section_question":18,"source_question_pdf_page":113,"source_question_printed_page":115,"stem":"The following are true about cotton wool spots on the retina","statements":[{"label":"a","text":"they occur in ischaemic retinopathies","answer":true},{"label":"b","text":"they are injured glial cells","answer":false},{"label":"c","text":"they are usually orientated along the nerve fibre layer","answer":true},{"label":"d","text":"they eventually develop into hard exudates","answer":false},{"label":"e","text":"they disappear with time","answer":true}],"answer_key":"TFTFT","true_statements":["a","c","e"],"false_statements":["b","d"],"explanation":"Cotton wool spots contain localised accumulations of axoplasmic debris in . ganglion cell axons and occurs in ischaemic retinopathies. Cotton wool spots : typically resolve in 4 to 12 weeks time.","source_answer_pdf_page":119,"source_answer_printed_page":121,"id":288},{"section":"Pathology","section_question":19,"source_question_pdf_page":113,"source_question_printed_page":115,"stem":"Histological features of retinoblastoma include","statements":[{"label":"a","text":"cell necrosis","answer":true},{"label":"b","text":"calcification","answer":true},{"label":"c","text":"undifferentiated tumour cells outnumber differentiated tumour cells","answer":true},{"label":"d","text":"cells with high mitotic figures","answer":true},{"label":"e","text":"large hyperchromatic nuclei with scanty cytoplasm","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Retinoblastoma is the most common primary ocular malignancy. The tumour often outgrows its blood supply resulting in tumour necrosis. Calcification is common. Undifferentiated tumour cells outnumber differentiated tumour cells. The tumour cells contain high mitotic figures with large hyperchromatic nuclei and hardly perceivable cytoplasm.","source_answer_pdf_page":119,"source_answer_printed_page":121,"id":289},{"section":"Pathology","section_question":20,"source_question_pdf_page":113,"source_question_printed_page":115,"stem":"Flexner-Wintersteiner's rosettes occur in","statements":[{"label":"a","text":"pinealoblastoma","answer":true},{"label":"b","text":"retinoblastoma","answer":true},{"label":"c","text":"medulloepithelioma","answer":false},{"label":"d","text":"astrocytoma","answer":false},{"label":"e","text":"glioma","answer":false}],"answer_key":"TTFFF","true_statements":["a","b"],"false_statements":["c","d","e"],"explanation":"Flexner-Wintersteiner's rosettes represent retinal differentiations and contain a central Iumen which is empty. It is characteristic of retinoblastoma but may also 'occur in pinealoblastoma.","source_answer_pdf_page":119,"source_answer_printed_page":121,"id":290},{"section":"Pathology","section_question":21,"source_question_pdf_page":114,"source_question_printed_page":116,"stem":"Important prognostic indicators in retinoblastoma include","statements":[{"label":"a","text":"_proptosis","answer":true},{"label":"b","text":"leucocoria","answer":false},{"label":"c","text":"tumour cell differentiation","answer":false},{"label":"d","text":"_ bilaterality","answer":true},{"label":"e","text":"tumour cells behind the lamina cribrosa","answer":
