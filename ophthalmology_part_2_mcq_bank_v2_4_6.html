true}],"answer_key":"TFFTT","true_statements":["a","d","e"],"false_statements":["b","c"],"explanation":"Proptosis and bilaterality increase the chance of extraocular extension. Tumour cells in the optic nerve is associated with an increased risk of intracranial spread and therefore poorer prognosis. Leucocoria is a common presentation of retinoblastoma and does not appear to have prognostic significance. Tumour cell differentiation also does not appear to affect the prognosis.","source_answer_pdf_page":119,"source_answer_printed_page":121,"id":291},{"section":"Pathology","section_question":22,"source_question_pdf_page":114,"source_question_printed_page":116,"stem":"The following changes are observed in diabetic retinopathy","statements":[{"label":"a","text":"proliferation of the endothelium cells","answer":false},{"label":"b","text":"thickened basement of the blood vessels","answer":true},{"label":"c","text":"breakdown of the blood retina barrier","answer":true},{"label":"d","text":"loss of pericytes","answer":true},{"label":"e","text":"dilated intraretinal capillaries","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"Diabetic retinopathy results from changes in the retinal microcirculation. The retinal capillary membrane is thickened, there is selective loss of pericytes as compared with the retinal capillary endothelial cells, microaneurysm formation and closure of the retinal capillaries. IRMA (intraretinal microvascular abnormalities) represents dilated intraretinal capillaries.","source_answer_pdf_page":119,"source_answer_printed_page":121,"id":292},{"section":"Pathology","section_question":23,"source_question_pdf_page":114,"source_question_printed_page":116,"stem":"In diabetic retinopathy","statements":[{"label":"a","text":"microaneurysms are found in the junction between the inner nuclear and outer plexiform layers.","answer":true},{"label":"b","text":"flame-haemorrhages occur in the nerve fibre layer.","answer":true},{"label":"c","text":"dot and blot haemorrhages occur in the inner plexiform layer.","answer":true},{"label":"d","text":"hard exudates is found on the nerve fibre layer","answer":false},{"label":"e","text":"IRMA (intraretinal microvascular abnormalities) show profuse leakage with fluorescein angiography.","answer":false}],"answer_key":"TTTFF","true_statements":["a","b","c"],"false_statements":["d","e"],"explanation":"Retinal oedema is rich in protein and lipids. When the fluid is absorbed, intraretinal hard exudate occurs. Unlike neovascularization, IRMA typically shows little or no leakage with fluorescein angiography.","source_answer_pdf_page":119,"source_answer_printed_page":121,"id":293},{"section":"Pathology","section_question":24,"source_question_pdf_page":114,"source_question_printed_page":116,"stem":"In central retinal artery occlusion","statements":[{"label":"a","text":"the occlusion typically occurs near the optic nerve head","answer":true},{"label":"b","text":"the most common cause is arteriosclerosis of the retinal artery","answer":true},{"label":"c","text":"_liquefactive infarction of the retinal nerve fibre layer is a feature","answer":true},{"label":"d","text":"gliosis is a prominent repair mechanism","answer":false},{"label":"e","text":"the photoreceptors undergo atrophy","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Following central retinal artery occlusion, the nerve fibres undergo liquefactive infarction. Gliosis is minimal. Although the photoreceptors receive nutrients from the choroidal circulation, with time they undergo atrophy.","source_answer_pdf_page":120,"source_answer_printed_page":122,"id":294},{"section":"Pathology","section_question":25,"source_question_pdf_page":114,"source_question_printed_page":116,"stem":"In phthisical bulbi, the following features are usual","statements":[{"label":"a","text":"calcification","answer":false},{"label":"b","text":"shrinkage of the globe","answer":true},{"label":"c","text":"atrophy of the ocular structures","answer":true},{"label":"d","text":"neovascularization","answer":false},{"label":"e","text":"disorganization of the ocular tissues","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":") In phthisical bulbi, the globe is shrunken. The sclera is thickened and the ocular | content is disorganized. Extensive calcification is common. The RPE may also . undergo bony metaplasia.","source_answer_pdf_page":120,"source_answer_printed_page":122,"id":295},{"section":"Pathology","section_question":26,"source_question_pdf_page":115,"source_question_printed_page":117,"stem":"The following intraocular foreign body are inert","statements":[{"label":"a","text":"copper","answer":false},{"label":"b","text":"steel","answer":false},{"label":"c","text":"gold","answer":true},{"label":"d","text":"wood","answer":false},{"label":"e","text":"porcelain","answer":true}],"answer_key":"FFTFT","true_statements":["c","e"],"false_statements":["a","b","d"],"explanation":"Glass, plastic and porcelain, inert metals like gold, platinum and tantalum, are not associated with chemical reaction. Lead and aluminium excite mild local reaction. Zine and nickel tend to excite suppurative reaction. Iron and copper the 2 most common material undergo electrolytic dissociation and are widely deposited throughout eye causing degenerative changes. Pure copper gives violent suppurative reaction with fibrosis and shrinkage of globe, but alloys give milder reaction resulting in chalcosis. Retained iron and steel (depending on ferrous content) causes siderosis. Wood and other vegetable matter produce reaction with leukocytic and giant cell infiltration and inflammation.","source_answer_pdf_page":120,"source_answer_printed_page":122,"id":296},{"section":"Pathology","section_question":27,"source_question_pdf_page":115,"source_question_printed_page":117,"stem":"Asteroid hyalosis","statements":[{"label":"a","text":"is usually unilateral","answer":true},{"label":"b","text":"contains calcification","answer":true},{"label":"c","text":"usually occurs following intravitreal haemorrhage","answer":false},{"label":"d","text":"contains asteroid bodies attached to the vitreous","answer":true},{"label":"e","text":"reduces the visual acuity","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"Asteroid hyalosis is usually unilateral. It contains soap of calcium attached to the vitreous. Synchysis scintillans, not asteroid hyalosis, results from intravitreal haemorrhage. It does not impair visual acuity.","source_answer_pdf_page":120,"source_answer_printed_page":122,"id":297},{"section":"Pathology","section_question":28,"source_question_pdf_page":115,"source_question_printed_page":117,"stem":"The following are poor prognostic features of choroidal melanoma","statements":[{"label":"a","text":"anterior location","answer":true},{"label":"b","text":"spindle A cell type","answer":false},{"label":"c","text":"large size","answer":true},{"label":"d","text":"breach of the Bruch's membrane","answer":true},{"label":"e","text":"increased vascularization","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"The size of the tumour and the cell type are the two most important prognostic factors in choroidal melanoma. Epithelioid cell type has the worst prognosis and spindle cell type A the best. An anteriorly located tumour may go undetected until it is large whereas a posteriorly located lesion tends to affect vision early and therefore detected earlier. Other characteristics of the tumour that have been found to correlate with decreased survival include transscleral extension, growth through the Bruch membrane, optic nerve extension, lack of pigmentation, increased vascularization.","source_answer_pdf_page":120,"source_answer_printed_page":122,"id":298},{"section":"Pathology","section_question":29,"source_question_pdf_page":115,"source_question_printed_page":117,"stem":"In posterior segment haemorrhage","statements":[{"label":"a","text":"a fluid level is seen in subhyaloid haemorrhage","answer":true},{"label":"b","text":"an ochre membrane is found on the posterior lenticular surface","answer":false},{"label":"c","text":"the breakdown products from haemoglobins give rise to synchysis scintillans","answer":false},{"label":"d","text":"epithelial damage results from accumulation of haemosiderin","answer":true},{"label":"e","text":"ghost cell glaucoma results from clogging of the trabecular meshwork by haemoglobin laden macrophages","answer":false}],"answer_key":"TFFTF","true_statements":["a","d"],"false_statements":["b","c","e"],"explanation":"A fluid level is seen in subhyaloid haemorrhage. The subhyaloid space is found between the vitreous cortex and the neural retina. Ochre membrane refers to degenerating and organized blood along the posterior vitreous cortex. Synchysis scintillans is made up of chol esterol that results from the breakdown of the red blood cell membrane. Degeneration of haemoglobins gives rise to haemosiderin which is accumulated by epithelial cells. Haemosiderin is toxic to epithelial cells. Ghost cell glaucoma results from the clogging of the trabecular meshwork by the deformed red blood cells that pass from the vitreous cavity into the anterior chamber. Glaucoma that results from clogging of the trabecular meshwork by haemoglobin laden macrophages is called haemolytic glaucoma.","source_answer_pdf_page":120,"source_answer_printed_page":122,"id":299},{"section":"Pathology","section_question":30,"source_question_pdf_page":115,"source_question_printed_page":117,"stem":"Regarding melanoma of the eye","statements":[{"label":"a","text":"conjunctival melanoma arises mainly from pre-existent primary acquired melanosis with atypia (PMA)","answer":true},{"label":"b","text":"_ liver is the most common site for metastasized conjunctival melanoma","answer":false},{"label":"c","text":"iris melanoma has a better prognosis than choroidal melanoma","answer":true},{"label":"d","text":"Naevus of Ota is associated with an increased risk of choroidal melanoma","answer":true},{"label":"e","text":"choroidal melanoma has equal incidence in Europeans and East Asians.","answer":false}],"answer_key":"TFTTF","true_statements":["a","c","d"],"false_statements":["b","e"],"explanation":"In 2/3 of the cases, conjunctival melanoma arises from pre-existent primary acquired melanosis with atypia (PMA). Unlike choroidal melanoma, conjunctival melanoma usually metastasizes to the facial lymph nodes first. Iris melanoma is usually slow growing and metastasizes late. An increased incidence of choroidal melanoma occurs in naevus of Ota as compared with the normal population. The incidence of choroidal melanoma is higher in the Europeans than the East Asians.","source_answer_pdf_page":121,"source_answer_printed_page":123,"id":300}]};</script>

function questionCardHtml(q,index){const answer=session.answers[q.id]||[null,null,null,null,null],revealed=session.revealed[q.id]||session.submitted,flagged=store.flagged.includes(q.id);return `<article class="card question-card ${index===currentIndex?"current-question":""}" id="question-${q.id}" data-question-id="${q.id}" data-session-index="${index}"><div class="q-kicker">Question group ${q.section_question}<span class="pill">${esc(q.section)}</span><span class="page-ref">Source question page ${q.source_question_printed_page}</span></div><h2 class="q-title">${esc(q.stem)}</h2><div class="statements">${q.statements.map((s,i)=>statementHtml(s,i,answer,revealed,q.id)).join("")}</div>${revealed?revealedPanelsHtml(q):""}<div class="q-actions"><button class="btn btn-ghost" ${revealed?`data-copy-question-answer="${q.id}"`:`data-copy-question="${q.id}"`}>${revealed?"Copy question and answer":"Copy question"}</button><button class="btn btn-ghost flag-btn ${flagged?"flagged":""}" data-flag="${q.id}">${flagged?"★ Flagged":"☆ Flag"}</button><span class="spacer"></span>${session.mode==="study"&&!revealed?`<button class="btn btn-primary" data-check="${q.id}">Check answers</button>`:""}</div></article>`}

function wireCopyButtons(root=document){root.querySelectorAll("[data-copy-question]").forEach(button=>button.onclick=()=>copyText(questionText(byId(button.dataset.copyQuestion))));root.querySelectorAll("[data-copy-question-answer]").forEach(button=>button.onclick=()=>copyText(questionAnswerText(byId(button.dataset.copyQuestionAnswer))))}
function confirmIncompleteSubmission(action){const completed=session.mode==="study"?completedGroups():answeredGroups(),missing=session.questions.length-completed;if(!missing)return true;return confirm(`${missing} question group${missing===1?" is":"s are"} incomplete. ${action} anyway? Unanswered statements count as incorrect.`)}
function submitSession(auto=false){if(!auto&&!confirmIncompleteSubmission("Submit"))return;session.submitted=true;session.questions.forEach(q=>{const ans=session.answers[q.id]||[null,null,null,null,null],score=ans.reduce((n,v,i)=>n+(v===q.statements[i].answer),0);store.attempts[q.id]={answers:ans,checked:true,score,updated:Date.now()}});saveStore();clearSavedSession(sessionKey(),session.section);stopTimer();showResults()}
function finishStudy(){if(!confirmIncompleteSubmission("Finish study"))return;session.submitted=true;stopTimer();const revealed=session.questions.filter(q=>session.revealed[q.id]);clearSavedSession(sessionKey(),session.section);if(!revealed.length){home();return}showResults(true)}
function showResults(study=false){leaveSessionView();setActive(session.contextMode||session.mode);const qs=study?session.questions.filter(q=>session.revealed[q.id]):session.questions;let correct=0,total=qs.length*5;qs.forEach(q=>{const a=session.answers[q.id]||[];correct+=a.reduce((n,v,i)=>n+(v===q.statements[i].answer),0)});const pct=total?Math.round(correct/total*100):0;const perSection={};qs.forEach(q=>{perSection[q.section]??={c:0,t:0};const a=session.answers[q.id]||[];perSection[q.section].c+=a.reduce((n,v,i)=>n+(v===q.statements[i].answer),0);perSection[q.section].t+=5});app.innerHTML=`<section class="page results">${breadcrumbHtml("Results")}<div class="card score-hero"><div class="score-ring" style="--score:${pct*3.6}deg"><strong>${pct}%</strong></div><h1>${pct>=80?"Strong performance":pct>=60?"A useful baseline":"Keep building"}</h1><p>${correct} of ${total} statements correct across ${qs.length} question groups.</p><div class="result-actions"><button class="btn btn-primary" id="reviewSession">Review answers</button><button class="btn btn-ghost" data-mode="${session.contextMode==="review"?"study":session.contextMode||session.mode}">New session</button><button class="btn btn-ghost" data-go="home">Dashboard</button></div></div><div class="card breakdown"><h2>Section breakdown</h2>${Object.entries(perSection).map(([name,v])=>{const p=Math.round(v.c/v.t*100);return `<div class="break-row"><span>${esc(name)}</span><div class="bar"><i style="width:${p}%"></i></div><b>${p}%</b></div>`}).join("")}</div></section>${footerHtml()}`;wire();document.getElementById("reviewSession").onclick=()=>{session.submitted=true;session.contextMode="review";session.questions.forEach(q=>session.revealed[q.id]=true);currentIndex=0;renderQuestion()}}
function review(){autosaveSession("navigation");leaveSessionView();stopTimer();session=null;setActive("review");const missed=QUESTIONS.filter(q=>store.attempts[q.id]?.checked&&store.attempts[q.id].score<5), flagged=QUESTIONS.filter(q=>store.flagged.includes(q.id)), ids=new Set([...flagged,...missed].map(q=>q.id)),items=QUESTIONS.filter(q=>ids.has(q.id)).sort(sequential);app.innerHTML=`<section class="page">${breadcrumbHtml("Review queue")}<div class="section-title"><div><div class="eyebrow">Target weak areas</div><h2>Review queue</h2><p>${flagged.length} flagged · ${missed.length} previously missed</p></div>${items.length?`<button class="btn btn-primary" id="startReview">Start new review</button>`:""}</div>${resumePanelHtml("review")}${items.length?`<div class="browse-list">${items.map(browseItem).join("")}</div>`:`<div class="card empty"><h2>Your review queue is clear</h2><p>Flag a question or answer any statement incorrectly to add it here.</p><button class="btn btn-primary" data-mode="study">Start studying</button></div>`}</section>${footerHtml()}`;wire();document.getElementById("startReview")?.addEventListener("click",()=>{clearSavedSession("review");session={mode:"study",contextMode:"review",questions:items,answers:{},revealed:{},submitted:false,started:Date.now(),viewMode:"continuous"};currentIndex=0;renderQuestion();autosaveSession("session-start")})}
function browse(){autosaveSession("navigation");leaveSessionView();stopTimer();session=null;setActive("browse");app.innerHTML=`<section class="page">${breadcrumbHtml("Browse question bank")}<div class="section-title"><div><h2>Browse the bank</h2><p>Search stems and statements, or filter by section.</p></div></div><div class="browse-tools"><input class="search" id="query" type="search" placeholder="Search all 300 question groups…"><select class="select" id="browseSection"><option>All sections</option>${BANK.sections.map(s=>`<option>${esc(s.name)}</option>`).join("")}</select></div><div class="browse-list" id="browseList"></div></section>${footerHtml()}`;const draw=()=>{const term=document.getElementById("query").value.trim().toLowerCase(),section=document.getElementById("browseSection").value;const rows=QUESTIONS.filter(q=>(section==="All sections"||q.section===section)&&(!term||`${q.stem} ${q.statements.map(s=>s.text).join(" ")}`.toLowerCase().includes(term))).sort(sequential);document.getElementById("browseList").innerHTML=rows.slice(0,100).map(browseItem).join("")+(rows.length>100?`<div class="notice">Showing the first 100 of ${rows.length} matches. Refine your search.</div>`:"");document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>resumeSingle(byId(b.dataset.open)))};document.getElementById("query").oninput=draw;document.getElementById("browseSection").onchange=draw;draw();wire()}
function browseItem(q){const a=store.attempts[q.id],status=a?.checked?`${a.score}/5 correct`:"Not attempted";return `<article class="card browse-item"><div><h3>${esc(q.stem)}</h3><p>${esc(q.section)} · Group ${q.section_question} · source question page ${q.source_question_printed_page} · ${status}${store.flagged.includes(q.id)?" · Flagged":""}</p></div><button class="btn btn-ghost" data-open="${q.id}">Open</button></article>`}
function remaining(){return Math.max(0,session.duration-Math.floor((Date.now()-session.started)/1000))}function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}function startTimer(){stopTimer();timerId=setInterval(()=>{const left=remaining(),el=document.getElementById("timer");if(el){el.textContent=formatTime(left);el.classList.toggle("low",left<300)}if(left>0&&left%15===0)scheduleAutosave("timer");if(left<=0){stopTimer();submitSession(true)}},1000)}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function wire(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>({home,review,browse}[b.dataset.go]||home)());document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setup(b.dataset.mode));document.querySelectorAll("[data-start-section]").forEach(b=>b.onclick=()=>setup("study",b.dataset.startSection));document.querySelectorAll("[data-resume-session]").forEach(b=>b.onclick=()=>restoreSavedSession(b.dataset.resumeSession));document.querySelectorAll(".choice-chip").forEach(b=>b.onclick=()=>{const parent=b.parentElement;parent.querySelectorAll(".choice-chip").forEach(x=>x.classList.remove("active"));b.classList.add("active")});document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>resumeSingle(byId(b.dataset.open)));resetPageScroll()}
document.addEventListener("keydown",e=>{if(!session||!document.querySelector(".question-card")||e.target.matches("input,select,textarea"))return;if(e.key==="ArrowRight"&&currentIndex<session.questions.length-1){scrollToQuestion(currentIndex+1)}if(e.key==="ArrowLeft"&&currentIndex>0){scrollToQuestion(currentIndex-1)}});
addEventListener("pagehide",()=>autosaveSession("pagehide"));
addEventListener("beforeunload",()=>autosaveSession("beforeunload"));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")autosaveSession("visibility-hidden")});
updateTopProgress();home();
})();
</script>
</body>
