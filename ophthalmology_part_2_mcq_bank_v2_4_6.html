rce_question_pdf_page":27,"source_question_printed_page":29,"stem":"Posner-Schlossman glaucoma shows the following features","statements":[{"label":"a","text":"severe uveitis","answer":false},{"label":"b","text":"_keratitic precipitates","answer":true},{"label":"c","text":"intraocular pressure in the mid-20","answer":false},{"label":"d","text":"angle closure","answer":false},{"label":"e","text":"granulomatous nodules on the iris","answer":false}],"answer_key":"FTFFF","true_statements":["b"],"false_statements":["a","c","d","e"],"explanation":"omictry Posner-Schlossman glaucoma is associated with mild anterior uveitis. The ASIK, intraocular pressure is typically between 40 to 60 mmHg. The uveitis is nongranulomatous. Fine keratitic precipitates may be found on the endothelium. The angle is open.","source_answer_pdf_page":33,"source_answer_printed_page":35,"id":75},{"section":"Glaucoma","section_question":16,"source_question_pdf_page":28,"source_question_printed_page":30,"stem":"In phacolytic glaucoma","statements":[{"label":"a","text":"the lens capsule is breached","answer":false},{"label":"b","text":"there is presence of macrophages in the anterior chamber","answer":true},{"label":"c","text":"the lens is usually hypermature","answer":true},{"label":"d","text":"the peripheral drainage angle is closed","answer":false},{"label":"e","text":"peripheral iridotomy is useful in relieving the glaucoma","answer":false}],"answer_key":"FTTFF","true_statements":["b","c"],"false_statements":["a","d","e"],"explanation":"y. The mia of Phacolytic glaucoma occurs in cataractous lenses with intact lens capsules. There is i's line liquefaction of the lens nucleus and cortex, attenuation of the capsule with the ene release of lens proteins into the anterior chamber. A macrophagic response is urgery, typically present. Numerous macrophages having phagocytized degenerated lens material (phacolytic cells), can be found in the anterior chamber. Phacolytic glaucoma is an open-angle glaucoma.","source_answer_pdf_page":33,"source_answer_printed_page":35,"id":76},{"section":"Glaucoma","section_question":17,"source_question_pdf_page":28,"source_question_printed_page":30,"stem":"Pigment dispersion syndrome","statements":[{"label":"a","text":"occurs more commonly in myopic male","answer":true},{"label":"b","text":"is associated with a convex peripheral iris","answer":false},{"label":"c","text":"typically has a region of horizontal pigmentation on the posterior cornea","answer":false},{"label":"d","text":"is associated with blurring of vision during exercise","answer":true},{"label":"e","text":"peripheral iridotomy may reduce pigment dispersion","answer":true}],"answer_key":"TFFTT","true_statements":["a","d","e"],"false_statements":["b","c"],"explanation":"ed with factors Myopia is present in approximately 80% of affected individuals with pigment ater Gispersion syndrome. The condition is more common in male than female. There is a posterior bowing of the peripheral iris that precipitates the zonular touch and / increased pigment liberation. Pigmentary glaucoma may be asymptomatic or ' patients may complain of symptoms related to episodic IOP rises (colored haloes around lights, blurred vision and subtle ocular pain) particularly after exercise. During exercise, increase sympathetic discharge causes pupillary dilatation and therefore increasing zonular touch and pigment liberation. Peripheral iridotomy allows aqueous to move freely between the posterior and anterior chamber therefore reduces the iris lenticular touch.","source_answer_pdf_page":33,"source_answer_printed_page":35,"id":77},{"section":"Glaucoma","section_question":18,"source_question_pdf_page":28,"source_question_printed_page":30,"stem":"Pseudoexfoliation syndrome is associated with","statements":[{"label":"a","text":"leakage of the iris vessels on fluorescein angiography","answer":true},{"label":"b","text":"_ peripupillary iris atrophy","answer":true},{"label":"c","text":"pigmentation of the trabecular meshwork","answer":true},{"label":"d","text":"_ iridodonesis","answer":true},{"label":"e","text":"diffuse iris pigmentation","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"The abnormal basement membrane of iris blood vessels lead to leakage on fluorescein angiography. Iris atrophy and increased pigmentation of the trabecular meshwork are typical features in pseudoexfoliation syndrome. Pseudoexfoliative deposits are associated with degeneration of the ciliary epithelium, zonules (zonular dehiscence and lens subluxation) and posterior iris epithelium (pigment dispersion, poor pupil dilation, posterior synechiae, iridodonesis).","source_answer_pdf_page":34,"source_answer_printed_page":36,"id":78},{"section":"Glaucoma","section_question":19,"source_question_pdf_page":28,"source_question_printed_page":30,"stem":"The following are true about neovascular glaucoma","statements":[{"label":"a","text":"the angle is closed in advanced glaucoma","answer":true},{"label":"b","text":"the new vessels typically begin at the angle","answer":false},{"label":"c","text":"the risk is increased in diabetic patients who underwent cataract surgery","answer":true},{"label":"d","text":"panphotocoagulation of the retina is useful in reversing the glaucoma even in advanced cases","answer":false},{"label":"e","text":"it is more common in branch retinal vein occlusion than central retinal vein occlusion","answer":false}],"answer_key":"TFTFF","true_statements":["a","c"],"false_statements":["b","d","e"],"explanation":"In advanced cases of neovascular glaucoma, the new vessels along with its attendant fibrovascular support membrane, bridge the angle and physically pull the iris and cornea into apposition. Neovascularization of the iris usually begins around the pupil. Central retinal vein occlusion is associated with more extensive retinal ischaemia than branch retinal vein occlusion and therefore more likely to result in neovascular glaucoma.","source_answer_pdf_page":34,"source_answer_printed_page":36,"id":79},{"section":"Glaucoma","section_question":20,"source_question_pdf_page":28,"source_question_printed_page":30,"stem":"The following are features of iridocorneal endothelial syndrome","statements":[{"label":"a","text":"anterior chamber inflammation","answer":false},{"label":"b","text":"posterior synechiae","answer":false},{"label":"c","text":"polycoria","answer":true},{"label":"d","text":"bilateral in 50% of cases","answer":false},{"label":"e","text":"medical treatment is usually sufficient to control the glaucoma","answer":false}],"answer_key":"FFTFF","true_statements":["c"],"false_statements":["a","b","d","e"],"explanation":"In iridocorneal endothelial syndrome (ICE), polycoria and iris atrophy are common. The condition is unilateral and affects mostly female. Surgery for raised intraocular pressure is needed eventually. Studies have shown that the ICE syndromes represent a spectrum of disease that are characterized by corneal endothelial abnormality. The disease is caused by migration of endothelium over the angle and iris as a result of loss of contact inhibition.","source_answer_pdf_page":34,"source_answer_printed_page":36,"id":80},{"section":"Glaucoma","section_question":21,"source_question_pdf_page":29,"source_question_printed_page":31,"stem":"Malignant glaucoma","statements":[{"label":"a","text":"typically occurs after trabeculectomy","answer":true},{"label":"b","text":"is caused by aqueous misdirection into the vitreous cavity","answer":true},{"label":"c","text":"is best treated with intensive miotic","answer":false},{"label":"d","text":"can be abolished with iridotomy","answer":false},{"label":"e","text":"is best managed by par plana vitrectomy if medical treatment failed","answer":true}],"answer_key":"TTFFT","true_statements":["a","b","e"],"false_statements":["c","d"],"explanation":"Malignant glaucoma may occur within hours to days or years after trabeculectomy. Miotics are contraindicated as they precipitate and aggravate malignant glaucoma. The first line of treatment is medical which involves the use of cycloplegia, topical B-blocker and osmotic agents. The aims of medical treatment are: decreasing aqueous production, reducing the vitreous volume, and moving the iris-lens diaphragm backward. Surgery involves plana vitrectomy with or without lensectomy. This disrupts the impermeable anterior vitreous face and reduces the ind vitreous volume. The goal is to create a direct communication between the vitreous or cavity and the anterior chamber.","source_answer_pdf_page":34,"source_answer_printed_page":36,"id":81},{"section":"Glaucoma","section_question":22,"source_question_pdf_page":29,"source_question_printed_page":31,"stem":"Regarding peripheral laser iridotomy","statements":[{"label":"a","text":"the amount of energy used is dependent on the iris pigmentation","answer":true},{"label":"b","text":"has a better long-term success rate than surgical iridectomy in treating primary angle closure glaucoma","answer":false},{"label":"c","text":"the use of pre-treatment miotic reduces the energy needed","answer":true},{"label":"d","text":"the area chosen for the procedure should ideally be covered by the upper eyelid","answer":true},{"label":"e","text":"it is associated with formation of progressive cataract","answer":false}],"answer_key":"TFTTF","true_statements":["a","c","d"],"false_statements":["b","e"],"explanation":"Ber Brown irises are thicker and more difficult to penetrate with laser than green or blue irises. Surgical iridectomies create larger holes than laser iridectomies. Smaller laser iridectomies tend to close or occlude spontaneously leading to poorer longterm success rate. Pre-treatment with miotic constricts the pupil and stretches the iris. This helps to make the iris thinner and reduces the energy needed. Glare and diplopia have been reported in iridotomy not covered by the eyelid. Localized ch cataract can develop after Argon or YAG laser peripheral iridotomies. These dar lenticular opacities do not progress.","source_answer_pdf_page":35,"source_answer_printed_page":37,"id":82},{"section":"Glaucoma","section_question":23,"source_question_pdf_page":29,"source_question_printed_page":31,"stem":"Regarding trabeculectomy for primary open angle glaucoma","statements":[{"label":"a","text":"the long term success rate is higher in the young than the old","answer":false},{"label":"b","text":"the objective is to create a passage through the sclera into the subtenon space","answer":true},{"label":"c","text":"the peripheral iridectomy should be as small as possible","answer":false},{"label":"d","text":"wound leakage is more common with fornix-based conjunctival flap than limbal based","answer":true},{"label":"e","text":"it is associated with an increased risk of cataract formation","answer":true}],"answer_key":"FTFTT","true_statements":["b","d","e"],"false_statements":["a","c"],"explanation":"Fibrous reaction and scarring are commoner in young than the old population following trabeculectomy. The objective of trabeculectomy is to create a passage through the subconjunctival and subtenon's space. A small peripheral iridectomy is prone to closure and obstruction. Wound leakage is more common in fornix-based ie conjunctival flap but the blebs tend to be larger than the limbal-based conjunctival ned flap. Cataract formation and progression can occur after filtration procedures. Lens Ral opacification is the main cause of early visual loss after filtration surgery.","source_answer_pdf_page":35,"source_answer_printed_page":37,"id":83},{"section":"Glaucoma","section_question":24,"source_question_pdf_page":29,"source_question_printed_page":31,"stem":"Shallow anterior chamber after trabeculectomy could be caused by","statements":[{"label":"a","text":"excessive drainage through the trapped door","answer":true},{"label":"b","text":"small iridectomy","answer":false},{"label":"c","text":"choroidal effusion","answer":true},{"label":"d","text":"malignant glaucoma","answer":true},{"label":"e","text":"retinal detachment","answer":false}],"answer_key":"TFTTF","true_statements":["a","c","d"],"false_statements":["b","e"],"explanation":"Shallow anterior chamber may be due to under-production of aqueous or overdrainage of aqueous. Small iridectomy will slow aqueous drainage. Choroidal effusion causes forward movement of the lens and hence shallow anterior chamber. on. Malignant glaucoma is associated with a flat anterior chamber and raised ilar intraocular pressure. Retinal detachment does not cause AC shallowing.","source_answer_pdf_page":35,"source_answer_printed_page":37,"id":84},{"section":"Glaucoma","section_question":25,"source_question_pdf_page":29,"source_question_printed_page":31,"stem":"The advantages of using cycloplegia post-trabeculectomy include","statements":[{"label":"a","text":"reduction of anterior chamber inflammation","answer":true},{"label":"b","text":"deepen the anterior chamber","answer":true},{"label":"c","text":"prevent anterior synechiae","answer":false},{"label":"d","text":"reduce the action of fibroblast","answer":false},{"label":"e","text":"reduce the aqueous production","answer":false}],"answer_key":"TTFFF","true_statements":["a","b"],"false_statements":["c","d","e"],"explanation":"Cycloplegic agents are known to stabilize blood aqueous barrier and reduces anterior chamber inflammation. Cycloplegic agents also relax the ciliary muscle causing posterior movement of the lens-iris diaphragm. Consequently, the anterior chamber is deepened. The mydriatic effect of cycloplegic agents is also beneficial a in preventing posterior synechiae. Cycloplegics have no effect on fibroblast a activities. Cycloplegics have no effect on aqueous production.","source_answer_pdf_page":35,"source_answer_printed_page":37,"id":85},{"section":"Glaucoma","section_question":26,"source_question_pdf_page":30,"source_question_printed_page":32,"stem":"2 weeks after a successful trabeculectomy, a patient develops a large dome- 3 shaped cyst over the trabeculectomy and the intraocular pressure raises to","statements":[{"label":"a","text":"mmHg. The following are true","answer":true},{"label":"b","text":"_ it is caused by proliferation of the conjunctival epithelium","answer":true},{"label":"c","text":"the use of anti-metabolite may decrease this complication","answer":true},{"label":"d","text":"needling of the cyst may reduce the pressure","answer":false},{"label":"e","text":"ocular message is useful in reducing the pressure ' YAG laser on the cyst is useful in creating a new passage for the aqueous . drainage 2 s","answer":false}],"answer_key":"TTTFF","true_statements":["a","b","c"],"false_statements":["d","e"],"explanation":"Encapsulated blebs or tenon cysts are localized dome-shaped blebs. This type of blebs commonly appears within 2-4 weeks after surgery. The frequency of encapsulated blebs with mitomycin C is lower. The long-term prognosis for IOP control in eyes that develop encapsulated blebs is relatively good. Needling and ocular massage may reduce the pressure in tenon cyst but not ocular massage alone.","source_answer_pdf_page":36,"source_answer_printed_page":38,"id":86},{"section":"Glaucoma","section_question":27,"source_question_pdf_page":30,"source_question_printed_page":32,"stem":"Regarding mitomycin C in trabeculectomy","statements":[{"label":"a","text":"mitomycin C is derived from fungus","answer":true},{"label":"b","text":"it is a more potent anti-fibrotic agent than 5-fluouracil","answer":true},{"label":"c","text":"scleral melt is a known complication","answer":true},{"label":"d","text":"it is associated with an increased incidence of bleb leakage","answer":true},{"label":"e","text":"it is associated with increased incidence of post-operative endophthalmitis","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Mitomycin C is a derived from Streptomyces caespitosus. It acts as an alkylating agent that inhibits cell division by cross-linking its DNA. It is more potent than 5fluouracil. It can cause scleral melt even many years after its use. Its use in trabeculectomy is associated with a thinner bleb which is prone to leakage. In addition, a thinner bleb increases the risk of endophthalmitis.","source_answer_pdf_page":36,"source_answer_printed_page":38,"id":87},{"section":"Glaucoma","section_question":28,"source_question_pdf_page":30,"source_question_printed_page":32,"stem":"Pilocarpine","statements":[{"label":"a","text":"is an indirect-acting anticholinesterase agent","answer":false},{"label":"b","text":"decreases the aqueous production","answer":false},{"label":"c","text":"is contraindicated in patients with uveitis","answer":true},{"label":"d","text":"induces hypermetropia","answer":false},{"label":"e","text":"increases lacrimal gland secretion.","answer":true}],"answer_key":"FFTFT","true_statements":["c","e"],"false_statements":["a","b","d"],"explanation":"Pilocarpine is a direct-acting parasympathomimetic agent. It causes iris contraction and increases aqueous outflow via the trabecular meshwork. It increases the permeability of the blood ocular barrier and therefore should be avoided in uveitis. It causes contraction of the ciliary muscle and induces myopia. It stimulates tear secretion.","source_answer_pdf_page":36,"source_answer_printed_page":38,"id":88},{"section":"Glaucoma","section_question":29,"source_question_pdf_page":30,"source_question_printed_page":32,"stem":"Latanoprost","statements":[{"label":"a","text":"_ increases aqueous outflow through the trabecular meshwork.","answer":false},{"label":"b","text":"_ increases the risk of iris melanoma","answer":false},{"label":"c","text":"causes hypertrichosis '","answer":true},{"label":"d","text":"causes poliosis","answer":false},{"label":"e","text":"_ is associated with cystoid macular oedema in pseudophakic patients '","answer":true}],"answer_key":"FFTFT","true_statements":["c","e"],"false_statements":["a","b","d"],"explanation":"Latanoprost increases the uveoscleral outflow of the aqueous. It increases iris pigmentation by stimulating the production of melanin and does not appear to increase the risk of iris melanoma. It causes increased pigmentation of the eyelashes and hypertrichosis as evidence by long eyelashes. Cystoid macular oedema is a known complication when the medication in used in pseudophakic patients.","source_answer_pdf_page":36,"source_answer_printed_page":38,"id":89},{"section":"Glaucoma","section_question":30,"source_question_pdf_page":30,"source_question_printed_page":32,"stem":"Regarding the use of topical B-blocker in glaucoma","statements":[{"label":"a","text":"_ it is less effective in patients who are already on oral B-blockers","answer":true},{"label":"b","text":"its effect takes one week to develop in new users","answer":false},{"label":"c","text":"_ its ocular hypertensive effect may diminish with chronic use","answer":true},{"label":"d","text":"ithas an additive effect when given with latanoprost.","answer":true},{"label":"e","text":"itcan be safely given in patients with asthma","answer":false}],"answer_key":"TFTTF","true_statements":["a","c","d"],"false_statements":["b","e"],"explanation":"Topical -blocker is less effective in reducing intraocular pressure in patients who are already on oral form for other conditions such as hypertension. Its effect on aqueous production begins one hour afier instillation. Tachyphylaxis reduces its effectiveness with long-term use. It has an additive effect when combined with latanoprost. Topical B-blocker is contraindicated in asthmatic patients.","source_answer_pdf_page":36,"source_answer_printed_page":38,"id":90},{"section":"Oculoplastic","section_question":1,"source_question_pdf_page":37,"source_question_printed_page":39,"stem":"Causes of ptosis include","statements":[{"label":"a","text":"chronic use of topical steroid","answer":true},{"label":"b","text":"contact lens use","answer":true},{"label":"c","text":"superior rectus suture during extracapsular cataract surgery","answer":true},{"label":"d","text":"resection of the superior rectus","answer":false},{"label":"e","text":"inferior rectus fibrosis","answer":false}],"answer_key":"TTTFF","true_statements":["a","b","c"],"false_statements":["d","e"],"explanation":"Chronic topical steroid causes atrophy of the levator muscle. Both contact lenses | (especially hard contact lens) and cataract surgery (especially if superior rectus suture were used) cause dehiscence of the levator aponeurosis. Resection of the superior rectus if excessive can cause widening of the palpebral fissure. In inferior rectus muscle restriction, the excessive tone of the ipsilateral superior rectus needed to overcome the tight inferior rectus to keep the eye in primary position results in excessive contraction of the levator muscle, producing upper-eyelid retraction","source_answer_pdf_page":43,"source_answer_printed_page":45,"id":91},{"section":"Oculoplastic","section_question":2,"source_question_pdf_page":37,"source_question_printed_page":39,"stem":"The following are features of aponeurotic ptosis","statements":[{"label":"a","text":"high skin crease","answer":true},{"label":"b","text":"poor levator function","answer":false},{"label":"c","text":"a lower position of the lid compared with the opposite side on downgaze","answer":true},{"label":"d","text":"poor Bell's phenomenon","answer":false},{"label":"e","text":"a bluish discoloration of the central lid in those with fair skin","answer":true}],"answer_key":"TFTFT","true_statements":["a","c","e"],"false_statements":["b","d"],"explanation":"In aponeurotic ptosis, the skin crease is high and the levator function is normal. Unlike congenital ptosis, the ptotic lid is lower on downgaze compared with the normal side. This may cause problem with reading. The Bell's phenomenon may be present or absent and is not related to this type of ptosis. The thinning of the eyelid due to levator dehiscence may allow the colour of the iris to show through on lid closure.","source_answer_pdf_page":43,"source_answer_printed_page":45,"id":92},{"section":"Oculoplastic","section_question":3,"source_question_pdf_page":37,"source_question_printed_page":39,"stem":"Causes of pseudoptosis include","statements":[{"label":"a","text":"phthisical eye","answer":true},{"label":"b","text":"hypotropia","answer":true},{"label":"c","text":"dermatochalasis","answer":true},{"label":"d","text":"Lambert-Eaton syndrome","answer":false},{"label":"e","text":"contralateral exophthalmos","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Causes of pseudoptosis include: Ipsilateral pathology such as excess skin (brow ptosis, dermatochalasis), inadequate globe size (microphthalmos, phthisis bulbi, prosthesis), incorrect globe position (enophthalmos, hypotropia). Contralateral pathology such as contralateral lid retraction.","source_answer_pdf_page":43,"source_answer_printed_page":45,"id":93},{"section":"Oculoplastic","section_question":4,"source_question_pdf_page":37,"source_question_printed_page":39,"stem":"Feature (s) of Horner's syndrome include","statements":[{"label":"a","text":"iris heterochromia","answer":true},{"label":"b","text":"poor pupil reaction to light","answer":false},{"label":"c","text":"lower intraocular pressure","answer":true},{"label":"d","text":"decrease sweating of the face on the affected side","answer":true},{"label":"e","text":"elevation of the lower eyelid","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"Iris heterochromia occurs in congenital Horner's syndrome. The pupil reaction to light is normal. Decreased sympathetic innervation causes a drop in the intraocular pressure. Decreased facial sweating occurs if the lesion involves the first or second order neurones. The lower lid is elevated and together with the ptosis causes apparent enophthalmos.","source_answer_pdf_page":43,"source_answer_printed_page":45,"id":94},{"section":"Oculoplastic","section_question":5,"source_question_pdf_page":37,"source_question_printed_page":39,"stem":"Floppy eyelid syndrome is characterized by","statements":[{"label":"a","text":"darkness of the skin around the eye","answer":true},{"label":"b","text":"conjunctivochalasis","answer":true},{"label":"c","text":"follicular conjunctivitis","answer":true},{"label":"d","text":"meibomian gland dysfunction","answer":true},{"label":"e","text":"recurrent corneal erosion","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Floppy eyelid syndrome is usually seen in overweigh middle-aged males. All of these are features of floppy eyelid syndrome.","source_answer_pdf_page":43,"source_answer_printed_page":45,"id":95},{"section":"Oculoplastic","section_question":6,"source_question_pdf_page":38,"source_question_printed_page":40,"stem":"Sebaceous cell carcinoma","statements":[{"label":"a","text":"_ is more common in Asian than the European","answer":true},{"label":"b","text":"may present as unilateral blepharitis","answer":true},{"label":"c","text":"shows pagetoid spread on the conjunctiva","answer":true},{"label":"d","text":"is more common in the lower lids than the upper lid","answer":false},{"label":"e","text":"is sensitive to radiotherapy","answer":false}],"answer_key":"TTTFF","true_statements":["a","b","c"],"false_statements":["d","e"],"explanation":"Sebaceous cell carcinoma is more common in Asian than European. Female are more often affected than males. The upper lid is more often involves than the lower lid purely because there are more sebaceous gland in the upper lid. It may present as recurrent chalazion or unilateral blepharitis. Pagetoid spread must be excluded by doing random map biopsy of the conjunctiva Treatment include wide excision and exenteration if there were extensive pagetoid spread involving the bulbar conjunctiva. The tumour is not sensitive to radiation.","source_answer_pdf_page":44,"source_answer_printed_page":46,"id":96},{"section":"Oculoplastic","section_question":7,"source_question_pdf_page":38,"source_question_printed_page":40,"stem":"The following are true about the treatment of basal cell carcinoma","statements":[{"label":"a","text":"Mohs micrographic excision should be performed in all cases of lower lid basal cell carcinoma","answer":false},{"label":"b","text":"Mohs micrographic excision is useful for the diagnosis of basal cell carcinoma","answer":false},{"label":"c","text":"Mohs micrographic excision allows three dimensional examination of tumour margins,","answer":true},{"label":"d","text":"aggressive tissue removal is avoided in Mohs micrographic excision","answer":true},{"label":"e","text":"before Mohs tissue excision the skin is spread with zinc sulphate paste","answer":false}],"answer_key":"FFTTF","true_statements":["c","d"],"false_statements":["a","b","e"],"explanation":"Mohs micrographic surgery (MMS) is a surgical technique for the removal of certain cutaneous carcinomas that allows precise microscopic marginal control. The technique is time consuming and is usually reserved for cases where there is risk of dcep tissue invasion or tumour with undefined margin. The technique is not used for diagnosing tumour type. Zinc sulphate paste is not longer used.","source_answer_pdf_page":44,"source_answer_printed_page":46,"id":97},{"section":"Oculoplastic","section_question":8,"source_question_pdf_page":38,"source_question_printed_page":40,"stem":"Orbital invasion of the basal cell carcinoma is increased in","statements":[{"label":"a","text":"nodular type","answer":false},{"label":"b","text":"morphea form or sclerosing type","answer":true},{"label":"c","text":"involvement of the lacrimal punctum","answer":true},{"label":"d","text":"incompletely excised base with skin graft","answer":true},{"label":"e","text":"those undergoing radiotherapy","answer":false}],"answer_key":"FTTTF","true_statements":["b","c","d"],"false_statements":["a","e"],"explanation":"The risk of orbital involvement is increased if the tumour is of the morphea form or there were involvement of the lacrimal punctum. Skin graft should be avoided until one is certain the base is clear of the tumour otherwise the tumour may be pushed deeper.","source_answer_pdf_page":44,"source_answer_printed_page":46,"id":98},{"section":"Oculoplastic","section_question":9,"source_question_pdf_page":38,"source_question_printed_page":40,"stem":"Xanthelasma","statements":[{"label":"a","text":"is more common in male than female","answer":true},{"label":"b","text":"usually bilateral","answer":true},{"label":"c","text":"contains lipid laden histiocytes","answer":true},{"label":"d","text":"occurs in secondary hyperlipidaemia","answer":true},{"label":"e","text":"can be removed using 75% trichloroacetic acid","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"Xanthelasma is usually bilateral and involves female more often than male. It is made up of lipid laden histocytes in the dermis of the skin. Secondary hyperlipidaemia such as primary biliary cirrhosis, nephrotic syndrome and diabetes mellitus are associated with xanthelasma. 75% trichloroacetic acid applied to the lesion is a slow way of removing the lesion.","source_answer_pdf_page":44,"source_answer_printed_page":46,"id":99},{"section":"Oculoplastic","section_question":10,"source_question_pdf_page":38,"source_question_printed_page":40,"stem":"The following are used to correct a large lower lid full thickness defect","statements":[{"label":"a","text":"Tenzel's flap","answer":true},{"label":"b","text":"Hugh's flap","answer":true},{"label":"c","text":"Cutler-Beard's flap","answer":false},{"label":"d","text":"Mustarde's flap","answer":true},{"label":"e","text":"Weiss's procedure","answer":false}],"answer_key":"TTFTF","true_statements":["a","b","d"],"false_statements":["c","e"],"explanation":"Cutler-Beard's flap is used to close a large upper lid defect and Weiss's procedure is used to treat lower eyelid entropion.","source_answer_pdf_page":44,"source_answer_printed_page":46,"id":100},{"section":"Oculoplastic","section_question":11,"source_question_pdf_page":39,"source_question_printed_page":41,"stem":"The following are true causes of enophthalmos","statements":[{"label":"a","text":"Horner's syndrome","answer":false},{"label":"b","text":"Silent sinus syndrome","answer":true},{"label":"c","text":"Blow-out fracture","answer":true},{"label":"d","text":"Breast carcinoma metastasis to the orbit","answer":true},{"label":"e","text":"Phthisical bulbi","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"Homner's syndrome causes apparent enophthalmos due to partial ptosis and lower lid elevation. The rest are true causes of enophthalmos.","source_answer_pdf_page":44,"source_answer_printed_page":46,"id":101},{"section":"Oculoplastic","section_question":12,"source_question_pdf_page":39,"source_question_printed_page":41,"stem":"Features of blepharophimosis include","statements":[{"label":"a","text":"autosomal recessive","answer":false},{"label":"b","text":"shortened palpebral aperture","answer":true},{"label":"c","text":"ptosis with poor levator function","answer":true},{"label":"d","text":"ocular motility problem","answer":false},{"label":"e","text":"female infertility","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"€ Blepharophimosis may be an autosomal dominant condition. t The signs include: it © Moderate to severe symmetrical ptosis with poor levator function d © — Short horizontal palpebral aperture ¢ Telecanthus and epicanthus inversus d Lateral ectropion of lower lids Poorly developed nasal bridge and hypoplasia of the superior orbital rims — Association with female infertility","source_answer_pdf_page":45,"source_answer_printed_page":47,"id":102},{"section":"Oculoplastic","section_question":13,"source_question_pdf_page":39,"source_question_printed_page":41,"stem":"In blepharochalasis","statements":[{"label":"a","text":"most affected patients are in their 40's","answer":false},{"label":"b","text":"there are recurrent lid oedema","answer":true},{"label":"c","text":"there are levator disinsertion","answer":true},{"label":"d","text":"the condition is associated with Ascher's syndrome","answer":true},{"label":"e","text":"systemic steroid is useful","answer":false}],"answer_key":"FTTTF","true_statements":["b","c","d"],"false_statements":["a","e"],"explanation":"ie Blepharochalasis is a rare condition characterized by recurrent episodes of painless, of non-pitting oedema of both upper lids which usually resolves spontaneously after a d few days only to recur. It usually starts around puberty and causes thinning of the eyelid lid, excessive loosening of the skin and ptosis. Systemic steroid is not useful.","source_answer_pdf_page":45,"source_answer_printed_page":47,"id":103},{"section":"Oculoplastic","section_question":14,"source_question_pdf_page":39,"source_question_printed_page":41,"stem":"in congenital eyelid disorders","statements":[{"label":"a","text":"curyblepharon refers to abnormal enlargement of the horizontal palpebral fissure","answer":true},{"label":"b","text":"Treacher-Collin's disease causes coloboma in the medial third of the lower eyelids","answer":false},{"label":"c","text":"most isolated eyelid coloboma involves the nasal one third of the upper lid","answer":true},{"label":"d","text":"ankyloblepharon refers to closure of the eyelids by webs of skin","answer":true},{"label":"e","text":"cryptophthalmos refers to failure of the eyelid differentiation with the resultant extension of skin from the forehead to the cheek","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"or In euryblepharon, the horizontal palpebral fissure is abnormally enlarged. This is il mainly of cosmesis concerned but some patients may suffer from epiphora due to d eyelid laxity. Coloboma of lid in Treacher-Collin's disease involves the lateral third of the lower eyelid. Most upper eyelid coloboma involves the nasal 1/3 of the eyelid.","source_answer_pdf_page":45,"source_answer_printed_page":47,"id":104},{"section":"Oculoplastic","section_question":15,"source_question_pdf_page":39,"source_question_printed_page":41,"stem":"The following are true about tumours arising from hair follicles","statements":[{"label":"a","text":"trichoepithelioma is commoner in women than men","answer":true},{"label":"b","text":"women with multiple trichilemmomas have an increased risk of breast cancer","answer":true},{"label":"c","text":"calcification is a feature of pilomatrixoma","answer":true},{"label":"d","text":"_ pilomatrixoma is commoner in children than adult","answer":true},{"label":"e","text":"malignant transformation is common in pilomatrixoma","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"24 Pilomatrixoma is a benign tumor with differentiation toward hair cells. It manifests id as a solitary, asymptomatic, firm nodule. It has long been considered a rare tumor, -d but it may be more common than previously realized.","source_answer_pdf_page":45,"source_answer_printed_page":47,"id":105},{"section":"Oculoplastic","section_question":16,"source_question_pdf_page":40,"source_question_printed_page":42,"stem":"In essential blepharospasm","statements":[{"label":"a","text":"there is a male preponderance","answer":false},{"label":"b","text":"only the orbicularis oculi is involved in the involuntary contraction","answer":false},{"label":"c","text":"poor tear film is common","answer":true},{"label":"d","text":"routine CT scan is important to exclude any brain pathology","answer":false},{"label":"e","text":"_ frontalis suspension is useful for patients who fail chemical treatment","answer":true}],"answer_key":"FFTFT","true_statements":["c","e"],"false_statements":["a","b","d"],"explanation":"In essential blepharospasm the female to male ratio is 3:1. It is characterized by is progressive involuntary spasm of the orbicularis oculi and upper facial muscles. Routine CT scan is not necessary as it is an idiopathic condition. Botulinum toxin is a very effective therapy in most cases of essential blepharospasm. In a small percentage, however, it is not efficient even in repeated attempts. In these cases, frontalis suspension is performed so that lid opening by fingers is no longer necessary.","source_answer_pdf_page":45,"source_answer_printed_page":47,"id":106},{"section":"Oculoplastic","section_question":17,"source_question_pdf_page":40,"source_question_printed_page":42,"stem":"The effect of Botulinum toxin injection to the orbicularis oculi include","statements":[{"label":"a","text":"widening of the palpebral aperture","answer":true},{"label":"b","text":"decreased tear secretion","answer":true},{"label":"c","text":"raising the eyebrows","answer":true},{"label":"d","text":"abolishment of Bell's phenomenon","answer":false},{"label":"e","text":"removal of the crow feet","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Bell's phenomenon involves extraocular muscles and cranial nerves which are not affected by botulinum toxin injection to the orbicularis oculi.","source_answer_pdf_page":46,"source_answer_printed_page":48,"id":107},{"section":"Oculoplastic","section_question":18,"source_question_pdf_page":40,"source_question_printed_page":42,"stem":"The following procedures are useful for corneal exposure secondary to facial nerve palsy","statements":[{"label":"a","text":"gold weight","answer":true},{"label":"b","text":"medial canthoplasty","answer":true},{"label":"c","text":"lateral tarsorrhaphy","answer":true},{"label":"d","text":"upper lid recession","answer":true},{"label":"e","text":"Botox injection to the upper lid","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"All the above are true","source_answer_pdf_page":46,"source_answer_printed_page":48,"id":108},{"section":"Oculoplastic","section_question":19,"source_question_pdf_page":40,"source_question_printed_page":42,"stem":"Factors contributing to involutional entropion of the lower lid include","statements":[{"label":"a","text":"fat atrophy","answer":true},{"label":"b","text":"weakening of the retractor complex","answer":true},{"label":"c","text":"weakening of the attachment of the medial and lateral attachments of the tarsi to the orbit","answer":true},{"label":"d","text":"preseptal orbicularis oculi muscle fibers overriding the pretarsal orbicularis oculi","answer":true},{"label":"e","text":"involutional shallowing of the inferior fornix","answer":false}],"answer_key":"TTTTF","true_statements":["a","b","c","d"],"false_statements":["e"],"explanation":"Involutional entropion involves age-related degeneration of fat elastic and fibrous tissue within the eyelid resulting in horizontal lid laxity caused by stretching of the canthal tendons and tarsal plate; vertical lid instability caused by attenuation, dehiscence or disinsertion of the lower lid retractors; over-riding of the pretarsal by the preseptal orbicularis during lid closure moving the lower border of the tarsus anteriorly, away from the globe, and the upper border towards the globe, thus tipping the lid inwards.","source_answer_pdf_page":46,"source_answer_printed_page":48,"id":109},{"section":"Oculoplastic","section_question":20,"source_question_pdf_page":40,"source_question_printed_page":42,"stem":"During dacryocystorhinostomy, the following are usually removed","statements":[{"label":"a","text":"maxillary bone","answer":true},{"label":"b","text":"frontal bone","answer":false},{"label":"c","text":"lacrimal bone","answer":true},{"label":"d","text":"lacrimal fossa","answer":true},{"label":"e","text":"_ethmoid bone","answer":false}],"answer_key":"TFTTF","true_statements":["a","c","d"],"false_statements":["b","e"],"explanation":"DCR involves anastomosing the lacrimal sac to the nasal mucosa of the middle nasal meatus. The frontal bone separates the anterior cranial fossa from the orbital cavity whereas the ethmoidal bone separated the ethmoidal air cells from the orbital cavity.","source_answer_pdf_page":46,"source_answer_printed_page":48,"id":110},{"section":"Oculoplastic","section_question":21,"source_question_pdf_page":41,"source_question_printed_page":43,"stem":"In dacryocystorhinostomy ( DCR )","statements":[{"label":"a","text":"the success rate of external DCR is higher than that of endosteal DCR","answer":true},{"label":"b","text":"the formation of the anterior flap is more important than the posterior flap","answer":true},{"label":"c","text":"itis essential to resuture the medial canthus if cut to avoid telecanthus","answer":false},{"label":"d","text":"the use of tubing increases the success rate","answer":true},{"label":"e","text":"the ostium should be lower than the level of the lower punctum","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"External dacryocystorhinostomy (DCR) has success rate of over 90%. Endoscopic DCR has success rate of about 85% and endolaser DCR has success rate of only about 70%. Ostium situated too high will result in \"sump syndrome\" where there is a dilated lacrimal sac lateral to and below the level of the inferior margin of the ostium, in which secretions collected are unable to gain access to the ostium and hence the nasal cavity","source_answer_pdf_page":46,"source_answer_printed_page":48,"id":111},{"section":"Oculoplastic","section_question":22,"source_question_pdf_page":41,"source_question_printed_page":43,"stem":"The clinical features that define Graves' disease include","statements":[{"label":"a","text":"_ finger acropachy","answer":true},{"label":"b","text":"pretibial myxoedema","answer":true},{"label":"c","text":"thyromegaly","answer":true},{"label":"d","text":"alopecia","answer":false},{"label":"e","text":"exophthalmos","answer":true}],"answer_key":"TTTFT","true_statements":["a","b","c","e"],"false_statements":["d"],"explanation":"Graves' disease is the commonest cause of hyperthyroidism. Anti TSH receptor antibodies cause overproduction of thyroxine ( T4 ) and/or T3. Distinguishing features include thyroid acropachy pretibial myxoedema exophthalmos","source_answer_pdf_page":46,"source_answer_printed_page":48,"id":112},{"section":"Oculoplastic","section_question":23,"source_question_pdf_page":41,"source_question_printed_page":43,"stem":"In a patient with severe thyroid eye disease","statements":[{"label":"a","text":"optic nerve compression is caused by fat hyperplasia","answer":false},{"label":"b","text":"radiation therapy should be covered with oral steroid","answer":true},{"label":"c","text":"orbital decompression is preferable over radiation in patient with compressive neuropathy","answer":true},{"label":"d","text":"removal of the orbital fat may reduce proptosis","answer":true},{"label":"e","text":"_tarsorrhaphy is useful for exposure keratitis","answer":true}],"answer_key":"FTTTT","true_statements":["b","c","d","e"],"false_statements":["a"],"explanation":"Optic nerve compression is due to hypertrophic extraocular muscles. There is a possibility that radioactive iodine worsens thyroid eye disease; therefore it is common practice to give prophylactic oral steroids when administering radioactive iodine. Orbital decompression is preferred over radiation in acute progressive optic neuropathy.","source_answer_pdf_page":47,"source_answer_printed_page":49,"id":113},{"section":"Oculoplastic","section_question":24,"source_question_pdf_page":41,"source_question_printed_page":43,"stem":"The following are risk factors for severe thyroid eye disease","statements":[{"label":"a","text":"young age","answer":false},{"label":"b","text":"male sex","answer":true},{"label":"c","text":"smoking","answer":true},{"label":"d","text":"previous radio-iodine treatment","answer":true},{"label":"e","text":"oral carbimazole","answer":false}],"answer_key":"FTTTF","true_statements":["b","c","d"],"false_statements":["a","e"],"explanation":"Risk factors for severe thyroid eye disease and hence poor prognosis include: ¢ — older age of onset ¢ male ¢ smoker diabetes decreased visual acuity rapid progression at onset — longer duration of active disease previous radio-iodine treatment","source_answer_pdf_page":47,"source_answer_printed_page":49,"id":114},{"section":"Oculoplastic","section_question":25,"source_question_pdf_page":41,"source_question_printed_page":43,"stem":"Upper eyelid retraction in thyroid eye disease is caused by","statements":[{"label":"a","text":"adrenergic stimulation of the Muller's muscle","answer":true},{"label":"b","text":"superior oblique fibrosis","answer":false},{"label":"c","text":"inferior rectus fibrosis","answer":true},{"label":"d","text":"fibrosis of the levator","answer":true},{"label":"e","text":"fatty infiltration of the levator","answer":false}],"answer_key":"TFTTF","true_statements":["a","c","d"],"false_statements":["b","e"],"explanation":"Fibrosis of the levator leads to secondary overaction of superior rectus/levator complex.","source_answer_pdf_page":47,"source_answer_printed_page":49,"id":115},{"section":"Oculoplastic","section_question":26,"source_question_pdf_page":42,"source_question_printed_page":44,"stem":"Thyroid eye disease","statements":[{"label":"a","text":"is seen in 40% of patients with Graves' disease","answer":true},{"label":"b","text":"does not occur in Hashimoto's thyroiditis","answer":false},{"label":"c","text":"isnot feature of thyroid cancer","answer":true},{"label":"d","text":"tends to peak 6 months from onset","answer":true},{"label":"e","text":"usually cease to be active 18 months after onset","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"Thyroid eye disease is seen in 40% of patients with Graves' disease but also occurs in 3% of Hashimoto's thyroiditis. TED is a feature of autoimmune thyroid disease not thyroid cancer. It tends to peak at 6 months from onset and become inactive after 18 months.","source_answer_pdf_page":47,"source_answer_printed_page":49,"id":116},{"section":"Oculoplastic","section_question":27,"source_question_pdf_page":42,"source_question_printed_page":44,"stem":"The radiological features of thyroid eye disease include","statements":[{"label":"a","text":"inferior and lateral recti are the two extraocular muscles most often involved","answer":false},{"label":"b","text":"the tendon of the affected muscle is not involved","answer":true},{"label":"c","text":"medial rectus enlargement is more likely than inferior rectus enlargement in causing compressive optic neuropathy","answer":true},{"label":"d","text":"oedema of the extraocular muscle is best diagnosed with B-scan","answer":false},{"label":"e","text":"STIR-sequence of MRI is useful in assessing the activity of thyroid eye disease","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"Inferior rectus is the most commonly involved extraocular muscle followed by medial rectus. Muscle bellies show enlargement and inflammation; the tendons are typically spared. Medial rectus has the shortest tendon ( 5.5 mm from the limbus ) and lies closest to the optic nerve. Extraocular muscle oedema is best visualized with MRI scan. MRI (T2 weighted and STIR) gives better soft tissue resolution and identifies active disease.","source_answer_pdf_page":47,"source_answer_printed_page":49,"id":117},{"section":"Oculoplastic","section_question":28,"source_question_pdf_page":42,"source_question_printed_page":44,"stem":"The following are true about thyroid eye disease","statements":[{"label":"a","text":"the orbital tissue is infiltrated by B cells during the active phase","answer":false},{"label":"b","text":"when performing orbital decompression for optic neuropathy, the medial wall should be removed","answer":true},{"label":"c","text":"lacrimal gland enlargement is common","answer":false},{"label":"d","text":"bicoronal flap is the best approach for orbital decompression","answer":false},{"label":"e","text":"diplopia is a common complication of orbital decompression","answer":true}],"answer_key":"FTFFT","true_statements":["b","e"],"false_statements":["a","c","d"],"explanation":"During active phase, activated T cells act upon cells of the fibroblast-adipocyte lineage within the orbit so stimulating adipogenesis, fibroblast proliferation and glycosaminoglycans synthesis. Lacrimal gland is typically not enlarged but lacrimal gland prolapse is common. Bicoronal flap is rarely used for orbital decompression. Diplopia remains a major potential complication of orbital decompression performed for thyroid eye disease. Medial and lateral wall decompressions produce less diplopia than decompression involving the orbital floor.","source_answer_pdf_page":47,"source_answer_printed_page":49,"id":118},{"section":"Oculoplastic","section_question":29,"source_question_pdf_page":42,"source_question_printed_page":44,"stem":"Indications for surgery in blow out fracture include","statements":[{"label":"a","text":"orbital floor fracture seen on CT scan","answer":false},{"label":"b","text":"cheek hypoanaesthesia","answer":false},{"label":"c","text":"persistent diplopia in the primary position","answer":true},{"label":"d","text":"significant enophthalmos","answer":true},{"label":"e","text":"presence of exophthalmos","answer":false}],"answer_key":"FFTTF","true_statements":["c","d"],"false_statements":["a","b","e"],"explanation":"The majority of blow-out fracture occurs medial to the infraorbital canal. Diplopia in the primary position is often caused by entrapment of the infraorbital tissue in the fracture and is an indication for repair. Enophthalmos is caused by an increased in the orbital volume and if significant can result in poor cosmesis and is an indication for orbital floor repair.","source_answer_pdf_page":48,"source_answer_printed_page":50,"id":119},{"section":"Oculoplastic","section_question":30,"source_question_pdf_page":42,"source_question_printed_page":44,"stem":"In post-enucleation socket syndrome","statements":[{"label":"a","text":"it is more common following evisceration than enucleation","answer":false},{"label":"b","text":"enophthalmos is a feature","answer":true},{"label":"c","text":"atrophy of the orbital content is the cause","answer":true},{"label":"d","text":"neurogenic ptosis is common","answer":false},{"label":"e","text":"there is shallowing of the inferior fornix","answer":true}],"answer_key":"FTTFT","true_statements":["b","c","e"],"false_statements":["a","d"],"explanation":"The signs of post-enucleation syndrome include enophthalmos, deep upper eyelid sulcus, ptosis and laxity of the lower lid. The enucleated socket undergoes a number of anatomical soft tissue changes postoperatively, which are particularly pronounced if volume replacement is inadequate. These include backward tilt of the superior fornix, with deepening of the superior sulcus; shallowing and forward displacement of the inferior fornix and lower lid stretching. In advanced cases, contraction of the socket may lead to incomplete closure of the lids over the prosthesis, upper and lower lid entropion, and instability or inability to retain a prosthesis.","source_answer_pdf_page":48,"source_answer_printed_page":50,"id":120},{"section":"Uveitis","section_question":1,"source_question_pdf_page":49,"source_question_printed_page":51,"stem":"Cyclosporin A","statements":[{"label":"a","text":"is a natural fungal product","answer":true},{"label":"b","text":"is excreted mainly by the kidneys","answer":false},{"label":"c","text":"suppresses the function of B lymphocytes","answer":false},{"label":"d","text":"is associated with hypertension","answer":true},{"label":"e","text":"causes bone marrow suppression as its major side effects","answer":false}],"answer_key":"TFFTF","true_statements":["a","d"],"false_statements":["b","c","e"],"explanation":"Cyclosporin is isolated from the fungus Tolypocladium inflatum. Elimination is primarily biliary with only 6% of the dose excreted in the urine. T-lymphocytes are preferentially inhibited. Adverse effects include nephrotoxicity, systemic hypertension, gingival hyperplasia, and neurotoxicity.","source_answer_pdf_page":55,"source_answer_printed_page":57,"id":121},{"section":"Uveitis","section_question":2,"source_question_pdf_page":49,"source_question_printed_page":51,"stem":"The main action of the following immunosuppressive drugs are true","statements":[{"label":"a","text":"cyclophosphamide suppresses the function of T cells","answer":true},{"label":"b","text":"chlorambucil inhibits transcription of messenger RNA","answer":false},{"label":"c","text":"azathioprine inhibits purine ring synthesis","answer":true},{"label":"d","text":"methotrexate inhibits the production of leukotriene","answer":false},{"label":"e","text":"FK 506 inhibits lymphocyte proliferation","answer":true}],"answer_key":"TFTFT","true_statements":["a","c","e"],"false_statements":["b","d"],"explanation":"Chlorambucil is an alkylating agent. Methotrexate is a folic acid antagonist that inhibits dihydrofolate reductase (DHFR), interfering with the synthesis of thymidylate, purine nucleotides and the amino acids serine and methionine, thereby interfering with the formation of DNA, RNA and proteins.","source_answer_pdf_page":55,"source_answer_printed_page":57,"id":122},{"section":"Uveitis","section_question":3,"source_question_pdf_page":49,"source_question_printed_page":51,"stem":"The following HLA associations are true","statements":[{"label":"a","text":"HLA A29 and birdshot choroidopathy","answer":true},{"label":"b","text":"HLA B27 and Reiter syndrome","answer":true},{"label":"c","text":"HLA B27 and juvenile rheumatoid arthritis","answer":false},{"label":"d","text":"HLA BS and Behcet's disease","answer":true},{"label":"e","text":"HLAB7 and presumed ocular histoplasmosis syndrome","answer":true}],"answer_key":"TTFTT","true_statements":["a","b","d","e"],"false_statements":["c"],"explanation":"HLA-A29 has been observed in nearly all patients (95.8%) with birdshot chorioretinopathy compared with 7% in healthy controls. Reiter syndrome is associated with HLA-B27. In Behcet's disease, HLA-BS is associated with 1 Behcet's disease in Middle Eastern and Far Eastern patients. Presumed ocular histoplasmosis syndrome (POHS) is associated with HLA-B7 and HLA-DRw2.","source_answer_pdf_page":55,"source_answer_printed_page":57,"id":123},{"section":"Uveitis","section_question":4,"source_question_pdf_page":49,"source_question_printed_page":51,"stem":"Regarding HLA","statements":[{"label":"a","text":"HLA testing is useful in excluding certain uveitic disease","answer":false},{"label":"b","text":"HLA testing can be used to support the diagnosis of certain uveitic syndrome","answer":true},{"label":"c","text":"HLA association with uveitic syndrome shows variation between races","answer":true},{"label":"d","text":"HLA testing is important in tissue transplant","answer":true},{"label":"e","text":"HLA testing is best done using the red blood cells","answer":false}],"answer_key":"FTTTF","true_statements":["b","c","d"],"false_statements":["a","e"],"explanation":"HLA testing helps support the diagnosis of uveitic condition but will not exclude its diagnosis. The success of tissue and organ transplantation depends on the donor's and recipient's human leukocyte antigen (HLA) encoded by the HLA genes. These proteins are alloantigens. The genes for the HLA proteins are clustered in the major histocompatibility complex (MHC), located on the short arm of chromosome 6. Human leukocyte antigen (leukocyte is the name for white blood cell, while antigen refers to a genetic marker) is a substance that is located on the surface of white blood cells.","source_answer_pdf_page":55,"source_answer_printed_page":57,"id":124},{"section":"Uveitis","section_question":5,"source_question_pdf_page":49,"source_question_printed_page":51,"stem":"Topical drugs that may exacerbate iritis include","statements":[{"label":"a","text":"atropine","answer":false},{"label":"b","text":"phenylephrine","answer":false},{"label":"c","text":"pilocarpine","answer":true},{"label":"d","text":"latanoprost","answer":true},{"label":"e","text":"acetazolamide","answer":false}],"answer_key":"FFTTF","true_statements":["c","d"],"false_statements":["a","b","e"],"explanation":"Pilocarpine is a parasympathomimetic which affects the blood-aqueous barrier and exacerbates iritis, Latanoprost is a prostaglandin F2a analogue that can exacerbate iritis,","source_answer_pdf_page":55,"source_answer_printed_page":57,"id":125},{"section":"Uveitis","section_question":6,"source_question_pdf_page":50,"source_question_printed_page":52,"stem":"Systemic drugs that are associated with anterior uveitis include","statements":[{"label":"a","text":"cidofovir","answer":true},{"label":"b","text":"rifabutin","answer":true},{"label":"c","text":"ethambutol","answer":false},{"label":"d","text":"isoniazid","answer":false},{"label":"e","text":"ganciclovir","answer":false}],"answer_key":"TTFFF","true_statements":["a","b"],"false_statements":["c","d","e"],"explanation":"Uveitis has been reported in cidofovir and rifabutin therapy.","source_answer_pdf_page":55,"source_answer_printed_page":57,"id":126},{"section":"Uveitis","section_question":7,"source_question_pdf_page":50,"source_question_printed_page":52,"stem":"Granulomatous uveitis occurs in","statements":[{"label":"a","text":"ankylosing spondylitis","answer":false},{"label":"b","text":"Reiter's syndrome","answer":false},{"label":"c","text":"sarcoidosis","answer":true},{"label":"d","text":"tuberculosis","answer":true},{"label":"e","text":"sympathetic ophthalmia","answer":true}],"answer_key":"FFTTT","true_statements":["c","d","e"],"false_statements":["a","b"],"explanation":"Ankylosing spondylitis and Reiter's syndrome are associated with nongranulomatous uveitis.","source_answer_pdf_page":56,"source_answer_printed_page":58,"id":127},{"section":"Uveitis","section_question":8,"source_question_pdf_page":50,"source_question_printed_page":52,"stem":"Regarding anterior uveitis","statements":[{"label":"a","text":"less than 10% has an identifiable cause","answer":true},{"label":"b","text":"raised intraocular pressure is seen in 60% of the cases","answer":false},{"label":"c","text":"topical steroid is the first line treatment","answer":true},{"label":"d","text":"Koeppe nodules are found in the iris stroma","answer":false},{"label":"e","text":"Busacca nodules are found in the iris pupillary margin","answer":false}],"answer_key":"TFTFF","true_statements":["a","c"],"false_statements":["b","d","e"],"explanation":"Anterior uveitis accounted for more than 90% of all cases of uveitis and less than 10% has an identifiable cause. Intraocular pressure is usually reduced in the eye with iritis due to decreased aqueous production by the inflamed ciliary body. Occasionally, IOP is elevated as a result of altered or obstructed aqueous outflow. Topical corticosteroids are the mainstay of therapy and should be used aggressively during the initial phases of therapy. Inflammatory nodules (Koeppe's and Busacca's) usually represent accumulations of inflammatory cells. Koeppe's nodules are found at the pupillary boarder and Busacca's nodules on the surface of the iris.","source_answer_pdf_page":56,"source_answer_printed_page":58,"id":128},{"section":"Uveitis","section_question":9,"source_question_pdf_page":50,"source_question_printed_page":52,"stem":"Risk factors for juvenile rheumatoid arthritis associated iridocyclitis include","statements":[{"label":"a","text":"onset after the age of 5","answer":false},{"label":"b","text":"female sex","answer":true},{"label":"c","text":"more than 5 joints are involved","answer":false},{"label":"d","text":"recurrent pyrexia","answer":false},{"label":"e","text":"positive antinuclear antibody ( ANA )","answer":true}],"answer_key":"FTFFT","true_statements":["b","e"],"false_statements":["a","c","d"],"explanation":"Peak age of onset of juvenile rheumatoid arthritis is at age 2 years. The ratio of girls to boys is 5:1. Pauciarticular type in which four or fewer joints are involved is more susceptible to iritis. Presence of ANA (antinuclear antibodies) is also associated with a higher risk of iritis.","source_answer_pdf_page":56,"source_answer_printed_page":58,"id":129},{"section":"Uveitis","section_question":10,"source_question_pdf_page":50,"source_question_printed_page":52,"stem":"Behcet's disease","statements":[{"label":"a","text":"_ is best diagnosed by HLA typing","answer":false},{"label":"b","text":"is more common in pigmented race","answer":true},{"label":"c","text":"usually presents with chronic uveitis","answer":false},{"label":"d","text":"is associated with caput medusa of the abdomen","answer":true},{"label":"e","text":"with retinal vessels involvement is best treated with colchicine","answer":false}],"answer_key":"FTFTF","true_statements":["b","d"],"false_statements":["a","c","e"],"explanation":"The diagnosis of Behcet's disease is clinical. According to the ISG (International Study Group) criteria for the diagnosis of Behcet's disease: \"There must be recurrent oral ulceration (either aphthous or herpetiform) observed by the physician or patient at least 3 times over a 12-month period. Plus at least 2 of the following criteria: Recurrent genital ulceration Eye lesions (anterior uveitis, posterior uveitis, or cells in vitreous on slit-lamp examination; or retinal vasculitis detected by an ophthalmologist) Skin lesions (erythema nodosum observed by physician or patient, pseudofolliculitis, or papulopustular lesions; or acneiform nodules observed by physician in post adolescent patients not on corticosteroid treatment) % Positive pathergy test. The uveitis is usually acute rather than chronic. Venous thrombosis is common in this condition and can cause caput medusa from hepatic vein thrombosis. Immunosuppression is the treatment of choice if there is retinal vessel involvement.","source_answer_pdf_page":56,"source_answer_printed_page":58,"id":130},{"section":"Uveitis","section_question":11,"source_question_pdf_page":51,"source_question_printed_page":53,"stem":"The following are true about Reiter's syndrome","statements":[{"label":"a","text":"_iritis occurs more commonly than conjunctivitis","answer":false},{"label":"b","text":"blindness from retinal vein occlusion occurs in 5% of the cases","answer":false},{"label":"c","text":"it occurs more commonly in male than female by 2:1","answer":true},{"label":"d","text":"keratoderma blennorrhagica of the palm may be present","answer":true},{"label":"e","text":"arthritis occurs in all patients","answer":true}],"answer_key":"FFTTT","true_statements":["c","d","e"],"false_statements":["a","b"],"explanation":"Acute uveitis occurs in 20% of Reiter's syndrome whereas conjunctivitis is almost universal in Reiter's syndrome. Retinal vein occlusion is rare. The male to female ratio is 9:1. Keratoderma blennorrhagica is observed in the palms and soles. Reiter's disease is a clinical diagnosis consists of a triad of nongonococcal urethritis, conjunctivitis, and arthritis.","source_answer_pdf_page":57,"source_answer_printed_page":59,"id":131},{"section":"Uveitis","section_question":12,"source_question_pdf_page":51,"source_question_printed_page":53,"stem":"Regarding birdshot chorioretinopathy","statements":[{"label":"a","text":"HLA A29 is positive in more than 95% of the patients","answer":true},{"label":"b","text":"it typically occurs in immunosuppressed patients","answer":false},{"label":"c","text":". itis common in male than female","answer":false},{"label":"d","text":"itis usually bilateral and symmetrical","answer":true},{"label":"e","text":"cystoid macular oedema is a common cause of poor vision","answer":true}],"answer_key":"TFFTT","true_statements":["a","d","e"],"false_statements":["b","c"],"explanation":"In birdshot chorioretinopathy, HLA-A29 is present in 95.8% of cases (whereas only 7% of Caucasian population have HLA A29). It is more common in Caucasian than Asians and affects female more than male. Most affected patients are healthy. The diagnostic criteria of birdshot chorioretinopathy include: bilateral and symmetrical characteristic birdshot flecks in the fundus of the eye a mild to severe inflammation of the vitreous often accompanied by cystoid macular oedema the presence of the antigen HLA-A29","source_answer_pdf_page":57,"source_answer_printed_page":59,"id":132},{"section":"Uveitis","section_question":13,"source_question_pdf_page":51,"source_question_printed_page":53,"stem":"Acute posterior multifocal placoid pigment epitheliopathy (APMPPE)","statements":[{"label":"a","text":"a preceding upper respiratory infection is common","answer":true},{"label":"b","text":"it has equal sex involvement","answer":true},{"label":"c","text":"rarely affects both eyes","answer":false},{"label":"d","text":"steroid is usually needed for treatment","answer":false},{"label":"e","text":"fluorescein angiography shows early hyperfluorescence corresponding to areas of yellowish lesions","answer":false}],"answer_key":"TTFFF","true_statements":["a","b"],"false_statements":["c","d","e"],"explanation":"Preceding upper respiratory tract infection is common in AMPPE. There is no sex predilection. Most cases are bilateral and appear simultancously in both eyes. Most patients with APMPPE have a good visual prognosis and do not require therapy. Hypofluorescence followed by hyperfluorescence in combination with appropriately sized and colored fundic lesions is diagnostic of APMPPE.","source_answer_pdf_page":57,"source_answer_printed_page":59,"id":133},{"section":"Uveitis","section_question":14,"source_question_pdf_page":51,"source_question_printed_page":53,"stem":"Schwartz's syndrome","statements":[{"label":"a","text":"occurs in rhegmatogenous retinal detachment","answer":true},{"label":"b","text":"_ is associated with low intraocular pressure","answer":false},{"label":"c","text":"occurs only in pseudophakic patients","answer":false},{"label":"d","text":"degraded photoreceptors may be seen in the anterior chamber","answer":true},{"label":"e","text":"granulomatous inflammation is typical","answer":false}],"answer_key":"TFFTF","true_statements":["a","d"],"false_statements":["b","c","e"],"explanation":"The syndrome of increased intraocular pressure, an open anterior chamber angle and anterior segment inflammation in the presence of rhegmatogenous retinal detachment is termed Schwartz syndrome. It can occur in phakic eyes. Blockage of trabecular meshwork from retinal pigment epithelium or components of the photoreceptors may be the cause of increased intraocular pressure. The anterior segment inflammation is non-granulomatous and usually resolves with topical corticosteroid therapy.","source_answer_pdf_page":57,"source_answer_printed_page":59,"id":134},{"section":"Uveitis","section_question":15,"source_question_pdf_page":51,"source_question_printed_page":53,"stem":"in Fuchs' heterochromic cyclitis","statements":[{"label":"a","text":"the affected eye has hypochromic iris","answer":true},{"label":"b","text":"Busacca nodules may be present on the iris","answer":true},{"label":"c","text":"_ intensive steroid is the treatment of choice","answer":false},{"label":"d","text":"open angle glaucoma occurs in 50% of the cases","answer":false},{"label":"e","text":"Amsler's sign during cataract surgery is a known complication","answer":true}],"answer_key":"TTFFT","true_statements":["a","b","e"],"false_statements":["c","d"],"explanation":"The classic hallmark of Fuchs' heterochromic iridocyclitis is iris heterochromia. Busacca's nodules on the iris stroma may be seen. Although therapy with topical corticosteroids can decrease the clinical signs of inflammation, long term topical therapy is often unnecessary and may serve only to hasten cataract formation and induce glaucoma in steroid responders. Intraocular pressure is raised in 10 — 15% of patients.","source_answer_pdf_page":58,"source_answer_printed_page":60,"id":135},{"section":"Uveitis","section_question":16,"source_question_pdf_page":52,"source_question_printed_page":54,"stem":"Sympathetic ophthalmia","statements":[{"label":"a","text":"isa known complication of cataract surgery","answer":true},{"label":"b","text":"to prevent its occurrence, rupture globe without useful vision should be routinely enucleated as a primary procedure","answer":false},{"label":"c","text":"choroidal granuloma is a feature","answer":true},{"label":"d","text":"early fluorescein blockage is an indication of posterior involvement","answer":true},{"label":"e","text":"choroidal neovascularization is a cause of poor vision","answer":true}],"answer_key":"TFTTT","true_statements":["a","c","d","e"],"false_statements":["b"],"explanation":"Sympathetic ophthalmia is a bilateral granulomatous uveitis that occurs after either intentional or unintentional penetrating trauma to one eye. Therefore cataract surgery can lead to sympathetic ophthalmia. After trauma there is a short window of opportunity about 10 days in which enucleation can prevent sympathetic ophthalmia. However, for most traumatized eyes with visual potential the eye should be preserved where possible. In addition, most sympathetic ophthalmia can now be adequately controlled with medications. Choroidal granulomas termed Dalen-Fuchs nodules are typical in this condition.","source_answer_pdf_page":58,"source_answer_printed_page":60,"id":136},{"section":"Uveitis","section_question":17,"source_question_pdf_page":52,"source_question_printed_page":54,"stem":"Tubulointerstitial nephritis and uveitis ( TINU )","statements":[{"label":"a","text":"is usually caused by viral infection","answer":false},{"label":"b","text":"is more common in male than female","answer":false},{"label":"c","text":"is characterized by bilateral posterior uveitis","answer":false},{"label":"d","text":"is associated with proteinuria detectable with urine dipstick","answer":true},{"label":"e","text":"causes persistent renal dysfunction in less than 1% of patients","answer":false}],"answer_key":"FFFTF","true_statements":["d"],"false_statements":["a","b","c","e"],"explanation":"Diagnosis of TINU requires identification of acute interstitial nephritis and uveitis, in the absence of systemic diseases associated with either condition. TINU occurs more frequently in females (3 : 1), with the median age of onset being 15 years, and has no racial association. Acute anterior uveitis is the typical finding (80%) and is usually bilateral. About 20% of patients develop ocular complications, such as posterior synechiae (most common), cataracts and glaucoma. Renal failure may resolve spontaneously and almost always responds to steroids. Persistent renal dysfunction occurs in about 10% of patients, with few needing dialysis.","source_answer_pdf_page":58,"source_answer_printed_page":60,"id":137},{"section":"Uveitis","section_question":18,"source_question_pdf_page":52,"source_question_printed_page":54,"stem":"Vogt-Koyanagi Harada's syndrome","statements":[{"label":"a","text":"is best diagnosed by skin biopsy","answer":false},{"label":"b","text":"is rare in non-pigmented race","answer":true},{"label":"c","text":"usually affects the elderly","answer":false},{"label":"d","text":"may be induced by trauma","answer":false},{"label":"e","text":"the choroidal changes may be identical to that of sympathetic ophthalmia","answer":true}],"answer_key":"FTFFT","true_statements":["b","e"],"false_statements":["a","c","d"],"explanation":"The source directs the reader to the Vogt-Koyanagi-Harada comparison under the next question. Vogt-Koyanagi's syndrome and Harada's syndrome have many similarities and therefore they are grouped under the syndrome called VKH (Vogt-KoyanagiHarada's syndrome). Nevertheless, it remains useful to divide the syndrome into two types because of the variable involvement of different systems and visual prognosis. Agen, black, heavily ty | R : pigmented ace pigmented Caucasian z Caucasian Central nervous | Mild or lacking Usually marked system symptoms Slight anterior _uveitis; Severe anterior and roa . ... | Marked choroiditis and Ocular symptoms _| posterior uveitis | ™ feet tgertse vitritis; frequent secondary retinal detachment Spontaneous healing of. Sequelae of other severe] retinal detachment with Sequelae Me nae? fs uveitides albinotic depigmentation of the fundus Auditory : im Aieniianres, Common (>50%) Common Alterations of hair | Generally constant (90%) Uncommon (\u003c10%) Skin changes Common (>50%) Uncommon (\u003c10%)","source_answer_pdf_page":58,"source_answer_printed_page":60,"id":138},{"section":"Uveitis","section_question":19,"source_question_pdf_page":52,"source_question_printed_page":54,"stem":"In contrast to Vogt-Koyanagi's disease, Harada's disease is more likely to show","statements":[{"label":"a","text":"vitiligo","answer":false},{"label":"b","text":"deafness","answer":true},{"label":"c","text":"poliosis","answer":false},{"label":"d","text":"meningism","answer":true},{"label":"e","text":"worse visual prognosis","answer":false}],"answer_key":"FTFTF","true_statements":["b","d"],"false_statements":["a","c","e"],"explanation":"Vogt-Koyanagi's syndrome and Harada's syndrome have many similarities and therefore they are grouped under the syndrome called VKH (Vogt-KoyanagiHarada's syndrome). Nevertheless, it remains useful to divide the syndrome into two types because of the variable involvement of different systems and visual prognosis. Agen, black, heavily ty | R : pigmented ace pigmented Caucasian z Caucasian Central nervous | Mild or lacking Usually marked system symptoms Slight anterior _uveitis; Severe anterior and roa . ... | Marked choroiditis and Ocular symptoms _| posterior uveitis | ™ feet tgertse vitritis; frequent secondary retinal detachment Spontaneous healing of. Sequelae of other severe] retinal detachment with Sequelae Me nae? fs uveitides albinotic depigmentation of the fundus Auditory : im Aieniianres, Common (>50%) Common Alterations of hair | Generally constant (90%) Uncommon (\u003c10%) Skin changes Common (>50%) Uncommon (\u003c10%)","source_answer_pdf_page":58,"source_answer_printed_page":60,"id":139},{"section":"Uveitis","section_question":20,"source_question_pdf_page":52,"source_question_printed_page":54,"stem":"The following are true about pars planitis","statements":[{"label":"a","text":"it is associated with multiple sclerosis","answer":true},{"label":"b","text":"it typically affects elderly patients","answer":false},{"label":"c","text":"band keratopathy is a complication","answer":true},{"label":"d","text":"choroidal neovascularization is a common cause of poor vision","answer":false},{"label":"e","text":"oral steroid is the treatment of choice","answer":false}],"answer_key":"TFTFF","true_statements":["a","c"],"false_statements":["b","d","e"],"explanation":"Par planitis is associated with multiple sclerosis. It tends to mostly affect people in their teens to their forties. Anterior segment inflammation is more common in children with uveitis when there may be moderate degree of anterior chamber cells with posterior synechiae. Band keratopathy is a known anterior segment complications. Most cases of poor vision is due to cystoid macular oedema. Periocular steroid is the treatment of choice.","source_answer_pdf_page":59,"source_answer_printed_page":61,"id":140},{"section":"Uveitis","section_question":21,"source_question_pdf_page":53,"source_question_printed_page":55,"stem":"Concerning ankylosing spondylitis","statements":[{"label":"a","text":"it typically affects young males","answer":true},{"label":"b","text":"it causes uveitis which is usually confined to the anterior segment","answer":true},{"label":"c","text":"_ it is associated with inflammatory bowel disease","answer":true},{"label":"d","text":"physiotherapy is useful in preventing abnormal posture","answer":true},{"label":"e","text":"cardiac conduction abnormality is a known complication","answer":true}],"answer_key":"TTTTT","true_statements":["a","b","c","d","e"],"false_statements":[],"explanation":"'Ankylosing spondylitis is 2.5 to 3 times more common in men than women. 'Ankylosing spondylitis and inflammatory bowel disease has a strong association with HLA B27. Anterior uveitis is a common association and the posterior segment is rarely involved. Cardiac conduction disturbances such as AV block is a known association and in severe cases may need cardiac pacemaker.","source_answer_pdf_page":60,"source_answer_printed_page":62,"id":141},{"section":"Uveitis","section_question":22,"source_question_pdf_page":53,"source_question_printed_page":55,"stem":"The following tests if abnormal are suggestive of sarcoidosis","statements":[{"label":"a","text":"serum angiotensin converting enzyme, ACE concentration","answer":true},{"label":"b","text":"serum calcium","answer":true},{"label":"c","text":"chest X-ray","answer":true},{"label":"d","text":"serum antinuclear antibody","answer":false},{"label":"e","text":"serum anticentromere antibody","answer":false}],"answer_key":"TTTFF","true_statements":["a","b","c"],"false_statements":["d","e"],"explanation":"Elevated serum ACE concentration, hypercalcemia and abnormal chest X-ray are suggestive of sarcoidosis. The 3 classic X-ray patterns of pulmonary sarcoidosis are Type I - bilateral hilar adenopathy with no parenchymal abnormalities Type II - bilateral hilar adenopathy with diffuse parenchymal changes Type III- diffuse parenchymal changes without hilar adenopathy either with fibrosis or upper lobe retraction","source_answer_pdf_page":60,"source_answer_printed_page":62,"id":142},{"section":"Uveitis","section_question":23,"source_question_pdf_page":53,"source_question_printed_page":55,"stem":"Regarding syphilis","statements":[{"label":"a","text":"the best way to diagnose syphilitic infection is by tissue culture","answer":false},{"label":"b","text":"positive VRDL is diagnostic of syphilis","answer":false},{"label":"c","text":"acute iritis typically occurs during primary stage of syphilis","answer":false},{"label":"d","text":"eccentric choroidal neovascularization is a feature of syphilitic chorioretinitis","answer":true},{"label":"e","text":"penicillin is effective against syphilis","answer":true}],"answer_key":"FFFTT","true_statements":["d","e"],"false_statements":["a","b","c"],"explanation":"Syphilitic infection is diagnosed by serological means. Venereal Disease Research Laboratory (VDRL) test is a non-treponemal serological screening for syphilis and is not specific for syphilis. VDRL can be positive in a variety of conditions such as mononucleosis, rheumatoid arthritis, pregnancy and leprosy etc. Acute iritis typically occurs in the secondary stage of syphilis. Penicillin G is the drug of choice for all stages of syphilis","source_answer_pdf_page":60,"source_answer_printed_page":62,"id":143},{"section":"Uveitis","section_question":24,"source_question_pdf_page":53,"source_question_printed_page":55,"stem":"The following are true about immune recovery uveitis (IRU)","statements":[{"label":"a","text":"it is seen mainly in patients receiving HAART (highly active antiretroviral therapy","answer":true},{"label":"b","text":"it rarely occurs if the CD4 T-cell count is less than 100 cells/mm'","answer":true},{"label":"c","text":"it occurs only in patients with AIDS","answer":false},{"label":"d","text":"prior use of intravenous cidofovir is a risk factor","answer":true},{"label":"e","text":"anti-cytomegalovirus medication is the treatment of choice","answer":fa
